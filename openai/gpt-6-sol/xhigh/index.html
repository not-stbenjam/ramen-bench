<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Vegan ramen</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #080c0c;
      cursor: default;
      -webkit-tap-highlight-color: transparent;
    }
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse 43% 42% at 50% 57%, rgba(133, 62, 24, .16), transparent 82%),
        radial-gradient(ellipse 82% 64% at 50% 78%, rgba(48, 61, 48, .16), transparent 79%),
        linear-gradient(155deg, #101617 0%, #0d1110 42%, #090c0b 77%, #070909 100%);
    }
    .scene::before {
      content: "";
      position: absolute;
      inset: -15%;
      background: radial-gradient(circle at calc(50% + var(--light-x, 0px)) calc(55% + var(--light-y, 0px)), rgba(232, 128, 52, .105), rgba(126, 67, 32, .045) 21%, transparent 49%);
      filter: blur(28px);
      pointer-events: none;
      transition: background-position .2s ease;
    }
    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      opacity: .65;
      background: radial-gradient(ellipse 74% 80% at 50% 56%, transparent 38%, rgba(0, 0, 0, .25) 74%, rgba(0, 0, 0, .58) 100%);
    }
    .surface {
      position: absolute;
      width: min(1300px, 145vw);
      height: min(240px, 28vh);
      left: 50%;
      top: 78%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(76, 56, 37, .18), rgba(26, 28, 24, .09) 41%, transparent 72%);
      filter: blur(20px);
    }
    .art {
      position: absolute;
      left: 50%;
      top: 53%;
      width: min(1100px, 150vw, 153vh);
      height: auto;
      overflow: visible;
      transform: translate3d(calc(-50% + var(--move-x, 0px)), calc(-50% + var(--move-y, 0px)), 0) rotate(var(--tilt, 0deg));
      transform-origin: 50% 54%;
      will-change: transform;
      filter: drop-shadow(0 32px 34px rgba(0, 0, 0, .52));
    }
    .steam-wisp {
      fill: none;
      stroke: url(#steamGradient);
      stroke-linecap: round;
      filter: url(#steamBlur);
      opacity: .41;
      animation: steam 7.6s ease-in-out infinite;
      transform-origin: center bottom;
    }
    .steam-wisp.fine { filter: url(#steamSoft); opacity: .25; }
    .steam-wisp:nth-child(2) { animation-duration: 8.8s; animation-delay: -3.4s; }
    .steam-wisp:nth-child(3) { animation-duration: 6.9s; animation-delay: -5.2s; }
    .steam-wisp:nth-child(4) { animation-duration: 9.5s; animation-delay: -1.9s; }
    .steam-wisp:nth-child(5) { animation-duration: 8.1s; animation-delay: -6.1s; }
    .steam-wisp:nth-child(6) { animation-duration: 10s; animation-delay: -4.8s; }
    @keyframes steam {
      0% { transform: translate(0, 12px) skewX(-2deg); opacity: .06; }
      22% { opacity: .38; }
      52% { transform: translate(13px, -9px) skewX(3deg); opacity: .39; }
      80% { opacity: .26; }
      100% { transform: translate(-7px, -32px) skewX(-4deg); opacity: .02; }
    }
    .glimmer { animation: glimmer 5s ease-in-out infinite alternate; }
    @keyframes glimmer { from { opacity: .3; } to { opacity: .7; } }
    .float-light { animation: floatLight 7s ease-in-out infinite; }
    @keyframes floatLight { 50% { transform: translateY(-2px); } }
    @media (max-width: 600px) {
      .art { top: 57%; width: min(1100px, 138vw, 159vh); }
      .surface { top: 72%; }
      .scene { background: radial-gradient(ellipse 75% 36% at 50% 55%, rgba(133, 62, 24, .14), transparent 85%), linear-gradient(160deg, #101617, #090d0c 75%); }
    }
    @media (max-height: 520px) {
      .art { top: 51%; width: min(1100px, 135vw, 140vh); }
      .surface { top: 76%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
      .steam-wisp { opacity: .22; }
      .art { will-change: auto; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="A steaming bowl of vegan ramen in warm light">
    <div class="surface" aria-hidden="true"></div>
    <svg class="art" viewBox="0 0 1000 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Steaming vegan ramen with tofu, noodles, mushrooms, greens, corn and scallions in a ceramic bowl">
      <defs>
        <radialGradient id="halo"><stop stop-color="#e17c3f" stop-opacity=".23"/><stop offset=".5" stop-color="#99522c" stop-opacity=".09"/><stop offset="1" stop-color="#a45a31" stop-opacity="0"/></radialGradient>
        <radialGradient id="broth" cx="43%" cy="36%" r="70%"><stop stop-color="#ad6030"/><stop offset=".34" stop-color="#8e401f"/><stop offset=".71" stop-color="#562819"/><stop offset="1" stop-color="#281b16"/></radialGradient>
        <linearGradient id="bowl" x1=".1" y1=".08" x2=".81" y2=".9" objectBoundingBox="true"><stop stop-color="#e8e4d3"/><stop offset=".15" stop-color="#bbbba8"/><stop offset=".46" stop-color="#777b70"/><stop offset=".75" stop-color="#343b38"/><stop offset="1" stop-color="#111b1a"/></linearGradient>
        <linearGradient id="rim" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f5edda"/><stop offset=".23" stop-color="#ded7c1"/><stop offset=".6" stop-color="#9b9e90"/><stop offset="1" stop-color="#505b54"/></linearGradient>
        <linearGradient id="tofuTop" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f7db9e"/><stop offset=".43" stop-color="#e7ab58"/><stop offset="1" stop-color="#a95d30"/></linearGradient>
        <linearGradient id="tofuSide" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#bb6930"/><stop offset="1" stop-color="#663419"/></linearGradient>
        <linearGradient id="leaf" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#85a840"/><stop offset=".38" stop-color="#3c702f"/><stop offset=".75" stop-color="#244b2a"/><stop offset="1" stop-color="#142d21"/></linearGradient>
        <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#acd15f"/><stop offset=".4" stop-color="#67953a"/><stop offset="1" stop-color="#305929"/></linearGradient>
        <linearGradient id="stalk" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#e4e7a6"/><stop offset=".5" stop-color="#a9bd71"/><stop offset="1" stop-color="#56773e"/></linearGradient>
        <radialGradient id="mushroom"><stop stop-color="#ac7645"/><stop offset=".52" stop-color="#754628"/><stop offset="1" stop-color="#34241b"/></radialGradient>
        <radialGradient id="oil"><stop stop-color="#e88031" stop-opacity=".9"/><stop offset=".6" stop-color="#e24f20" stop-opacity=".55"/><stop offset="1" stop-color="#df4b1a" stop-opacity="0"/></radialGradient>
        <linearGradient id="steamGradient" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#f8e3b8" stop-opacity="0"/><stop offset=".22" stop-color="#f6dfb9" stop-opacity=".57"/><stop offset=".7" stop-color="#e0dfd1" stop-opacity=".38"/><stop offset="1" stop-color="#d8e7df" stop-opacity="0"/></linearGradient>
        <filter id="steamBlur" x="-100%" y="-40%" width="300%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
        <filter id="steamSoft" x="-100%" y="-40%" width="300%" height="180%"><feGaussianBlur stdDeviation="13"/></filter>
        <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="15"/></filter>
        <filter id="smallShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
        <filter id="ceramicTexture" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".34" numOctaves="3" seed="11" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".17"/></feComponentTransfer></filter>
        <clipPath id="brothClip"><ellipse cx="500" cy="428" rx="326" ry="124"/></clipPath>
        <clipPath id="bowlFrontClip"><path d="M151 431 C158 523 314 571 500 571 C686 571 842 523 849 431 C835 616 702 750 500 757 C298 750 165 616 151 431Z"/></clipPath>
        <g id="tofuPiece">
          <path d="M-38 -23 L18 -34 L43 -15 L-14 -4Z" fill="url(#tofuTop)" stroke="#ffe2a1" stroke-width="2"/>
          <path d="M-38 -23 L-14 -4 L-12 31 L-34 14Z" fill="#9c5b2b" stroke="#cf8742" stroke-width="1"/>
          <path d="M-14 -4 L43 -15 L40 17 L-12 31Z" fill="url(#tofuSide)" stroke="#b66a36" stroke-width="1.5"/>
          <path d="M-24 -18 L12 -25 M-8 -8 L29 -17" stroke="#9a4b26" stroke-width="5" opacity=".45" stroke-linecap="round"/>
          <path d="M-6 -2 L-4 23 M13 -8 L15 14" stroke="#442619" stroke-width="3" opacity=".27" stroke-linecap="round"/>
          <circle cx="-1" cy="-17" r="2" fill="#6e391c" opacity=".5"/><circle cx="24" cy="-21" r="2.5" fill="#6e391c" opacity=".4"/>
        </g>
        <g id="shiitake">
          <ellipse cy="13" rx="48" ry="23" fill="#2a1d17" opacity=".58" filter="url(#smallShadow)"/>
          <path d="M-43 3 Q0 43 43 3 Q22 10 0 10 Q-23 10 -43 3Z" fill="#d8bd8c" stroke="#b18c60" stroke-width="2"/>
          <path d="M-41 5 Q0 27 41 5" fill="none" stroke="#6b4328" stroke-width="3"/>
          <path d="M-26 10 L-14 26 M-10 13 L-2 30 M8 13 L14 29 M24 10 L31 22" stroke="#8c6a48" stroke-width="2" opacity=".7"/>
          <ellipse rx="48" ry="27" fill="url(#mushroom)" stroke="#3d2a20" stroke-width="3"/>
          <path d="M-26 -8 Q-13 -18 4 -16 M11 -14 Q23 -13 29 -6" fill="none" stroke="#dec18e" stroke-width="4" stroke-linecap="round" opacity=".64"/>
          <path d="M-36 2 Q-28 19 -11 20" fill="none" stroke="#d2a16d" stroke-width="3" opacity=".45"/>
        </g>
        <g id="bokchoy">
          <path d="M0 0 C-41 -12 -82 -56 -75 -91 C-50 -99 -22 -73 2 -33 C8 -78 25 -111 57 -119 C84 -86 56 -40 15 -8Z" fill="url(#leaf)" stroke="#21452c" stroke-width="3"/>
          <path d="M0 -8 C-27 -52 -50 -68 -67 -82 M6 -25 C22 -76 43 -100 57 -111" fill="none" stroke="#9dc366" stroke-width="5" opacity=".64"/>
          <path d="M-38 -65 L-58 -57 M-30 -55 L-48 -43 M31 -77 L53 -73 M23 -57 L45 -49" stroke="#a4c46d" stroke-width="2" opacity=".45"/>
          <path d="M-20 -30 Q-6 -15 0 1 Q14 -17 25 -34 L19 30 Q-3 45 -18 27Z" fill="url(#stalk)" stroke="#d7dd9b" stroke-width="2"/>
          <path d="M-7 -18 Q0 5 -3 35 M8 -17 Q3 8 5 35" fill="none" stroke="#f3eab3" stroke-width="3" opacity=".6"/>
        </g>
      </defs>

      <ellipse cx="500" cy="432" rx="460" ry="390" fill="url(#halo)" opacity=".65"/>
      <g aria-hidden="true">
        <path class="steam-wisp" stroke-width="24" d="M388 391 C360 338 406 316 393 272 S359 209 392 166 S420 107 397 64"/>
        <path class="steam-wisp fine" stroke-width="34" d="M442 392 C467 351 431 313 456 269 S497 211 477 167 S456 108 481 61"/>
        <path class="steam-wisp" stroke-width="19" d="M523 379 C491 342 526 305 521 265 S493 213 523 171 S542 111 526 75"/>
        <path class="steam-wisp fine" stroke-width="33" d="M585 397 C610 357 572 329 602 280 S636 231 609 185 S601 119 627 79"/>
        <path class="steam-wisp" stroke-width="22" d="M663 396 C626 360 664 328 650 281 S624 235 656 186 S664 126 649 91"/>
        <path class="steam-wisp fine" stroke-width="27" d="M329 388 C315 353 333 322 313 286 S305 218 328 193"/>
      </g>

      <ellipse cx="500" cy="742" rx="326" ry="45" fill="#000" opacity=".52" filter="url(#softShadow)"/>
      <ellipse cx="495" cy="744" rx="225" ry="20" fill="#d27b40" opacity=".10" filter="url(#softShadow)"/>

      <g class="float-light">
        <!-- The front wall curves down from the lower edge of the oval opening. -->
        <path d="M151 431 C158 523 314 571 500 571 C686 571 842 523 849 431 C835 616 702 750 500 757 C298 750 165 616 151 431Z" fill="url(#bowl)" stroke="#838d7d" stroke-width="2"/>
        <g clip-path="url(#bowlFrontClip)"><rect x="130" y="416" width="740" height="360" filter="url(#ceramicTexture)" opacity=".33"/></g>
        <path d="M181 510 C219 633 320 718 469 733" fill="none" stroke="#fff8e3" stroke-width="16" opacity=".14" filter="url(#softShadow)"/>
        <path d="M826 495 C801 618 700 715 577 743" fill="none" stroke="#060e0d" stroke-width="25" opacity=".24" filter="url(#softShadow)"/>
        <path d="M300 691 Q500 780 702 690" fill="none" stroke="#0b1513" stroke-width="13" opacity=".28" filter="url(#smallShadow)"/>
        <ellipse cx="500" cy="429" rx="353" ry="145" fill="url(#rim)" stroke="#f0e7d2" stroke-width="3"/>
        <ellipse cx="500" cy="428" rx="330" ry="128" fill="#28241d" stroke="#635d46" stroke-width="4"/>
        <ellipse cx="500" cy="427" rx="324" ry="122" fill="url(#broth)"/>
        <g clip-path="url(#brothClip)">
          <ellipse cx="408" cy="345" rx="249" ry="68" fill="#efa465" opacity=".16" filter="url(#softShadow)"/>
          <ellipse cx="652" cy="487" rx="173" ry="65" fill="#180d0a" opacity=".31" filter="url(#softShadow)"/>
          <path d="M318 424 L286 312 Q290 299 304 296 L363 302 Q376 303 376 318 L389 430Z" fill="#172d22" stroke="#496039" stroke-width="3"/>
          <path d="M330 412 L308 307 M349 405 L337 313 M368 402 L360 319" stroke="#72905b" stroke-width="3" opacity=".26"/>
          <path d="M693 430 L722 308 Q728 296 743 301 L792 321 Q804 326 798 340 L747 456Z" fill="#1d3026" stroke="#526b45" stroke-width="3"/>
          <path d="M715 414 L739 316 M734 420 L764 326 M753 414 L785 342" stroke="#8ea46a" stroke-width="2" opacity=".23"/>
          <ellipse cx="492" cy="425" rx="221" ry="86" fill="#e7a651" opacity=".14" filter="url(#softShadow)"/>
          <g id="brothDetails"></g>
          <g id="noodles"></g>

          <!-- Greens are gathered around the noodles rather than forming a separate focal point. -->
          <g transform="translate(339 465) rotate(-22)"><use href="#bokchoy"/></g>
          <g transform="translate(300 456) rotate(-45) scale(.73)"><use href="#bokchoy"/></g>
          <g transform="translate(735 465) rotate(25) scale(.82)"><use href="#bokchoy"/></g>
          <g transform="translate(700 484) rotate(45) scale(.68)"><use href="#bokchoy"/></g>

          <g transform="translate(394 473) rotate(-21)"><use href="#shiitake"/></g>
          <g transform="translate(677 510) rotate(17) scale(.93)"><use href="#shiitake"/></g>
          <g transform="translate(287 409) rotate(-10) scale(.67)"><use href="#shiitake"/></g>

          <g transform="translate(585 393) rotate(-11)"><use href="#tofuPiece"/></g>
          <g transform="translate(652 426) rotate(18) scale(.94)"><use href="#tofuPiece"/></g>
          <g transform="translate(546 440) rotate(12) scale(.83)"><use href="#tofuPiece"/></g>

          <g id="toppings"></g>
          <path d="M218 420 Q268 341 346 338 M711 343 Q785 388 782 443" fill="none" stroke="#f9b276" stroke-width="5" opacity=".2" stroke-linecap="round" class="glimmer"/>
        </g>
        <!-- The front edge catches a narrow line of warm light. -->
        <path d="M149 434 C161 509 309 575 500 575 C691 575 839 509 851 434" fill="none" stroke="#f3e3c5" stroke-width="15" opacity=".66"/>
        <path d="M152 443 C169 523 313 582 500 582 C687 582 831 523 848 443" fill="none" stroke="#4a554c" stroke-width="4" opacity=".77"/>
        <path d="M171 473 C231 548 357 569 456 574" fill="none" stroke="#fff8de" stroke-width="5" opacity=".3" stroke-linecap="round"/>
        <path d="M644 565 Q777 543 825 475" fill="none" stroke="#f0d9ad" stroke-width="3" opacity=".18" stroke-linecap="round"/>
        <path d="M408 729 Q500 755 598 729" fill="none" stroke="#d1cdbc" stroke-width="3" opacity=".19" stroke-linecap="round"/>
      </g>
    </svg>
  </main>
  <script>
    (() => {
      const ns = 'http://www.w3.org/2000/svg';
      const noodles = document.getElementById('noodles');
      const details = document.getElementById('brothDetails');
      const toppings = document.getElementById('toppings');
      let seed = 40127;
      const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
      const el = (tag, attrs, parent) => {
        const node = document.createElementNS(ns, tag);
        for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
        parent.appendChild(node);
        return node;
      };

      // Small pools of chili oil and fine highlights give the broth a lived-in surface.
      for (let i = 0; i < 57; i++) {
        const a = rand() * Math.PI * 2;
        const r = Math.sqrt(rand());
        const x = 500 + Math.cos(a) * r * 310;
        const y = 427 + Math.sin(a) * r * 111;
        const size = 3 + rand() * 14;
        el('ellipse', { cx:x.toFixed(1), cy:y.toFixed(1), rx:(size * (1.2 + rand())).toFixed(1), ry:(size * .22).toFixed(1), fill:i % 5 === 0 ? '#f9b367' : '#df6d29', opacity:(.1 + rand() * .23).toFixed(2), transform:`rotate(${Math.round(rand() * 180)} ${x.toFixed(1)} ${y.toFixed(1)})` }, details);
      }
      for (let i = 0; i < 21; i++) {
        const x = 205 + rand() * 590;
        const y = 361 + rand() * 145;
        el('path', { d:`M${x.toFixed(1)} ${y.toFixed(1)} q${(8 + rand()*11).toFixed(1)} ${(-3 - rand()*4).toFixed(1)} ${(18 + rand()*24).toFixed(1)} 0`, fill:'none', stroke:'#ffd19a', 'stroke-width':(1 + rand()*1.6).toFixed(1), opacity:(.13 + rand()*.23).toFixed(2), 'stroke-linecap':'round' }, details);
      }

      // Each strand has a darker underside and a slender warm highlight.
      for (let i = 0; i < 125; i++) {
        const a = rand() * Math.PI * 2;
        const radius = 16 + Math.sqrt(rand()) * 164;
        const cx = 493 + Math.cos(a) * radius * 1.24;
        const cy = 432 + Math.sin(a) * radius * .59;
        const len = 43 + rand() * 78;
        const direction = rand() * Math.PI * 2;
        const dx = Math.cos(direction) * len;
        const dy = Math.sin(direction) * len * .45;
        const bend = (rand() - .5) * 45;
        const d = `M${(cx-dx/2).toFixed(1)} ${(cy-dy/2).toFixed(1)} C${(cx-dx/5+bend).toFixed(1)} ${(cy-dy*.9-12).toFixed(1)} ${(cx+dx/4-bend).toFixed(1)} ${(cy+dy*.7+17).toFixed(1)} ${(cx+dx/2).toFixed(1)} ${(cy+dy/2).toFixed(1)}`;
        el('path', { d, fill:'none', stroke:'#472713', 'stroke-width':(7 + rand()*3).toFixed(1), opacity:'.48', 'stroke-linecap':'round' }, noodles);
        el('path', { d, fill:'none', stroke:i%6===0 ? '#e49d4c' : '#e5b568', 'stroke-width':(4.3 + rand()*2).toFixed(1), opacity:(.68 + rand()*.22).toFixed(2), 'stroke-linecap':'round' }, noodles);
        if (i % 3 === 0) el('path', { d, fill:'none', stroke:'#fff0bd', 'stroke-width':'1.2', opacity:'.43', 'stroke-linecap':'round' }, noodles);
      }

      // Scallion rings, corn kernels, sesame and flecks of chili finish the surface.
      for (let i = 0; i < 28; i++) {
        const x = 307 + rand() * 408;
        const y = 349 + rand() * 157;
        const rx = 5 + rand() * 9;
        const ry = 2.3 + rand() * 3.5;
        el('ellipse', { cx:x.toFixed(1), cy:y.toFixed(1), rx:rx.toFixed(1), ry:ry.toFixed(1), fill:'none', stroke:i%3===0?'#b5cf76':'#70a659', 'stroke-width':(2.5+rand()*2).toFixed(1), opacity:(.65+rand()*.3).toFixed(2), transform:`rotate(${Math.round(rand()*170)} ${x.toFixed(1)} ${y.toFixed(1)})` }, toppings);
      }
      for (let i = 0; i < 23; i++) {
        const x = 246 + rand()*498;
        const y = 364 + rand()*139;
        el('ellipse', { cx:x.toFixed(1), cy:y.toFixed(1), rx:(3.4+rand()*3).toFixed(1), ry:(2.2+rand()*2).toFixed(1), fill:i%3===0?'#f8d66a':'#dbac38', stroke:'#a9742d', 'stroke-width':'.7', opacity:'.9', transform:`rotate(${Math.round(rand()*180)} ${x.toFixed(1)} ${y.toFixed(1)})` }, toppings);
      }
      for (let i = 0; i < 43; i++) {
        const x = 205 + rand()*588;
        const y = 341 + rand()*177;
        const color = i%4===0 ? '#e36b33' : i%3===0 ? '#d7d99c' : '#c4a766';
        el('ellipse', { cx:x.toFixed(1), cy:y.toFixed(1), rx:(1.1+rand()*2).toFixed(1), ry:(.7+rand()*1.2).toFixed(1), fill:color, opacity:(.5+rand()*.4).toFixed(2), transform:`rotate(${Math.round(rand()*180)} ${x.toFixed(1)} ${y.toFixed(1)})` }, toppings);
      }

      const scene = document.querySelector('.scene');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      let targetX = 0, targetY = 0, currentX = 0, currentY = 0, frame = 0;
      const tick = () => {
        currentX += (targetX - currentX) * .065;
        currentY += (targetY - currentY) * .065;
        scene.style.setProperty('--move-x', `${(currentX * 13).toFixed(2)}px`);
        scene.style.setProperty('--move-y', `${(currentY * 8).toFixed(2)}px`);
        scene.style.setProperty('--tilt', `${(currentX * 1.05).toFixed(2)}deg`);
        scene.style.setProperty('--light-x', `${(currentX * 75).toFixed(2)}px`);
        scene.style.setProperty('--light-y', `${(currentY * 42).toFixed(2)}px`);
        if (Math.abs(targetX-currentX) + Math.abs(targetY-currentY) > .002) frame = requestAnimationFrame(tick);
        else frame = 0;
      };
      const move = event => {
        if (reduce.matches || event.pointerType === 'touch') return;
        targetX = Math.max(-1, Math.min(1, (event.clientX / innerWidth - .5) * 2));
        targetY = Math.max(-1, Math.min(1, (event.clientY / innerHeight - .5) * 2));
        if (!frame) frame = requestAnimationFrame(tick);
      };
      window.addEventListener('pointermove', move, { passive:true });
      window.addEventListener('pointerleave', () => { targetX = targetY = 0; if (!frame && !reduce.matches) frame = requestAnimationFrame(tick); });
      reduce.addEventListener('change', () => {
        if (!reduce.matches) return;
        targetX = targetY = currentX = currentY = 0;
        if (frame) cancelAnimationFrame(frame);
        frame = 0;
        for (const prop of ['--move-x','--move-y','--tilt','--light-x','--light-y']) scene.style.removeProperty(prop);
      });
    })();
  </script>
</body>
