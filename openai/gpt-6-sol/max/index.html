<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d0d">
  <title>Vegan ramen</title>
  <style>
    :root {
      color-scheme: dark;
      --move-x: 0px;
      --move-y: 0px;
      --move-rotation: 0deg;
      --glow-x: 0px;
      --glow-y: 0px;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-height: 100%; margin: 0; }

    body {
      overflow: hidden;
      background: #0b0d0d;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse 47% 55% at 50% 52%, rgba(92, 48, 27, .23) 0%, transparent 73%),
        radial-gradient(ellipse 75% 54% at 50% 94%, rgba(92, 50, 28, .22), transparent 75%),
        linear-gradient(160deg, #101718 0%, #0c1011 39%, #0a0b0c 100%);
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: -10%;
      pointer-events: none;
      background: radial-gradient(ellipse 30% 38% at calc(50% + var(--glow-x)) calc(47% + var(--glow-y)), rgba(216, 111, 49, .18), rgba(157, 64, 34, .07) 44%, transparent 82%);
      filter: blur(30px);
      animation: breathe 7s ease-in-out infinite alternate;
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background:
        radial-gradient(ellipse 67% 76% at 50% 48%, transparent 32%, rgba(0, 0, 0, .43) 100%),
        repeating-linear-gradient(90deg, transparent 0 3px, rgba(255, 255, 255, .006) 4px 5px);
    }

    .table {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -20%;
      height: 43%;
      transform: perspective(500px) rotateX(55deg);
      transform-origin: center top;
      background:
        radial-gradient(ellipse 36% 32% at 50% 24%, rgba(135, 66, 35, .2), transparent 85%),
        linear-gradient(180deg, rgba(40, 31, 26, .49), #08090a 70%);
      box-shadow: 0 -20px 50px rgba(0, 0, 0, .14);
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 24%);
      mask-image: linear-gradient(to bottom, transparent, #000 24%);
    }

    .art {
      display: block;
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(115vw, 1420px);
      height: auto;
      max-height: 105vh;
      transform: translate(-50%, -50%);
      overflow: visible;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }

    .dish {
      transform: translate(var(--move-x), var(--move-y)) rotate(var(--move-rotation));
      transform-origin: 600px 600px;
      will-change: transform;
    }

    .steam {
      fill: none;
      stroke: url(#steamGradient);
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#steamBlur);
      opacity: .6;
      transform-origin: center bottom;
      animation: steam-rise 6.5s ease-in-out infinite;
    }

    .steam.fine { filter: none; opacity: .43; }
    .steam.two { animation-duration: 7.8s; animation-delay: -2.2s; }
    .steam.three { animation-duration: 7.2s; animation-delay: -4.4s; }
    .steam.four { animation-duration: 8.8s; animation-delay: -3s; }
    .steam.five { animation-duration: 6.9s; animation-delay: -5s; }

    .broth-sheen { animation: sheen 5s ease-in-out infinite alternate; transform-origin: 600px 460px; }
    .oil-glint { animation: glint 3.6s ease-in-out infinite alternate; }
    .oil-glint:nth-of-type(2n) { animation-delay: -1.7s; }

    @keyframes breathe {
      from { opacity: .64; transform: scale(.96); }
      to { opacity: 1; transform: scale(1.08); }
    }

    @keyframes steam-rise {
      0% { opacity: .11; transform: translate(0, 15px) scale(.92); }
      27% { opacity: .64; }
      70% { opacity: .42; }
      100% { opacity: .04; transform: translate(15px, -30px) scale(1.11); }
    }

    @keyframes sheen {
      from { opacity: .3; transform: translateX(-5px); }
      to { opacity: .7; transform: translateX(8px); }
    }

    @keyframes glint {
      from { opacity: .3; }
      to { opacity: .9; }
    }

    @media (max-aspect-ratio: 3/4) {
      .art { width: 180vw; max-height: none; top: 53%; }
      .scene { background: radial-gradient(ellipse 90% 43% at 50% 52%, rgba(92, 48, 27, .24), transparent 80%), #0b0e0f; }
      .table { height: 39%; bottom: -16%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
      .steam { opacity: .35; }
      .dish { transform: none; will-change: auto; }
    }
  </style>
</head>

  </main>

  <script>
    (() => {
      const root = document.documentElement;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const target = { x: 0, y: 0 };
      const current = { x: 0, y: 0 };
      let frame = 0;

      function draw() {
        frame = 0;
        if (reducedMotion.matches) return;
        current.x += (target.x - current.x) * 0.085;
        current.y += (target.y - current.y) * 0.085;
        root.style.setProperty('--move-x', `${(current.x * 13).toFixed(2)}px`);
        root.style.setProperty('--move-y', `${(current.y * 8).toFixed(2)}px`);
        root.style.setProperty('--move-rotation', `${(current.x * 1.15).toFixed(2)}deg`);
        root.style.setProperty('--glow-x', `${(current.x * 25).toFixed(2)}px`);
        root.style.setProperty('--glow-y', `${(current.y * 18).toFixed(2)}px`);
        if (Math.abs(target.x - current.x) > 0.002 || Math.abs(target.y - current.y) > 0.002) {
          frame = requestAnimationFrame(draw);
        }
      }

      function queue() {
        if (!frame && !reducedMotion.matches) frame = requestAnimationFrame(draw);
      }

      window.addEventListener('pointermove', event => {
        if (event.pointerType === 'touch' || reducedMotion.matches) return;
        target.x = (event.clientX / window.innerWidth - 0.5) * 2;
        target.y = (event.clientY / window.innerHeight - 0.5) * 2;
        queue();
      }, { passive: true });

      document.addEventListener('pointerleave', () => {
        target.x = 0;
        target.y = 0;
        queue();
      });

      reducedMotion.addEventListener('change', () => {
        if (reducedMotion.matches) {
          cancelAnimationFrame(frame);
          frame = 0;
          target.x = target.y = current.x = current.y = 0;
          for (const name of ['--move-x', '--move-y', '--move-rotation', '--glow-x', '--glow-y']) {
            root.style.removeProperty(name);
          }
        }
      });
    })();
  </script>
</body>
