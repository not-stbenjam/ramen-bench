<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Vegan Ramen</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { overflow: hidden; background: #0d1010; }
    .scene {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      perspective: 1100px;
      background:
        radial-gradient(ellipse 38% 31% at 50% 66%, rgba(136, 65, 31, .19), transparent 100%),
        radial-gradient(ellipse 72% 72% at 50% 51%, #20211d 0%, #141818 49%, #090d0e 100%);
    }
    .scene::before {
      content: "";
      position: absolute;
      inset: -20%;
      pointer-events: none;
      background: radial-gradient(ellipse 38% 28% at 50% 78%, rgba(222, 99, 35, .12), transparent 75%);
      filter: blur(30px);
      animation: ember 7s ease-in-out infinite alternate;
    }
    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 28%, rgba(0, 0, 0, .48) 100%);
    }
    .art {
      position: relative;
      z-index: 1;
      display: block;
      width: min(111vw, 1100px, 117.6svh);
      height: auto;
      max-height: 100svh;
      overflow: visible;
      transform-origin: 50% 56%;
      will-change: transform;
      pointer-events: none;
    }
    .art-anchor {
      position: absolute;
      top: 50%;
      left: 50%;
      width: max-content;
      transform: translate(-50%, -50%);
    }
    .steam { fill: none; stroke-linecap: round; transform-origin: center bottom; animation: steam 6s ease-in-out infinite; }
    .steam:nth-child(2) { animation-duration: 7.5s; animation-delay: -3.1s; }
    .steam:nth-child(3) { animation-duration: 6.8s; animation-delay: -1.9s; }
    .steam:nth-child(4) { animation-duration: 8.2s; animation-delay: -5.3s; }
    .steam:nth-child(5) { animation-duration: 7.1s; animation-delay: -2.6s; }
    .steam:nth-child(6) { animation-duration: 6.4s; animation-delay: -4.4s; }
    .steam:nth-child(7) { animation-duration: 8.7s; animation-delay: -1.1s; }
    .heat-shimmer { animation: shimmer 5.5s ease-in-out infinite alternate; }
    @keyframes steam {
      0% { opacity: .18; transform: translate3d(-4px, 14px, 0) scaleX(.94); }
      45% { opacity: .65; }
      100% { opacity: .1; transform: translate3d(12px, -32px, 0) scaleX(1.1); }
    }
    @keyframes shimmer { from { opacity: .18; } to { opacity: .48; } }
    @keyframes ember { from { opacity: .55; transform: scale(.96); } to { opacity: 1; transform: scale(1.05); } }
    @media (max-width: 600px) {
      .art { width: min(148vw, 740px, 117.6svh); }
      .scene { background:
        radial-gradient(ellipse 70% 21% at 50% 64%, rgba(136, 65, 31, .19), transparent 100%),
        radial-gradient(ellipse 96% 64% at 50% 50%, #20211d 0%, #141818 52%, #090d0e 100%);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .steam { opacity: .38; }
      .heat-shimmer { opacity: .32; }
      .art { will-change: auto; transform: none !important; }
    }
  </style>
</head>

  <script>
    (() => {
      const scene = document.querySelector('.scene');
      const art = document.querySelector('.art');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
      let targetX = 0, targetY = 0, x = 0, y = 0, frame = 0;

      function render() {
        if (reduced.matches) {
          art.style.transform = '';
          frame = 0;
          return;
        }
        x += (targetX - x) * .08;
        y += (targetY - y) * .08;
        art.style.transform = `translate3d(${(x * 9).toFixed(2)}px, ${(y * 6).toFixed(2)}px, 0) rotateX(${(-y * 2.3).toFixed(2)}deg) rotateY(${(x * 3).toFixed(2)}deg)`;
        if (Math.abs(targetX - x) + Math.abs(targetY - y) > .001) frame = requestAnimationFrame(render);
        else frame = 0;
      }
      function start() { if (!frame && !reduced.matches) frame = requestAnimationFrame(render); }
      scene.addEventListener('pointermove', event => {
        if (event.pointerType === 'touch' || reduced.matches) return;
        const rect = scene.getBoundingClientRect();
        targetX = Math.max(-1, Math.min(1, (event.clientX - rect.left - rect.width / 2) / (rect.width / 2)));
        targetY = Math.max(-1, Math.min(1, (event.clientY - rect.top - rect.height / 2) / (rect.height / 2)));
        start();
      }, { passive: true });
      scene.addEventListener('pointerleave', () => { targetX = 0; targetY = 0; start(); });
      reduced.addEventListener('change', () => { targetX = targetY = 0; if (reduced.matches) art.style.transform = ''; else start(); });
    })();
  </script>
