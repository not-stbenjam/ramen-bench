<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Vegan Ramen</title>
  <style>
    :root {
      color-scheme: dark;
      --move-x: 0px;
      --move-y: 0px;
      --steam-x: 0px;
      --steam-y: 0px;
      --glow-x: 50%;
      --glow-y: 48%;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-height: 100%; margin: 0; }

    body {
      overflow: hidden;
      background: #100e12;
    }

    .scene {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(ellipse 48% 40% at var(--glow-x) var(--glow-y), rgba(146, 66, 30, .19), transparent 74%),
        radial-gradient(ellipse 72% 60% at 50% 85%, rgba(86, 43, 34, .15), transparent 74%),
        linear-gradient(180deg, #17151a 0%, #100e12 54%, #0b0b0e 100%);
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 62% 18% at 50% 77%, rgba(203, 105, 43, .105), transparent 74%),
        linear-gradient(transparent 69%, rgba(7, 7, 9, .27) 100%);
      pointer-events: none;
    }

    .illustration {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      width: min(1360px, max(100vw, 560px));
      height: auto;
      max-width: none;
      flex: none;
      overflow: visible;
      transform: translate(-50%, -50%);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #bowl-art {
      transform: translate3d(var(--move-x), var(--move-y), 0);
      will-change: transform;
    }

    #steam {
      transform: translate3d(var(--steam-x), var(--steam-y), 0);
      will-change: transform;
    }

    .steam-plume {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: steam-rise 5.8s ease-in-out infinite alternate;
    }

    .steam-plume:nth-child(2) { animation-duration: 6.7s; animation-delay: -3.3s; }
    .steam-plume:nth-child(3) { animation-duration: 5.1s; animation-delay: -1.8s; }
    .steam-plume:nth-child(4) { animation-duration: 7.1s; animation-delay: -4.4s; }
    .steam-plume:nth-child(5) { animation-duration: 6.2s; animation-delay: -2.6s; }

    .surface-glint { animation: glimmer 4.6s ease-in-out infinite; }
    .surface-glint:nth-of-type(2) { animation-delay: -2.1s; }
    .surface-glint:nth-of-type(3) { animation-delay: -3.4s; }

    .warm-mote { animation: mote 6s ease-in-out infinite alternate; }
    .warm-mote:nth-child(2n) { animation-delay: -2.7s; animation-duration: 7.4s; }
    .warm-mote:nth-child(3n) { animation-delay: -4.1s; animation-duration: 5.3s; }

    @keyframes steam-rise {
      from { transform: translate(-5px, 8px) rotate(-2deg); opacity: .56; }
      50% { opacity: .82; }
      to { transform: translate(11px, -21px) rotate(3deg); opacity: .38; }
    }

    @keyframes glimmer {
      0%, 100% { opacity: .23; }
      50% { opacity: .66; }
    }

    @keyframes mote {
      from { transform: translate(0, 3px); opacity: .15; }
      to { transform: translate(5px, -12px); opacity: .55; }
    }

    @media (max-width: 600px) {
      .illustration { width: clamp(560px, 160vw, 600px); }
      .scene { background-position: center; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .illustration { width: min(100vw, 135svh); }
    }

    @media (prefers-reduced-motion: reduce) {
      #bowl-art, #steam { transform: none !important; will-change: auto; }
      .steam-plume, .surface-glint, .warm-mote { animation: none !important; }
    }
  </style>
</head>

  <script>
    (() => {
      const scene = document.querySelector('.scene');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;
      let frame = 0;

      function render() {
        frame = 0;
        if (reducedMotion.matches) return;

        currentX += (targetX - currentX) * 0.09;
        currentY += (targetY - currentY) * 0.09;
        scene.style.setProperty('--move-x', `${(currentX * 10).toFixed(2)}px`);
        scene.style.setProperty('--move-y', `${(currentY * 6).toFixed(2)}px`);
        scene.style.setProperty('--steam-x', `${(currentX * 21).toFixed(2)}px`);
        scene.style.setProperty('--steam-y', `${(currentY * 10).toFixed(2)}px`);
        scene.style.setProperty('--glow-x', `${(50 + currentX * 5).toFixed(2)}%`);
        scene.style.setProperty('--glow-y', `${(48 + currentY * 4).toFixed(2)}%`);

        if (Math.abs(targetX - currentX) > 0.001 || Math.abs(targetY - currentY) > 0.001) {
          frame = requestAnimationFrame(render);
        }
      }

      function schedule() {
        if (!frame && !reducedMotion.matches) frame = requestAnimationFrame(render);
      }

      scene.addEventListener('pointermove', event => {
        if (event.pointerType === 'touch' || reducedMotion.matches) return;
        targetX = Math.max(-1, Math.min(1, (event.clientX / window.innerWidth - .5) * 2));
        targetY = Math.max(-1, Math.min(1, (event.clientY / window.innerHeight - .5) * 2));
        schedule();
      }, { passive: true });

      scene.addEventListener('pointerleave', () => {
        targetX = 0;
        targetY = 0;
        schedule();
      });

      reducedMotion.addEventListener('change', () => {
        if (reducedMotion.matches) {
          cancelAnimationFrame(frame);
          frame = 0;
          targetX = targetY = currentX = currentY = 0;
          scene.style.removeProperty('--move-x');
          scene.style.removeProperty('--move-y');
          scene.style.removeProperty('--steam-x');
          scene.style.removeProperty('--steam-y');
          scene.style.removeProperty('--glow-x');
          scene.style.removeProperty('--glow-y');
        }
      });
    })();
  </script>
