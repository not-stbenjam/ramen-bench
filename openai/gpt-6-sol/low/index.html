<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11110f">
  <title>Ramen</title>
  <style>
    :root { color-scheme: dark; --mx: 0px; --my: 0px; --tilt-x: 0deg; --tilt-y: 0deg; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #11110f; }
    .scene { position: relative; width: 100%; min-height: 100svh; display: grid; place-items: center; overflow: hidden; isolation: isolate; background: radial-gradient(ellipse 40% 33% at 50% 49%, #403020 0%, #28231c 48%, transparent 100%), radial-gradient(ellipse 65% 58% at 50% 63%, #29241e 0%, #171715 67%, #11110f 100%); }
    .scene::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .36; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E"); mix-blend-mode: soft-light; z-index: 9; }
    .scene::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 65% 63% at 50% 48%, transparent 30%, #0b0b0b 100%); z-index: 8; }
    .warmth { position: absolute; width: min(95vw, 950px); height: min(75vh, 750px); border-radius: 50%; background: radial-gradient(circle, #ae61231e 0%, #70451b0e 42%, transparent 70%); filter: blur(24px); animation: breathe 8s ease-in-out infinite alternate; }
    .art { position: relative; width: min(95vw, 890px, calc(92svh * 1.22)); aspect-ratio: 890 / 730; transform: translate3d(var(--mx), var(--my), 0) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)); transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 35px 30px #0008); z-index: 2; }
    svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .steam { fill: none; stroke: #f3d9a8; stroke-linecap: round; filter: url(#steamBlur); opacity: 0; animation: rise 5.7s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .steam.s2 { animation-delay: -1.4s; animation-duration: 6.4s; }
    .steam.s3 { animation-delay: -3s; animation-duration: 5.1s; }
    .steam.s4 { animation-delay: -4.2s; animation-duration: 6.8s; }
    .steam.s5 { animation-delay: -2.5s; animation-duration: 5.9s; }
    .glimmer { animation: glimmer 5s ease-in-out infinite alternate; }
    .leaf { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 5s ease-in-out infinite alternate; }
    .leaf.l2 { animation-delay: -2.6s; animation-duration: 6s; }
    .ripple { animation: pulse 5s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .ripple.r2 { animation-delay: -2.5s; }
    @keyframes rise { 0% { opacity: 0; transform: translate(0, 15px) scale(.75); } 22% { opacity: .36; } 62% { opacity: .18; } 100% { opacity: 0; transform: translate(16px, -88px) scale(1.35); } }
    @keyframes breathe { to { opacity: .55; transform: scale(1.1); } }
    @keyframes glimmer { to { opacity: .42; } }
    @keyframes sway { to { transform: rotate(5deg); } }
    @keyframes pulse { 0% { opacity: .18; transform: scale(.94); } 70%,100% { opacity: 0; transform: scale(1.08); } }
    @media (max-aspect-ratio: 3/4) { .art { width: min(112vw, calc(76svh * 1.22)); margin-top: 3svh; } .scene { background-position: center; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .steam { opacity: .2; } .ripple { opacity: .1; } }
  </style>
</head>
<body>
  <main class="scene" aria-label="A steaming bowl of vegan ramen in a warm, dark room">
    <div class="warmth" aria-hidden="true"></div>
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 890 730" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="broth"><stop stop-color="#b87535"/><stop offset=".42" stop-color="#875022"/><stop offset=".78" stop-color="#543015"/><stop offset="1" stop-color="#281b11"/></radialGradient>
          <radialGradient id="bowl"><stop stop-color="#485249"/><stop offset=".58" stop-color="#303b36"/><stop offset="1" stop-color="#171f1e"/></radialGradient>
          <linearGradient id="bowlFront" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#4a5951"/><stop offset=".36" stop-color="#28342f"/><stop offset=".72" stop-color="#192522"/><stop offset="1" stop-color="#111817"/></linearGradient>
          <linearGradient id="rim" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#9a9c82"/><stop offset=".5" stop-color="#5e6a5e"/><stop offset="1" stop-color="#25332c"/></linearGradient>
          <linearGradient id="noodle" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4cf84"/><stop offset=".5" stop-color="#dca956"/><stop offset="1" stop-color="#a86b32"/></linearGradient>
          <radialGradient id="mushroom"><stop stop-color="#bd8660"/><stop offset=".62" stop-color="#74422c"/><stop offset="1" stop-color="#3d261e"/></radialGradient>
          <radialGradient id="tofu"><stop stop-color="#f4d9a0"/><stop offset=".72" stop-color="#d9b978"/><stop offset="1" stop-color="#9f7948"/></radialGradient>
          <radialGradient id="shadow"><stop stop-color="#000" stop-opacity=".8"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
          <filter id="blur"><feGaussianBlur stdDeviation="13"/></filter>
          <filter id="steamBlur"><feGaussianBlur stdDeviation="5"/></filter>
          <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
          <clipPath id="inside"><ellipse cx="445" cy="394" rx="275" ry="168"/></clipPath>
        </defs>

        <!-- Steam sits behind the bowl and curls gently into the dark. -->
        <g stroke-width="14">
          <path class="steam s1" d="M330 262 C300 213 353 187 329 146 S312 84 352 43"/>
          <path class="steam s2" d="M405 244 C374 205 425 176 403 129 S401 75 430 37"/>
          <path class="steam s3" d="M480 243 C457 207 503 175 485 134 S472 76 514 30"/>
          <path class="steam s4" d="M554 262 C531 221 575 195 550 155 S550 99 576 65"/>
          <path class="steam s5" d="M371 255 C360 218 391 197 380 166 S376 115 401 90" stroke-width="8"/>
        </g>

        <ellipse cx="445" cy="641" rx="345" ry="62" fill="url(#shadow)" filter="url(#blur)" opacity=".9"/>
        <ellipse cx="445" cy="614" rx="247" ry="36" fill="#1b1c19" opacity=".8"/>

        <!-- Outer ceramic bowl, viewed from slightly above. -->
        <path d="M158 389 C163 507 242 622 353 643 Q445 668 537 643 C648 622 727 507 732 389 Z" fill="url(#bowlFront)" stroke="#111a17" stroke-width="5"/>
        <path d="M177 451 C229 562 316 625 445 638 C574 625 661 562 713 451" fill="none" stroke="#68786a" stroke-opacity=".2" stroke-width="4"/>
        <path d="M253 552 Q444 679 638 552" fill="none" stroke="#a49b79" stroke-opacity=".16" stroke-width="3"/>
        <ellipse cx="445" cy="390" rx="290" ry="182" fill="url(#rim)" stroke="#a6a48a" stroke-width="3"/>
        <ellipse cx="445" cy="394" rx="275" ry="168" fill="url(#bowl)"/>
        <ellipse cx="445" cy="394" rx="266" ry="159" fill="url(#broth)"/>

        <g clip-path="url(#inside)">
          <!-- Soft oil sheen and a pair of slow broth ripples. -->
          <ellipse cx="462" cy="364" rx="230" ry="113" fill="#d68a3f" opacity=".09"/>
          <ellipse class="ripple" cx="449" cy="380" rx="220" ry="120" fill="none" stroke="#efba6b" stroke-width="3"/>
          <ellipse class="ripple r2" cx="449" cy="380" rx="194" ry="98" fill="none" stroke="#efba6b" stroke-width="3"/>
          <path d="M184 361 Q310 278 410 312 T696 338" fill="none" stroke="#f5ba63" stroke-opacity=".14" stroke-width="9" filter="url(#soft)"/>

          <!-- A fan of nori peeks from the back of the bowl. -->
          <g transform="rotate(-17 319 284)">
            <rect x="240" y="184" width="94" height="176" rx="5" fill="#1a2822" stroke="#38463a" stroke-width="3"/>
            <path d="M253 195 L266 345 M279 190 L291 342 M310 191 L319 336" stroke="#5c6846" stroke-opacity=".27" stroke-width="4"/>
          </g>
          <g transform="rotate(8 355 283)">
            <rect x="324" y="175" width="90" height="166" rx="5" fill="#202e27" stroke="#506047" stroke-width="3"/>
            <path d="M339 187 L347 332 M363 184 L373 325 M393 186 L399 325" stroke="#778659" stroke-opacity=".22" stroke-width="4"/>
          </g>

          <!-- Noodles turn through the broth rather than sitting as a flat disk. -->
          <g fill="none" stroke="url(#noodle)" stroke-linecap="round" stroke-width="7">
            <path d="M252 385 C294 333 349 337 389 366 S486 423 533 378 S609 310 665 360"/>
            <path d="M238 407 C296 363 351 377 397 404 S471 455 523 417 S612 344 671 387"/>
            <path d="M239 434 C297 386 344 412 391 439 S490 464 546 426 S621 375 669 416"/>
            <path d="M270 460 C319 420 374 429 422 459 S511 484 567 443 S635 419 675 442"/>
            <path d="M284 351 C340 303 396 325 440 355 S511 384 551 350 S608 311 646 339"/>
            <path d="M275 482 C332 457 378 471 427 493 S528 506 593 464"/>
            <path d="M405 329 C449 298 500 309 532 336 S586 378 635 358"/>
          </g>
          <g fill="none" stroke="#ffe2a1" stroke-linecap="round" stroke-width="1.7" opacity=".62">
            <path d="M252 383 C294 331 349 335 389 364 S486 421 533 376"/>
            <path d="M238 405 C296 361 351 375 397 402 S471 453 523 415"/>
            <path d="M271 458 C319 418 374 427 422 457 S511 482 567 441"/>
          </g>

          <!-- Bok choy, with pale ribs and lively green leaves. -->
          <g class="leaf l1" transform="rotate(-25 327 424)">
            <path d="M326 444 C270 431 250 379 270 346 C299 350 329 378 326 444Z" fill="#416c32" stroke="#253e25" stroke-width="3"/>
            <path d="M323 444 Q297 393 272 350" stroke="#b9bc76" stroke-width="8" fill="none"/>
            <path d="M296 397 L273 391 M308 413 L290 367" stroke="#93a65d" stroke-width="3"/>
          </g>
          <g class="leaf l2" transform="rotate(13 340 428)">
            <path d="M339 449 C323 392 345 348 378 335 C394 369 379 412 339 449Z" fill="#4f803b" stroke="#2b4b2b" stroke-width="3"/>
            <path d="M341 447 Q361 386 376 339" stroke="#d5c88a" stroke-width="9" fill="none"/>
            <path d="M353 408 L329 380 M363 383 L387 369" stroke="#a9bc6d" stroke-width="3"/>
          </g>
          <path d="M318 448 Q339 427 353 411" stroke="#e0d3a0" stroke-width="20" fill="none" stroke-linecap="round"/>

          <!-- Tofu cubes catch the amber light. -->
          <g transform="rotate(-13 512 325)">
            <rect x="477" y="293" width="72" height="67" rx="12" fill="url(#tofu)" stroke="#a67642" stroke-width="3"/>
            <path d="M482 306 Q514 321 545 299" fill="none" stroke="#fff1c3" stroke-width="5" opacity=".7"/>
            <circle cx="506" cy="337" r="3" fill="#9d7748" opacity=".5"/>
          </g>
          <g transform="rotate(22 593 405)">
            <rect x="557" y="373" width="70" height="65" rx="12" fill="url(#tofu)" stroke="#a67642" stroke-width="3"/>
            <path d="M565 382 Q599 400 623 380" fill="none" stroke="#fff1c3" stroke-width="5" opacity=".7"/>
          </g>

          <!-- Shiitake caps and their curved gills. -->
          <g transform="rotate(-20 540 463)">
            <path d="M478 470 C484 418 516 401 547 409 C579 418 599 447 595 484 Q538 506 478 470Z" fill="url(#mushroom)" stroke="#3b231b" stroke-width="4"/>
            <path d="M491 468 Q539 492 585 479 M525 418 Q508 439 501 459 M551 419 Q546 443 543 482 M572 434 Q576 452 576 477" fill="none" stroke="#d3aa78" stroke-opacity=".58" stroke-width="4"/>
          </g>
          <g transform="rotate(18 629 338) scale(.82) translate(137 -69)">
            <path d="M568 344 C570 307 597 289 625 294 C654 299 674 321 677 355 Q622 377 568 344Z" fill="url(#mushroom)" stroke="#3b231b" stroke-width="4"/>
            <path d="M579 344 Q623 361 665 350 M601 303 L593 339 M626 298 L623 352 M648 309 L656 347" fill="none" stroke="#d3aa78" stroke-opacity=".55" stroke-width="4"/>
          </g>

          <!-- Scallion rings, chili oil, sesame, and small herbal notes. -->
          <g fill="none" stroke="#a8c66d" stroke-width="5" opacity=".95">
            <ellipse cx="420" cy="347" rx="15" ry="8" transform="rotate(22 420 347)"/><ellipse cx="459" cy="452" rx="13" ry="7" transform="rotate(-24 459 452)"/>
            <ellipse cx="641" cy="399" rx="12" ry="6" transform="rotate(19 641 399)"/><ellipse cx="387" cy="465" rx="11" ry="6" transform="rotate(-18 387 465)"/>
            <ellipse cx="603" cy="360" rx="10" ry="5" transform="rotate(-20 603 360)"/>
          </g>
          <g fill="#c35d24" opacity=".85"><ellipse cx="432" cy="392" rx="18" ry="7" transform="rotate(20 432 392)"/><ellipse cx="615" cy="459" rx="19" ry="6" transform="rotate(-21 615 459)"/><ellipse cx="264" cy="425" rx="13" ry="5"/></g>
          <g fill="#f1d89c" opacity=".9"><ellipse cx="464" cy="315" rx="4" ry="2" transform="rotate(32 464 315)"/><ellipse cx="409" cy="438" rx="4" ry="2"/><ellipse cx="548" cy="391" rx="4" ry="2"/><ellipse cx="619" cy="431" rx="4" ry="2"/><ellipse cx="291" cy="374" rx="4" ry="2"/><ellipse cx="474" cy="483" rx="4" ry="2"/></g>
          <g fill="#2d643a"><path d="M433 330 q-7-20 8-25 q8 12-8 25Z"/><path d="M442 329 q9-16 20-11 q-5 12-20 11Z"/><path d="M371 471 q-7-19 9-25 q7 13-9 25Z"/></g>
          <path class="glimmer" d="M310 309 Q444 250 580 308" fill="none" stroke="#ffe4ac" stroke-opacity=".25" stroke-width="7" filter="url(#soft)"/>
        </g>

        <!-- The thick ceramic lip closes the composition. -->
        <path d="M164 397 C176 501 292 566 445 567 C598 566 714 501 726 397" fill="none" stroke="#171f1c" stroke-width="18" opacity=".8"/>
        <path d="M166 397 C192 488 301 545 445 548 C589 545 698 488 724 397" fill="none" stroke="#879183" stroke-width="7" opacity=".68"/>
        <path d="M196 449 Q301 531 445 534 Q589 531 694 449" fill="none" stroke="#d2c39d" stroke-width="2" opacity=".3"/>
        <path d="M219 500 Q271 585 353 613" fill="none" stroke="#a1a590" stroke-width="9" opacity=".09" filter="url(#soft)"/>
      </svg>
    </div>
  </main>
  <script>
    (() => {
      const scene = document.querySelector('.scene');
      const art = document.querySelector('.art');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let frame = 0;
      const reset = () => {
        art.style.setProperty('--mx', '0px'); art.style.setProperty('--my', '0px');
        art.style.setProperty('--tilt-x', '0deg'); art.style.setProperty('--tilt-y', '0deg');
      };
      scene.addEventListener('pointermove', event => {
        if (reducedMotion.matches || event.pointerType === 'touch') return;
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          const x = (event.clientX / window.innerWidth - .5) * 2;
          const y = (event.clientY / window.innerHeight - .5) * 2;
          art.style.setProperty('--mx', `${x * 9}px`);
          art.style.setProperty('--my', `${y * 6}px`);
          art.style.setProperty('--tilt-x', `${-y * 1.5}deg`);
          art.style.setProperty('--tilt-y', `${x * 2}deg`);
        });
      });
      scene.addEventListener('pointerleave', reset);
      reducedMotion.addEventListener('change', reset);
    })();
  </script>
</body>
</html>
