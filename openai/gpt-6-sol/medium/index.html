<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100e10">
  <title>Vegan ramen</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { overflow: hidden; background: #100e10; }
    .scene {
      --light-x: 50%; --light-y: 48%;
      position: relative; display: grid; place-items: center;
      width: 100%; min-height: 100svh; overflow: hidden; isolation: isolate;
      background:
        radial-gradient(ellipse 48% 42% at var(--light-x) var(--light-y), #62402a3b 0%, #34231d30 42%, transparent 100%),
        radial-gradient(ellipse 85% 65% at 50% 95%, #27201d 0%, #171416 53%, #0d0c0f 100%);
    }
    .scene::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 65% 50% at 50% 103%, transparent 35%, #09090b95 100%);
      z-index: 3;
    }
    .scene::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      mix-blend-mode: screen; z-index: 4;
    }
    .art { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; width: min(1200px, 155vw, 160vh); height: auto; overflow: visible; touch-action: pan-y; }
    .dish { transform-origin: 600px 590px; will-change: transform; }
    .steam { fill: none; stroke: url(#steam); stroke-linecap: round; filter: url(#steam-blur); transform-box: fill-box; transform-origin: center bottom; animation: drift 6s ease-in-out infinite; }
    .steam.s2 { animation-duration: 7.4s; animation-delay: -2.9s; }
    .steam.s3 { animation-duration: 6.8s; animation-delay: -4.5s; }
    .steam.s4 { animation-duration: 8.2s; animation-delay: -1.6s; }
    .steam.s5 { animation-duration: 7.7s; animation-delay: -5.4s; }
    .surface-shimmer { animation: shimmer 5s ease-in-out infinite alternate; transform-origin: center; }
    .leaf { animation: breathe 5.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 85%; }
    .leaf.two { animation-delay: -2.4s; }
    .leaf.three { animation-delay: -3.8s; }
    .ember { animation: twinkle 4s ease-in-out infinite; }
    .ember:nth-of-type(2n) { animation-delay: -2s; }
    @keyframes drift {
      0% { opacity: 0; transform: translate(0, 15px) scale(.94); }
      20% { opacity: .75; }
      72% { opacity: .48; }
      100% { opacity: 0; transform: translate(16px, -36px) scale(1.12); }
    }
    @keyframes shimmer { from { opacity: .36; transform: scale(.98); } to { opacity: .8; transform: scale(1.025); } }
    @keyframes breathe { from { transform: rotate(-1.4deg); } to { transform: rotate(1.5deg); } }
    @keyframes twinkle { 0%, 100% { opacity: .1; transform: translateY(5px); } 50% { opacity: .55; transform: translateY(-7px); } }
    @media (max-width: 600px) { .art { width: min(155vw, 160vh); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .steam { opacity: .36; }
      .ember { opacity: .18; }
    }
  </style>
</head>
<body>

  <script>
    (() => {
      const scene = document.querySelector('.scene');
      const dish = document.querySelector('.dish');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let targetX = 0, targetY = 0, currentX = 0, currentY = 0, frame = 0;

      function animate() {
        currentX += (targetX - currentX) * 0.075;
        currentY += (targetY - currentY) * 0.075;
        dish.style.transform = `translate(${(currentX * 8).toFixed(2)}px, ${(currentY * 5).toFixed(2)}px) rotate(${(currentX * 0.75).toFixed(2)}deg)`;
        scene.style.setProperty('--light-x', `${50 + currentX * 8}%`);
        scene.style.setProperty('--light-y', `${48 + currentY * 5}%`);
        if (Math.abs(targetX - currentX) + Math.abs(targetY - currentY) > 0.003) {
          frame = requestAnimationFrame(animate);
        } else {
          frame = 0;
        }
      }
      function move(event) {
        if (reduceMotion.matches || event.pointerType === 'touch') return;
        targetX = Math.max(-1, Math.min(1, (event.clientX / innerWidth - .5) * 2));
        targetY = Math.max(-1, Math.min(1, (event.clientY / innerHeight - .5) * 2));
        if (!frame) frame = requestAnimationFrame(animate);
      }
      scene.addEventListener('pointermove', move, { passive: true });
      scene.addEventListener('pointerleave', () => {
        targetX = targetY = 0;
        if (!reduceMotion.matches && !frame) frame = requestAnimationFrame(animate);
      });
      reduceMotion.addEventListener('change', () => {
        if (reduceMotion.matches) {
          if (frame) cancelAnimationFrame(frame);
          frame = 0; targetX = targetY = currentX = currentY = 0;
          dish.style.transform = '';
          scene.style.removeProperty('--light-x');
          scene.style.removeProperty('--light-y');
        }
      });
    })();
  </script>
</body>
</html>
