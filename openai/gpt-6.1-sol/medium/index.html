<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100d0b">
<title>Warmth</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d0b}body{min-height:100svh}main{position:relative;width:100%;height:100%;isolation:isolate;background:radial-gradient(ellipse at 50% 58%,#30221a 0%,#1b1510 34%,#100e0c 66%,#090909 100%)}main:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,#07070780 100%);z-index:3}.light{position:absolute;width:85vmin;height:85vmin;left:50%;top:48%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,#b8753520,transparent 66%);filter:blur(40px);animation:warmth 9s ease-in-out infinite}.scene{position:absolute;inset:0;display:grid;place-items:center;perspective:1000px}.dish{width:min(100vw,1100px);height:auto;max-height:100svh;overflow:visible;transform:translate3d(var(--x,0px),var(--y,0px),0) rotate(var(--r,0deg));will-change:transform}.steam{mix-blend-mode:screen;pointer-events:none}.steam path{fill:none;stroke:#e2d4b6;stroke-linecap:round;filter:url(#steamBlur);opacity:0;animation:rise 8s ease-in-out infinite;transform-origin:50% 60%}.steam path:nth-child(2){animation-delay:-2.6s;animation-duration:9s}.steam path:nth-child(3){animation-delay:-5.2s;animation-duration:10s}.steam path:nth-child(4){animation-delay:-6s;animation-duration:11s}.surface-glow{animation:shimmer 6s ease-in-out infinite}.floating{animation:bob 7s ease-in-out infinite;transform-origin:center}.floating.slow{animation-delay:-3s;animation-duration:9s}.broth-ripple{fill:none;stroke:#ffd393;stroke-width:1;opacity:0;transform-origin:550px 458px;animation:ripple 8s ease-out infinite}.broth-ripple.second{animation-delay:-4s}.pointer-glow{opacity:var(--hover,0);transition:opacity 1s;mix-blend-mode:screen}.grain{pointer-events:none;opacity:.13;mix-blend-mode:soft-light}@keyframes rise{0%{opacity:0;transform:translate(0,22px) scaleX(.85)}25%{opacity:.17}65%{opacity:.11}100%{opacity:0;transform:translate(20px,-65px) scaleX(1.15)}}@keyframes warmth{50%{opacity:.65;transform:translate(-50%,-50%) scale(1.1)}}@keyframes shimmer{50%{opacity:.55}}@keyframes bob{50%{transform:translateY(-1.5px)}}@keyframes ripple{0%{opacity:0;transform:scale(.78)}15%{opacity:.12}100%{opacity:0;transform:scale(1.06)}}@media(max-aspect-ratio:3/4){.dish{width:145vw;max-width:none;max-height:none}.light{width:120vw;height:120vw}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.dish{transform:none!important}.steam path{opacity:.1}.steam path:nth-child(2){opacity:.07}.steam path:nth-child(3),.steam path:nth-child(4){opacity:0}}
</style>
</head>
<body>
<main aria-label="A warm ceramic bowl of vegan ramen, with golden broth, noodles, tofu, mushrooms and green vegetables. Gentle steam rises into the darkness.">
<div class="light"></div>
<div class="scene">
<svg class="dish" viewBox="0 0 1100 850" role="img" aria-labelledby="scene-title">
<title id="scene-title">A steaming bowl of vegan ramen</title>
<defs>
<radialGradient id="shadow"><stop stop-color="#000" stop-opacity=".8"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<linearGradient id="bowl" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#655044"/><stop offset=".2" stop-color="#423129"/><stop offset=".48" stop-color="#271d19"/><stop offset=".78" stop-color="#191715"/><stop offset="1" stop-color="#30231a"/></linearGradient>
<linearGradient id="bowlLight" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#e3b885" stop-opacity=".26"/><stop offset=".45" stop-color="#ba895b" stop-opacity=".06"/><stop offset="1" stop-color="#050505" stop-opacity=".2"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b49775"/><stop offset=".22" stop-color="#76604b"/><stop offset=".56" stop-color="#3b2d23"/><stop offset="1" stop-color="#a0805d"/></linearGradient>
<radialGradient id="broth" cx=".42" cy=".35" r=".75"><stop stop-color="#b88030"/><stop offset=".38" stop-color="#88501f"/><stop offset=".76" stop-color="#61331b"/><stop offset="1" stop-color="#2b1b11"/></radialGradient>
<linearGradient id="noodle" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1d58c"/><stop offset=".5" stop-color="#d5ab61"/><stop offset="1" stop-color="#a6712f"/></linearGradient>
<linearGradient id="leaf" x1="0" y1="1" x2=".6" y2="0"><stop stop-color="#9ea967"/><stop offset=".35" stop-color="#697d36"/><stop offset=".65" stop-color="#3a672f"/><stop offset="1" stop-color="#173d25"/></linearGradient>
<linearGradient id="stem"><stop stop-color="#d6d99b"/><stop offset=".5" stop-color="#8ca963"/><stop offset="1" stop-color="#3c6c35"/></linearGradient>
<linearGradient id="tofu" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7c28a"/><stop offset=".5" stop-color="#c99c59"/><stop offset="1" stop-color="#9e602b"/></linearGradient>
<linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a36d42"/><stop offset=".4" stop-color="#704225"/><stop offset="1" stop-color="#382117"/></linearGradient>
<radialGradient id="oil"><stop stop-color="#ffeab3" stop-opacity=".65"/><stop offset=".7" stop-color="#eab257" stop-opacity=".25"/><stop offset="1" stop-color="#eab257" stop-opacity="0"/></radialGradient>
<filter id="steamBlur"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="foodShadow" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#261307" flood-opacity=".7"/></filter>
<filter id="texture"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<clipPath id="soupClip"><ellipse cx="550" cy="456" rx="258" ry="101"/></clipPath>
<clipPath id="bowlClip"><path d="M270 451C278 565 345 656 477 682Q550 697 623 682C755 656 822 565 830 451Z"/></clipPath>
</defs>
<!-- A soft pool of light grounds the bowl in the darkness. -->
<ellipse cx="550" cy="701" rx="335" ry="72" fill="url(#shadow)"/>
<ellipse cx="550" cy="691" rx="158" ry="22" fill="#000" opacity=".4"/>
<path d="M465 659L471 687Q550 710 629 687L635 659" fill="#221b16"/>
<path d="M474 688Q550 704 625 688" fill="none" stroke="#806044" stroke-opacity=".3" stroke-width="3"/>
<path d="M270 451C278 565 345 656 477 682Q550 697 623 682C755 656 822 565 830 451Z" fill="url(#bowl)"/>
<path d="M270 451C278 565 345 656 477 682Q550 697 623 682C755 656 822 565 830 451Z" fill="url(#bowlLight)"/>
<g id="ceramic" clip-path="url(#bowlClip)"></g>
<path d="M287 506C310 589 370 646 475 667" fill="none" stroke="#dbb688" stroke-width="2" opacity=".12"/>
<ellipse cx="550" cy="449" rx="281" ry="119" fill="url(#rim)"/>
<ellipse cx="550" cy="446" rx="272" ry="108" fill="#302219"/>
<ellipse cx="550" cy="453" rx="262" ry="104" fill="url(#broth)"/>
<g clip-path="url(#soupClip)">
<g id="oil"></g>
<ellipse class="broth-ripple" cx="550" cy="458" rx="244" ry="89"/>
<ellipse class="broth-ripple second" cx="550" cy="458" rx="244" ry="89"/>
<g id="noodles" filter="url(#foodShadow)"></g>
<!-- Charred tofu, each face catches the warm overhead light. -->
<g class="floating slow" filter="url(#foodShadow)">
<path d="M358 409L420 394L461 420L399 439Z" fill="url(#tofu)"/><path d="M358 409L399 439L399 461L359 430Z" fill="#a36d34"/><path d="M399 439L461 420L459 443L399 461Z" fill="#bc8642"/>
<path d="M337 450L389 438L425 461L373 477Z" fill="url(#tofu)"/><path d="M337 450L373 477L373 495L338 468Z" fill="#96622c"/><path d="M373 477L425 461L423 481L373 495Z" fill="#b6813f"/>
<g stroke="#75401b" stroke-width="4" opacity=".65"><path d="M372 410L411 435M385 406L425 430M399 403L439 426M347 452L380 472M362 449L394 469M377 447L408 464"/></g>
<g fill="#f8dda7" opacity=".65"><circle cx="366" cy="416" r="1"/><circle cx="430" cy="420" r="1.5"/><circle cx="390" cy="419" r="1"/><circle cx="358" cy="459" r="1"/><circle cx="401" cy="457" r="1.2"/></g>
</g>
<!-- Tender greens with folded leaves and pale, juicy stems. -->
<g class="floating" filter="url(#foodShadow)">
<path d="M634 427C653 394 660 347 692 345C710 331 736 344 739 365C761 370 761 394 744 406C723 426 678 426 647 446Z" fill="url(#leaf)"/>
<path d="M660 429C686 405 715 386 732 357M686 406L687 363M707 389L740 389" fill="none" stroke="#8ca450" stroke-width="2" opacity=".45"/>
<path d="M625 446C651 407 687 393 719 408C737 410 746 429 730 439C711 462 664 454 644 464Z" fill="url(#leaf)"/>
<path d="M633 455Q668 430 723 421" fill="none" stroke="#a5b35e" stroke-width="2" opacity=".45"/>
<path d="M607 469Q614 447 665 415Q651 445 631 472Q617 480 607 469" fill="url(#stem)"/>
<path d="M620 470Q647 449 684 441Q665 461 636 481Q624 484 620 470" fill="url(#stem)"/>
<path d="M613 466Q632 445 651 432" fill="none" stroke="#ecedbb" opacity=".45" stroke-width="2"/>
</g>
<!-- Shiitake caps with hand-cut star scoring. -->
<g filter="url(#foodShadow)" class="floating slow">
<path d="M568 390L577 422Q586 430 596 420L588 385" fill="#bb995f"/>
<path d="M537 386C539 361 569 351 591 363C615 374 618 393 605 403C589 416 538 410 537 386Z" fill="url(#cap)"/>
<path d="M548 389Q578 406 606 390" stroke="#cc9c66" stroke-width="2" fill="none" opacity=".6"/>
<path d="M558 369L587 396M593 370L562 396" stroke="#d6b17d" stroke-width="4" stroke-linecap="round"/><path d="M557 382L599 383" stroke="#c8a072" stroke-width="3" stroke-linecap="round"/>
<path d="M704 472L710 493Q718 498 724 490L721 470" fill="#a58657"/>
<path d="M676 468C677 444 708 434 732 447C751 456 754 475 741 484C721 495 676 487 676 468Z" fill="url(#cap)"/>
<path d="M693 452L729 478M729 452L700 479" stroke="#d1a672" stroke-width="3.5" stroke-linecap="round"/>
<path d="M683 474Q710 488 742 474" stroke="#c89b65" stroke-width="2" fill="none" opacity=".5"/>
</g>
<g id="corn" filter="url(#foodShadow)"></g>
<g id="garnish" filter="url(#foodShadow)"></g>
<g fill="none" stroke="#bd3e21" stroke-width="4"><ellipse cx="459" cy="489" rx="10" ry="5" transform="rotate(-22 459 489)"/><ellipse cx="643" cy="502" rx="9" ry="5" transform="rotate(25 643 502)"/><ellipse cx="494" cy="405" rx="8" ry="4" transform="rotate(20 494 405)"/></g>
<path class="surface-glow" d="M417 527Q549 564 680 528" fill="none" stroke="#f9c270" stroke-width="1.5" opacity=".3"/>
<ellipse class="pointer-glow" id="reflection" cx="530" cy="455" rx="95" ry="45" fill="url(#oil)"/>
</g>
<!-- The lip wraps around the soup, including all of its toppings. -->
<path d="M273 461C295 524 424 565 550 565C679 565 807 524 827 461" fill="none" stroke="#251e18" stroke-width="9"/>
<path d="M273 456C298 520 425 560 550 560C680 560 804 520 827 456" fill="none" stroke="url(#rim)" stroke-width="6"/>
<path d="M303 491C355 534 462 551 548 552" fill="none" stroke="#dec49b" stroke-width="1.5" opacity=".45"/>
<g clip-path="url(#bowlClip)" class="grain"><rect x="260" y="455" width="580" height="240" filter="url(#texture)" opacity=".45"/></g>
<g class="steam" aria-hidden="true">
<path d="M477 412C442 366 500 340 472 295S450 230 490 194S514 136 495 113" stroke-width="17"/>
<path d="M549 403C579 362 518 333 551 289S584 226 560 193S547 151 570 128" stroke-width="22"/>
<path d="M627 405C656 363 598 344 620 303S662 260 640 215S635 159 650 137" stroke-width="14"/>
<path d="M510 411C536 368 494 342 511 317S542 273 529 246" stroke-width="26"/>
</g>
</svg>
</div>
</main>
<script>
(()=>{
'use strict';
const ns='http://www.w3.org/2000/svg';
let seed=81;const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const add=(id,tag,attrs)=>{const el=document.createElementNS(ns,tag);for(const [key,value]of Object.entries(attrs))el.setAttribute(key,value);document.getElementById(id).append(el);return el};
// Fine thrown-pot ridges follow the curve of the ceramic.
for(let i=0;i<30;i++){const x=280+i*18.5;add('ceramic','path',{d:`M${x} 491 Q${550+(x-550)*.89} 614 ${550+(x-550)*.52} 689`,fill:'none',stroke:i%3===0?'#b49a7a':'#0d0c0a','stroke-width':i%3===0?.8:1.4,opacity:i%3===0?.075:.15});}
for(let i=0;i<65;i++){const x=310+random()*480,y=367+random()*176;add('oil','ellipse',{cx:x,cy:y,rx:2+random()*11,ry:1+random()*3,fill:'url(#oil)',opacity:.3+random()*.6});}
// Individual strands curl into an irregular nest, rather than a flat symbol.
for(let i=0;i<25;i++){
const y=413+i*3.6,x=425+random()*19,w=175+random()*31;
const d=`M${x} ${y} C${x-25} ${y-22} ${x+36} ${y-29} ${x+58} ${y-15} S${x+118} ${y+14} ${x+w} ${y-5} C${x+w+43} ${y-19} ${x+w+41} ${y+19} ${x+w-1} ${y+20} S${x+85} ${y-7} ${x+58} ${y+11} S${x-8} ${y+24} ${x+4} ${y+6}`;
add('noodles','path',{d,fill:'none',stroke:'#70401b','stroke-width':6,'stroke-linecap':'round',opacity:.7});
add('noodles','path',{d,fill:'none',stroke:'url(#noodle)','stroke-width':3.6,'stroke-linecap':'round'});
add('noodles','path',{d,fill:'none',stroke:'#ffe4a5','stroke-width':.7,'stroke-linecap':'round',opacity:.3,transform:'translate(0,-1)'});
}
for(let i=0;i<33;i++){const x=737+random()*42,y=411+random()*37;add('corn','ellipse',{cx:x,cy:y,rx:4+random()*2,ry:3+random()*1.5,fill:['#eebf50','#d59a2d','#f4d375'][i%3],transform:`rotate(${random()*70-35} ${x} ${y})`,stroke:'#a96e21','stroke-width':.6});add('corn','path',{d:`M${x-2} ${y-1}q2 -2 4 0`,stroke:'#ffeda2','stroke-width':.8,fill:'none',opacity:.65});}
for(let i=0;i<40;i++){const x=423+random()*255,y=405+random()*117;if(x>615&&y<474)continue;const angle=random()*180;add('garnish','ellipse',{cx:x,cy:y,rx:4+random()*2,ry:2.2,fill:'#6f994a',stroke:'#9bbd66','stroke-width':1.2,transform:`rotate(${angle} ${x} ${y})`});add('garnish','ellipse',{cx:x,cy:y,rx:2.3,ry:1,fill:'#344e24',transform:`rotate(${angle} ${x} ${y})`});}
for(let i=0;i<40;i++){const x=380+random()*350,y=397+random()*133;add('garnish','ellipse',{cx:x,cy:y,rx:1.7,ry:.8,fill:i%3?'#e6cb91':'#2e2216',transform:`rotate(${random()*180} ${x} ${y})`,opacity:.85});}
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),dish=document.querySelector('.dish'),main=document.querySelector('main'),reflection=document.getElementById('reflection');
let tx=0,ty=0,x=0,y=0,frame=0;
function animate(){x+=(tx-x)*.045;y+=(ty-y)*.045;dish.style.setProperty('--x',`${x*7}px`);dish.style.setProperty('--y',`${y*4}px`);dish.style.setProperty('--r',`${x*.65}deg`);reflection.setAttribute('cx',550+x*110);reflection.setAttribute('cy',455+y*30);if(Math.abs(tx-x)+Math.abs(ty-y)>.001){frame=requestAnimationFrame(animate)}else frame=0;}
function move(e){if(reduced.matches)return;tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2;main.style.setProperty('--hover','.2');if(!frame)frame=requestAnimationFrame(animate);}
window.addEventListener('pointermove',move,{passive:true});document.documentElement.addEventListener('pointerleave',()=>{tx=ty=0;main.style.setProperty('--hover','0');if(!frame&&!reduced.matches)frame=requestAnimationFrame(animate)});
reduced.addEventListener('change',()=>{cancelAnimationFrame(frame);frame=0;tx=ty=x=y=0;dish.style.setProperty('--x','0px');dish.style.setProperty('--y','0px');dish.style.setProperty('--r','0deg');main.style.setProperty('--hover','0');});
})();
</script>
</body>
</html>
