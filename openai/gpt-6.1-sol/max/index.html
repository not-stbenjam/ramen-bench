<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0b0b">
  <meta name="description" content="A quiet, living portrait of a steaming bowl of vegan ramen.">
  <title>Warmth</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #0a0b0b; }
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 43% 48%, #29221b22 0%, #17171518 31%, transparent 66%),
        radial-gradient(ellipse at 50% 100%, #030405 0%, transparent 58%),
        #0b0c0c;
    }
    .light {
      position: absolute;
      inset: -15%;
      background:
        radial-gradient(ellipse 34% 38% at 43% 49%, #b87d3420, #7553370b 54%, transparent 80%),
        radial-gradient(ellipse 30% 25% at 64% 67%, #63624b06, transparent);
      transform: translate3d(var(--light-x, 0px), var(--light-y, 0px), 0);
      will-change: transform;
    }
    .grain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .047;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }
    .stage {
      position: absolute;
      left: 50%;
      top: 48%;
      width: min(1220px, 130vw, calc(100svh * 1.23));
      aspect-ratio: 11 / 9;
      transform: translate(-50%, -50%);
    }
    .portrait {
      position: absolute;
      inset: 0;
      transform-origin: 50% 64%;
      transform: translate3d(var(--dish-x, 0px), var(--dish-y, 0px), 0) rotate(var(--dish-r, 0deg));
      will-change: transform;
    }
    .ramen, .steam, .surface-light {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .steam, .surface-light { pointer-events: none; }
    .ramen, .steam, .surface-light { transform: translateZ(0); }
    .surface-light { will-change: opacity; }
    .soup-glow { animation: simmer 7s ease-in-out infinite alternate; }
    .oil-shine { animation: simmer 9s -3s ease-in-out infinite alternate; }
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 52%, transparent 38%, #02030340 84%, #02030380 115%);
    }
    @keyframes simmer { from { opacity: .32; } to { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .portrait, .light { transform: none; will-change: auto; }
      .soup-glow { opacity: .5; }
      .oil-shine { opacity: .55; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="A steaming bowl of vegan ramen in warm, quiet light">

    <svg class="grain" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">

          <g fill="none" stroke-linecap="round" filter="url(#small-shadow)">
            <path d="M482 464 C510 438 546 438 559 460 C568 477 526 485 519 466 C513 450 543 434 551 451 C559 468 517 484 495 478" stroke="#a2371c" stroke-width="2"/>
            <path d="M489 468 C526 468 521 439 544 444 C566 451 537 463 525 475" stroke="#d45b2b" stroke-width="1.7"/>
            <path d="M499 454 C491 440 525 445 534 458 C549 479 514 485 509 471" stroke="#eb7741" stroke-width="1.15"/>
            <path d="M504 481 Q539 462 565 469" stroke="#8d2619" stroke-width="1.5"/>
          </g>

          <!-- The front lip catches a thin, interrupted ribbon of warm light. -->
          <path d="M217 526 C218 600 366 662 548 662 C731 662 879 601 883 526" fill="none" stroke="#09100d" stroke-width="5" opacity=".5"/>
          <path d="M219 522 C218 598 366 656 550 657 C734 657 881 599 881 522" fill="none" stroke="url(#ceramic-reflection)" stroke-width="3.5"/>
          <path d="M224 507 C243 442 382 392 551 392 C687 392 805 426 852 473" fill="none" stroke="url(#rim-light)" stroke-width="1.6"/>
          <path d="M227 514 C237 542 251 558 273 572 M301 596 Q343 622 394 631" fill="none" stroke="#d1c3a0" stroke-width="1.5" opacity=".3" stroke-linecap="round"/>
          <path d="M769 625 Q810 610 834 590" fill="none" stroke="#a0af91" stroke-width="1.3" opacity=".25" stroke-linecap="round"/>
        </svg>
        <svg class="surface-light soup-glow" viewBox="0 0 1100 900" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <g fill="none" stroke="#ffe1a2" stroke-linecap="round">
            <path d="M254 534 Q252 557 272 570" stroke-width="1.8"/>
            <path d="M279 580 Q292 590 310 594 M530 621 Q558 623 575 620" stroke-width="1.2"/>
            <path d="M813 561 Q823 551 827 543 M805 570 L807 568" stroke-width="1.6"/>
          </g>
        </svg>
        <svg class="surface-light oil-shine" viewBox="0 0 1100 900" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <g fill="none" stroke="#ffe9b5" stroke-linecap="round">
            <path d="M283 525 Q284 519 291 518 M291 534 L294 535 M462 608 Q471 611 479 609 M577 593 L583 590" stroke-width="1.5"/>
            <path d="M755 581 Q765 581 770 578 M794 539 L799 536" stroke-width="1.2"/>
          </g>
        </svg>
        <canvas class="steam" aria-hidden="true"></canvas>
      </div>
    </div>
    <div class="vignette" aria-hidden="true"></div>
  </main>
  <script>
    (() => {
      'use strict';

      // Deterministic variation gives each small drawn detail its own shape.
      let seed = 71427;
      const random = () => {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
      };
      const between = (a, b) => a + random() * (b - a);
      const ns = 'http://www.w3.org/2000/svg';
      const make = (tag, attributes, parent) => {
        const element = document.createElementNS(ns, tag);
        for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
        if (parent) parent.appendChild(element);
        return element;
      };
      const group = id => document.getElementById(id);
      const round = n => Math.round(n * 100) / 100;
      const ellipsePoint = (rx, ry, cx = 550, cy = 522) => {
        const a = between(0, Math.PI * 2);
        const r = Math.sqrt(random());
        return { x: cx + Math.cos(a) * rx * r, y: cy + Math.sin(a) * ry * r };
      };

      // The bowl's very fine concentric grooves follow its curved profile.
      for (let i = 0; i < 52; i++) {
        const y = 557 + i * 4.9;
        make('path', {
          d: `M218 ${round(y - 26)} Q549 ${round(y + 105 - i * .6)} 882 ${round(y - 26)}`,
          fill: 'none', stroke: i % 3 ? '#a6ab95' : '#020906',
          'stroke-width': between(.4, 1.1), opacity: between(.024, .065)
        }, group('throwing-lines'));
      }
      for (let i = 0; i < 530; i++) {
        make('ellipse', {
          cx: between(225, 880), cy: between(566, 810),
          rx: between(.3, 1.2), ry: between(.25, .7),
          fill: i % 3 ? '#c6c3a9' : '#07100b', opacity: between(.04, .23)
        }, group('glaze-specks'));
      }

      // Oil collects in irregular lenses instead of evenly spaced circles.
      for (let i = 0; i < 43; i++) {
        const {x, y} = ellipsePoint(307, 109);
        const rx = between(7, 38), ry = rx * between(.21, .47);
        make('path', {
          d: `M${round(x-rx)} ${round(y)} C${round(x-rx)} ${round(y-ry)} ${round(x-rx*.3)} ${round(y-ry*1.3)} ${round(x+rx*.4)} ${round(y-ry*.7)} C${round(x+rx*1.15)} ${round(y-ry*.4)} ${round(x+rx)} ${round(y+ry*.7)} ${round(x+rx*.2)} ${round(y+ry)} C${round(x-rx*.4)} ${round(y+ry*.7)} ${round(x-rx*.8)} ${round(y+ry*.8)} ${round(x-rx)} ${round(y)}Z`,
          fill: 'url(#oil)', opacity: between(.16, .5),
          stroke: i % 3 ? '#e3ad50' : '#9d461c', 'stroke-width': .65
        }, group('broth-oil'));
      }
      for (let i = 0; i < 240; i++) {
        const {x, y} = ellipsePoint(310, 112);
        const r = between(.3, 1.3);
        make('ellipse', {
          cx: round(x), cy: round(y), rx: r, ry: r * .52,
          fill: i % 4 ? '#ffdc80' : '#713916', opacity: between(.12, .6)
        }, group('broth-flecks'));
      }

      // Nori is crinkled: little overlapping fibers catch the grazing light.
      for (let i = 0; i < 470; i++) {
        const x = between(279, 434), y = between(344, 464);
        const width = between(1, 9);
        make('path', {
          d: `M${round(x)} ${round(y)} l${round(width*.6)} ${round(between(-3, 1))} l${round(width*.4)} ${round(between(-1, 3))}`,
          fill: 'none', stroke: i % 4 ? '#7e8b60' : '#020b08',
          'stroke-width': between(.45, 1.7), opacity: between(.12, .36)
        }, group('nori-texture'));
      }

      // Smooth Catmull–Rom curves keep the noodles loose and organic.
      const smoothPath = points => {
        let d = `M${round(points[0].x)} ${round(points[0].y)}`;
        for (let i = 0; i < points.length - 1; i++) {
          const a = points[Math.max(0, i-1)], b = points[i];
          const c = points[i+1], e = points[Math.min(points.length-1, i+2)];
          d += ` C${round(b.x+(c.x-a.x)/6)} ${round(b.y+(c.y-a.y)/6)} ${round(c.x-(e.x-b.x)/6)} ${round(c.y-(e.y-b.y)/6)} ${round(c.x)} ${round(c.y)}`;
        }
        return d;
      };
      const noodleColors = ['#e4bd70', '#e8c77f', '#d9a859', '#f0cd84', '#d5a258', '#ebc279'];
      for (let i = 0; i < 48; i++) {
        const cx = between(462, 558), cy = between(512, 559);
        const rx = between(55, 111), ry = between(24, 52);
        const phase = between(0, Math.PI * 2), curl = between(.85, 1.45);
        const points = [];
        const segments = 26;
        for (let j = 0; j <= segments; j++) {
          const t = phase + j / segments * Math.PI * 2 * curl;
          const wobble = Math.sin(t * 3 + i * .8) * 6 + Math.cos(t * 5 + i) * 3;
          points.push({
            x: cx + Math.cos(t) * (rx + wobble) + Math.sin(t * 2 + i) * 7,
            y: cy + Math.sin(t) * (ry + wobble * .36) + Math.sin(t * 3 + i) * 2
          });
        }
        const d = smoothPath(points);
        const width = between(3.3, 5.4);
        make('path', {d, fill:'none', stroke:'#6b401c', 'stroke-width':width+2, 'stroke-linecap':'round', opacity:.58, transform:'translate(.7 2)'}, group('noodles'));
        make('path', {d, fill:'none', stroke:noodleColors[i%noodleColors.length], 'stroke-width':width, 'stroke-linecap':'round', 'stroke-linejoin':'round'}, group('noodles'));
        make('path', {d, fill:'none', stroke:'#ffe3a2', 'stroke-width':width*.26, 'stroke-linecap':'round', opacity:between(.32,.62), transform:'translate(-.4 -.85)'}, group('noodles'));
      }

      for (let i = 0; i < 17; i++) {
        const {x, y} = ellipsePoint(29, 20, 318, 571);
        const angle = between(-35, 35);
        const kernel = make('g', {transform:`translate(${round(x)} ${round(y)}) rotate(${angle})`}, group('corn'));
        make('path', {d:'M-5 -3 Q-5 -8 0 -7 Q7 -7 7 -1 L5 5 Q0 8 -5 4Z', fill:i%3 ? '#e6b348' : '#f2c85c', stroke:'#ba7c27', 'stroke-width':.6}, kernel);
        make('path', {d:'M-3 -3 Q0 -6 4 -3', fill:'none', stroke:'#ffe69a', 'stroke-width':1.5, 'stroke-linecap':'round', opacity:.75}, kernel);
      }

      // Thin scallion slices, toasted sesame, and tiny chili flakes.
      for (let i = 0; i < 34; i++) {
        let point;
        if (i < 24) point = ellipsePoint(137, 58, 516, 537);
        else point = ellipsePoint(276, 91);
        const {x, y} = point;
        const rx = between(4, 7.7), ry = rx * between(.4, .66);
        const g = make('g', {transform:`translate(${round(x)} ${round(y)}) rotate(${between(-50, 50)})`, filter:'url(#small-shadow)'}, group('garnish'));
        make('ellipse', {cx:0, cy:1, rx, ry, fill:'#2c662a'}, g);
        make('ellipse', {cx:0, cy:0, rx, ry, fill:'#82ac47'}, g);
        make('ellipse', {cx:0, cy:-.4, rx:rx*.57, ry:ry*.57, fill:'#c8d992'}, g);
        make('ellipse', {cx:.4, cy:.3, rx:rx*.34, ry:ry*.34, fill:'#536d2e'}, g);
        make('path', {d:`M${-rx*.73} -1 Q${-rx*.45} ${-ry*.9} 0 ${-ry*.8}`, fill:'none', stroke:'#dce5a0', 'stroke-width':.9, opacity:.8}, g);
      }
      for (let i = 0; i < 78; i++) {
        const {x, y} = ellipsePoint(231, 84, 549, 526);
        make('ellipse', {
          cx:round(x), cy:round(y), rx:between(1.4, 2.5), ry:between(.65, .95),
          fill:i%6 ? '#f3d597' : '#734d2c', stroke:'#8b5e31', 'stroke-width':.25,
          transform:`rotate(${between(-70, 70)} ${round(x)} ${round(y)})`, opacity:between(.65, 1)
        }, group('garnish'));
      }
      for (let i = 0; i < 24; i++) {
        const {x, y} = ellipsePoint(189, 69, 558, 550);
        make('path', {d:`M${round(x)} ${round(y)} l${between(1,3)} -1 l1 ${between(1,3)} l-3 1Z`, fill:i%3 ? '#a34021' : '#d6642b', opacity:.8}, group('garnish'));
      }
      const chili = make('g', {transform:'translate(554 591) rotate(-23)', filter:'url(#small-shadow)'}, group('garnish'));
      make('path', {d:'M-17 -2 C-13 -14 6 -15 17 -6 C23 4 7 13 -7 11 C-15 9 -20 5 -17 -2Z M-10 -1 C-10 5 -1 8 8 3 C17 -1 7 -8 -2 -6 C-6 -6 -9 -4 -10 -1Z', fill:'url(#chili)', 'fill-rule':'evenodd', stroke:'#e27338', 'stroke-width':1}, chili);
      make('path', {d:'M-12 -4 Q-3 -13 12 -6', fill:'none', stroke:'#f2ad66', 'stroke-width':1.2, opacity:.8}, chili);
      make('ellipse', {cx:-1, cy:1, rx:2.5, ry:1.1, fill:'#edcf8f'}, chili);

      const scene = document.querySelector('.scene');
      const stage = document.querySelector('.stage');
      const portrait = document.querySelector('.portrait');
      const light = document.querySelector('.light');
      const canvas = document.querySelector('.steam');
      const ctx = canvas.getContext('2d');
      const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      let reduced = motionQuery.matches;
      let frame = 0, lastTime = 0, time = 0, rect, resolution = 1;
      const pointer = {x:0, y:0, targetX:0, targetY:0, active:false};
      const disturbances = [];
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

      // Several continuous, unevenly timed ribbons mingle as real vapor does.
      const ribbons = Array.from({length:14}, (_, i) => ({
        x:between(381, 717), y:between(470, 533),
        height:between(222, 340), width:between(9, 22),
        amplitude:between(9, 26), phase:between(0, Math.PI*2),
        speed:between(.3, .58), alpha:between(.029, .063),
        drift:between(-32, 22), index:i
      }));

      function drawSteam(t) {
        if (!ctx) return;
        ctx.setTransform(resolution, 0, 0, resolution, 0, 0);
        ctx.clearRect(0, 0, 1100, 900);
        ctx.globalCompositeOperation = 'screen';
        const draft = pointer.x * 33;
        for (const ribbon of ribbons) {
          const life = (Math.sin(t * ribbon.speed + ribbon.phase) + 1) * .5;
          const strength = ribbon.alpha * (.45 + life * .65);
          const points = [];
          const count = 39;
          for (let j = 0; j <= count; j++) {
            const p = j / count;
            const wave = Math.sin(p * 7.5 - t * .58 + ribbon.phase);
            const detail = Math.sin(p * 17 - t * .83 + ribbon.phase * 2) * .3;
            let x = ribbon.x + (wave + detail) * ribbon.amplitude * Math.sin(p * Math.PI * .8)
              + (ribbon.drift + draft) * p * p;
            let y = ribbon.y - p * ribbon.height;
            for (const disturbance of disturbances) {
              const age = t - disturbance.start;
              if (age < 0 || age > 3.8) continue;
              const dy = Math.abs(y - (disturbance.y - age * 47));
              const dx = x - disturbance.x;
              const influence = Math.exp(-dy * dy / 6800 - dx * dx / 40000) * Math.exp(-age * .8);
              x += Math.sin(p * 8 + age * 2) * influence * disturbance.force;
            }
            points.push({x, y, p});
          }
          // Nested translucent contours feather the vapor without live blur.
          const gradient = ctx.createLinearGradient(0, ribbon.y, 0, ribbon.y-ribbon.height);
          gradient.addColorStop(0, 'rgba(205, 209, 185, 0)');
          gradient.addColorStop(.12, 'rgba(205, 209, 185, .5)');
          gradient.addColorStop(.32, 'rgba(205, 209, 185, 1)');
          gradient.addColorStop(.58, 'rgba(205, 209, 185, .7)');
          gradient.addColorStop(.82, 'rgba(205, 209, 185, .25)');
          gradient.addColorStop(1, 'rgba(205, 209, 185, 0)');
          ctx.fillStyle = gradient;
          const widths = [.8, .65, .5, .38, .27, .16];
          const opacities = [.10, .13, .18, .21, .27, .35];
          for (let pass = 0; pass < widths.length; pass++) {
            ctx.globalAlpha = strength * opacities[pass];
            ctx.beginPath();
            for (let side = 0; side < 2; side++) {
              for (let j = 0; j < points.length; j++) {
                const point = points[side ? points.length-1-j : j];
                const p = point.p;
                const width = ribbon.width * (.25+p*1.65) * Math.pow(Math.sin(Math.PI*p), .5) * widths[pass];
                const x = point.x + width * (side ? 1 : -1);
                if (!side && !j) ctx.moveTo(x, point.y);
                else ctx.lineTo(x, point.y);
              }
            }
            ctx.closePath();
            ctx.fill();
          }
        }
        // A little warm haze just above the surface joins the individual wisps.
        ctx.globalAlpha = 1;
        const haze = ctx.createRadialGradient(538, 482, 10, 538, 482, 168);
        haze.addColorStop(0, 'rgba(224, 194, 132, .033)');
        haze.addColorStop(1, 'rgba(224, 194, 132, 0)');
        ctx.fillStyle = haze;
        ctx.save();
        ctx.translate(0, 300);
        ctx.scale(1, .38);
        ctx.fillRect(322, 278, 448, 380);
        ctx.restore();
        ctx.globalCompositeOperation = 'source-over';
      }

      function resize() {
        rect = stage.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
        resolution = Math.min(1.7, rect.width / 1100 * dpr);
        canvas.width = Math.round(1100 * resolution);
        canvas.height = Math.round(900 * resolution);
        drawSteam(time || 11);
      }

      function animate(now) {
        frame = 0;
        if (reduced || document.hidden) return;
        const dt = lastTime ? Math.min((now-lastTime)/1000, .15) : 0;
        lastTime = now;
        time += dt;
        const ease = 1 - Math.exp(-dt * 3.2);
        pointer.x += (pointer.targetX-pointer.x) * ease;
        pointer.y += (pointer.targetY-pointer.y) * ease;
        portrait.style.transform = `translate3d(${pointer.x*7}px, ${pointer.y*3}px, 0) rotate(${pointer.x*.55}deg)`;
        light.style.transform = `translate3d(${pointer.x*24}px, ${pointer.y*13}px, 0)`;
        for (let i = disturbances.length-1; i >= 0; i--) {
          if (time - disturbances[i].start > 4) disturbances.splice(i, 1);
        }
        drawSteam(time);
        frame = requestAnimationFrame(animate);
      }

      function start() {
        if (!reduced && !document.hidden && !frame) {
          lastTime = 0;
          frame = requestAnimationFrame(animate);
        }
      }

      scene.addEventListener('pointermove', event => {
        if (reduced || event.pointerType === 'touch') return;
        pointer.active = true;
        pointer.targetX = clamp((event.clientX / window.innerWidth - .5) * 2, -1, 1);
        pointer.targetY = clamp((event.clientY / window.innerHeight - .5) * 2, -1, 1);
      }, {passive:true});
      scene.addEventListener('pointerleave', () => {
        pointer.active = false;
        pointer.targetX = pointer.targetY = 0;
      }, {passive:true});
      scene.addEventListener('pointerdown', event => {
        if (reduced || !rect) return;
        const x = (event.clientX-rect.left) / rect.width * 1100;
        const y = (event.clientY-rect.top) / rect.height * 900;
        if (x > 225 && x < 880 && y > 250 && y < 650) {
          disturbances.push({x, y, start:time, force:between(24, 43)});
          if (disturbances.length > 4) disturbances.shift();
        }
      }, {passive:true});

      motionQuery.addEventListener('change', event => {
        reduced = event.matches;
        if (reduced) {
          cancelAnimationFrame(frame);
          frame = 0;
          pointer.x = pointer.y = pointer.targetX = pointer.targetY = 0;
          portrait.removeAttribute('style');
          light.removeAttribute('style');
          drawSteam(11);
        } else start();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          cancelAnimationFrame(frame);
          frame = 0;
        } else start();
      });
      window.addEventListener('resize', resize, {passive:true});
      resize();
      time = 11;
      start();
    })();
  </script>
</body>
