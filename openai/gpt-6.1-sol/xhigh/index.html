<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0d0c">
  <title>Warmth</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #0b0c0b; }
    .atmosphere {
      position: fixed; inset: 0; overflow: hidden; isolation: isolate;
      background:
        radial-gradient(ellipse at 48% 57%, #28231a 0%, #181711 25%, transparent 59%),
        radial-gradient(ellipse at 30% 23%, #252019 0%, transparent 52%),
        linear-gradient(120deg, #11120f, #090b0a 72%);
    }
    .atmosphere::before {
      content: ""; position: absolute; inset: -20%; pointer-events: none;
      background: radial-gradient(ellipse at 44% 46%, #b36d2420, transparent 45%);
      animation: warmth 12s ease-in-out infinite alternate; will-change: opacity, transform;
    }
    .atmosphere::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 36%, #03060580 100%);
    }
    .grain { position: absolute; width: 100%; height: 100%; opacity: .025; pointer-events: none; transform: translateZ(0); }
    .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; perspective: 1600px; }
    .scene {
      position: relative; width: min(1080px, 99vw, 129vh); aspect-ratio: 1000 / 820;
      will-change: transform; flex: none;
      margin-top: -1.5vh;
    }
    .dish, .steam { position: absolute; inset: 0; width: 100%; height: 100%; }
    .dish { overflow: visible; transform: translateZ(0); }
    .steam { pointer-events: none; transform: translateZ(0); }
    .broth-gleam { opacity: .45; }
    .oil-shimmer { opacity: .36; }
    @keyframes warmth { from { opacity: .5; transform: translateX(-1%); } to { opacity: .95; transform: translateX(1%); } }
    @media (max-width: 600px) {
      .scene { width: min(139vw, 111vh); flex-shrink: 0; margin-top: -3vh; }
      .atmosphere { background: radial-gradient(ellipse at 45% 47%, #262017, #10120f 52%, #090b0a 90%); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .scene { will-change: auto; transform: none !important; }
    }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const NS = 'http://www.w3.org/2000/svg';
      const scene = document.querySelector('.scene');
      const dish = document.querySelector('.dish');
      const motion = matchMedia('(prefers-reduced-motion: reduce)');
      let seed = 12487;
      const random = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
      const range = (a, b) => a + random() * (b - a);
      const el = (tag, attrs, parent) => {
        const node = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        if (parent) parent.appendChild(node);
        return node;
      };
      const at = id => document.getElementById(id);
      const soupPoint = () => {
        const angle = range(0, Math.PI * 2), radius = Math.sqrt(random());
        return [500 + Math.cos(angle) * radius * 288, 379 + Math.sin(angle) * radius * 124];
      };

      // Procedural marks are vector geometry, including every glaze fleck and oil bead.
      const pottery = at('potteryTexture');
      for (let i = 0; i < 2100; i++) {
        const x = range(180, 820), y = range(389, 692), r = range(.25, 1.15);
        el('ellipse', { cx: x, cy: y, rx: r, ry: r * range(.35, .85), fill: random() > .47 ? '#c1ba8e' : '#071610', opacity: range(.025, .11) }, pottery);
      }
      const broth = at('brothTexture');
      for (let i = 0; i < 470; i++) {
        const [x, y] = soupPoint(), r = range(.6, 5.5);
        el('ellipse', { cx: x, cy: y, rx: r, ry: r * .52, fill: i % 3 ? '#e5a049' : '#653b18', opacity: range(.06, .23), stroke: '#f1b861', 'stroke-width': .5, 'stroke-opacity': .17 }, broth);
        if (i % 13 === 0) el('path', { d: `M${x-r*.5} ${y-r*.24} q${r*.45} ${-r*.28} ${r*.8} ${-r*.13}`, stroke: '#f9d58d', 'stroke-width': .7, opacity: .28, fill: 'none', class: 'oil-shimmer' }, broth);
      }
      for (let i = 0; i < 70; i++) {
        const [x,y] = soupPoint();
        el('ellipse', { cx:x, cy:y, rx:range(.4,1.1), ry:range(.25,.5), fill:'#362810', opacity:range(.2,.5) }, broth);
      }

      const strokeNoodle = (d, width, parent, highlight = true) => {
        el('path', {d, fill:'none', stroke:'#65401c', 'stroke-width':width+2.7, 'stroke-linecap':'round', 'stroke-linejoin':'round', opacity:.72, transform:'translate(1 2)'}, parent);
        el('path', {d, fill:'none', stroke:'url(#noodle)', 'stroke-width':width, 'stroke-linecap':'round', 'stroke-linejoin':'round'}, parent);
        if (highlight) el('path', {d, fill:'none', stroke:'#ffe0a0', 'stroke-width':width*.2, 'stroke-linecap':'round', 'stroke-linejoin':'round', opacity:range(.35,.62), transform:'translate(-.5 -.9)'}, parent);
      };
      const loose = at('looseNoodles');
      [
        'M361 392 C331 361 370 309 404 325 S429 364 465 337 S529 298 551 326',
        'M369 417 C311 444 332 477 374 468 S410 426 434 434',
        'M516 319 C566 286 605 310 581 340 S600 372 626 353',
        'M516 469 C490 503 442 497 420 479 S395 473 380 480',
        'M600 369 C640 348 648 384 622 396',
        'M354 391 C313 410 294 389 303 373'
      ].forEach(d => strokeNoodle(d, 5.3, loose));

      // Curving strands follow a loose, folded mound instead of a flat spiral.
      const noodles = at('noodles');
      for (let i = 0; i < 38; i++) {
        const row = i / 37, left = 375 + Math.sin(row * 5) * 15;
        const y = 327 + row * 139, right = 552 + Math.sin(row * 4 + .5) * 39;
        const dip = range(12, 26), bend = range(-13, 13);
        const d = `M${left+range(-10,10)} ${y+range(-4,4)} C${left-30} ${y-dip} ${left+13} ${y-dip-13} ${left+45} ${y-8} S${left+84} ${y+dip} ${left+110} ${y+bend} S${right+34} ${y-19} ${right} ${y+7} Q${right-25} ${y+27} ${right-42} ${y+15}`;
        strokeNoodle(d, range(4.3, 6.1), noodles);
      }
      [
        'M421 340 C404 372 435 389 415 412 S397 446 430 467',
        'M494 342 C456 364 502 384 477 406 S478 437 507 454',
        'M551 367 C579 387 536 405 551 424 S553 460 535 474',
        'M388 382 C409 362 438 390 458 378 S492 350 504 370',
        'M393 443 C425 427 442 460 467 451 S501 432 523 456'
      ].forEach(d => strokeNoodle(d, 5.2, noodles));

      // Crisp tofu: separate top and side faces, with toasted, porous edges.
      const tofu = at('tofu');
      const cubes = [[621,296,-12,.83],[687,309,17,.91],[744,351,30,.8],[651,357,-18,1],[709,382,12,.91]];
      cubes.forEach(([x,y,angle,size], n) => {
        const g = el('g', {transform:`translate(${x} ${y}) rotate(${angle}) scale(${size})`}, tofu);
        el('path', {d:'M-33-17 L21-26 L37 9 L29 30 L-22 39 L-34 17Z', fill:'#62421c', opacity:.6}, g);
        el('path', {d:'M-33-17 L-23 18 L-22 37 L-34 16Z', fill:'#d1a362'}, g);
        el('path', {d:'M-23 18 L36 8 L29 30 L-22 37Z', fill:'url(#tofuSide)'}, g);
        el('path', {d:'M-33-17 Q-34-21-29-21 L18-28 Q22-29 24-25 L37 4 Q39 9 34 11 L-20 21 Q-24 22-26 17Z', fill:'url(#tofuTop)', stroke:'#dcb071', 'stroke-width':1.5}, g);
        const clipId = `tofuClip${n}`;
        const clip = el('clipPath', {id:clipId}, dish.querySelector('defs'));
        el('path', {d:'M-33-17 L21-28 L38 9 L-23 21Z'}, clip);
        const pores = el('g', {'clip-path':`url(#${clipId})`}, g);
        for (let j = 0; j < 95; j++) {
          const px=range(-33,38), py=range(-28,22), r=range(.35,2.6);
          el('ellipse', {cx:px, cy:py, rx:r, ry:r*range(.4,.9), fill:random()>.3?'#8b5627':'#ffedb7', opacity:range(.12,.43)}, pores);
        }
        el('path', {d:'M-31-18 L18-27 M-23 20 L33 10', stroke:'#fff0bb', 'stroke-width':1.5, 'stroke-opacity':.55, fill:'none'}, g);
        el('path', {d:'M-19 24 L29 15 M-19 32 L25 24', stroke:'#ead69a', 'stroke-width':1, 'stroke-opacity':.22, fill:'none'}, g);
      });

      const garnish = at('garnish');
      const scallions = [[397,302],[425,329],[544,323],[595,378],[737,370],[734,452],[279,410],[336,465],[476,484],[565,493],[528,396],[571,362],[668,287],[391,448],[471,430]];
      scallions.forEach(([x,y]) => el('use', {href:'#scallion', transform:`translate(${x} ${y}) rotate(${range(-70,70)}) scale(${range(.5,.9)})`, filter:'url(#smallShadow)'}, garnish));
      for (let i = 0; i < 70; i++) {
        let x = range(366,574), y = range(323,478);
        if (i>50) [x,y]=soupPoint();
        const light = random()>.24;
        el('ellipse', {cx:x, cy:y, rx:range(1.1,2.1), ry:range(.5,.85), fill:light?'#e7d09b':'#302e19', opacity:range(.58,.9), transform:`rotate(${range(-80,80)} ${x} ${y})`}, garnish);
      }
      // Fine chili threads and tiny herb fragments add color without clutter.
      for (let i=0;i<12;i++) {
        const x=range(423,550), y=range(334,366);
        el('path', {d:`M${x} ${y} q${range(-15,10)} ${range(-17,-5)} ${range(-24,23)} ${range(-33,-12)}`, fill:'none', stroke:i%3?'#a84625':'#d07838', 'stroke-width':range(.7,1.1), 'stroke-linecap':'round', opacity:.85}, garnish);
      }

      const canvas = document.querySelector('.steam');
      const ctx = canvas.getContext('2d');
      let canvasScale = 1;
      let frame = 0, last = 0, clock = 0;
      let active = !document.hidden;
      const pointer = {x:0, y:0, tx:0, ty:0, soupX:500, soupY:379, heat:0, light:0};
      const rings = [];
      const plumes = Array.from({length:9}, (_, i) => ({
        x:350+i*34+range(-13,13), y:range(338,383), height:range(200,320),
        phase:range(0,Math.PI*2), speed:range(.3,.55), width:range(7,15), drift:range(-23,23)
      }));

      function resize() {
        const bounds = canvas.getBoundingClientRect();
        const ratio = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(bounds.width * ratio);
        canvas.height = Math.round(bounds.height * ratio);
        canvasScale = canvas.width / 1000;
        plumes.forEach(cachePlume);
        if (motion.matches) drawSteam(18);
      }
      // Paint these original, code-drawn wisps once. Cached canvas strokes keep
      // softness out of the animation loop; no bitmap files or artwork are loaded.
      function cachePlume(p) {
          const buffer = document.createElement('canvas');
          const density = Math.max(.7, canvasScale);
          buffer.width = Math.ceil(190*density);
          buffer.height = Math.ceil((p.height+60)*density);
          const ink = buffer.getContext('2d');
          ink.setTransform(density,0,0,density,0,0);
          const bottom = p.height+30;
          const gradient = ink.createLinearGradient(0,bottom,0,30);
          gradient.addColorStop(0,'rgba(223,216,189,0)');
          gradient.addColorStop(.14,'rgba(223,218,201,.06)');
          gradient.addColorStop(.48,'rgba(209,215,206,.11)');
          gradient.addColorStop(.8,'rgba(196,203,197,.045)');
          gradient.addColorStop(1,'rgba(200,209,200,0)');
          for (let pass=0;pass<2;pass++) {
            ink.beginPath();
            for (let step=0;step<=55;step++) {
              const u=step/55;
              const wave=Math.sin(u*8+p.phase)*(8+u*21)+Math.sin(u*15+p.phase)*u*8;
              const x=95+wave+p.drift*u;
              const y=bottom-u*p.height;
              if(step===0) ink.moveTo(x,y); else ink.lineTo(x,y);
            }
            ink.strokeStyle=gradient;
            ink.lineWidth=pass===0?p.width*2.2:p.width*.48;
            ink.lineCap='round'; ink.lineJoin='round';
            ink.filter=`blur(${(pass===0?10:3)*density}px)`;
            ink.stroke();
          }
          p.buffer=buffer;
      }
      function drawSteam(time) {
        ctx.setTransform(1,0,0,1,0,0);
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.setTransform(canvasScale,0,0,canvas.height/820,0,0);
        ctx.save();
        ctx.beginPath();ctx.ellipse(500,379,297,131,0,0,Math.PI*2);ctx.clip();
        if(pointer.light>.001) {
          const light=ctx.createRadialGradient(pointer.soupX,pointer.soupY,0,pointer.soupX,pointer.soupY,150);
          light.addColorStop(0,`rgba(255,215,144,${pointer.light*.065})`);light.addColorStop(1,'rgba(255,215,144,0)');
          ctx.fillStyle=light;ctx.fillRect(200,248,600,262);
        }
        const sheen=.23+.12*Math.sin(time*.65);
        ctx.strokeStyle=`rgba(255,220,155,${sheen})`;ctx.lineWidth=1.5;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(237,372);ctx.quadraticCurveTo(240,359,246,351);
        ctx.moveTo(730,416);ctx.quadraticCurveTo(743,409,750,400);ctx.stroke();
        ctx.restore();
        // Tiny rings spread through the broth in response to the pointer.
        if(rings.length) {
          ctx.save();
          ctx.beginPath(); ctx.ellipse(500,379,297,131,0,0,Math.PI*2); ctx.clip();
          for(let i=rings.length-1;i>=0;i--) {
            const ring=rings[i], age=time-ring.time;
            if(age>1.9) {rings.splice(i,1);continue;}
            const progress=age/1.9;
            const radius=ring.radius+25*(1-(1-progress)**2);
            ctx.beginPath();ctx.ellipse(ring.x,ring.y,radius,radius*.45,0,0,Math.PI*2);
            ctx.strokeStyle=`rgba(248,210,144,${.24*(1-progress)**2})`;ctx.lineWidth=.7;ctx.stroke();
          }
          ctx.restore();
        }
        for (const p of plumes) {
          const phase=time*p.speed+p.phase;
          const breath=.56+.4*Math.sin(phase*.8);
          const stretch=1+.065*Math.sin(phase*.6);
          ctx.save();
          ctx.globalAlpha=breath;
          ctx.translate(p.x+Math.sin(phase)*9+pointer.x*9, p.y-(1+Math.sin(phase*.5))*9);
          ctx.transform(1+.12*Math.sin(phase*.7),0,Math.sin(phase*.45)*.045+pointer.x*.025,stretch,0,0);
          ctx.drawImage(p.buffer,-95,-p.height-30,190,p.height+60);
          ctx.restore();
        }
      }
      function animate(now) {
        frame=0;
        if (motion.matches || !active) return;
        const dt=last?Math.min((now-last)/1000,.1):.016;
        last=now; clock+=dt;
        const ease=1-Math.exp(-dt*4);
        pointer.x+=(pointer.tx-pointer.x)*ease;
        pointer.y+=(pointer.ty-pointer.y)*ease;
        pointer.light+=(pointer.heat-pointer.light)*ease;
        scene.style.transform=`translate3d(${pointer.x*7}px,${pointer.y*4}px,0) rotateX(${-pointer.y*2}deg) rotateY(${pointer.x*2.6}deg)`;
        drawSteam(clock);
        frame=requestAnimationFrame(animate);
      }
      function start() {
        if(frame) cancelAnimationFrame(frame);
        frame=0; last=0;
        if(motion.matches) { scene.style.transform=''; drawSteam(18); }
        else if(active) frame=requestAnimationFrame(animate);
      }

      let lastRipple=0, previousPoint=null;
      function ripple(x,y,bigger=false) {
        if(motion.matches) return;
        rings.push({x,y,radius:bigger?8:4,time:clock});
        if(rings.length>12) rings.shift();
      }
      function soupCoordinates(event) {
        const matrix = dish.getScreenCTM();
        if(!matrix) return null;
        const point = new DOMPoint(event.clientX,event.clientY).matrixTransform(matrix.inverse());
        return ((point.x-500)/291)**2+((point.y-379)/126)**2<1 ? point : null;
      }
      window.addEventListener('pointermove',event=>{
        if(motion.matches || event.pointerType==='touch') return;
        pointer.tx=Math.max(-1,Math.min(1,(event.clientX/innerWidth-.5)*2));
        pointer.ty=Math.max(-1,Math.min(1,(event.clientY/innerHeight-.5)*2));
        const point=soupCoordinates(event);
        if(point) {
          pointer.soupX=point.x;pointer.soupY=point.y;pointer.heat=1;
          const now=performance.now();
          if(previousPoint && now-lastRipple>260 && Math.hypot(point.x-previousPoint.x,point.y-previousPoint.y)>12) {
            ripple(point.x,point.y); lastRipple=now; previousPoint=point;
          } else if(!previousPoint) previousPoint=point;
        } else {previousPoint=null;pointer.heat=0;}
      },{passive:true});
      document.documentElement.addEventListener('pointerleave',()=>{pointer.tx=0;pointer.ty=0;pointer.heat=0;previousPoint=null;});
      window.addEventListener('blur',()=>{pointer.tx=0;pointer.ty=0;pointer.heat=0;});
      window.addEventListener('pointerdown',event=>{
        const point=soupCoordinates(event);
        if(point) ripple(point.x,point.y,true);
      },{passive:true});
      document.addEventListener('visibilitychange',()=>{active=!document.hidden;start();});
      motion.addEventListener('change',()=>{rings.length=0;pointer.x=pointer.y=pointer.tx=pointer.ty=pointer.heat=pointer.light=0;start();});
      new ResizeObserver(resize).observe(scene);
      resize(); start();
    })();
  </script>
</body>
</html>
