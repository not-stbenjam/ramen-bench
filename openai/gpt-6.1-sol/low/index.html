<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111411"><title>Warmth</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101310}body{display:grid;place-items:center}main{width:100%;height:100%;position:relative;isolation:isolate;background:radial-gradient(ellipse at 50% 48%,#282b20 0%,#191d17 33%,#101410 66%,#0b0e0c 100%)}main:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,#05080680 100%)}svg.scene{position:absolute;width: min(110vw,1250px);height:min(100vh,1000px);left:50%;top:50%;transform:translate(-50%,-50%);overflow:visible}#dish{transform-origin:600px 640px;transition:transform .65s ease-out}.steam{fill:none;stroke:#e1e2c5;stroke-linecap:round;filter:url(#steamBlur);mix-blend-mode:screen;animation:breathe 7s ease-in-out infinite;transform-origin:600px 520px}.steam:nth-child(2){animation-delay:-2.7s}.steam:nth-child(3){animation-delay:-4.2s}.steam:nth-child(4){animation-delay:-1.3s}@keyframes breathe{0%,100%{opacity:.06;transform:translate(0,12px) scaleX(.94)}50%{opacity:.21;transform:translate(8px,-23px) scaleX(1.06)}}.glint{animation:shimmer 6s ease-in-out infinite}@keyframes shimmer{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.steam{opacity:.12}}
</style>
</head>
<body>
<main aria-label="A warm ceramic bowl of vegan ramen, with noodles, mushrooms, tofu and fresh greens, gently steaming in the dark.">

<linearGradient id="rim"><stop stop-color="#9b9a7f"/><stop offset=".28" stop-color="#777e68"/><stop offset=".65" stop-color="#444f3e"/><stop offset="1" stop-color="#70725a"/></linearGradient>
<radialGradient id="broth" cx="43%" cy="35%" r="70%"><stop stop-color="#be782f"/><stop offset=".42" stop-color="#965620"/><stop offset=".8" stop-color="#643616"/><stop offset="1" stop-color="#38250f"/></radialGradient>
<linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#8a9b43"/><stop offset=".35" stop-color="#547a34"/><stop offset="1" stop-color="#173e25"/></linearGradient>
<linearGradient id="tofu" x2=".3" y2="1"><stop stop-color="#f1d69c"/><stop offset=".7" stop-color="#d2a964"/><stop offset="1" stop-color="#a77436"/></linearGradient>
<linearGradient id="mushroom" x2=".2" y2="1"><stop stop-color="#b68655"/><stop offset=".35" stop-color="#78512e"/><stop offset="1" stop-color="#372518"/></linearGradient>
<filter id="shadow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="steamBlur" x="-100%" y="-50%" width="300%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="foodShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="1" dy="6" stdDeviation="4" flood-color="#261609" flood-opacity=".6"/></filter>
<filter id="texture"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="8"/><feColorMatrix type="saturate" values="0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="soft-light"/></filter>
<clipPath id="soupClip"><ellipse cx="600" cy="547" rx="263" ry="117"/></clipPath>

<path d="M736 539 Q747 496 789 460 M752 500 L735 459 M750 506 L799 480" fill="none" stroke="#abc166" opacity=".4" stroke-width="2"/>
<path d="M705 562 Q733 528 769 491 Q748 527 735 572Z" fill="#bac97b"/>

<!-- Shiitake caps -->

</svg>
</main>
<script>
(()=>{
const NS='http://www.w3.org/2000/svg';let seed=27;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const add=(parent,tag,attrs)=>{const el=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));parent.appendChild(el);return el};
const oil=document.getElementById('oil');for(let i=0;i<110;i++){const x=340+rand()*520,y=435+rand()*220,r=1+rand()*6;add(oil,'ellipse',{cx:x,cy:y,rx:r,ry:r*.45,fill:'none',stroke:rand()>.5?'#ebae50':'#d69232','stroke-width':.7,opacity:.12+rand()*.23})}
const noodles=document.getElementById('noodles');for(let i=0;i<44;i++){const x=465+rand()*200,y=506+rand()*97;let d=`M ${x} ${y}`;for(let j=0;j<4;j++){const nx=x-55+rand()*135,ny=y-28+rand()*52;d+=` Q ${x-65+rand()*130} ${y-45+rand()*90} ${nx} ${ny}`}add(noodles,'path',{d,stroke:'#502c11','stroke-width':7,opacity:.5,transform:'translate(1 3)'});add(noodles,'path',{d,stroke:['#d9b469','#e4c27d','#c69a51'][i%3],'stroke-width':3.4+rand()*1.3});add(noodles,'path',{d,stroke:'#f4d799','stroke-width':.8,opacity:.35,transform:'translate(0 -1)'})}
const garnish=document.getElementById('garnish');for(let i=0;i<45;i++){let x=510+rand()*185,y=491+rand()*105;add(garnish,'ellipse',{cx:x,cy:y,rx:4+rand()*4,ry:2+rand()*2,fill:'none',stroke:['#90aa57','#b3bd70','#527f39'][i%3],'stroke-width':2.3,transform:`rotate(${rand()*150} ${x} ${y})`})}for(let i=0;i<65;i++){const x=398+rand()*403,y=474+rand()*146;add(garnish,'ellipse',{cx:x,cy:y,rx:1.5,ry:.75,fill:i%4===0?'#392818':'#e2c599',opacity:.8,transform:`rotate(${rand()*180} ${x} ${y})`})}for(let i=0;i<13;i++){const x=548+rand()*100,y=530+rand()*42;add(garnish,'path',{d:`M${x} ${y}q${rand()*17-8} -20 ${rand()*25-12} -30`,fill:'none',stroke:'#ac4926','stroke-width':1.7,'stroke-linecap':'round'})}
const motion=matchMedia('(prefers-reduced-motion: reduce)'),dish=document.getElementById('dish');window.addEventListener('pointermove',e=>{if(motion.matches)return;const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;dish.style.transform=`translate(${x*9}px,${y*5}px) rotate(${x*.8}deg)`},{passive:true});document.addEventListener('pointerleave',()=>dish.style.transform='');motion.addEventListener('change',()=>dish.style.transform='');
})();
</script>
</body>
</html>
