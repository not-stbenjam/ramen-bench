<title>A bowl of warmth</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #100f0c; }

  .world { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); place-items: center; width: 100%; height: 100%; min-height: 100svh; overflow: hidden; isolation: isolate; background: radial-gradient(ellipse at 51% 43%, #29271e 0%, #1a1a15 26%, #11120f 52%, #090b0a 100%); }

  .atmosphere { position: absolute; inset: 0; opacity: .12; pointer-events: none; }
  .scene { position: relative; width: min(1200px, 125vw, 160svh); aspect-ratio: 1000 / 850; flex: none; transform: translate3d(0, -1.5%, 0); }
  .art { width: 100%; height: 100%; display: block; overflow: visible; }
  #bowl { transform-origin: 500px 550px; }
  #glow { mix-blend-mode: screen; }
  .steam { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; filter: blur(5px); }
  .still-steam { opacity: .42; }
  @media (max-width: 600px) { .scene { width: min(143vw, 150svh); transform: translate3d(0, -2%, 0); } }

<script>
(() => {
  'use strict';
  const scene = document.querySelector('.scene');
  const bowl = document.getElementById('bowl');
  const glow = document.getElementById('glow');
  const canvas = document.querySelector('.steam');
  const ctx = canvas.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const pointer = { x: 0, y: 0, targetX: 0, targetY: 0 };
  let frame = 0, last = 0, elapsed = 0, bounds;

  function resize() {
    bounds = scene.getBoundingClientRect();
    const ratio = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(bounds.width * ratio);
    canvas.height = Math.round(bounds.height * ratio);
    if (ctx) ctx.setTransform(canvas.width / 1000, 0, 0, canvas.height / 850, 0, 0);
  }
  function resetPointer() { pointer.targetX = pointer.targetY = 0; }
  window.addEventListener('pointermove', event => {
    if (reduced.matches || event.pointerType === 'touch') return;
    pointer.targetX = Math.max(-1, Math.min(1, (event.clientX / innerWidth - .5) * 2));
    pointer.targetY = Math.max(-1, Math.min(1, (event.clientY / innerHeight - .5) * 2));
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', resetPointer);
  window.addEventListener('blur', resetPointer);
  window.addEventListener('resize', resize, { passive: true });

  // Continuous, overlapping ribbons: the vapor unfolds without resetting or popping.
  function steam(time) {
    if (!ctx) return;
    ctx.clearRect(0, 0, 1000, 850);
    for (let plume = 0; plume < 9; plume++) {
      const seed = plume * 2.399;
      const origin = 361 + plume * 33;
      const height = 235 + Math.sin(seed * 4) * 48;
      const baseY = 413 + Math.sin(seed) * 16;
      const gradient = ctx.createLinearGradient(0, baseY, 0, baseY - height);
      const breath = .74 + Math.sin(time * .48 + seed) * .26;
      gradient.addColorStop(0, 'rgba(235,225,204,0)');
      gradient.addColorStop(.15, `rgba(235,225,204,${.14 * breath})`);
      gradient.addColorStop(.48, `rgba(227,222,209,${.11 * breath})`);
      gradient.addColorStop(.8, `rgba(219,219,209,${.05 * breath})`);
      gradient.addColorStop(1, 'rgba(219,219,209,0)');
      ctx.strokeStyle = gradient;
      ctx.lineWidth = 10 + plume % 3 * 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (let step = 0; step <= 48; step++) {
        const progress = step / 48;
        const y = baseY - progress * height;
        const curl = Math.sin(progress * 8 - time * .64 + seed) * (7 + progress * 17)
                   + Math.sin(progress * 13 - time * .36 + seed * 2) * progress * 9;
        const drift = pointer.x * progress * progress * 43;
        const x = origin + curl + drift + Math.sin(time * .23 + seed) * progress * 12;
        if (step === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  function animate(now) {
    if (reduced.matches || document.hidden) { frame = 0; return; }
    const dt = last ? Math.min((now - last) / 1000, .05) : 0;
    last = now;
    elapsed += dt;
    const ease = 1 - Math.exp(-dt * 3);
    pointer.x += (pointer.targetX - pointer.x) * ease;
    pointer.y += (pointer.targetY - pointer.y) * ease;
    bowl.style.transform = `translate(${pointer.x * 4}px, ${pointer.y * 2}px) rotate(${pointer.x * .28}deg)`;
    glow.setAttribute('cx', 595 + pointer.x * 48);
    glow.setAttribute('cy', 401 + pointer.y * 18);
    steam(elapsed);
    frame = requestAnimationFrame(animate);
  }
  function syncMotion() {
    cancelAnimationFrame(frame);
    frame = 0;
    last = 0;
    if (reduced.matches) {
      resetPointer();
      pointer.x = pointer.y = 0;
      bowl.style.transform = '';
      glow.setAttribute('cx', '595');
      glow.setAttribute('cy', '401');
      if (ctx) ctx.clearRect(0, 0, 1000, 850);
    } else if (!document.hidden) frame = requestAnimationFrame(animate);
  }
  reduced.addEventListener('change', syncMotion);
  document.addEventListener('visibilitychange', syncMotion);
  resize();
  syncMotion();
})();
