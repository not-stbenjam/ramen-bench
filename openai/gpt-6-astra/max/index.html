<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="icon" href="data:,">
  <title>A quiet bowl of ramen</title>
  <style>
    :root { color-scheme: dark; background: #100e0b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body { overflow: hidden; }
    .world {
      position: relative; display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100vh; height: 100svh; overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 71%, #30201470 0%, #20181038 29%, transparent 58%),
        radial-gradient(ellipse at 37% 39%, #33302242 0%, transparent 51%),
        linear-gradient(125deg, #151612, #11110e 43%, #100c09 100%);
    }
    .warmth {
      position: absolute; width: min(1000px, 120vw); aspect-ratio: 1;
      border-radius: 50%; pointer-events: none;
      background: radial-gradient(ellipse, #a06a2520 0%, #97682c0b 35%, transparent 64%);
      transform: translate(-8%, 2%); animation: warmth 12s ease-in-out infinite alternate;
    }
    .world::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3;
      background: radial-gradient(ellipse at 50% 48%, transparent 35%, #05060470 100%);
      box-shadow: inset 0 0 100px #00000020;
    }
    .scene {
      position: relative; width: min(1240px, 148vw, 154vh); width: min(1240px, 148vw, 154svh);
      aspect-ratio: 6 / 5; flex-shrink: 0;
      transform: perspective(1400px) translate3d(var(--pan-x, 0px), var(--pan-y, 0px), 0)
        rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
      transform-origin: 50% 67%; will-change: transform;
    }
    .ramen, .steam { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .ramen { overflow: visible; }
    .steam { pointer-events: none; }
    .broth-light { animation: simmer 7s ease-in-out infinite alternate; }
    .glaze-light { mix-blend-mode: screen; }
    .still-steam { opacity: .72; }
    .has-steam .still-steam { opacity: 0; }
    @keyframes warmth { to { opacity: .6; } }
    @keyframes simmer { from { opacity: .3; } to { opacity: .65; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .scene { transform: none !important; will-change: auto; }
      .broth-light { opacity: .45; }
    }
  </style>
</head>

<script>
(() => {
  'use strict';
  const scene = document.querySelector('.scene');
  const canvas = document.querySelector('.steam');
  const context = canvas.getContext('2d');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const finePointer = matchMedia('(hover: hover) and (pointer: fine)');
  const rippleLayer = document.getElementById('ripples');
  const glaze = document.querySelector('.glaze-light');
  const pointer = { x: 0, y: 0, targetX: 0, targetY: 0, wind: 0, targetWind: 0 };
  const ripples = [];
  const plumes = [
    { x: 477, y: 472, height: 307, width: 21, phase: 0.5, speed: 0.78 },
    { x: 553, y: 464, height: 358, width: 27, phase: 2.7, speed: 0.63 },
    { x: 624, y: 468, height: 327, width: 23, phase: 4.5, speed: 0.71 },
    { x: 720, y: 482, height: 282, width: 18, phase: 1.8, speed: 0.82 },
    { x: 576, y: 501, height: 254, width: 15, phase: 5.6, speed: 0.67 }
  ];
  let frame = 0;
  let previousTime = 0;
  let steamTime = 9;
  let lastPaint = -Infinity;
  let lastRipple = 0;
  let lastPointerX = null;
  let lastPointerTime = 0;
  let lastPose = '';
  let canvasScale = 1;
  let bounds = scene.getBoundingClientRect();

  // A continuous ribbon grows, curls and disperses as it rises. Its edges
  // are feathered instead of using opaque circles or looping smoke images.
  function drawSteam(time) {
    if (!context) return;
    context.setTransform(canvasScale, 0, 0, canvasScale, 0, 0);
    context.clearRect(0, 0, 1200, 1000);
    context.globalCompositeOperation = 'screen';
    for (const plume of plumes) {
      const left = [], right = [], middle = [];
      const phase = time * plume.speed + plume.phase;
      for (let step = 0; step <= 48; step++) {
        const rise = step / 48;
        const wave = Math.sin(rise * 9.6 - phase);
        const curl = Math.sin(rise * 18.5 - phase * 1.3 + plume.phase);
        const spread = Math.sin(Math.PI * rise) ** 0.65;
        const x = plume.x + wave * (11 + rise * 30) + curl * rise * 13
          + pointer.wind * rise * rise * 58 + pointer.x * rise * 12;
        const y = plume.y - rise * plume.height;
        const width = (2 + plume.width * spread) * (0.76 + Math.sin(rise * 13 - phase) * 0.24);
        middle.push([x, y]);
        left.push([x - width, y]);
        right.push([x + width, y]);
      }
      const ink = context.createLinearGradient(0, plume.y, 0, plume.y - plume.height);
      ink.addColorStop(0, 'rgba(223, 222, 195, 0)');
      ink.addColorStop(0.13, 'rgba(217, 216, 191, 0.038)');
      ink.addColorStop(0.34, 'rgba(210, 215, 196, 0.064)');
      ink.addColorStop(0.62, 'rgba(204, 212, 198, 0.039)');
      ink.addColorStop(0.85, 'rgba(195, 207, 191, 0.015)');
      ink.addColorStop(1, 'rgba(195, 207, 191, 0)');
      context.fillStyle = ink;
      context.filter = 'blur(8px)';
      context.beginPath();
      left.forEach(([x, y], i) => i ? context.lineTo(x, y) : context.moveTo(x, y));
      right.reverse().forEach(([x, y]) => context.lineTo(x, y));
      context.closePath();
      context.fill();
      context.strokeStyle = ink;
      context.lineWidth = 7;
      context.filter = 'blur(3px)';
      context.beginPath();
      middle.forEach(([x, y], i) => i ? context.lineTo(x, y) : context.moveTo(x, y));
      context.stroke();
    }
    context.filter = 'none';
    context.globalCompositeOperation = 'source-over';
  }

  function resize() {
    bounds = scene.getBoundingClientRect();
    if (context) {
      // Cap raster resolution: the softly focused steam needs no 4K buffer.
      const width = Math.min(1800, Math.round(scene.clientWidth * Math.min(devicePixelRatio || 1, 1.75)));
      canvas.width = width;
      canvas.height = Math.round(width * 5 / 6);
      canvasScale = width / 1200;
      drawSteam(reducedMotion.matches ? 9 : steamTime);
      scene.classList.add('has-steam');
    }
  }

  function addRipple(x, y, now) {
    if (now - lastRipple < 420 || ripples.length >= 4) return;
    lastRipple = now;
    const ellipse = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
    ellipse.setAttribute('cx', x.toFixed(1));
    ellipse.setAttribute('cy', y.toFixed(1));
    ellipse.setAttribute('opacity', '0');
    rippleLayer.append(ellipse);
    ripples.push({ element: ellipse, age: 0 });
  }

  function onPointerMove(event) {
    if (reducedMotion.matches || !finePointer.matches || event.pointerType === 'touch') return;
    const now = performance.now();
    pointer.targetX = Math.max(-1, Math.min(1, event.clientX / innerWidth * 2 - 1));
    pointer.targetY = Math.max(-1, Math.min(1, event.clientY / innerHeight * 2 - 1));
    if (lastPointerX !== null && now - lastPointerTime < 160) {
      const velocity = (event.clientX - lastPointerX) / Math.max(now - lastPointerTime, 8);
      pointer.targetWind = Math.max(-1.1, Math.min(1.1, velocity * 0.65));
    }
    lastPointerX = event.clientX;
    lastPointerTime = now;
    const x = (event.clientX - bounds.left) / bounds.width * 1200;
    const y = (event.clientY - bounds.top) / bounds.height * 1000;
    if (((x - 600) / 310) ** 2 + ((y - 507) / 130) ** 2 < 1) addRipple(x, y, now);
  }

  function resetPointer() {
    pointer.targetX = pointer.targetY = pointer.targetWind = 0;
    lastPointerX = null;
  }

  function animate(now) {
    const dt = previousTime ? Math.min((now - previousTime) / 1000, 0.05) : 0;
    previousTime = now;
    steamTime += dt;
    const ease = 1 - Math.exp(-dt * 3.5);
    pointer.x += (pointer.targetX - pointer.x) * ease;
    pointer.y += (pointer.targetY - pointer.y) * ease;
    pointer.wind += (pointer.targetWind - pointer.wind) * ease;
    pointer.targetWind *= Math.exp(-dt * 1.9);
    const pose = `${pointer.x.toFixed(3)},${pointer.y.toFixed(3)}`;
    if (pose !== lastPose) {
      scene.style.setProperty('--pan-x', `${(pointer.x * 5).toFixed(2)}px`);
      scene.style.setProperty('--pan-y', `${(pointer.y * 2.5).toFixed(2)}px`);
      scene.style.setProperty('--tilt-x', `${(-pointer.y * 0.55).toFixed(3)}deg`);
      scene.style.setProperty('--tilt-y', `${(pointer.x * 0.8).toFixed(3)}deg`);
      glaze.setAttribute('transform', `translate(${(pointer.x * 55).toFixed(1)} ${(pointer.y * 9).toFixed(1)})`);
      lastPose = pose;
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const ripple = ripples[i];
      ripple.age += dt;
      const progress = ripple.age / 2.8;
      if (progress >= 1) {
        ripple.element.remove();
        ripples.splice(i, 1);
      } else {
        const radius = 8 + progress * 80;
        ripple.element.setAttribute('rx', radius.toFixed(1));
        ripple.element.setAttribute('ry', (radius * 0.4).toFixed(1));
        ripple.element.setAttribute('opacity', (Math.sin(progress * Math.PI) * 0.19).toFixed(3));
      }
    }
    // Steam is slow by nature. Thirty paints per second keeps it fluid and light.
    if (now - lastPaint >= 32) {
      drawSteam(steamTime);
      lastPaint = now;
    }
    frame = requestAnimationFrame(animate);
  }

  function syncMotion() {
    cancelAnimationFrame(frame);
    frame = 0;
    previousTime = 0;
    lastPaint = -Infinity;
    lastPose = '';
    if (reducedMotion.matches) {
      resetPointer();
      pointer.x = pointer.y = pointer.wind = 0;
      scene.removeAttribute('style');
      glaze.removeAttribute('transform');
      ripples.forEach(ripple => ripple.element.remove());
      ripples.length = 0;
      drawSteam(9);
    } else if (!document.hidden) {
      frame = requestAnimationFrame(animate);
    }
  }

  window.addEventListener('pointermove', onPointerMove, { passive: true });
  document.documentElement.addEventListener('pointerleave', resetPointer);
  window.addEventListener('blur', resetPointer);
  window.addEventListener('resize', resize, { passive: true });
  document.addEventListener('visibilitychange', syncMotion);
  reducedMotion.addEventListener('change', syncMotion);
  finePointer.addEventListener('change', resetPointer);
  resize();
  syncMotion();
})();
</script>
</body>
</html>
