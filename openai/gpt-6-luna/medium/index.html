<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100e0d">
<title></title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#100e0d}body{min-height:100svh;display:grid;place-items:center;isolation:isolate}.scene{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 69%,#372019 0%,#211510 25%,#15110f 55%,#100e0d 82%);--mx:0px;--my:0px}.scene:before{content:"";position:absolute;inset:-20%;background:radial-gradient(ellipse at 50% 55%,rgba(255,157,81,.12),transparent 44%);transform:translate(var(--mx),var(--my));transition:transform .35s ease;pointer-events:none}.scene:after{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E")}.glow{position:absolute;left:50%;top:62%;width:min(66vw,760px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,122,54,.18),rgba(198,73,35,.07) 38%,transparent 68%);filter:blur(16px);animation:glow 6s ease-in-out infinite alternate}.art{position:absolute;width:min(88vw,900px);height:min(92vh,900px);left:50%;top:50%;transform:translate(calc(-50% + var(--mx)*.25),calc(-50% + var(--my)*.2));overflow:visible;transition:transform .22s ease-out;filter:drop-shadow(0 35px 38px rgba(0,0,0,.48))}.bowl{transform-origin:500px 574px;animation:breathe 6s ease-in-out infinite}.steam{fill:none;stroke-linecap:round;filter:url(#softGlow);opacity:0}.steam path{stroke:rgba(255,228,191,.68);stroke-width:5;animation:steam 4.2s ease-in-out infinite}.steam path:nth-child(2){animation-delay:-1.5s;stroke-width:4}.steam path:nth-child(3){animation-delay:-2.7s;stroke-width:3}.steam path:nth-child(4){animation-delay:-.8s;stroke:rgba(255,185,131,.42);stroke-width:2.5}.steam path:nth-child(5){animation-delay:-3.4s;stroke-width:2}.steam{opacity:1}.oil{animation:oil 7s ease-in-out infinite;transform-origin:center}.oil:nth-child(2){animation-delay:-2.3s}.oil:nth-child(3){animation-delay:-4.5s}.scallion{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.scallion:nth-child(even){animation-delay:-2.4s}.shine{animation:shine 4.5s ease-in-out infinite}.chili{animation:float 6s ease-in-out infinite reverse;transform-box:fill-box;transform-origin:center}.cursor-light{position:absolute;inset:0;pointer-events:none;background:radial-gradient(320px circle at var(--px,50%) var(--py,50%),rgba(255,190,127,.055),transparent 72%);mix-blend-mode:screen}.grain{position:absolute;width:100%;height:100%;opacity:.07;pointer-events:none;background-image:radial-gradient(#ffd7ad .55px,transparent .65px);background-size:6px 6px;mask-image:linear-gradient(transparent,#000 30%,#000 85%,transparent)}
@keyframes steam{0%{transform:translateY(20px) scaleX(.86);opacity:0}18%{opacity:.7}70%{opacity:.34}100%{transform:translateY(-90px) scaleX(1.15);opacity:0}}@keyframes breathe{0%,100%{transform:translateY(0) rotate(-.25deg)}50%{transform:translateY(-5px) rotate(.25deg)}}@keyframes glow{from{opacity:.65;transform:translate(-50%,-50%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}@keyframes oil{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(3px,-5px) scale(1.08)}}@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}@keyframes shine{0%,100%{opacity:.4}50%{opacity:.9}}
@media(max-width:600px){.art{width:112vw;height:88vh;max-height:760px}.glow{width:100vw;top:60%}}@media(max-height:520px){.art{height:118vh;width:90vh}.glow{width:55vh}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}.steam path{opacity:.45;transform:none}}
</style>
</head>
<body>
<main class="scene" aria-label="A steaming bowl of vegan ramen in a dark, warm atmosphere">
<div class="glow" aria-hidden="true"></div><div class="cursor-light" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
<svg class="art" viewBox="0 0 1000 800" role="img" aria-label="A bowl of ramen topped with noodles, tofu, mushrooms, greens, sesame and chili oil">

 <radialGradient id="broth" cx="46%" cy="35%" r="72%"><stop stop-color="#e79a43"/><stop offset=".42" stop-color="#bd5b25"/><stop offset=".78" stop-color="#762c1d"/><stop offset="1" stop-color="#3b1714"/></radialGradient>
 <linearGradient id="porcelain" x1=".12" y1="0" x2=".86" y2="1"><stop stop-color="#eee0c7"/><stop offset=".17" stop-color="#bba58b"/><stop offset=".46" stop-color="#6f594e"/><stop offset=".72" stop-color="#302725"/><stop offset=".91" stop-color="#9c7865"/><stop offset="1" stop-color="#e3c6a6"/></linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0d7"/><stop offset=".25" stop-color="#c6a88b"/><stop offset=".72" stop-color="#493731"/><stop offset="1" stop-color="#c49a78"/></linearGradient>
 <linearGradient id="tofu" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#ffe9b5"/><stop offset=".5" stop-color="#dfa96b"/><stop offset="1" stop-color="#ad643c"/></linearGradient>
 <linearGradient id="mushroom" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#e7b876"/><stop offset=".55" stop-color="#936044"/><stop offset="1" stop-color="#50332b"/></linearGradient>
 <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4c66e"/><stop offset=".42" stop-color="#64733d"/><stop offset="1" stop-color="#263c2e"/></linearGradient>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter><filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
 <clipPath id="inside"><ellipse cx="500" cy="390" rx="270" ry="106"/></clipPath>
</defs>

<g class="bowl">

 <path d="M251 446c39 112 116 162 249 164 134-2 210-53 249-164-38 23-144 39-249 39-106 0-210-16-249-39z" fill="#201a18" opacity=".29"/>
 <path d="M294 584c54 40 117 58 206 59 93 0 161-20 210-60" fill="none" stroke="#d5b79a" stroke-opacity=".36" stroke-width="3"/>
 <path d="M383 628c31 10 72 15 117 15 48 0 87-5 118-16" fill="none" stroke="#efd7b7" stroke-opacity=".22" stroke-width="5" stroke-linecap="round"/>
 <!-- thick rim and broth --> <ellipse cx="500" cy="393" rx="293" ry="128" fill="url(#rim)" stroke="#f0dfc9" stroke-width="5"/>
 <ellipse cx="500" cy="390" rx="270" ry="106" fill="url(#broth)" stroke="#3f241d" stroke-width="3"/>
 <g clip-path="url(#inside)">
  <ellipse cx="500" cy="397" rx="270" ry="104" fill="url(#broth)"/>
  <!-- noodle nest -->
  <g fill="none" stroke-linecap="round">
   <path d="M299 408c12-58 42-72 79-43 35 27 12 62 53 69 41 7 44-47 83-49 39-2 29 62 70 64 41 2 29-62 67-70 29-7 51 23 65 47" stroke="#f3ca83" stroke-width="11"/>
   <path d="M318 364c27-27 58-22 61 8 3 29-31 45-9 66 22 21 59-4 77-36 18-32 37-45 57-30 20 15 6 49 22 62 16 13 42 4 60-21 18-25 43-44 69-35" stroke="#ffe0a2" stroke-width="8"/>
   <path d="M346 437c25-31 58-21 76 1 18 22 38 34 64 11 26-23 19-58 46-62 27-4 33 24 53 43 20 19 45 9 75-18" stroke="#d9954d" stroke-width="5"/>
   <path d="M374 340c14 15 27 31 18 47m93-48c-10 17-12 31-4 44m101-33c-12 12-17 27-13 41" stroke="#fff0bc" stroke-width="3" opacity=".75"/>
  </g>
  <!-- greens -->
  <g class="scallion"><path d="M420 380c-33-64-25-102 5-115 27 33 30 69-5 115" fill="url(#leaf)"/><path d="M421 382c-5-45-3-77 3-104" stroke="#bbc779" stroke-width="3" fill="none"/></g>
  <g class="scallion"><path d="M443 374c-9-57 12-90 42-88 15 40 2 72-42 88" fill="url(#leaf)"/><path d="M444 373c12-38 22-62 37-79" stroke="#d0cd82" stroke-width="3" fill="none"/></g>
  <g class="scallion"><path d="M602 392c21-61 50-79 74-61-3 39-24 63-74 61" fill="url(#leaf)"/><path d="M603 391c30-29 48-42 66-52" stroke="#b4bd72" stroke-width="3" fill="none"/></g>
  <g class="scallion"><path d="M624 404c39-40 71-39 83-12-20 29-48 37-83 12" fill="url(#leaf)"/></g>
  <!-- bok choy -->
  <path d="M352 396c-29-48-20-78 3-81 17 22 19 45 2 67 30-45 56-53 68-34-10 31-35 48-73 48z" fill="url(#leaf)" stroke="#c4c777" stroke-opacity=".44" stroke-width="2"/>
  <path d="M362 398l-7-68m9 67 42-43" stroke="#d5cf84" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <!-- tofu cubes -->
  <g><path d="M470 335l37-17 33 17-37 20z" fill="#ffe6af"/><path d="M470 335l33 20v41l-33-18z" fill="url(#tofu)"/><path d="M503 355l37-20v41l-37 20z" fill="#bf7845"/><path d="M477 339l26 15 28-15" fill="none" stroke="#fff0ca" stroke-width="3" opacity=".7"/></g>
  <g><path d="M532 369l29-14 30 15-31 16z" fill="#f7dca3"/><path d="M532 369l28 17v33l-28-15z" fill="#d69a5a"/><path d="M560 386l31-16v34l-31 15z" fill="#a85b38"/></g>

  <g class="oil"><ellipse cx="589" cy="432" rx="13" ry="6" fill="#ee8130" opacity=".72"/><ellipse cx="589" cy="430" rx="5" ry="2.5" fill="#ffd27a"/></g>

  <g fill="#f9e9c6"><ellipse cx="467" cy="378" rx="4" ry="2.4" transform="rotate(20 467 378)"/><ellipse cx="581" cy="385" rx="4" ry="2" transform="rotate(-20 581 385)"/><ellipse cx="530" cy="430" rx="3.5" ry="2"/><ellipse cx="390" cy="393" rx="3.2" ry="2"/><ellipse cx="623" cy="362" rx="3" ry="1.8"/><ellipse cx="494" cy="414" rx="3" ry="2"/><ellipse cx="432" cy="350" rx="3.5" ry="2"/></g>
  <g fill="none" stroke="#d8e29a" stroke-width="5"><circle cx="614" cy="347" r="10"/><circle cx="638" cy="382" r="8"/><circle cx="429" cy="423" r="7"/></g>
  <path class="shine" d="M280 386c12-40 35-61 65-69" fill="none" stroke="#fff0d7" stroke-width="4" stroke-linecap="round" opacity=".55"/>
 </g>
 <!-- rim highlight --> <ellipse cx="500" cy="393" rx="286" ry="121" fill="none" stroke="#fff0db" stroke-opacity=".62" stroke-width="4"/><path d="M262 436c42 32 129 54 238 54 108 0 195-22 238-54" fill="none" stroke="#f4d6b3" stroke-opacity=".37" stroke-width="4"/>
 <!-- bowl glaze accents --> <path d="M268 470c18 71 43 117 80 148" fill="none" stroke="#f5dfc4" stroke-opacity=".34" stroke-width="8" stroke-linecap="round"/><path d="M737 476c-18 68-42 114-74 141" fill="none" stroke="#ddbd9e" stroke-opacity=".18" stroke-width="7" stroke-linecap="round"/>
</g>
</svg>
</main>
<script>
(()=>{const scene=document.querySelector('.scene');let frame=0;const move=e=>{const r=scene.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;scene.style.setProperty('--px',`${x*100}%`);scene.style.setProperty('--py',`${y*100}%`);if(!frame){frame=requestAnimationFrame(()=>{scene.style.setProperty('--mx',`${(x-.5)*22}px`);scene.style.setProperty('--my',`${(y-.5)*16}px`);frame=0})}};scene.addEventListener('pointermove',move,{passive:true});scene.addEventListener('pointerleave',()=>{scene.style.setProperty('--mx','0px');scene.style.setProperty('--my','0px')},{passive:true})})();
</script>
</body>
</html>
