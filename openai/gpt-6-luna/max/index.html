<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101116">
  <title></title>
  <style>
    :root {
      color-scheme: dark;
      background: #101116;
      font-synthesis: none;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101116;
    }

    body { min-height: 100svh; }

    .scene {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100svh;
      overflow: hidden;
      background: #101116;
      touch-action: pan-y;
    }

    .steam {
      fill: none;
      stroke: url(#steamColor);
      stroke-width: 5;
      stroke-linecap: round;
      filter: url(#steamGlow);
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: rise 5.8s ease-in-out infinite;
    }

    .steam.s2 { animation-delay: -2.1s; animation-duration: 6.4s; }
    .steam.s3 { animation-delay: -3.7s; animation-duration: 5.2s; }
    .steam.s4 { animation-delay: -.9s; animation-duration: 6.9s; stroke-width: 3.5; opacity: 0; }

    @keyframes rise {
      0% { opacity: 0; transform: translate3d(0, 20px, 0) scale(.92); }
      18% { opacity: .46; }
      62% { opacity: .28; }
      100% { opacity: 0; transform: translate3d(9px, -77px, 0) scale(1.1); }
    }

    .bowl-float {
      transform-box: fill-box;
      transform-origin: center;
      animation: settle 7s ease-in-out infinite;
    }

    @keyframes settle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .broth-glint {
      animation: glimmer 4.8s ease-in-out infinite;
    }

    .broth-glint.g2 { animation-delay: -2.4s; }

    @keyframes glimmer {
      0%, 100% { opacity: .12; }
      45% { opacity: .48; }
      65% { opacity: .23; }
    }

    .bubble {
      transform-box: fill-box;
      transform-origin: center;
      animation: simmer 3.7s ease-in-out infinite;
    }

    .bubble.b2 { animation-delay: -1.25s; }
    .bubble.b3 { animation-delay: -2.5s; }

    @keyframes simmer {
      0%, 100% { opacity: 0; transform: translateY(3px) scale(.72); }
      28% { opacity: .55; }
      72% { opacity: .25; transform: translateY(-5px) scale(1); }
    }

    .pointer-layer {
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
    }

    .portrait-fit {
      transform-box: view-box;
      transform-origin: 50% 55.56%;
    }

    @media (max-aspect-ratio: 4/5) {
      .portrait-fit { transform: scale(.62); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
      .steam { opacity: .3; transform: none !important; }
      .bubble { opacity: .16; transform: none !important; }
    }
  </style>
</head>

  <script>
    (() => {
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const scene = document.querySelector('.scene');
      const layers = [...document.querySelectorAll('.pointer-layer')];
      if (reduceMotion.matches || !('PointerEvent' in window)) return;

      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;
      let frame = 0;

      function move(event) {
        const bounds = scene.getBoundingClientRect();
        targetX = ((event.clientX - bounds.left) / bounds.width - .5) * 2;
        targetY = ((event.clientY - bounds.top) / bounds.height - .5) * 2;
        if (!frame) frame = requestAnimationFrame(update);
      }

      function update() {
        currentX += (targetX - currentX) * .075;
        currentY += (targetY - currentY) * .075;
        layers.forEach((layer, index) => {
          const depth = index === 0 ? 1.15 : index === 1 ? .65 : .35;
          layer.style.transform = `translate(${currentX * 7 * depth}px, ${currentY * 5 * depth}px)`;
        });
        if (Math.abs(targetX - currentX) + Math.abs(targetY - currentY) > .002) {
          frame = requestAnimationFrame(update);
        } else {
          frame = 0;
        }
      }

      scene.addEventListener('pointermove', move, { passive: true });
      scene.addEventListener('pointerleave', () => {
        targetX = 0;
        targetY = 0;
        if (!frame) frame = requestAnimationFrame(update);
      }, { passive: true });
    })();
  </script>
