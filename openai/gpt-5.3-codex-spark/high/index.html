<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vegan Ramen</title>
    <style>
      :root {
        --steam-x: 0px;
        --steam-y: 0px;
        --dish-tilt-x: 0deg;
        --dish-tilt-y: 0deg;
        --heat: 0.42;
        --mouse-dist: 0;
        --float-phase: 0;
        --motion-scale: 1;
        --wisp-color: 0, 0, 0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #06090f;
      }

      body {
        display: grid;
        place-items: center;
        position: relative;
        color: #f8e9da;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      .scene {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .backdrop {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 30% 60%, rgba(255, 154, 89, 0.17), transparent 55%),
          radial-gradient(circle at 70% 12%, rgba(255, 196, 128, 0.08), transparent 48%),
          linear-gradient(180deg, #080d16 0%, #05070d 55%, #04060c 100%);
      }

      .mist {
        position: absolute;
        inset: -15%;
        pointer-events: none;
        background:
          radial-gradient(circle at 45% 58%, rgba(255, 196, 128, 0.07), rgba(0, 0, 0, 0.6) 72%),
          radial-gradient(circle at 58% 40%, rgba(170, 140, 86, 0.06), rgba(0, 0, 0, 0.5) 70%);
        filter: blur(12px);
        animation: mistFloat 16s ease-in-out infinite alternate;
      }

      .dish-wrap {
        --steam-width: clamp(210px, 38vmin, 390px);
        --dish-width: clamp(260px, 46vmin, 580px);
        --dish-height: calc(var(--dish-width) * 0.64);

        position: absolute;
        left: 50%;
        top: 56%;
        width: var(--dish-width);
        height: var(--dish-height);
        transform:
          translate3d(-50%, -45%, 0)
          rotateX(var(--dish-tilt-x))
          rotateY(var(--dish-tilt-y));
        transform-origin: center 60%;
        perspective: 900px;
        filter: drop-shadow(0 25px 45px rgba(0, 0, 0, 0.58));
      }

      .heat-core {
        position: absolute;
        left: 50%;
        top: 72%;
        width: 180%;
        height: 140%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 143, 62, 0.30), rgba(255, 143, 62, 0.02) 58%, transparent 75%);
        animation: pulseGlow 6s ease-in-out infinite;
        pointer-events: none;
        opacity: calc(0.32 + var(--heat) * 0.58);
      }

      .dish {
        position: absolute;
        left: 50%;
        top: 12%;
        width: var(--dish-width);
        height: calc(var(--dish-height) * 0.76);
        transform: translateX(-50%);
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }

      .steam {
        position: absolute;
        left: 50%;
        top: -6%;
        width: var(--steam-width);
        height: 70%;
        transform: translateX(-50%) translate3d(calc(var(--steam-x) * 0.24), calc(var(--steam-y) * 0.1), 0);
        pointer-events: none;
      }

      .steam span {
        position: absolute;
        bottom: 100%;
        width: 6px;
        height: calc(40px + var(--size));
        left: calc(50% + var(--x));
        border-radius: 999px;
        background: linear-gradient(to top, transparent, rgba(255, 240, 220, 0.68), rgba(255, 240, 220, 0.95), transparent);
        filter: blur(0.6px) drop-shadow(0 0 8px rgba(255, 182, 92, 0.32));
        opacity: 0;
        transform: translateX(var(--drift));
        animation: steamRise calc(2.9s + var(--dur)) linear infinite;
        animation-delay: var(--delay);
      }

      .steam span::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 10px;
        right: -10px;
        height: 65%;
        border-radius: 999px;
        background: linear-gradient(to right, transparent, rgba(255, 240, 220, 0.35), transparent);
      }

      .bowl {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .bowl-body {
        position: absolute;
        inset: 0;
        border-radius: 50% 50% 43% 43% / 48% 48% 35% 35%;
        background:
          linear-gradient(180deg, #deae84 0%, #a76a3f 22%, #7d4727 55%, #6f3f22 82%, #60361c 100%);
        box-shadow:
          inset 0 -16px 40px rgba(0, 0, 0, 0.35),
          inset 0 2px 6px rgba(255, 255, 255, 0.18),
          0 22px 38px rgba(0, 0, 0, 0.42);
      }

      .bowl-body::before {
        content: "";
        position: absolute;
        top: -5%;
        left: -2.5%;
        width: 105%;
        height: 32%;
        border-radius: 48% 48% 60% 60%;
        background:
          linear-gradient(180deg, #f2c39a 4%, #cf9268 26%, #b66f40 60%, #87512f 100%);
        box-shadow: inset 0 2px 7px rgba(255, 255, 255, 0.45);
      }

      .bowl-body::after {
        content: "";
        position: absolute;
        inset: 6% 7% 10% 7%;
        border-radius: 50% 50% 40% 40% / 68% 68% 28% 28%;
        background:
          radial-gradient(circle at 30% 20%, rgba(111, 72, 45, 0.65), rgba(75, 44, 24, 0.95) 56%),
          linear-gradient(180deg, rgba(83, 38, 23, 0.95) 20%, #3b1f14 80%);
        border: 2px solid rgba(95, 57, 35, 0.8);
        overflow: hidden;
      }

      .broth {
        position: absolute;
        inset: 11% 10% 20% 10%;
        border-radius: 0 0 44% 44% / 15% 15% 58% 58%;
        overflow: hidden;
        background:
          radial-gradient(circle at 32% 22%, rgba(118, 62, 41, 0.48), rgba(84, 42, 31, 0.82) 48%, #32180d 100%);
      }

      .broth::before {
        content: "";
        position: absolute;
        inset: -28% -8% 0 -8%;
        border-radius: 52% 52% 40% 40%;
        background:
          repeating-linear-gradient(
            78deg,
            rgba(233, 214, 176, 0.24) 0,
            rgba(233, 214, 176, 0.24) 4px,
            transparent 4px,
            transparent 11px
          );
        mix-blend-mode: screen;
        opacity: 0.45;
      }

      .steam-cast {
        position: absolute;
        inset: 0;
        top: 12%;
        left: 4%;
        width: 92%;
        filter: blur(0.25px);
        opacity: 0.84;
      }

      .steam-cast .droplet,
      .steam-cast .droplet::before,
      .steam-cast .droplet::after {
        position: absolute;
        width: 4px;
        border-radius: 999px;
        background: rgba(238, 215, 183, 0.18);
      }

      .steam-cast .droplet {
        left: 32%;
        top: 16%;
        height: 12px;
        animation: bubble 3.2s ease-in-out infinite;
      }

      .steam-cast .droplet::before {
        content: "";
        height: 8px;
        left: 120%;
        top: 26%;
        animation: bubble 3.1s 1.2s ease-in-out infinite;
      }

      .steam-cast .droplet::after {
        content: "";
        height: 6px;
        left: -95%;
        top: 48%;
        animation: bubble 2.9s 0.7s ease-in-out infinite;
      }

      .noodle {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: var(--len);
        height: clamp(4px, 0.5vmin, 6px);
        background: linear-gradient(90deg, rgba(243, 226, 199, 0.8), rgba(243, 216, 176, 0.55), rgba(248, 233, 206, 0.86));
        border-radius: 999px;
        transform-origin: left center;
        animation: noodleSway calc(3.5s + var(--speed)) ease-in-out infinite;
        box-shadow: 0 0 10px rgba(255, 220, 170, 0.14);
      }

      .noodle::before {
        content: "";
        position: absolute;
        inset: -2px 0;
        border-radius: 999px;
        filter: blur(1.2px);
        opacity: 0.35;
        background: linear-gradient(90deg, rgba(255, 240, 215, 0.8), rgba(255, 230, 195, 0));
      }

      .topping {
        position: absolute;
      }

      .tofu,
      .chili,
      .nori,
      .sprout,
      .sesame {
        position: absolute;
        border-radius: 50%;
      }

      .tofu {
        background: linear-gradient(180deg, #f3e7c8 0%, #ddcfac 40%, #c7b48d 100%);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.7);
      }

      .tofu.one {
        width: 16px;
        height: 16px;
        left: 44%;
        top: 50%;
      }

      .tofu.two {
        width: 12px;
        height: 12px;
        left: 58%;
        top: 58%;
      }

      .tofu.three {
        width: 14px;
        height: 14px;
        left: 66%;
        top: 52%;
      }

      .chili {
        width: 10px;
        height: 10px;
        border-radius: 45%;
        transform: rotate(30deg);
        background: linear-gradient(145deg, #cf3f34 0%, #a2261c 100%);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), inset 0 -2px 2px rgba(0, 0, 0, 0.15);
      }

      .chili.one { left: 54%; top: 44%; }
      .chili.two { left: 63%; top: 46%; }

      .nori {
        width: 44px;
        height: 10px;
        left: 34%;
        top: 64%;
        border-radius: 14px;
        background: linear-gradient(90deg, rgba(30, 35, 28, 0.9) 0%, rgba(39, 45, 34, 0.85) 100%);
        filter: blur(0.2px);
        transform: rotate(-12deg);
      }

      .sprout {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        left: 70%;
        top: 61%;
        background: radial-gradient(circle at 35% 28%, #def2b6, #95a76e 60%, #6b7a48 100%);
        box-shadow: 0 0 7px rgba(182, 212, 130, 0.6);
      }

      .sprout::before,
      .sprout::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 3px;
        background: linear-gradient(90deg, rgba(182, 212, 130, 0.55), rgba(182, 212, 130, 0));
        border-radius: 999px;
      }

      .sprout::before {
        transform: rotate(24deg) translate(-5px, -4px);
      }

      .sprout::after {
        transform: rotate(-20deg) translate(3px, 6px);
      }

      .sprout.two {
        left: 51%;
        top: 64%;
      }

      .sesame {
        width: 2px;
        height: 2px;
        border-radius: 999px;
        background: #f6efde;
        box-shadow:
          0 0 0 1px rgba(246, 239, 222, 0.25),
          4px 8px 0 0.2px rgba(246, 239, 226, 0.2),
          10px -6px 0 0.4px rgba(250, 239, 222, 0.14),
          -5px 4px 0 0.2px rgba(250, 239, 230, 0.22),
          -10px -4px 0 0.2px rgba(242, 227, 200, 0.16);
      }

      .steam-hit {
        position: absolute;
        width: 100%;
        height: 110%;
        top: -48%;
        left: 0;
        transform: translateX(calc(var(--steam-x) * 0.16))
          translateY(calc(var(--steam-y) * 0.12));
        pointer-events: none;
      }

      .floor {
        position: absolute;
        left: 50%;
        top: 84%;
        width: min(82vmin, 86%);
        height: clamp(30px, 8vmin, 85px);
        transform: translateX(-50%);
        background: radial-gradient(ellipse at center, rgba(12, 16, 23, 0.9) 0%, rgba(9, 11, 16, 0.2) 68%, rgba(4, 7, 12, 0) 100%);
        filter: blur(1px);
      }

      .plate-ring {
        position: absolute;
        width: calc(var(--dish-width) + 34%);
        height: clamp(38px, 7vmin, 66px);
        left: 50%;
        top: 72%;
        transform: translateX(-50%) perspective(500px) rotateX(66deg);
        background: radial-gradient(ellipse at center, rgba(180, 134, 79, 0.3) 0%, rgba(88, 55, 28, 0.13) 34%, rgba(11, 15, 23, 0.03) 100%);
        border-radius: 50%;
        filter: blur(0.5px);
      }

      @keyframes steamRise {
        0% {
          transform: translateX(var(--drift)) translateY(0) scale(0.7) rotate(2deg);
          opacity: 0;
        }
        12% {
          opacity: 0.22;
        }
        45% {
          opacity: 0.62;
        }
        100% {
          transform: translateX(calc(var(--drift) + var(--steam-x) * 0.7)) translateY(-110%) scale(1.18) rotate(-6deg);
          opacity: 0;
        }
      }

      @keyframes noodleSway {
        0%, 100% {
          transform: translateX(0) scaleX(0.95) rotate(1.3deg);
        }
        50% {
          transform: translateX(2px) scaleX(1.02) rotate(-1.9deg);
        }
      }

      @keyframes mistFloat {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(4%);
        }
      }

      @keyframes bubble {
        0%, 100% {
          transform: translateX(0) translateY(0) scale(0.85);
          opacity: 0;
        }
        40% {
          opacity: 0.18;
        }
        50% {
          opacity: 0.6;
        }
        85% {
          transform: translateX(2px) translateY(-8px) scale(1.06);
          opacity: 0;
        }
      }

      @keyframes pulseGlow {
        0%, 100% {
          transform: translate(-50%, -50%) scale(0.98);
          opacity: 0.28;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.08);
          opacity: 0.42;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        :root {
          --motion-scale: 0;
          --steam-x: 0px;
          --steam-y: 0px;
          --dish-tilt-x: 0deg;
          --dish-tilt-y: 0deg;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          transition-delay: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene" aria-hidden="true">
      <div class="backdrop"></div>
      <div class="mist"></div>
      <div class="floor"></div>
      <div class="plate-ring"></div>

      <div class="dish-wrap">
        <div class="heat-core"></div>

        <div class="steam-hit">
          <div class="steam">
            <span style="--x:-72px; --delay:-0.2s; --dur:0s; --size:16px; --drift:-2px"></span>
            <span style="--x:-52px; --delay:-1.8s; --dur:0.7s; --size:22px; --drift:-7px"></span>
            <span style="--x:-34px; --delay:-0.8s; --dur:1.4s; --size:30px; --drift:-3px"></span>
            <span style="--x:-18px; --delay:-1.1s; --dur:0.9s; --size:12px; --drift:4px"></span>
            <span style="--x:-1px; --delay:-3.2s; --dur:0.5s; --size:28px; --drift:2px"></span>
            <span style="--x:18px; --delay:-2.5s; --dur:1.6s; --size:18px; --drift:3px"></span>
            <span style="--x:38px; --delay:-1.7s; --dur:0.6s; --size:24px; --drift:0px"></span>
            <span style="--x:56px; --delay:-2.8s; --dur:0.9s; --size:20px; --drift:-5px"></span>
            <span style="--x:71px; --delay:-0.4s; --dur:1.2s; --size:14px; --drift:6px"></span>
            <span style="--x:86px; --delay:-1.9s; --dur:1.1s; --size:16px; --drift:-1px"></span>
          </div>
        </div>

        <div class="dish">
          <div class="bowl">
            <div class="bowl-body"></div>
            <div class="broth">
              <div class="steam-cast">
                <div class="droplet"></div>
              </div>

              <div class="noodle" style="--x:14%; --y:52%; --len:72%; --speed:0.4s"></div>
              <div class="noodle" style="--x:8%; --y:56%; --len:62%; --speed:1.7s"></div>
              <div class="noodle" style="--x:12%; --y:60%; --len:66%; --speed:1.2s"></div>
              <div class="noodle" style="--x:20%; --y:64%; --len:56%; --speed:2.1s"></div>
              <div class="noodle" style="--x:28%; --y:45%; --len:48%; --speed:1.3s"></div>
              <div class="noodle" style="--x:36%; --y:48%; --len:51%; --speed:0.8s"></div>
              <div class="noodle" style="--x:46%; --y:54%; --len:39%; --speed:1.8s"></div>
              <div class="noodle" style="--x:59%; --y:57%; --len:36%; --speed:1s"></div>

              <div class="tofu tofu one"></div>
              <div class="tofu tofu two"></div>
              <div class="tofu tofu three"></div>

              <div class="chili chili one"></div>
              <div class="chili chili two"></div>

              <div class="nori"></div>
              <div class="sprout"></div>
              <div class="sprout two"></div>

              <div class="sesame" style="left:46%; top:71%"></div>
              <div class="sesame" style="left:52%; top:69%"></div>
              <div class="sesame" style="left:59%; top:73%"></div>
              <div class="sesame" style="left:66%; top:70%"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const root = document.documentElement;
      const dish = document.querySelector('.dish-wrap');
      const steam = document.querySelector('.steam');

      if (reduce) {
        root.style.setProperty('--heat', '0.45');
      } else {
        const updateParallax = (clientX, clientY) => {
          const cx = innerWidth * 0.5;
          const cy = innerHeight * 0.5;
          const nx = (clientX - cx) / cx;
          const ny = (clientY - cy) / cy;

          const dishRect = dish.getBoundingClientRect();
          const dx = clientX - (dishRect.left + dishRect.width * 0.5);
          const dy = clientY - (dishRect.top + dishRect.height * 0.5);
          const maxDist = Math.hypot(innerWidth, innerHeight);
          const intensity = Math.max(0, 1 - Math.hypot(dx, dy) / maxDist);

          root.style.setProperty('--steam-x', `${Math.max(-30, Math.min(30, nx * 34))}px`);
          root.style.setProperty('--steam-y', `${Math.max(-22, Math.min(22, ny * 26))}px`);
          root.style.setProperty('--dish-tilt-x', `${-ny * 5}deg`);
          root.style.setProperty('--dish-tilt-y', `${nx * 5}deg`);
          root.style.setProperty('--heat', `${0.34 + intensity * 0.56}`);
        };

        const handleMove = (event) => {
          updateParallax(event.clientX, event.clientY);
        };

        window.addEventListener('pointermove', handleMove, { passive: true });

        window.addEventListener('pointerleave', () => {
          root.style.setProperty('--steam-x', '0px');
          root.style.setProperty('--steam-y', '0px');
          root.style.setProperty('--dish-tilt-x', '0deg');
          root.style.setProperty('--dish-tilt-y', '0deg');
          root.style.setProperty('--heat', '0.42');
        });

        const animate = (time) => {
          const phase = time * 0.0003;
          root.style.setProperty('--float-phase', phase.toFixed(3));
          steam.style.opacity = 0.84 + Math.sin(phase * 3.2) * 0.06;
          requestAnimationFrame(animate);
        };

        requestAnimationFrame(animate);
      }
    </script>
  </body>
</html>
