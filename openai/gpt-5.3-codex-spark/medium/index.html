<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vegan Ramen</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #04060d;
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    }

    body {
      display: block;
    }

    #scene {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      image-rendering: auto;
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');

    const state = {
      time: 0,
      mouse: { x: 0, y: 0, active: false },
      reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
      steam: Array.from({ length: 14 }, (_, i) => ({
        baseX: 0,
        phase: Math.random() * Math.PI * 2,
        height: 120 + Math.random() * 120,
        width: 12 + Math.random() * 16,
        speed: 0.002 + Math.random() * 0.0015,
        drift: (Math.random() - 0.5) * 0.25,
        widthAmp: 2 + Math.random() * 4,
      })),
      bubbles: Array.from({ length: 42 }, () => ({
        x: Math.random(),
        y: Math.random(),
        size: 1.2 + Math.random() * 2.4,
        speed: 0.2 + Math.random() * 0.8,
        wobble: Math.random() * Math.PI * 2,
      })),
      noodleStrands: Array.from({ length: 28 }, (_, i) => ({
        angle: Math.random() * Math.PI * 2,
        amp: 1.6 + Math.random() * 1.9,
        freq: 0.7 + Math.random() * 0.8,
        phase: Math.random() * Math.PI * 2,
        len: 90 + Math.random() * 95,
        offset: (i % 4) - 1.5,
      })),
      heatWaves: Array.from({ length: 9 }, () => ({
        angle: Math.random() * Math.PI,
        radius: 130 + Math.random() * 130,
        speed: 0.15 + Math.random() * 0.2,
        offset: Math.random() * Math.PI * 2,
      })),
    };

    let width = 0;
    let height = 0;
    let centerX = 0;
    let centerY = 0;
    let bowlY = 0;
    let bowlRadiusX = 0;
    let bowlRadiusY = 0;

    function resize() {
      const dpr = Math.max(1, Math.min(2.2, window.devicePixelRatio || 1));
      width = canvas.clientWidth = window.innerWidth;
      height = canvas.clientHeight = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      centerX = width / 2;
      centerY = height * 0.62;
      bowlY = centerY;
      const scale = Math.min(width, height);
      bowlRadiusX = scale * 0.24;
      bowlRadiusY = Math.max(34, scale * 0.09);

      state.mouse.x = centerX;
      state.mouse.y = centerY - bowlRadiusY * 2;
    }

    function easeOut(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function drawBackground() {
      const bg = ctx.createLinearGradient(0, 0, 0, height);
      bg.addColorStop(0, '#05080f');
      bg.addColorStop(0.5, '#0a101a');
      bg.addColorStop(1, '#120d12');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, width, height);

      const vignette = ctx.createRadialGradient(centerX, centerY * 0.45, 40, centerX, centerY, width * 0.85);
      vignette.addColorStop(0, 'rgba(255, 110, 35, 0.14)');
      vignette.addColorStop(0.52, 'rgba(0, 0, 0, 0.1)');
      vignette.addColorStop(1, 'rgba(0, 0, 0, 0.48)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, width, height);

      const ambient = ctx.createLinearGradient(centerX - bowlRadiusX, centerY - bowlRadiusY * 0.2, centerX + bowlRadiusX, centerY + bowlRadiusY * 2.8);
      ambient.addColorStop(0, 'rgba(236, 128, 58, 0.11)');
      ambient.addColorStop(0.4, 'rgba(255, 170, 85, 0.06)');
      ambient.addColorStop(1, 'rgba(15, 5, 10, 0.02)');
      ctx.fillStyle = ambient;
      ctx.fillRect(0, 0, width, height);
    }

    function drawTable() {
      const shadow = ctx.createRadialGradient(
        centerX,
        bowlY + bowlRadiusY * 1.1,
        bowlRadiusX * 0.2,
        centerX,
        bowlY + bowlRadiusY * 1.1,
        bowlRadiusX * 0.94,
      );
      shadow.addColorStop(0, 'rgba(0, 0, 0, 0.65)');
      shadow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = shadow;
      ctx.beginPath();
      ctx.ellipse(
        centerX,
        bowlY + bowlRadiusY * 1.1,
        bowlRadiusX * 1.02,
        bowlRadiusY * 0.42,
        0,
        0,
        Math.PI * 2,
      );
      ctx.fill();
    }

    function drawBowlPulsePulse(t) {
      const warmth = 0.13 * (0.5 + Math.sin(t) * 0.5);
      const edge = ctx.createRadialGradient(centerX - 6, bowlY - 6, bowlRadiusX * 0.2, centerX, bowlY, bowlRadiusX);
      edge.addColorStop(0, `rgba(255, 173, 100, ${0.15 + warmth * 0.3})`);
      edge.addColorStop(1, 'rgba(255, 90, 32, 0)');
      ctx.fillStyle = edge;
      ctx.beginPath();
      ctx.ellipse(centerX, bowlY, bowlRadiusX * 1.04, bowlRadiusY * 0.72, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBowl() {
      const rim = bowlRadiusY * 0.75;
      const steamAttraction = Math.max(-18, Math.min(18, (centerX - state.mouse.x) * 0.012));

      const potGlow = ctx.createLinearGradient(centerX - bowlRadiusX * 0.4, bowlY - rim, centerX + bowlRadiusX * 0.4, bowlY + rim * 1.4);
      potGlow.addColorStop(0, '#c16b3e');
      potGlow.addColorStop(0.5, '#6c3722');
      potGlow.addColorStop(1, '#3a1b0d');

      // bowl wall
      ctx.fillStyle = '#7b3b25';
      ctx.beginPath();
      ctx.ellipse(centerX, bowlY, bowlRadiusX * 1.05, rim, 0, 0, Math.PI * 2);
      ctx.ellipse(centerX + steamAttraction * 0.08, bowlY - 4, bowlRadiusX * 0.95, rim * 0.78, 0, 0, Math.PI * 2);
      ctx.fill('evenodd');

      // inner bowl
      ctx.fillStyle = potGlow;
      ctx.beginPath();
      ctx.ellipse(centerX, bowlY + 2, bowlRadiusX * 0.93, rim * 0.67, 0, 0, Math.PI * 2);
      ctx.fill();

      // rim highlight
      ctx.strokeStyle = 'rgba(255, 196, 148, 0.7)';
      ctx.lineWidth = Math.max(1.4, width * 0.0018);
      ctx.beginPath();
      ctx.ellipse(centerX, bowlY - 4, bowlRadiusX * 0.92, rim * 0.55, 0, 0, Math.PI * 2);
      ctx.stroke();

      // broth top shine
      const shine = ctx.createRadialGradient(centerX - bowlRadiusX * 0.3, bowlY - 8, 10, centerX, bowlY + 4, bowlRadiusX * 0.7);
      shine.addColorStop(0, 'rgba(255, 206, 150, 0.34)');
      shine.addColorStop(0.4, 'rgba(255, 145, 83, 0.24)');
      shine.addColorStop(1, 'rgba(60, 24, 8, 0.08)');
      ctx.fillStyle = shine;
      ctx.beginPath();
      ctx.ellipse(centerX, bowlY + 5, bowlRadiusX * 0.68, rim * 0.52, 0, 0, Math.PI * 2);
      ctx.fill();

      // steam outlet region
      ctx.fillStyle = 'rgba(180, 90, 44, 0.16)';
      ctx.beginPath();
      ctx.ellipse(centerX - steamAttraction * 0.15, bowlY - rim * 0.85, bowlRadiusX * 0.34, rim * 0.22, 0, Math.PI, 0, true);
      ctx.fill();
    }

    function drawSteam(dt) {
      const steamIntensity = state.reducedMotion ? 0.05 : 0.7;
      const pointer = Math.max(-24, Math.min(24, (centerX - state.mouse.x) * 0.015));

      state.steam.forEach((s, index) => {
        const age = state.time * s.speed + s.phase;
        const baseX = centerX + (Math.sin(age * 1.3 + index) * 6) + pointer + s.drift * 28;
        const width = s.width * (state.reducedMotion ? 0.2 : 1);
        const h = s.height * (0.6 + 0.25 * Math.cos(index));
        const y = bowlY - 25 - ((state.time * (state.reducedMotion ? 0.15 : 0.8) + index * 6) * 0.9 % (h + bowlRadiusY * 1.4));

        ctx.beginPath();
        const start = y + h * steamIntensity;
        const end = bowlY - 140;
        const ctrl1x = baseX + Math.sin(age * 0.8 + 2) * s.widthAmp + pointer * 0.4;
        const ctrl1y = (start + end) * 0.6;
        const ctrl2x = baseX + Math.cos(age * 0.9 + 1.2) * (s.widthAmp * 0.9) + pointer * 0.75;
        const ctrl2y = (start + end) * 0.3;

        ctx.moveTo(baseX, start);
        ctx.bezierCurveTo(ctrl1x, ctrl1y, ctrl2x, ctrl2y, baseX + pointer * 0.4, end);
        ctx.strokeStyle = `rgba(230, 216, 206, ${0.07 + steamIntensity * 0.18})`;
        ctx.lineWidth = Math.max(1.2, width * 0.0016);
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        const cx = baseX + pointer * 0.15 + Math.sin(age * 1.2 + s.phase) * 4;
        const cy = end + Math.cos(age * 1.3 + s.phase) * 6;
        const cr = 2.5 + Math.sin(age + s.phase) * 0.9;
        ctx.fillStyle = `rgba(250, 220, 200, ${steamIntensity * 0.22})`;
        ctx.arc(cx, cy, Math.max(0.8, cr), 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawNoodles(t) {
      const heat = 0.35 + Math.max(0, state.mouseDist / (Math.max(width, height) * 0.18));
      const vigor = state.reducedMotion ? 0.08 : heat;

      state.noodleStrands.forEach((n, i) => {
        const y = bowlY - bowlRadiusY * 0.26 + (i % 8) * 1.4;
        const x = centerX - bowlRadiusX * 0.68 + (i % 12) * (bowlRadiusX * 1.16) / 12;
        const baseAmp = n.amp + vigor * 0.8;
        const amp = baseAmp * (Math.sin(t * n.freq + n.phase) * 0.8 + 1);
        ctx.beginPath();
        ctx.moveTo(x, y);

        const wave = Math.sin(t * 0.9 + n.phase) * 8;
        for (let p = 0; p <= 14; p++) {
          const px = x + (p / 14) * n.len * 0.92;
          const py = y + Math.sin((p / 14) * Math.PI * 1.85 + n.phase + wave * 0.04) * amp - n.offset * 5;
          const wobble = Math.sin(t * 1.4 + n.phase * 1.2 + p * 0.5 + state.mouseDist * 0.02) * (state.reducedMotion ? 0.2 : 1) * 1.5;
          const cx = px + Math.cos(t * 0.7 + p * 0.4 + n.phase) * 3 + wobble;
          const cy = py + wobble;
          ctx.quadraticCurveTo(cx, cy, px, py);
        }

        ctx.strokeStyle = `rgba(${190 + i * 1.1}, ${160 + vigor * 28}, ${120 + vigor * 10}, ${0.28 + vigor * 0.16})`;
        ctx.lineWidth = 2.2;
        ctx.stroke();
      });
    }

    function drawToppings(t) {
      const eggX = centerX + bowlRadiusX * 0.16 + Math.cos(t * 0.2) * 5;
      const eggY = bowlY - bowlRadiusY * 0.13;

      // egg
      const wob = state.reducedMotion ? 0 : Math.sin(t * 0.6) * 1.6;
      const yolk = ctx.createRadialGradient(eggX - 8, eggY - 4, 2, eggX + 4, eggY + 4, 22);
      yolk.addColorStop(0, 'rgba(250, 215, 120, 0.94)');
      yolk.addColorStop(1, 'rgba(210, 120, 18, 0.85)');
      ctx.fillStyle = 'rgba(245, 236, 211, 0.96)';
      ctx.beginPath();
      ctx.ellipse(eggX, eggY + wob, 27, 19, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = yolk;
      ctx.beginPath();
      ctx.ellipse(eggX + 3, eggY + 1.5, 9, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      // scallion
      const scallionColor = 'rgba(130, 185, 40, 0.84)';
      const lines = 11;
      for (let i = 0; i < lines; i++) {
        const lx = centerX - bowlRadiusX * 0.34 + i * (bowlRadiusX * 0.68 / lines);
        const ly = bowlY - bowlRadiusY * 0.52;
        ctx.strokeStyle = scallionColor;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.bezierCurveTo(
          lx + 2,
          ly - 4,
          lx + 2,
          ly - 12,
          lx + 1,
          ly - 24,
        );
        ctx.stroke();
      }

      // mushrooms
      for (let i = 0; i < 4; i++) {
        const mx = centerX + (Math.sin(t * 0.3 + i) * 4) - bowlRadiusX * 0.16 + i * 14;
        const my = bowlY - 12;
        const h = 7 + i * 0.6;
        ctx.fillStyle = '#c28b57';
        ctx.beginPath();
        ctx.ellipse(mx, my, 6 + (i % 2), h, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#efe1c0';
        ctx.fillRect(mx - 1.4, my - 1, 2.6, h);
      }

      // sesame dots
      for (let i = 0; i < 7; i++) {
        const sx = centerX - bowlRadiusX * 0.45 + i * (bowlRadiusX * 0.15);
        const sy = bowlY - bowlRadiusY * 0.03 + Math.sin(t * 0.9 + i) * 3;
        ctx.fillStyle = 'rgba(244, 241, 224, 0.76)';
        ctx.beginPath();
        ctx.arc(sx, sy, 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawBrothSurface(t) {
      const waveCount = state.heatWaves.length;
      const swirl = state.reducedMotion ? 0.04 : 0.18;

      for (let i = 0; i < waveCount; i++) {
        const w = state.heatWaves[i];
        const waveY = bowlY - bowlRadiusY * (0.36 - 0.08 * Math.sin(w.angle + t * 0.18 + w.offset));
        const amp = 2 + i * 0.55 * (state.mouseDist * 0.04);
        ctx.beginPath();
        const len = bowlRadiusX * 0.78;
        const startX = centerX - len;
        const endX = centerX + len;

        for (let x = 0; x <= 60; x++) {
          const tStep = x / 60;
          const xx = startX + (endX - startX) * tStep;
          const yy = waveY + Math.sin(t * w.speed + tStep * Math.PI * 2 + w.offset) * amp + Math.sin(tStep * Math.PI * 4 + i) * 0.6;
          if (x === 0) ctx.moveTo(xx, yy);
          else ctx.lineTo(xx, yy);
        }

        const alpha = 0.14 + (i % 3) * 0.035;
        ctx.strokeStyle = `rgba(255, 185, 108, ${alpha})`;
        ctx.lineWidth = 1 + (i % 2) * 0.45;
        ctx.stroke();
      }

      const boil = 0.5 + Math.sin(t * 1.1) * 0.5;
      state.bubbles.forEach((b) => {
        const x = centerX - bowlRadiusX * 0.7 + b.x * bowlRadiusX * 1.4;
        const rise = ((t * (state.reducedMotion ? 0.06 : 0.22) * (b.speed + 0.3) + b.x * 20) % 1);
        const y = bowlY + 6 + rise * bowlRadiusY * 0.9 - bowlRadiusY * 0.55;
        const wob = Math.sin(b.wobble + t * 0.5 + b.y * 14) * (state.reducedMotion ? 0.25 : 2);
        const r = b.size * (1.1 + boil * 0.5);

        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 232, 198, ${0.2 + boil * 0.25})`;
        ctx.arc(x + wob, y, r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawLeaf() {
      const px = centerX - bowlRadiusX * 0.62;
      const py = bowlY + bowlRadiusY * 0.9;
      ctx.fillStyle = '#2a6b45';
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.bezierCurveTo(px - 2, py - 11, px + 4, py - 20, px + 8, py - 8);
      ctx.bezierCurveTo(px + 16, py - 6, px + 12, py + 12, px + 1, py + 10);
      ctx.fill();
    }

    function drawChopHandle(){
      const x = centerX - bowlRadiusX * 0.9;
      const y = centerY * 0.74;
      const bend = state.reducedMotion ? 0 : (state.mouse.x - centerX) * 0.002;
      ctx.strokeStyle = 'rgba(210, 210, 210, 0.5)';
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.moveTo(x, y + 42);
      ctx.quadraticCurveTo(x - 6, y + 4, x + 2 + bend, y - 40);
      ctx.stroke();
    }

    function drawPlateGlow() {
      const g = ctx.createRadialGradient(centerX, bowlY, bowlRadiusX * 0.2, centerX, bowlY, bowlRadiusX * 1.05);
      g.addColorStop(0, 'rgba(255, 150, 75, 0.12)');
      g.addColorStop(0.4, 'rgba(255, 130, 57, 0.06)');
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(centerX, bowlY, bowlRadiusX * 1.03, bowlRadiusY * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      state.time += 0.016;
      const t = state.time;
      const dt = state.reducedMotion ? 0.15 : 1;

      const dx = state.mouse.x - centerX;
      const dy = state.mouse.y - bowlY;
      state.mouseDist = Math.hypot(dx, dy) / Math.sqrt(width * height);
      drawBackground();
      drawTable();
      drawPlateGlow();
      drawBowlPulsePulse(t * 2.2);
      drawBrothSurface(t);
      drawBowl();
      drawToppings(t);
      drawNoodles(t * dt);
      drawSteam(dt);
      drawLeaf();
      drawChopHandle();
      drawPlateGlow();
      if (!state.reducedMotion) {
        requestAnimationFrame(draw);
      }
    }

    function animateReducedMotion() {
      draw();
      if (state.reducedMotion) {
        setInterval(() => {
          if (state.mouse.active) {
            draw();
          }
        }, 350);
      }
    }

    window.addEventListener('mousemove', (e) => {
      state.mouse.x = e.clientX;
      state.mouse.y = e.clientY;
      state.mouse.active = true;
    });

    window.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      if (!t) return;
      state.mouse.x = t.clientX;
      state.mouse.y = t.clientY;
      state.mouse.active = true;
    }, { passive: true });

    window.addEventListener('mouseleave', () => {
      state.mouse.active = false;
      state.mouse.x = centerX;
      state.mouse.y = centerY - bowlRadiusY * 2.2;
    });

    const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    motionQuery.addEventListener('change', (e) => {
      state.reducedMotion = e.matches;
      if (!state.reducedMotion) {
        requestAnimationFrame(draw);
      } else {
        animateReducedMotion();
      }
    });

    window.addEventListener('resize', resize);
    resize();

    if (state.reducedMotion) {
      animateReducedMotion();
    } else {
      requestAnimationFrame(draw);
    }
  </script>
</body>
</html>
