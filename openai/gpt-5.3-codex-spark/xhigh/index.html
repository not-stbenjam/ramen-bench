<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vegan Ramen Bowl</title>
  <style>
    :root {
      --mx: 0;
      --my: 0;
      --steam-lean: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 18%, #252b44 0%, #1a1f31 38%, #0d1018 100%);
      overflow: hidden;
      touch-action: none;
    }

    .scene {
      position: relative;
      width: min(94vmin, 980px);
      max-width: 100vw;
      aspect-ratio: 1 / 1.2;
      perspective: 1300px;
    }

    .atmosphere {
      position: absolute;
      left: 50%;
      top: 53%;
      width: min(78vmin, 640px);
      aspect-ratio: 1 / 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 135, 65, 0.22) 0%, rgba(255, 135, 65, 0.03) 55%, rgba(0, 0, 0, 0) 74%);
      filter: blur(2.1vmin);
      animation: atmosphere 7s ease-in-out infinite;
      pointer-events: none;
    }

    .plate-shadow {
      position: absolute;
      left: 50%;
      bottom: 8%;
      width: min(56vmin, 332px);
      aspect-ratio: 2.7 / 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.56) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(0.45vmin);
      animation: shadowPulse 3.8s ease-in-out infinite;
      pointer-events: none;
    }

    .steam-layer {
      position: absolute;
      left: 50%;
      bottom: 36%;
      width: 45%;
      height: 48%;
      transform: translateX(calc(-50% + calc(var(--steam-lean) * 0.8vmin)));
      pointer-events: none;
    }

    .steam {
      position: absolute;
      bottom: 0;
      left: var(--left);
      width: calc(0.45vmin * var(--size));
      height: calc(3.4vmin * var(--size));
      border-radius: 999px;
      background: linear-gradient(to top, rgba(255, 255, 255, 0), rgba(255, 248, 236, 0.72) 40%, rgba(255, 255, 255, 0.03));
      filter: blur(0.18vmin);
      opacity: 0;
      transform-origin: center center;
      animation: steamRise var(--duration) cubic-bezier(0.2, 0.65, 0.24, 1) infinite;
      animation-delay: var(--delay);
      mix-blend-mode: screen;
    }

    .s1 { --left: 12%; --start: -0.9vmin; --drift: -2.8vmin; --size: 1.05; --duration: 6.5s; --delay: -2.1s; }
    .s2 { --left: 26%; --start: -0.2vmin; --drift: -1vmin; --size: 0.95; --duration: 7s; --delay: -5.2s; }
    .s3 { --left: 40%; --start: 0.5vmin; --drift: 1.6vmin; --size: 1.15; --duration: 6.2s; --delay: -4.4s; }
    .s4 { --left: 55%; --start: 0.2vmin; --drift: 2.6vmin; --size: 1; --duration: 7.4s; --delay: -1.8s; }
    .s5 { --left: 67%; --start: -0.6vmin; --drift: -1.1vmin; --size: 0.85; --duration: 6.8s; --delay: -5.8s; }
    .s6 { --left: 79%; --start: 1.0vmin; --drift: 2.9vmin; --size: 0.9; --duration: 7.1s; --delay: -3.2s; }

    .bowl-wrap {
      position: absolute;
      left: 50%;
      bottom: 10%;
      width: min(68vmin, 530px);
      aspect-ratio: 2.95 / 1.22;
      transform: translateX(-50%);
      transform-style: preserve-3d;
    }

    .bowl-shell {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50% 50% 40% 40% / 80% 80% 20% 20%;
      background: linear-gradient(160deg, rgba(255, 241, 226, 0.2) 0%, rgba(224, 174, 123, 0.74) 37%, rgba(120, 80, 53, 0.98) 100%);
      border: clamp(0.24rem, 0.78vmin, 0.62rem) solid rgba(255, 236, 209, 0.5);
      box-shadow: inset 0 0.4vmin 1.1vmin rgba(255, 255, 255, 0.2), inset 0 -1.4vmin 2.1vmin rgba(0, 0, 0, 0.45), 0 1.25vmin 2.3vmin rgba(0, 0, 0, 0.5);
      transform: rotateX(60deg) rotateY(calc(var(--mx) * 10deg)) rotateX(calc(var(--my) * -4deg));
      transform-origin: center 62%;
      transition: transform 120ms linear;
      overflow: hidden;
    }

    .bowl-shell::before {
      content: "";
      position: absolute;
      inset: 1.5% 1.35% 34% 1.35%;
      border-radius: 50%;
      border: clamp(0.14rem, 0.52vmin, 0.45rem) solid rgba(255, 244, 222, 0.62);
      background: radial-gradient(circle at 50% 30%, rgba(255, 248, 228, 0.4), rgba(194, 148, 106, 0.06));
      box-shadow: inset 0 0.45vmin 0.9vmin rgba(255, 255, 255, 0.16), inset 0 -0.85vmin 1.15vmin rgba(18, 8, 2, 0.38);
      pointer-events: none;
    }

    .bowl-rim {
      position: absolute;
      inset: -3.8% -4.4% 55% -4.4%;
      border-radius: 50%;
      border: clamp(0.13rem, 0.56vmin, 0.4rem) solid rgba(255, 236, 212, 0.76);
      background: linear-gradient(180deg, rgba(255, 246, 227, 0.84) 0%, rgba(221, 169, 123, 0.24) 68%, rgba(129, 86, 55, 0.06) 100%);
      filter: blur(0.08vmin);
      pointer-events: none;
    }

    .bowl-content {
      position: absolute;
      left: 3%;
      right: 3%;
      top: 13%;
      bottom: 22%;
      border-radius: 50% / 42%;
      overflow: hidden;
      z-index: 2;
      animation: brothBreathe 5.2s ease-in-out infinite;
      filter: saturate(1.05);
    }

    .bowl-content::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(to right, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0) 45%, rgba(0, 0, 0, 0) 55%, rgba(255, 255, 255, 0.07) 100%);
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.55;
    }

    .bowl-art {
      position: absolute;
      left: -1%;
      top: -24%;
      width: 102%;
      height: 114%;
    }

    .broth {
      fill: url(#brothFill);
    }

    .noodle {
      fill: none;
      stroke: #f3dfbf;
      stroke-width: 5.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.74;
      filter: drop-shadow(0 0 0.25vmin rgba(255, 255, 255, 0.28));
      transform-box: fill-box;
      transform-origin: center;
      animation: noodleWave 4.8s ease-in-out infinite;
    }

    .n1 { animation-delay: -1.1s; }
    .n2 { animation-delay: -3.6s; animation-duration: 5.5s; stroke: #f5e0c0; }
    .n3 { animation-delay: -2.2s; animation-duration: 5.9s; stroke: #f1d8bc; }
    .n4 { animation-delay: -4.4s; animation-duration: 4.6s; stroke: #efd2af; }

    .tofu {
      fill: #f5ecde;
      stroke: #decaae;
      stroke-width: 0.8;
      opacity: 0.98;
      transform-box: fill-box;
      transform-origin: center;
      animation: ingredientFloat 4.6s ease-in-out infinite;
      filter: drop-shadow(0 0 0.15vmin rgba(255, 255, 255, 0.28));
    }

    .tofu:nth-of-type(3) { animation-delay: -1.3s; }
    .tofu:nth-of-type(4) { animation-delay: -2.4s; }
    .tofu:nth-of-type(5) { animation-delay: -3.2s; }

    .scallion {
      fill: none;
      stroke: #8ad2a8;
      stroke-width: 4.2;
      stroke-linecap: round;
      opacity: 0.82;
    }

    .green {
      fill: #4f9f63;
      opacity: 0.85;
    }

    .egg {
      fill: #f7f0e5;
      stroke: #eed7be;
      stroke-width: 1;
      transform-box: fill-box;
      transform-origin: center;
      animation: ingredientFloat 5.1s ease-in-out infinite;
      animation-delay: -2.7s;
    }

    .yolk {
      fill: #d99d31;
      opacity: 0.92;
      transform-box: fill-box;
      transform-origin: center;
      animation: yolkGlow 2.2s ease-in-out infinite;
    }

    .sesame {
      fill: #f4ebdc;
      opacity: 0.95;
    }

    .bubble {
      fill: rgba(255, 255, 255, 0.28);
    }

    @keyframes steamRise {
      0% {
        transform: translate3d(var(--start), 18%, 0) scale(0.25);
        opacity: 0;
      }
      12% {
        opacity: 0.5;
      }
      100% {
        transform: translate3d(calc(var(--drift) + calc(var(--steam-lean) * 1.2vmin)), -135%, 0) scale(1.13);
        opacity: 0;
      }
    }

    @keyframes atmosphere {
      0%,
      100% {
        transform: translateX(-50%) scale(0.97);
        opacity: 0.35;
      }
      50% {
        transform: translateX(-50%) scale(1.04);
        opacity: 0.65;
      }
    }

    @keyframes shadowPulse {
      0%, 100% {
        transform: translateX(-50%) scale(0.98);
        opacity: 0.74;
      }
      50% {
        transform: translateX(-50%) scale(1.05);
        opacity: 0.46;
      }
    }

    @keyframes brothBreathe {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-0.4%);
      }
    }

    @keyframes noodleWave {
      0%, 100% {
        transform: translateY(0) scaleX(1) rotate(0deg);
      }
      50% {
        transform: translateY(-0.7%) scaleX(1.02) rotate(-1deg);
      }
    }

    @keyframes ingredientFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-1.2%);
      }
    }

    @keyframes yolkGlow {
      0%, 100% {
        transform: scale(1);
        opacity: 0.82;
      }
      50% {
        transform: scale(1.06);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }

      .steam-layer,
      .atmosphere,
      .plate-shadow,
      .bowl-content,
      .noodle,
      .tofu,
      .egg,
      .yolk {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" id="ramenScene" aria-hidden="true">
    <div class="atmosphere"></div>
    <div class="plate-shadow"></div>
    <div class="steam-layer">
      <span class="steam s1"></span>
      <span class="steam s2"></span>
      <span class="steam s3"></span>
      <span class="steam s4"></span>
      <span class="steam s5"></span>
      <span class="steam s6"></span>
    </div>
    <div class="bowl-wrap">
      <div class="bowl-shell">
        <div class="bowl-rim"></div>
        <div class="bowl-content">
          <svg class="bowl-art" viewBox="0 0 360 170" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="brothFill" x1="50%" y1="5%" x2="50%" y2="95%">
                <stop offset="0%" stop-color="#f8d1a0" />
                <stop offset="42%" stop-color="#d89a57" />
                <stop offset="100%" stop-color="#9e5a2d" />
              </linearGradient>
            </defs>
            <path class="broth" d="M8 128 C32 101 73 86 116 94 C163 101 202 120 245 112 C286 105 327 118 352 130 L352 168 C241 188 115 188 8 168 Z" />
            <path class="noodle n1" d="M-2 128 C36 108 80 134 122 118 C160 102 197 130 239 114 C278 100 317 122 362 104" />
            <path class="noodle n2" d="M-6 103 C34 90 72 117 118 103 C161 90 201 112 247 101 C290 90 331 116 366 100" />
            <path class="noodle n3" d="M-8 149 C28 134 68 156 113 141 C161 129 205 146 249 133 C289 124 328 141 366 126" />
            <path class="noodle n4" d="M-2 110 C30 94 66 119 107 103 C149 86 197 107 238 97 C277 89 318 117 362 95" />
            <ellipse class="tofu" cx="112" cy="123" rx="29" ry="14" transform="rotate(-18 112 123)" />
            <ellipse class="tofu" cx="188" cy="133" rx="30" ry="14" transform="rotate(12 188 133)" />
            <ellipse class="tofu" cx="250" cy="118" rx="26" ry="13" transform="rotate(-9 250 118)" />
            <path class="scallion" d="M56 122 Q80 108 96 102 Q114 97 130 92" />
            <path class="scallion" d="M160 98 Q180 86 202 82 Q224 80 248 88" />
            <path class="scallion" d="M262 136 Q286 121 307 118 Q326 116 348 112" />
            <ellipse class="green" cx="75" cy="86" rx="8" ry="4" transform="rotate(-35 75 86)" />
            <ellipse class="green" cx="92" cy="94" rx="9" ry="5" transform="rotate(-30 92 94)" />
            <ellipse class="green" cx="205" cy="82" rx="7" ry="3.5" transform="rotate(28 205 82)" />
            <ellipse class="green" cx="223" cy="88" rx="7" ry="3.5" transform="rotate(18 223 88)" />
            <ellipse class="green" cx="293" cy="94" rx="8" ry="4" transform="rotate(-14 293 94)" />
            <ellipse class="egg" cx="235" cy="130" rx="27" ry="14" transform="rotate(-14 235 130)" />
            <circle class="yolk" cx="235" cy="130" r="10.2" />
            <circle class="sesame" cx="86" cy="114" r="1.5" />
            <circle class="sesame" cx="90" cy="108" r="1.4" />
            <circle class="sesame" cx="174" cy="122" r="1.45" />
            <circle class="sesame" cx="208" cy="114" r="1.4" />
            <circle class="sesame" cx="215" cy="150" r="1.3" />
            <circle class="sesame" cx="262" cy="109" r="1.3" />
            <circle class="sesame" cx="274" cy="118" r="1.25" />
            <circle class="bubble" cx="106" cy="134" r="1.6" />
            <circle class="bubble" cx="133" cy="144" r="1.2" />
            <circle class="bubble" cx="186" cy="138" r="1.4" />
          </svg>
        </div>
      </div>
    </div>
  </main>
  <script>
    const scene = document.getElementById('ramenScene');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduceMotion) {
      let tx = 0;
      let ty = 0;
      let x = 0;
      let y = 0;

      function moveBowl(e) {
        const r = scene.getBoundingClientRect();
        tx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (r.width / 2)));
        ty = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / (r.height / 2)));
      }

      window.addEventListener('pointermove', moveBowl, { passive: true });
      scene.addEventListener('pointerleave', () => {
        tx = 0;
        ty = 0;
      });

      function animate() {
        x += (tx - x) * 0.08;
        y += (ty - y) * 0.08;
        document.documentElement.style.setProperty('--mx', x.toFixed(4));
        document.documentElement.style.setProperty('--my', y.toFixed(4));
        document.documentElement.style.setProperty('--steam-lean', (x * 1.2).toFixed(4));
        requestAnimationFrame(animate);
      }
      animate();
    }
  </script>
</body>
</html>
