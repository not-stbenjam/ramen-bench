<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050806">
  <title>Steaming Vegan Ramen</title>
  <style>
    :root {
      color-scheme: dark;
      --scene-x: 0px;
      --scene-y: 0px;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --steam-x: 0px;
      --steam-y: 0px;
      --steam-skew: 0deg;
      --glow-x: 50%;
      --glow-y: 56%;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030504;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      font-family: system-ui, sans-serif;
    }

    .scene {
      position: relative;
      isolation: isolate;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at var(--glow-x) var(--glow-y), rgba(177, 73, 24, .15) 0%, rgba(98, 43, 20, .07) 23%, transparent 48%),
        radial-gradient(ellipse at 50% 31%, #17201a 0%, #0a0f0c 38%, #050806 66%, #020302 100%);
    }

    .scene::before {
      position: absolute;
      z-index: -3;
      top: -28%;
      left: 50%;
      width: min(78vw, 920px);
      height: 112%;
      content: "";
      transform: translateX(-50%) perspective(700px) rotateX(-12deg);
      transform-origin: 50% 0;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(180, 201, 168, .07), rgba(143, 94, 49, .025) 42%, transparent 78%);
      filter: blur(28px);
      opacity: .8;
    }

    .scene::after {
      position: absolute;
      z-index: 10;
      inset: 0;
      pointer-events: none;
      content: "";
      background:
        radial-gradient(ellipse at 50% 53%, transparent 27%, rgba(0, 0, 0, .15) 62%, rgba(0, 0, 0, .72) 112%),
        linear-gradient(180deg, rgba(0, 0, 0, .2), transparent 35%, rgba(0, 0, 0, .24));
    }

    .ambient-glow {
      position: absolute;
      z-index: -2;
      top: calc(var(--glow-y) - 28%);
      left: var(--glow-x);
      width: clamp(320px, 42vw, 680px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(231, 116, 46, .12), rgba(170, 62, 20, .035) 45%, transparent 70%);
      filter: blur(22px);
      animation: ambient-breathe 7s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .table {
      position: absolute;
      z-index: -1;
      right: -12%;
      bottom: -20%;
      left: -12%;
      height: 58%;
      transform: perspective(760px) rotateX(57deg);
      transform-origin: 50% 0;
      border-top: 1px solid rgba(155, 130, 99, .06);
      background:
        radial-gradient(ellipse at 50% 9%, rgba(106, 48, 22, .1), transparent 44%),
        linear-gradient(180deg, rgba(19, 23, 19, .9), #070907 52%, #030403 100%);
      box-shadow: inset 0 24px 70px rgba(0, 0, 0, .45);
    }

    .art {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: clamp(520px, min(112vw, 133vh), 1240px);
      height: auto;
      overflow: visible;
      transform:
        translate(-50%, -50%)
        translate3d(var(--scene-x), var(--scene-y), 0)
        perspective(1100px)
        rotateX(var(--tilt-x))
        rotateY(var(--tilt-y));
      transform-origin: 50% 67%;
      will-change: transform;
    }

    .floor-shadow {
      animation: shadow-breathe 5.5s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }

    .warm-reflection {
      animation: reflection-breathe 6.5s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }

    .steam {
      transform: translate(var(--steam-x), var(--steam-y)) skewX(var(--steam-skew));
      transform-origin: 50% 100%;
      transition: transform 120ms linear;
    }

    .wisp {
      opacity: 0;
      animation: steam-rise 5.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }

    .wisp:nth-child(2) {
      --drift: -15px;
      animation-duration: 6.4s;
      animation-delay: -2.7s;
    }

    .wisp:nth-child(3) {
      --drift: 13px;
      animation-duration: 5.1s;
      animation-delay: -4.1s;
    }

    .wisp:nth-child(4) {
      --drift: -8px;
      animation-duration: 6.8s;
      animation-delay: -1.3s;
    }

    .wisp:nth-child(5) {
      --drift: 10px;
      animation-duration: 5.9s;
      animation-delay: -3.5s;
    }

    .steam-blur {
      opacity: .22;
    }

    .steam-line {
      opacity: .48;
    }

    .bowl-assembly {
      animation: bowl-breathe 5.8s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center bottom;
    }

    .liquid-shimmer {
      animation: liquid-shift 5.2s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ingredient-float {
      animation: ingredient-float 4.3s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }

    .float-two {
      animation-duration: 5.1s;
      animation-delay: -2.4s;
    }

    .float-three {
      animation-duration: 3.9s;
      animation-delay: -1.2s;
    }

    .rim-glint {
      stroke-dasharray: 110 850;
      stroke-dashoffset: 650;
      animation: glint 7s ease-in-out infinite;
    }

    .oil-drop {
      animation: oil-pulse 4s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }

    .oil-drop:nth-child(even) {
      animation-delay: -2s;
      animation-duration: 5s;
    }

    @keyframes ambient-breathe {
      from { opacity: .6; transform: translate(-50%, -50%) scale(.94); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
    }

    @keyframes steam-rise {
      0% { opacity: 0; transform: translate3d(0, 25px, 0) scale(.9, .94); }
      18% { opacity: .72; }
      62% { opacity: .42; }
      100% { opacity: 0; transform: translate3d(var(--drift, 12px), -43px, 0) scale(1.08, 1.16); }
    }

    @keyframes bowl-breathe {
      from { transform: translateY(1px); }
      to { transform: translateY(-2px); }
    }

    @keyframes shadow-breathe {
      from { opacity: .8; transform: scaleX(.98); }
      to { opacity: .62; transform: scaleX(1.025); }
    }

    @keyframes reflection-breathe {
      from { opacity: .3; transform: scale(.96); }
      to { opacity: .5; transform: scale(1.04); }
    }

    @keyframes liquid-shift {
      from { transform: translateX(-5px) scaleX(.99); opacity: .66; }
      to { transform: translateX(7px) scaleX(1.015); opacity: .9; }
    }

    @keyframes ingredient-float {
      from { transform: translateY(-1.5px) rotate(-.35deg); }
      to { transform: translateY(2px) rotate(.45deg); }
    }

    @keyframes glint {
      0%, 28% { stroke-dashoffset: 660; opacity: 0; }
      42% { opacity: .75; }
      64% { stroke-dashoffset: -120; opacity: .22; }
      100% { stroke-dashoffset: -120; opacity: 0; }
    }

    @keyframes oil-pulse {
      from { opacity: .46; transform: scale(.94); }
      to { opacity: .82; transform: scale(1.06); }
    }

    @media (max-aspect-ratio: 3 / 4) {
      .art {
        top: 50%;
        width: min(162vw, 90vh, 1240px);
      }

      .scene::before {
        width: 120vw;
      }

      .table {
        bottom: -11%;
        height: 48%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient-glow,
      .floor-shadow,
      .warm-reflection,
      .wisp,
      .bowl-assembly,
      .liquid-shimmer,
      .ingredient-float,
      .rim-glint,
      .oil-drop {
        animation: none !important;
      }

      .wisp {
        opacity: .38;
      }

      .art,
      .steam,
      .ambient-glow {
        transition: none !important;
      }
    }
  </style>
</head>

  <script>
    (() => {
      const root = document.documentElement;
      const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;
      let frame = 0;

      const render = () => {
        currentX += (targetX - currentX) * 0.085;
        currentY += (targetY - currentY) * 0.085;

        root.style.setProperty('--scene-x', `${(currentX * 9).toFixed(2)}px`);
        root.style.setProperty('--scene-y', `${(currentY * 6).toFixed(2)}px`);
        root.style.setProperty('--tilt-x', `${(currentY * -1.45).toFixed(2)}deg`);
        root.style.setProperty('--tilt-y', `${(currentX * 2.4).toFixed(2)}deg`);
        root.style.setProperty('--steam-x', `${(currentX * -11).toFixed(2)}px`);
        root.style.setProperty('--steam-y', `${(currentY * -3).toFixed(2)}px`);
        root.style.setProperty('--steam-skew', `${(currentX * -1.5).toFixed(2)}deg`);
        root.style.setProperty('--glow-x', `${(50 + currentX * 5).toFixed(2)}%`);
        root.style.setProperty('--glow-y', `${(56 + currentY * 2.5).toFixed(2)}%`);

        if (Math.abs(targetX - currentX) > 0.001 || Math.abs(targetY - currentY) > 0.001) {
          frame = requestAnimationFrame(render);
        } else {
          frame = 0;
        }
      };

      const requestRender = () => {
        if (!frame) frame = requestAnimationFrame(render);
      };

      const onPointerMove = (event) => {
        if (motionQuery.matches) return;
        targetX = Math.max(-1, Math.min(1, (event.clientX / window.innerWidth - .5) * 2));
        targetY = Math.max(-1, Math.min(1, (event.clientY / window.innerHeight - .5) * 2));
        requestRender();
      };

      const settle = () => {
        targetX = 0;
        targetY = 0;
        requestRender();
      };

      const honorMotionPreference = () => {
        if (motionQuery.matches) {
          targetX = 0;
          targetY = 0;
          currentX = 0;
          currentY = 0;
          if (frame) cancelAnimationFrame(frame);
          frame = 0;
          root.style.removeProperty('--scene-x');
          root.style.removeProperty('--scene-y');
          root.style.removeProperty('--tilt-x');
          root.style.removeProperty('--tilt-y');
          root.style.removeProperty('--steam-x');
          root.style.removeProperty('--steam-y');
          root.style.removeProperty('--steam-skew');
          root.style.removeProperty('--glow-x');
          root.style.removeProperty('--glow-y');
        }
      };

      window.addEventListener('pointermove', onPointerMove, { passive: true });
      document.addEventListener('pointerleave', settle);
      window.addEventListener('blur', settle);
      if (motionQuery.addEventListener) {
        motionQuery.addEventListener('change', honorMotionPreference);
      } else {
        motionQuery.addListener(honorMotionPreference);
      }
      honorMotionPreference();
    })();
  </script>
