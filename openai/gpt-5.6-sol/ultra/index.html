<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Vegan ramen</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050606;
    }

    body {
      min-height: 100svh;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="scene" role="img" aria-label="A steaming bowl of vegan ramen in warm, atmospheric light"></canvas>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      if (!ctx) return;

      const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      const TAU = Math.PI * 2;
      const FROZEN_TIME = 18.75;
      let reducedMotion = motionQuery.matches;
      let width = 0;
      let height = 0;
      let dpr = 1;
      let bowlWidth = 0;
      let sceneScale = 1;
      let centerX = 0;
      let centerY = 0;
      let elapsed = 0;
      let previousTime = 0;
      let animationFrame = 0;

      const pointer = {
        x: 0,
        y: 0,
        targetX: 0,
        targetY: 0,
        energy: 0,
        targetEnergy: 0
      };

      function mulberry32(seed) {
        return function random() {
          let t = seed += 0x6d2b79f5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      const random = mulberry32(735912);

      const steam = Array.from({ length: 11 }, (_, index) => ({
        x: -210 + random() * 420,
        phase: random(),
        speed: 0.035 + random() * 0.025,
        height: 145 + random() * 105,
        sway: 22 + random() * 38,
        lean: -18 + random() * 36,
        width: 1.5 + random() * 2.2,
        opacity: 0.18 + random() * 0.22,
        curl: random() * TAU,
        warm: index % 3 === 0
      }));

      const motes = Array.from({ length: 22 }, () => ({
        x: -0.55 + random() * 1.1,
        y: -0.78 + random() * 1.15,
        size: 0.45 + random() * 1.4,
        phase: random(),
        speed: 0.018 + random() * 0.026,
        opacity: 0.08 + random() * 0.2
      }));

      const noodleCurves = Array.from({ length: 18 }, (_, index) => {
        const startX = -132 + random() * 235;
        const startY = -35 + random() * 57;
        const endX = -122 + random() * 245;
        const endY = -29 + random() * 62;
        return {
          startX,
          startY,
          c1x: startX + 28 + random() * 53,
          c1y: startY - 29 + random() * 64,
          c2x: endX - 35 - random() * 48,
          c2y: endY - 29 + random() * 63,
          endX,
          endY,
          width: 3.4 + random() * 2.4,
          phase: random() * TAU,
          tone: index % 4
        };
      });

      const scallions = [
        [-88, -53, 13, 0.20], [-51, -12, 11, -0.18], [-17, -56, 10, 0.38],
        [17, -24, 12, -0.12], [53, -47, 9, 0.26], [124, -36, 11, -0.28],
        [-109, 8, 9, -0.36], [-4, 13, 8, 0.30], [66, 14, 10, 0.10],
        [158, -10, 8, 0.45], [-151, -29, 8, -0.12]
      ];

      const corn = [
        [-80, -37, 0.18], [-63, -46, -0.2], [-45, -40, 0.3], [-27, -48, -0.1],
        [-91, -21, -0.35], [-70, -25, 0.1], [-49, -21, -0.28], [-28, -27, 0.22],
        [-12, -36, -0.12], [139, -3, 0.25], [154, 3, -0.18], [167, -7, 0.1]
      ];

      const grainCanvas = document.createElement('canvas');
      grainCanvas.width = 144;
      grainCanvas.height = 144;
      const grainContext = grainCanvas.getContext('2d');
      const grainImage = grainContext.createImageData(grainCanvas.width, grainCanvas.height);
      for (let i = 0; i < grainImage.data.length; i += 4) {
        const value = 105 + Math.floor(random() * 150);
        grainImage.data[i] = value;
        grainImage.data[i + 1] = value;
        grainImage.data[i + 2] = value;
        grainImage.data[i + 3] = Math.floor(random() * 34);
      }
      grainContext.putImageData(grainImage, 0, 0);
      const grainPattern = ctx.createPattern(grainCanvas, 'repeat');

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(current, target, amount) {
        return current + (target - current) * amount;
      }

      function pathEllipse(x, y, radiusX, radiusY) {
        ctx.beginPath();
        ctx.ellipse(x, y, radiusX, radiusY, 0, 0, TAU);
      }

      function radialEllipse(x, y, radiusX, radiusY, stops) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(1, radiusY / radiusX);
        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, radiusX);
        stops.forEach(([position, color]) => gradient.addColorStop(position, color));
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, radiusX, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function roundedPolygon(points, fillStyle) {
        ctx.beginPath();
        ctx.moveTo(points[0][0], points[0][1]);
        for (let i = 1; i < points.length; i += 1) {
          ctx.lineTo(points[i][0], points[i][1]);
        }
        ctx.closePath();
        ctx.fillStyle = fillStyle;
        ctx.fill();
      }

      function bowlBodyPath() {
        ctx.beginPath();
        ctx.moveTo(-392, -28);
        ctx.bezierCurveTo(-378, 78, -323, 207, -190, 259);
        ctx.bezierCurveTo(-102, 294, 102, 294, 190, 259);
        ctx.bezierCurveTo(323, 207, 378, 78, 392, -28);
        ctx.bezierCurveTo(240, 38, -240, 38, -392, -28);
        ctx.closePath();
      }

      function drawBackground(time) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#050606';
        ctx.fillRect(0, 0, width, height);

        const breath = reducedMotion ? 1 : 0.985 + Math.sin(time * 0.24) * 0.015;
        const glowX = centerX + pointer.x * pointer.energy * bowlWidth * 0.07;
        const glowY = centerY - bowlWidth * 0.10 + pointer.y * pointer.energy * bowlWidth * 0.025;
        const glowRadius = Math.max(bowlWidth * 0.85, height * 0.48);

        let gradient = ctx.createRadialGradient(glowX, glowY, 0, glowX, glowY, glowRadius);
        gradient.addColorStop(0, `rgba(124, 46, 17, ${0.19 * breath})`);
        gradient.addColorStop(0.28, `rgba(81, 26, 15, ${0.13 * breath})`);
        gradient.addColorStop(0.64, 'rgba(32, 12, 12, 0.07)');
        gradient.addColorStop(1, 'rgba(3, 4, 5, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        gradient = ctx.createRadialGradient(
          centerX + pointer.x * pointer.energy * bowlWidth * 0.24,
          centerY - bowlWidth * 0.05 + pointer.y * pointer.energy * bowlWidth * 0.10,
          0,
          centerX,
          centerY,
          bowlWidth * 0.72
        );
        gradient.addColorStop(0, `rgba(238, 113, 34, ${0.025 + pointer.energy * 0.02})`);
        gradient.addColorStop(0.45, 'rgba(103, 37, 18, 0.015)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        const tableTop = centerY + bowlWidth * 0.16;
        gradient = ctx.createLinearGradient(0, tableTop, 0, height);
        gradient.addColorStop(0, 'rgba(19, 12, 10, 0)');
        gradient.addColorStop(0.16, 'rgba(17, 10, 8, 0.42)');
        gradient.addColorStop(1, 'rgba(3, 4, 4, 0.92)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, tableTop, width, Math.max(0, height - tableTop));

        drawMotes(time);

        gradient = ctx.createRadialGradient(
          width * 0.5,
          height * 0.51,
          Math.min(width, height) * 0.16,
          width * 0.5,
          height * 0.51,
          Math.max(width, height) * 0.72
        );
        gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
        gradient.addColorStop(0.6, 'rgba(0, 0, 0, 0.12)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0.78)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        if (grainPattern) {
          ctx.save();
          ctx.globalAlpha = 0.055;
          ctx.globalCompositeOperation = 'soft-light';
          ctx.fillStyle = grainPattern;
          ctx.fillRect(0, 0, width, height);
          ctx.restore();
        }
      }

      function drawMotes(time) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        motes.forEach((mote) => {
          const life = (mote.phase + time * mote.speed) % 1;
          const drift = reducedMotion ? 0 : Math.sin(time * 0.31 + mote.phase * TAU) * 8;
          const x = centerX + mote.x * bowlWidth + drift + pointer.x * pointer.energy * 5;
          const y = centerY + (mote.y - (reducedMotion ? 0 : life * 0.18)) * bowlWidth;
          const fade = reducedMotion ? 0.55 : Math.sin(Math.PI * life);
          const alpha = mote.opacity * Math.max(0, fade) * 0.45;
          if (alpha < 0.005) return;
          const radius = mote.size * Math.max(0.65, sceneScale);
          const glow = ctx.createRadialGradient(x, y, 0, x, y, radius * 4);
          glow.addColorStop(0, `rgba(244, 132, 64, ${alpha})`);
          glow.addColorStop(0.2, `rgba(211, 83, 34, ${alpha * 0.45})`);
          glow.addColorStop(1, 'rgba(145, 45, 18, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(x, y, radius * 4, 0, TAU);
          ctx.fill();
        });
        ctx.restore();
      }

      function drawShadow() {
        radialEllipse(0, 274, 468, 62, [
          [0, 'rgba(0, 0, 0, 0.82)'],
          [0.48, 'rgba(0, 0, 0, 0.57)'],
          [0.78, 'rgba(23, 9, 7, 0.18)'],
          [1, 'rgba(0, 0, 0, 0)']
        ]);

        radialEllipse(-25, 253, 335, 37, [
          [0, 'rgba(107, 31, 14, 0.12)'],
          [0.55, 'rgba(55, 15, 10, 0.08)'],
          [1, 'rgba(0, 0, 0, 0)']
        ]);
      }

      function drawBowlBody() {
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.88)';
        ctx.shadowBlur = 34;
        ctx.shadowOffsetY = 19;
        const bodyGradient = ctx.createLinearGradient(-350, -10, 285, 270);
        bodyGradient.addColorStop(0, '#361619');
        bodyGradient.addColorStop(0.18, '#170e11');
        bodyGradient.addColorStop(0.54, '#090b0d');
        bodyGradient.addColorStop(0.82, '#100b0d');
        bodyGradient.addColorStop(1, '#280f14');
        bowlBodyPath();
        ctx.fillStyle = bodyGradient;
        ctx.fill();
        ctx.restore();

        ctx.save();
        bowlBodyPath();
        ctx.clip();
        const highlightX = -235 + pointer.x * pointer.energy * 42;
        const bodyLight = ctx.createRadialGradient(highlightX, 28, 0, highlightX, 28, 345);
        bodyLight.addColorStop(0, 'rgba(175, 57, 38, 0.20)');
        bodyLight.addColorStop(0.34, 'rgba(113, 30, 27, 0.09)');
        bodyLight.addColorStop(0.72, 'rgba(32, 9, 15, 0.025)');
        bodyLight.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = bodyLight;
        ctx.fillRect(-410, -40, 820, 340);

        const lowerGlow = ctx.createLinearGradient(0, 112, 0, 284);
        lowerGlow.addColorStop(0, 'rgba(255, 120, 67, 0)');
        lowerGlow.addColorStop(0.68, 'rgba(86, 23, 25, 0.05)');
        lowerGlow.addColorStop(1, 'rgba(239, 74, 50, 0.10)');
        ctx.fillStyle = lowerGlow;
        ctx.fillRect(-410, 100, 820, 195);
        ctx.restore();

        ctx.save();
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-333, 54);
        ctx.bezierCurveTo(-304, 160, -246, 220, -169, 251);
        ctx.strokeStyle = 'rgba(238, 103, 72, 0.11)';
        ctx.lineWidth = 4.2;
        ctx.shadowColor = 'rgba(224, 77, 49, 0.16)';
        ctx.shadowBlur = 12;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(290, 104);
        ctx.bezierCurveTo(256, 179, 208, 226, 144, 250);
        ctx.strokeStyle = 'rgba(175, 44, 43, 0.075)';
        ctx.lineWidth = 2.2;
        ctx.stroke();
        ctx.restore();

        const footGradient = ctx.createLinearGradient(0, 250, 0, 293);
        footGradient.addColorStop(0, '#160b0e');
        footGradient.addColorStop(0.5, '#070809');
        footGradient.addColorStop(1, '#1d0b0e');
        pathEllipse(0, 273, 151, 23);
        ctx.fillStyle = footGradient;
        ctx.fill();
        ctx.strokeStyle = 'rgba(129, 36, 34, 0.16)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function drawRimAndBroth(time) {
        const outerRim = ctx.createLinearGradient(0, -138, 0, 74);
        outerRim.addColorStop(0, '#3b1718');
        outerRim.addColorStop(0.36, '#1a0c0e');
        outerRim.addColorStop(0.66, '#08090a');
        outerRim.addColorStop(1, '#2d1014');
        pathEllipse(0, -30, 397, 105);
        ctx.fillStyle = outerRim;
        ctx.fill();
        ctx.strokeStyle = 'rgba(176, 55, 42, 0.16)';
        ctx.lineWidth = 3;
        ctx.stroke();

        pathEllipse(0, -34, 367, 86);
        ctx.fillStyle = '#0c0908';
        ctx.fill();

        const lightX = -112 + pointer.x * pointer.energy * 105;
        const lightY = -64 + pointer.y * pointer.energy * 14;
        const broth = ctx.createRadialGradient(lightX, lightY, 8, -2, -31, 388);
        broth.addColorStop(0, '#bf6725');
        broth.addColorStop(0.18, '#8e421b');
        broth.addColorStop(0.46, '#572112');
        broth.addColorStop(0.76, '#30110d');
        broth.addColorStop(1, '#160a09');
        pathEllipse(0, -35, 352, 76);
        ctx.fillStyle = broth;
        ctx.fill();

        ctx.save();
        pathEllipse(0, -35, 352, 76);
        ctx.clip();

        const surfaceGlow = ctx.createLinearGradient(0, -108, 0, 42);
        surfaceGlow.addColorStop(0, 'rgba(255, 192, 91, 0.06)');
        surfaceGlow.addColorStop(0.45, 'rgba(254, 126, 38, 0.02)');
        surfaceGlow.addColorStop(1, 'rgba(66, 10, 8, 0.22)');
        ctx.fillStyle = surfaceGlow;
        ctx.fillRect(-355, -114, 710, 160);

        drawOil(time);
        drawNoodles(time);
        drawCorn(time);
        ctx.restore();
      }

      function drawOil(time) {
        const oilDrops = [
          [-240, -49, 34, 10], [-187, 5, 22, 7], [-121, -77, 17, 6],
          [196, -66, 38, 9], [242, -13, 24, 7], [69, -81, 14, 5],
          [110, 23, 30, 6], [-14, 22, 18, 5], [284, -37, 12, 4]
        ];

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        oilDrops.forEach((drop, index) => {
          const shimmer = reducedMotion ? 0 : Math.sin(time * 0.7 + index * 1.7) * 1.5;
          const gradient = ctx.createRadialGradient(drop[0] - drop[2] * 0.25, drop[1] - 2, 0, drop[0], drop[1], drop[2]);
          gradient.addColorStop(0, 'rgba(255, 143, 45, 0.18)');
          gradient.addColorStop(0.46, 'rgba(213, 52, 19, 0.20)');
          gradient.addColorStop(0.82, 'rgba(126, 17, 13, 0.08)');
          gradient.addColorStop(1, 'rgba(89, 8, 10, 0)');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.ellipse(drop[0], drop[1] + shimmer * 0.25, drop[2], drop[3], -0.1, 0, TAU);
          ctx.fill();
        });

        const sweep = reducedMotion ? 0 : Math.sin(time * 0.42) * 8;
        ctx.beginPath();
        ctx.ellipse(-56 + sweep, -54, 215, 42, -0.02, Math.PI * 1.08, Math.PI * 1.73);
        ctx.strokeStyle = 'rgba(255, 191, 99, 0.11)';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.stroke();

        if (pointer.energy > 0.02) {
          const rippleX = pointer.x * 150;
          const rippleY = -35 + pointer.y * 16;
          for (let ring = 0; ring < 2; ring += 1) {
            ctx.beginPath();
            ctx.ellipse(rippleX, rippleY, 24 + ring * 24, 6 + ring * 5, 0, 0.12, Math.PI * 1.68);
            ctx.strokeStyle = `rgba(255, 190, 105, ${pointer.energy * (0.13 - ring * 0.045)})`;
            ctx.lineWidth = 1.4;
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function noodlePath(noodle, bob) {
        ctx.beginPath();
        ctx.moveTo(noodle.startX, noodle.startY + bob);
        ctx.bezierCurveTo(
          noodle.c1x,
          noodle.c1y + bob,
          noodle.c2x,
          noodle.c2y - bob * 0.3,
          noodle.endX,
          noodle.endY
        );
      }

      function drawNoodles(time) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        noodleCurves.forEach((noodle) => {
          const bob = reducedMotion ? 0 : Math.sin(time * 0.66 + noodle.phase) * 1.15;
          noodlePath(noodle, bob);
          ctx.strokeStyle = 'rgba(66, 27, 8, 0.55)';
          ctx.lineWidth = noodle.width + 4.4;
          ctx.stroke();

          noodlePath(noodle, bob);
          const tones = ['#e9ad4a', '#d89131', '#f0bd5a', '#c97b29'];
          ctx.strokeStyle = tones[noodle.tone];
          ctx.lineWidth = noodle.width;
          ctx.stroke();

          noodlePath(noodle, bob - 0.7);
          ctx.strokeStyle = 'rgba(255, 222, 139, 0.27)';
          ctx.lineWidth = Math.max(0.8, noodle.width * 0.22);
          ctx.stroke();
        });
        ctx.restore();
      }

      function drawCorn(time) {
        ctx.save();
        corn.forEach((kernel, index) => {
          const bob = reducedMotion ? 0 : Math.sin(time * 0.61 + index * 1.18) * 0.65;
          ctx.save();
          ctx.translate(kernel[0], kernel[1] + bob);
          ctx.rotate(kernel[2]);
          const gradient = ctx.createLinearGradient(-7, -5, 7, 6);
          gradient.addColorStop(0, '#ffe17b');
          gradient.addColorStop(0.5, '#e9a82e');
          gradient.addColorStop(1, '#9f551a');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.ellipse(0, 0, 8.5, 5.3, 0, 0, TAU);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(-2.6, -1.6, 1.6, 0, TAU);
          ctx.fillStyle = 'rgba(255, 246, 171, 0.45)';
          ctx.fill();
          ctx.restore();
        });
        ctx.restore();
      }

      function drawNori(time) {
        const bob = reducedMotion ? 0 : Math.sin(time * 0.38 + 1.4) * 1.3;
        ctx.save();
        ctx.translate(226, -126 + bob);
        ctx.rotate(-0.105);
        ctx.shadowColor = 'rgba(0, 0, 0, 0.52)';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(-61, 79);
        ctx.lineTo(-66, -80);
        ctx.quadraticCurveTo(-22, -91, 62, -74);
        ctx.lineTo(58, 80);
        ctx.quadraticCurveTo(2, 68, -61, 79);
        ctx.closePath();
        const gradient = ctx.createLinearGradient(-65, -70, 60, 75);
        gradient.addColorStop(0, '#1c3b29');
        gradient.addColorStop(0.32, '#0c2118');
        gradient.addColorStop(0.7, '#06120f');
        gradient.addColorStop(1, '#12251a');
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = 'rgba(112, 151, 93, 0.10)';
        ctx.lineWidth = 1;
        for (let x = -47; x <= 48; x += 18) {
          ctx.beginPath();
          ctx.moveTo(x, -67);
          ctx.lineTo(x + 5, 66);
          ctx.stroke();
        }
        for (let y = -50; y <= 54; y += 17) {
          ctx.beginPath();
          ctx.moveTo(-55, y);
          ctx.quadraticCurveTo(1, y + 4, 52, y - 1);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawLeaf(x, y, angle, length, leafWidth, light, dark) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        const gradient = ctx.createLinearGradient(-leafWidth * 0.2, 0, leafWidth * 0.3, -length);
        gradient.addColorStop(0, dark);
        gradient.addColorStop(0.55, light);
        gradient.addColorStop(1, '#193a24');
        ctx.beginPath();
        ctx.moveTo(0, 3);
        ctx.bezierCurveTo(-leafWidth * 0.85, -length * 0.28, -leafWidth * 0.72, -length * 0.75, 0, -length);
        ctx.bezierCurveTo(leafWidth * 0.72, -length * 0.76, leafWidth * 0.78, -length * 0.28, 0, 3);
        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(0, -2);
        ctx.quadraticCurveTo(4, -length * 0.5, 0, -length * 0.9);
        ctx.strokeStyle = 'rgba(190, 215, 112, 0.32)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      function drawBokChoy(time) {
        const bob = reducedMotion ? 0 : Math.sin(time * 0.44 + 2.1) * 1.1;
        ctx.save();
        ctx.translate(-174, -10 + bob);
        ctx.shadowColor = 'rgba(0, 0, 0, 0.32)';
        ctx.shadowBlur = 8;
        drawLeaf(-7, -12, -0.48, 92, 32, '#2b6b3d', '#0d311f');
        drawLeaf(8, -16, 0.12, 112, 35, '#317a43', '#0b2b1c');
        drawLeaf(24, -8, 0.55, 81, 30, '#245d36', '#0a281a');
        ctx.shadowBlur = 0;

        ctx.lineCap = 'round';
        [[-7, -61, 13], [8, -80, 15], [24, -54, 12]].forEach((stem) => {
          ctx.beginPath();
          ctx.moveTo(4, 13);
          ctx.quadraticCurveTo(stem[0] * 0.48, stem[1] * 0.48, stem[0], stem[1]);
          const stemGradient = ctx.createLinearGradient(0, 12, stem[0], stem[1]);
          stemGradient.addColorStop(0, '#d3c977');
          stemGradient.addColorStop(0.5, '#a9b55b');
          stemGradient.addColorStop(1, '#507c3c');
          ctx.strokeStyle = stemGradient;
          ctx.lineWidth = stem[2];
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, 9);
          ctx.quadraticCurveTo(stem[0] * 0.44, stem[1] * 0.47, stem[0] - 1, stem[1] + 3);
          ctx.strokeStyle = 'rgba(240, 232, 147, 0.32)';
          ctx.lineWidth = 2;
          ctx.stroke();
        });
        ctx.restore();
      }

      function drawMushroom(x, y, scale, rotation, time, phase) {
        const bob = reducedMotion ? 0 : Math.sin(time * 0.53 + phase) * 1.2;
        ctx.save();
        ctx.translate(x, y + bob);
        ctx.rotate(rotation);
        ctx.scale(scale, scale * 0.86);
        ctx.shadowColor = 'rgba(16, 4, 2, 0.5)';
        ctx.shadowBlur = 8;

        const stem = ctx.createLinearGradient(-4, 0, 22, 42);
        stem.addColorStop(0, '#e4c99d');
        stem.addColorStop(0.55, '#b68959');
        stem.addColorStop(1, '#68402d');
        ctx.beginPath();
        ctx.moveTo(-12, -2);
        ctx.quadraticCurveTo(-12, 27, -7, 39);
        ctx.quadraticCurveTo(7, 44, 18, 35);
        ctx.quadraticCurveTo(13, 15, 11, -4);
        ctx.closePath();
        ctx.fillStyle = stem;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-49, 4);
        ctx.bezierCurveTo(-39, -38, -9, -55, 15, -50);
        ctx.bezierCurveTo(43, -44, 55, -18, 55, 4);
        ctx.quadraticCurveTo(7, 18, -49, 4);
        ctx.closePath();
        const cap = ctx.createRadialGradient(-12, -30, 2, 3, -16, 58);
        cap.addColorStop(0, '#b16d3d');
        cap.addColorStop(0.38, '#754021');
        cap.addColorStop(0.8, '#3d1c13');
        cap.addColorStop(1, '#220d0b');
        ctx.fillStyle = cap;
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(-42, 4);
        ctx.quadraticCurveTo(3, 22, 49, 4);
        ctx.strokeStyle = 'rgba(230, 184, 126, 0.35)';
        ctx.lineWidth = 2.6;
        ctx.stroke();
        [-27, -12, 4, 20, 35].forEach((gx) => {
          ctx.beginPath();
          ctx.moveTo(gx * 0.82, 5);
          ctx.lineTo(gx, 12 - Math.abs(gx) * 0.09);
          ctx.strokeStyle = 'rgba(210, 162, 111, 0.2)';
          ctx.lineWidth = 1.2;
          ctx.stroke();
        });
        ctx.restore();
      }

      function drawTofu(x, y, size, rotation, time, phase) {
        const bob = reducedMotion ? 0 : Math.sin(time * 0.49 + phase) * 1.05;
        ctx.save();
        ctx.translate(x, y + bob);
        ctx.rotate(rotation);
        ctx.shadowColor = 'rgba(24, 6, 3, 0.45)';
        ctx.shadowBlur = 7;
        ctx.shadowOffsetY = 4;

        const half = size * 0.5;
        const depth = size * 0.31;
        const topGradient = ctx.createLinearGradient(-half, -half, half, half);
        topGradient.addColorStop(0, '#f6dca0');
        topGradient.addColorStop(0.45, '#dcae62');
        topGradient.addColorStop(1, '#b76c34');
        roundedPolygon([
          [-half, -depth], [-half * 0.42, -half], [half, -half * 0.56],
          [half * 0.78, depth * 0.58], [-half * 0.26, depth]
        ], topGradient);

        const sideGradient = ctx.createLinearGradient(-half, 0, half, size * 0.72);
        sideGradient.addColorStop(0, '#bb6b31');
        sideGradient.addColorStop(0.48, '#8d431f');
        sideGradient.addColorStop(1, '#552314');
        roundedPolygon([
          [-half, -depth], [-half * 0.26, depth], [-half * 0.18, size * 0.72],
          [-half * 0.9, size * 0.48]
        ], sideGradient);

        const rightGradient = ctx.createLinearGradient(0, 0, half, size * 0.7);
        rightGradient.addColorStop(0, '#c47a39');
        rightGradient.addColorStop(1, '#6b2d18');
        roundedPolygon([
          [-half * 0.26, depth], [half * 0.78, depth * 0.58], [half * 0.68, size * 0.52],
          [-half * 0.18, size * 0.72]
        ], rightGradient);

        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(104, 46, 19, 0.42)';
        [[-0.21, -0.27, 2.2], [0.13, -0.2, 1.7], [0.32, -0.08, 1.5], [-0.03, 0.02, 1.3]].forEach((spot) => {
          ctx.beginPath();
          ctx.arc(spot[0] * size, spot[1] * size, spot[2], 0, TAU);
          ctx.fill();
        });
        ctx.restore();
      }

      function drawScallions(time) {
        ctx.save();
        scallions.forEach((scallion, index) => {
          const bob = reducedMotion ? 0 : Math.sin(time * 0.57 + index * 0.82) * 0.85;
          ctx.save();
          ctx.translate(scallion[0], scallion[1] + bob);
          ctx.rotate(scallion[3]);
          ctx.beginPath();
          ctx.ellipse(0, 0, scallion[2], scallion[2] * 0.43, 0, 0, TAU);
          ctx.strokeStyle = '#68a94e';
          ctx.lineWidth = 5;
          ctx.shadowColor = 'rgba(31, 86, 34, 0.35)';
          ctx.shadowBlur = 4;
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.ellipse(-1, -1, scallion[2] - 3.2, scallion[2] * 0.25, 0, 0, TAU);
          ctx.strokeStyle = 'rgba(191, 220, 102, 0.58)';
          ctx.lineWidth = 1.2;
          ctx.stroke();
          ctx.restore();
        });
        ctx.restore();
      }

      function drawChili() {
        ctx.save();
        ctx.translate(40, -63);
        ctx.rotate(0.18);
        ctx.beginPath();
        ctx.moveTo(-36, -2);
        ctx.bezierCurveTo(-8, -17, 22, -13, 47, 1);
        ctx.strokeStyle = '#b82e1d';
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-34, -4);
        ctx.bezierCurveTo(-8, -14, 20, -10, 43, 0);
        ctx.strokeStyle = 'rgba(255, 111, 58, 0.46)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      function drawToppings(time) {
        drawNori(time);
        drawBokChoy(time);
        drawMushroom(-52, -59, 0.92, -0.08, time, 0.3);
        drawMushroom(82, -53, 0.72, 0.12, time, 2.2);
        drawMushroom(154, -18, 0.59, 0.24, time, 4.4);
        drawTofu(72, -5, 61, -0.08, time, 0.4);
        drawTofu(3, 6, 48, 0.10, time, 2.8);
        drawTofu(133, 13, 42, -0.18, time, 4.9);
        drawChili();
        drawScallions(time);
      }

      function drawFrontRim() {
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(0, -30, 397, 105, 0, 0.015, Math.PI - 0.015);
        const rimGradient = ctx.createLinearGradient(-390, 5, 390, 42);
        rimGradient.addColorStop(0, 'rgba(109, 30, 31, 0.68)');
        rimGradient.addColorStop(0.32, 'rgba(33, 12, 15, 0.92)');
        rimGradient.addColorStop(0.58, 'rgba(12, 10, 12, 0.96)');
        rimGradient.addColorStop(0.85, 'rgba(75, 20, 24, 0.78)');
        rimGradient.addColorStop(1, 'rgba(139, 38, 35, 0.63)');
        ctx.strokeStyle = rimGradient;
        ctx.lineWidth = 18;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(0, -34, 378, 93, 0, 0.09, Math.PI - 0.09);
        ctx.strokeStyle = 'rgba(242, 102, 59, 0.12)';
        ctx.lineWidth = 2.4;
        ctx.shadowColor = 'rgba(232, 74, 43, 0.15)';
        ctx.shadowBlur = 7;
        ctx.stroke();
        ctx.restore();
      }

      function steamPath(wisp, time, life) {
        const lift = life * 118;
        const baseY = -92 - lift;
        const length = wisp.height * (0.55 + life * 0.55);
        const wave = Math.sin(time * 0.52 + wisp.curl + life * 4.1);
        const current = (reducedMotion ? 0 : pointer.x * pointer.energy) * (16 + life * 48);
        const x0 = wisp.x + Math.sin(wisp.curl + life * 3.5) * 14;
        const topX = x0 + wisp.lean + wave * wisp.sway + current;
        ctx.beginPath();
        ctx.moveTo(x0, baseY);
        ctx.bezierCurveTo(
          x0 - wisp.sway * 0.8 + current * 0.18,
          baseY - length * 0.28,
          topX + wisp.sway * 0.72,
          baseY - length * 0.69,
          topX,
          baseY - length
        );
        return { baseY, topY: baseY - length };
      }

      function drawSteam(time) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.lineCap = 'round';

        steam.forEach((wisp) => {
          const life = (wisp.phase + time * wisp.speed) % 1;
          const fade = Math.pow(Math.sin(Math.PI * life), 1.35) * (1 - life * 0.2);
          const alpha = wisp.opacity * Math.max(0, fade);
          if (alpha < 0.008) return;

          let bounds = steamPath(wisp, time, life);
          let gradient = ctx.createLinearGradient(0, bounds.baseY, 0, bounds.topY);
          const warmColor = wisp.warm ? '255, 198, 149' : '229, 226, 211';
          gradient.addColorStop(0, `rgba(${warmColor}, ${alpha * 0.42})`);
          gradient.addColorStop(0.28, `rgba(${warmColor}, ${alpha * 0.8})`);
          gradient.addColorStop(0.72, `rgba(${warmColor}, ${alpha * 0.36})`);
          gradient.addColorStop(1, `rgba(${warmColor}, 0)`);
          ctx.strokeStyle = gradient;
          ctx.lineWidth = wisp.width * 5.2;
          ctx.filter = 'blur(8px)';
          ctx.stroke();

          ctx.filter = 'none';
          bounds = steamPath(wisp, time, life);
          gradient = ctx.createLinearGradient(0, bounds.baseY, 0, bounds.topY);
          gradient.addColorStop(0, `rgba(${warmColor}, ${alpha * 0.14})`);
          gradient.addColorStop(0.3, `rgba(${warmColor}, ${alpha * 0.72})`);
          gradient.addColorStop(0.76, `rgba(${warmColor}, ${alpha * 0.30})`);
          gradient.addColorStop(1, `rgba(${warmColor}, 0)`);
          ctx.strokeStyle = gradient;
          ctx.lineWidth = wisp.width;
          ctx.stroke();
        });

        ctx.filter = 'none';
        ctx.restore();
      }

      function drawBowl(time) {
        ctx.save();
        const driftX = reducedMotion ? 0 : pointer.x * pointer.energy * 3.2;
        const driftY = reducedMotion ? 0 : pointer.y * pointer.energy * 1.6;
        ctx.translate(centerX + driftX, centerY + driftY);
        ctx.scale(sceneScale, sceneScale);
        drawShadow();
        drawBowlBody();
        drawRimAndBroth(time);
        drawToppings(time);
        drawFrontRim();
        drawSteam(time);
        ctx.restore();
      }

      function drawForegroundGlow() {
        const x = centerX + pointer.x * pointer.energy * bowlWidth * 0.20;
        const y = centerY + bowlWidth * 0.05 + pointer.y * pointer.energy * bowlWidth * 0.06;
        const radius = bowlWidth * 0.55;
        const glow = ctx.createRadialGradient(x, y, 0, x, y, radius);
        glow.addColorStop(0, `rgba(255, 98, 35, ${0.016 + pointer.energy * 0.012})`);
        glow.addColorStop(0.52, 'rgba(147, 31, 18, 0.008)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);
        ctx.restore();
      }

      function render(time) {
        drawBackground(time);
        drawBowl(time);
        drawForegroundGlow();
      }

      function tick(timestamp) {
        if (reducedMotion || document.hidden) {
          animationFrame = 0;
          previousTime = 0;
          return;
        }

        const delta = previousTime ? Math.min((timestamp - previousTime) / 1000, 0.05) : 0;
        previousTime = timestamp;
        elapsed += delta;
        const easing = 1 - Math.pow(0.001, delta || 0.016);
        pointer.x = lerp(pointer.x, pointer.targetX, easing);
        pointer.y = lerp(pointer.y, pointer.targetY, easing);
        pointer.energy = lerp(pointer.energy, pointer.targetEnergy, easing * 0.72);
        render(elapsed);
        animationFrame = requestAnimationFrame(tick);
      }

      function startAnimation() {
        if (animationFrame || reducedMotion || document.hidden) return;
        previousTime = 0;
        animationFrame = requestAnimationFrame(tick);
      }

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(width * dpr));
        canvas.height = Math.max(1, Math.round(height * dpr));
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;

        bowlWidth = Math.min(width * 0.92, height * 0.88, 1120);
        sceneScale = bowlWidth / 800;
        centerX = width * 0.5;
        centerY = height * (width / Math.max(height, 1) < 0.72 ? 0.585 : 0.575);
        render(reducedMotion ? FROZEN_TIME : elapsed);
      }

      function updatePointer(event) {
        pointer.targetX = clamp((event.clientX / Math.max(width, 1) - 0.5) * 2, -1, 1);
        pointer.targetY = clamp((event.clientY / Math.max(height, 1) - 0.5) * 2, -1, 1);
        pointer.targetEnergy = 1;
        if (reducedMotion) {
          pointer.x = pointer.targetX;
          pointer.y = pointer.targetY;
          pointer.energy = 1;
          render(FROZEN_TIME);
        }
      }

      function releasePointer() {
        pointer.targetX = 0;
        pointer.targetY = 0;
        pointer.targetEnergy = 0;
        if (reducedMotion) {
          pointer.x = 0;
          pointer.y = 0;
          pointer.energy = 0;
          render(FROZEN_TIME);
        }
      }

      function motionPreferenceChanged(event) {
        reducedMotion = event.matches;
        if (reducedMotion) {
          if (animationFrame) cancelAnimationFrame(animationFrame);
          animationFrame = 0;
          previousTime = 0;
          render(FROZEN_TIME);
        } else {
          startAnimation();
        }
      }

      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('pointermove', updatePointer, { passive: true });
      document.documentElement.addEventListener('pointerleave', releasePointer, { passive: true });
      window.addEventListener('blur', releasePointer, { passive: true });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (animationFrame) cancelAnimationFrame(animationFrame);
          animationFrame = 0;
          previousTime = 0;
        } else if (reducedMotion) {
          render(FROZEN_TIME);
        } else {
          startAnimation();
        }
      });

      if (motionQuery.addEventListener) {
        motionQuery.addEventListener('change', motionPreferenceChanged);
      } else {
        motionQuery.addListener(motionPreferenceChanged);
      }

      resize();
      startAnimation();
    })();
  </script>
</body>
</html>
