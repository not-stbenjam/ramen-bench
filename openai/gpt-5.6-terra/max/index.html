<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Vegan Ramen</title>
  <style>
    :root {
      --pointer-x: 0;
      --pointer-y: 0;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --shift-x: 0px;
      --shift-y: 0px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030506;
    }

    body {
      min-height: 100svh;
      cursor: crosshair;
      -webkit-tap-highlight-color: transparent;
    }

    .scene {
      position: relative;
      display: grid;
      min-height: 100svh;
      place-items: center;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      isolation: isolate;
      overflow: hidden;
      perspective: 1300px;
      background:
        radial-gradient(ellipse 62% 47% at 50% 54%, rgba(90, 43, 22, .28), transparent 66%),
        radial-gradient(ellipse 50% 44% at 49% 18%, rgba(21, 48, 48, .22), transparent 76%),
        linear-gradient(135deg, #05090b 0%, #090d0e 44%, #030405 100%);
    }

    .scene::before,
    .scene::after {
      position: absolute;
      z-index: -1;
      content: "";
      pointer-events: none;
    }

    .scene::before {
      inset: -18%;
      background:
        radial-gradient(circle at calc(50% + var(--pointer-x) * 5%) calc(49% + var(--pointer-y) * 3%), rgba(230, 111, 38, .16), transparent 22%),
        radial-gradient(ellipse at 50% 66%, rgba(226, 86, 24, .13), transparent 37%);
      filter: blur(16px);
      transition: background-position .5s ease-out;
    }

    .scene::after {
      inset: 0;
      opacity: .28;
      background-image:
        radial-gradient(circle at 11% 26%, rgba(255, 205, 139, .2) 0 1px, transparent 1.5px),
        radial-gradient(circle at 76% 17%, rgba(255, 193, 105, .12) 0 1px, transparent 1.5px),
        radial-gradient(circle at 88% 76%, rgba(255, 193, 105, .11) 0 1px, transparent 1.5px),
        radial-gradient(circle at 18% 78%, rgba(255, 193, 105, .08) 0 1px, transparent 1.5px);
      background-size: 197px 223px, 277px 179px, 317px 241px, 237px 311px;
      mix-blend-mode: screen;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(ellipse 56% 57% at 50% 51%, transparent 22%, rgba(0, 0, 0, .08) 48%, rgba(0, 0, 0, .68) 100%);
    }

    .bowl-wrap {
      position: relative;
      width: min(96vw, 940px);
      min-width: 0;
      justify-self: center;
      transform: translate3d(var(--shift-x), var(--shift-y), 0) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transform-style: preserve-3d;
      will-change: transform;
    }

    .bowl-wrap::before {
      position: absolute;
      inset: 20% 4% 8%;
      z-index: -1;
      content: "";
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255, 93, 22, .22), rgba(151, 48, 12, .08) 38%, transparent 70%);
      filter: blur(30px);
      transform: translateZ(-30px) scale(1.04);
      animation: warmth 5s ease-in-out infinite;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .steam {
      transform-origin: 450px 380px;
      animation: steamGroup 7.5s ease-in-out infinite;
    }

    .steam-line {
      fill: none;
      stroke-linecap: round;
      mix-blend-mode: screen;
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: steamCurl 6.2s ease-in-out infinite;
    }

    .steam-line:nth-child(2n) { animation-duration: 7.7s; animation-delay: -3.5s; }
    .steam-line:nth-child(3n) { animation-duration: 5.4s; animation-delay: -1.8s; }
    .steam-line:nth-child(4n) { animation-duration: 8.9s; animation-delay: -5.1s; }

    .broth-shine { transform-origin: 450px 430px; animation: brothGlow 4.6s ease-in-out infinite; }
    .noodle-motion { transform-origin: 450px 438px; animation: noodleBreath 5.8s ease-in-out infinite; }
    .leaf-motion { transform-box: fill-box; transform-origin: center; animation: leafBreath 4.3s ease-in-out infinite; }
    .leaf-motion:nth-child(2n) { animation-delay: -2.1s; animation-duration: 5.2s; }
    .chili-shimmer { animation: chiliGlow 3s ease-in-out infinite; }
    .bowl-glint { animation: bowlGlint 5.5s ease-in-out infinite; }

    @keyframes steamGroup {
      0%, 100% { transform: translate(0, 6px) scaleX(.98); opacity: .62; }
      50% { transform: translate(3px, -9px) scaleX(1.03); opacity: .96; }
    }

    @keyframes steamCurl {
      0%, 100% { transform: translate(0, 0) rotate(-2deg) scaleX(.95); opacity: .13; }
      35% { opacity: .72; }
      65% { transform: translate(13px, -16px) rotate(5deg) scaleX(1.08); opacity: .43; }
    }

    @keyframes warmth {
      0%, 100% { opacity: .56; transform: translateZ(-30px) scale(.98); }
      50% { opacity: .95; transform: translateZ(-30px) scale(1.08); }
    }

    @keyframes brothGlow {
      0%, 100% { opacity: .38; transform: scale(.94); }
      50% { opacity: .75; transform: scale(1.05); }
    }

    @keyframes noodleBreath {
      0%, 100% { transform: translateY(0) rotate(-.35deg); }
      50% { transform: translateY(-3px) rotate(.45deg); }
    }

    @keyframes leafBreath {
      0%, 100% { transform: rotate(-1.5deg) translateY(1px); }
      50% { transform: rotate(2.2deg) translateY(-3px); }
    }

    @keyframes chiliGlow {
      0%, 100% { filter: saturate(1) brightness(.9); }
      50% { filter: saturate(1.28) brightness(1.22); }
    }

    @keyframes bowlGlint {
      0%, 15%, 100% { opacity: .18; transform: translateX(-22px); }
      46%, 70% { opacity: .75; transform: translateX(26px); }
    }

    @media (max-width: 620px) {
      .bowl-wrap { width: 132vw; }
      .scene { background-position: 50% 50%; }
      .vignette { background: radial-gradient(ellipse 68% 55% at 50% 52%, transparent 17%, rgba(0, 0, 0, .14) 57%, rgba(0, 0, 0, .68) 100%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      body { cursor: default; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="A steaming bowl of vegan ramen">
    <div class="bowl-wrap" id="bowl-wrap">
      <svg viewBox="0 0 900 800" role="img" aria-labelledby="ramen-title ramen-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="ramen-title">Steaming vegan ramen</title>

            <stop offset=".48" stop-color="#eebc65"/>

          </linearGradient>
          <linearGradient id="tofu" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#fff0bd"/>
            <stop offset=".45" stop-color="#e8be72"/>

          <linearGradient id="nori" x1="0" y1="0" x2="1" y2="1">

            <stop offset="1" stop-color="#641212"/>
          </linearGradient>

            <ellipse cx="450" cy="430" rx="263" ry="108"/>
          </clipPath>
        </defs>

        <path d="M183 460 C207 564 244 627 318 665 C377 695 522 695 582 665 C655 628 696 565 719 460" fill="none" stroke="#f29a61" stroke-opacity=".22" stroke-width="5"/>
        <path d="M222 548 C245 617 296 660 364 680" fill="none" stroke="#ffbd84" stroke-opacity=".27" stroke-width="15" stroke-linecap="round" filter="url(#soft-glow)"/>
        <ellipse cx="450" cy="704" rx="119" ry="16" fill="#19090b" opacity=".82"/>

        <ellipse class="broth-shine" cx="413" cy="409" rx="188" ry="63" fill="url(#broth-light)"/>

        <!-- food, clipped naturally by the liquid surface -->

            <path d="M244 427 C282 401 304 440 340 453 C385 470 420 448 429 417 C440 380 416 368 428 340" stroke-width="12"/>
            <path d="M286 476 C309 444 345 460 370 474 C412 497 448 478 457 442 C465 408 444 388 459 353" stroke-width="13"/>

            <path d="M519 482 C544 449 578 459 603 469 C639 483 666 463 668 432" stroke-width="11"/>
            <path d="M307 381 C335 356 367 373 388 389 C410 406 431 401 444 377" stroke-width="9" opacity=".74"/>
          </g>

          <!-- roasted nori sheet -->
          <path d="M221 342 L343 317 L367 405 L249 435 Z" fill="url(#nori)" stroke="#5b897a" stroke-opacity=".42" stroke-width="3"/>

          <!-- bok choy and greens -->

            <path d="M582 392 C610 332 654 321 687 339 C650 357 641 397 597 428 C584 430 578 415 582 392Z" fill="url(#green)"/>
            <path d="M590 405 C622 369 649 355 675 344" fill="none" stroke="#d7ec89" stroke-opacity=".65" stroke-width="4"/>
            <path d="M553 419 C577 360 613 351 637 368 C611 384 607 423 571 448 C557 448 550 436 553 419Z" fill="url(#green)"/>
            <path d="M566 433 C583 399 602 379 624 370" fill="none" stroke="#e3f19c" stroke-opacity=".55" stroke-width="4"/>
          </g>
          <g class="leaf-motion">
            <path d="M301 446 C293 402 317 372 347 369 C345 399 371 427 345 462 C327 470 310 462 301 446Z" fill="url(#green)"/>
            <path d="M314 453 C319 419 330 396 341 378" fill="none" stroke="#e3f19c" stroke-opacity=".56" stroke-width="4"/>
          </g>

          <!-- shiitake mushrooms -->

            <path d="M473 356 C485 341 509 338 522 356" fill="none" stroke="#f1c680" stroke-opacity=".55" stroke-width="4"/>
            <path d="M480 364 L474 394 C481 403 501 403 509 394 L505 366" fill="#d9a962"/>
            <path d="M365 444 C375 407 422 405 438 441 C419 458 383 462 365 444Z" fill="url(#mushroom)"/>
            <path d="M380 440 C394 425 414 425 426 441" fill="none" stroke="#f6ce89" stroke-opacity=".52" stroke-width="4"/>

          <!-- caramelized tofu -->

          <!-- sweet corn -->

            <circle cx="272" cy="469" r="9"/><circle cx="294" cy="481" r="10"/><circle cx="317" cy="489" r="8"/>
            <circle cx="643" cy="435" r="9"/><circle cx="659" cy="450" r="9"/><circle cx="638" cy="458" r="10"/>

        <path d="M657 520 C642 575 613 620 573 647" fill="none" stroke="#15070a" stroke-opacity=".4" stroke-width="14" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="vignette" aria-hidden="true"></div>
  </main>
  <script>
    (() => {
      const root = document.documentElement;
      const wrap = document.getElementById('bowl-wrap');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;
      let frame;

      const render = () => {
        currentX += (targetX - currentX) * 0.075;
        currentY += (targetY - currentY) * 0.075;
        root.style.setProperty('--pointer-x', currentX.toFixed(3));
        root.style.setProperty('--pointer-y', currentY.toFixed(3));
        root.style.setProperty('--tilt-x', `${(-currentY * 2.3).toFixed(2)}deg`);
        root.style.setProperty('--tilt-y', `${(currentX * 3.1).toFixed(2)}deg`);
        root.style.setProperty('--shift-x', `${(currentX * 8).toFixed(2)}px`);
        root.style.setProperty('--shift-y', `${(currentY * 5).toFixed(2)}px`);
        if (Math.abs(targetX - currentX) > .001 || Math.abs(targetY - currentY) > .001) {
          frame = requestAnimationFrame(render);
        } else {
          frame = undefined;
        }
      };

      const wake = () => {
        if (!frame && !reduceMotion.matches) frame = requestAnimationFrame(render);
      };

      window.addEventListener('pointermove', (event) => {
        if (reduceMotion.matches || event.pointerType === 'touch') return;
        targetX = (event.clientX / window.innerWidth - .5) * 2;
        targetY = (event.clientY / window.innerHeight - .5) * 2;
        wake();
      }, { passive: true });

      window.addEventListener('pointerleave', () => {
        targetX = 0;
        targetY = 0;
        wake();
      });

      window.addEventListener('blur', () => {
        targetX = 0;
        targetY = 0;
        wake();
      });

      reduceMotion.addEventListener?.('change', () => {
        if (reduceMotion.matches) {
          cancelAnimationFrame(frame);
          frame = undefined;
          root.style.removeProperty('--tilt-x');
          root.style.removeProperty('--tilt-y');
          root.style.removeProperty('--shift-x');
          root.style.removeProperty('--shift-y');
        }
      });

      wrap.addEventListener('pointerdown', wake, { passive: true });
    })();
  </script>
</body>
</html>
