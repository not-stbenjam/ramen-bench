<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b0d" />
    <title>Quiet Bowl — Vegetarian Ramen</title>
    <style>
      :root {
        color-scheme: dark;
        --night: #080b0d;
        --ember: #e9a757;
        --cream: #f6e7c3;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        overflow: hidden;
        background: var(--night);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .stage {
        position: relative;
        isolation: isolate;
        display: grid;
        min-height: 100svh;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 44%, rgba(117, 66, 35, 0.27) 0%, rgba(47, 31, 24, 0.16) 27%, transparent 55%),
          radial-gradient(ellipse at 50% 112%, #241810 0%, #0d1112 44%, #07090b 79%);
      }

      .stage::before {
        position: absolute;
        inset: -20%;
        z-index: -2;
        content: "";
        background:
          radial-gradient(circle at 50% 37%, rgba(255, 213, 142, 0.13), transparent 24%),
          radial-gradient(circle at 23% 18%, rgba(73, 104, 107, 0.08), transparent 22%),
          radial-gradient(circle at 79% 72%, rgba(198, 100, 46, 0.06), transparent 28%);
        filter: blur(28px);
        pointer-events: none;
      }

      .stage::after {
        position: absolute;
        right: -16vw;
        bottom: -21vw;
        left: -16vw;
        z-index: -1;
        height: 45vh;
        content: "";
        border-radius: 50%;
        background: rgba(200, 112, 48, 0.09);
        filter: blur(78px);
        pointer-events: none;
      }

      .bowl-scene {
        position: relative;
        width: min(94vw, 820px);
        aspect-ratio: 800 / 720;
        margin-top: 1.5vh;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .bowl-scene::before {
        position: absolute;
        right: 12%;
        bottom: 6%;
        left: 12%;
        height: 20%;
        content: "";
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.44);
        filter: blur(34px);
        opacity: 0.78;
        transform: translateY(9%);
        transition: opacity 700ms ease, transform 700ms ease;
        pointer-events: none;
      }

      .bowl-scene:hover::before,
      .bowl-scene.is-awakened::before {
        opacity: 0.6;
        transform: translateY(15%) scaleX(0.94);
      }

      .ramen-art {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        transform: translateY(0);
        transition: transform 900ms cubic-bezier(0.2, 0.75, 0.25, 1);
      }

      .bowl-scene:hover .ramen-art,
      .bowl-scene.is-awakened .ramen-art {
        transform: translateY(-5px);
      }

      .bowl-scene:focus-visible {
        outline: 1px solid rgba(248, 211, 151, 0.58);
        outline-offset: 10px;
        border-radius: 50%;
      }

      .bowl-shadow {
        fill: #000;
        opacity: 0.5;
        filter: url(#softShadow);
      }

      .bowl-body {
        fill: url(#bowlBody);
        stroke: rgba(114, 132, 132, 0.28);
        stroke-width: 3;
      }

      .bowl-body-highlight {
        fill: none;
        stroke: rgba(178, 192, 184, 0.18);
        stroke-linecap: round;
        stroke-width: 5;
      }

      .bowl-rim {
        fill: url(#bowlRim);
        stroke: rgba(142, 157, 151, 0.35);
        stroke-width: 3;
      }

      .broth {
        fill: url(#broth);
        stroke: rgba(244, 173, 86, 0.42);
        stroke-width: 3;
      }

      .broth-depth {
        fill: url(#brothDepth);
        opacity: 0.6;
      }

      .broth-sheen {
        fill: none;
        stroke: rgba(255, 223, 153, 0.44);
        stroke-linecap: round;
        stroke-width: 4;
        transform-box: fill-box;
        transform-origin: center;
        animation: shimmer 5.2s ease-in-out infinite;
      }

      .broth-sheen--soft {
        stroke: rgba(255, 191, 104, 0.2);
        stroke-width: 11;
        filter: url(#softBlur);
        animation-delay: -2.1s;
      }

      .noodle {
        fill: none;
        stroke: url(#noodle);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 9;
        transform-box: fill-box;
        transform-origin: center;
        animation: noodleSway 4.5s ease-in-out infinite;
      }

      .noodle--fine {
        stroke: rgba(255, 231, 164, 0.75);
        stroke-width: 4;
      }

      .noodle--deep {
        stroke: rgba(196, 108, 47, 0.74);
        stroke-width: 7;
      }

      .noodle:nth-of-type(2n) {
        animation-delay: -1.4s;
      }

      .noodle:nth-of-type(3n) {
        animation-delay: -2.6s;
      }

      .topping-float {
        transform-box: fill-box;
        transform-origin: center;
        animation: toppingFloat 5.5s ease-in-out infinite;
      }

      .topping-float--late {
        animation-delay: -2.8s;
      }

      .bok-choy-leaf {
        fill: url(#bokChoy);
        stroke: rgba(181, 199, 137, 0.58);
        stroke-width: 2;
      }

      .bok-choy-stem {
        fill: #d9d997;
        opacity: 0.88;
      }

      .tofu {
        fill: url(#tofu);
        stroke: rgba(248, 202, 121, 0.54);
        stroke-width: 2;
      }

      .tofu-edge {
        fill: none;
        stroke: rgba(255, 231, 163, 0.55);
        stroke-linecap: round;
        stroke-width: 3;
      }

      .mushroom-cap {
        fill: url(#mushroom);
        stroke: rgba(232, 167, 102, 0.5);
        stroke-width: 2;
      }

      .mushroom-gill {
        fill: none;
        stroke: rgba(250, 205, 143, 0.38);
        stroke-linecap: round;
        stroke-width: 2;
      }

      .corn {
        fill: #f4c94e;
        stroke: rgba(255, 236, 150, 0.48);
        stroke-width: 2;
      }

      .scallion {
        fill: rgba(218, 235, 159, 0.88);
        stroke: rgba(105, 137, 79, 0.78);
        stroke-width: 3;
      }

      .nori {
        fill: url(#nori);
        stroke: rgba(95, 151, 120, 0.5);
        stroke-width: 2;
      }

      .chili {
        fill: #d95836;
        stroke: rgba(255, 174, 99, 0.45);
        stroke-width: 2;
      }

      .ripple-ring {
        fill: none;
        stroke: rgba(255, 222, 150, 0.72);
        stroke-linecap: round;
        stroke-width: 4;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
      }

      .steam-path {
        fill: none;
        stroke: rgba(251, 232, 194, 0.3);
        stroke-linecap: round;
        stroke-width: 8;
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: steamFloat 6.4s ease-in-out infinite;
      }

      .steam-path--thin {
        stroke: rgba(255, 233, 196, 0.21);
        stroke-width: 4;
      }

      .steam-path--one {
        animation-delay: -2.8s;
      }

      .steam-path--two {
        animation-delay: -4.3s;
      }

      .steam-path--three {
        animation-delay: -1.2s;
      }

      .bowl-scene:hover .steam-path,
      .bowl-scene.is-awakened .steam-path {
        animation-name: steamAwakened;
        animation-duration: 2.8s;
      }

      .bowl-scene:hover .ripple-ring {
        animation: ripple 2.2s ease-out infinite;
      }

      .bowl-scene:hover .ripple-ring--second {
        animation-delay: 0.72s;
      }

      .bowl-scene.is-awakened .ripple-ring {
        animation: ripple 1.25s ease-out both;
      }

      .bowl-scene.is-awakened .ripple-ring--second {
        animation-delay: 0.24s;
      }

      @keyframes steamFloat {
        0%,
        100% {
          opacity: 0.08;
          transform: translate3d(0, 10px, 0) scaleX(0.92);
        }
        50% {
          opacity: 0.29;
          transform: translate3d(7px, -11px, 0) scaleX(1.04);
        }
      }

      @keyframes steamAwakened {
        0%,
        100% {
          opacity: 0.16;
          transform: translate3d(0, 8px, 0) scaleX(0.94);
        }
        50% {
          opacity: 0.54;
          transform: translate3d(12px, -15px, 0) scaleX(1.09);
        }
      }

      @keyframes shimmer {
        0%,
        100% {
          opacity: 0.22;
          transform: translateX(-5px) scaleX(0.92);
        }
        50% {
          opacity: 0.76;
          transform: translateX(7px) scaleX(1.08);
        }
      }

      @keyframes noodleSway {
        0%,
        100% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        50% {
          transform: translate3d(1px, -1px, 0) rotate(0.45deg);
        }
      }

      @keyframes toppingFloat {
        0%,
        100% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        50% {
          transform: translate3d(1px, -1.5px, 0) rotate(-0.7deg);
        }
      }

      @keyframes ripple {
        0% {
          opacity: 0.55;
          transform: scale(0.38);
        }
        100% {
          opacity: 0;
          transform: scale(1.28);
        }
      }

      @media (max-width: 540px) {
        .bowl-scene {
          width: 116vw;
          margin-top: 2vh;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.001ms !important;
        }

        .bowl-scene:hover .ripple-ring,
        .bowl-scene.is-awakened .ripple-ring {
          opacity: 0.28;
          transform: scale(0.9);
        }

        .bowl-scene:hover .steam-path,
        .bowl-scene.is-awakened .steam-path {
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>

    </main>

    <script>
      (() => {
        const scene = document.querySelector('.bowl-scene');
        let wakeTimer;

        const awaken = () => {
          scene.classList.remove('is-awakened');
          // Restart the short ripple animation when the bowl is touched again.
          void scene.offsetWidth;
          scene.classList.add('is-awakened');
          window.clearTimeout(wakeTimer);
          wakeTimer = window.setTimeout(() => scene.classList.remove('is-awakened'), 1450);
        };

        scene.addEventListener('pointerdown', awaken, { passive: true });
        scene.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            awaken();
          }
        });
      })();
    </script>
  </body>
</html>
