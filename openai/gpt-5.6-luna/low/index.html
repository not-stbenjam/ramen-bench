<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ramen Atmosphere</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #09090c; }
    body { cursor: none; }
    canvas { display: block; width: 100%; height: 100%; }
    @media (pointer: coarse) { body { cursor: default; } }
    @media (prefers-reduced-motion: reduce) { canvas { animation: none; } }
  </style>
</head>
<body>
<canvas id="scene" aria-label="A steaming bowl of vegan ramen"></canvas>
<script>
(() => {
  const canvas = document.getElementById('scene'), ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr, mx = 0, my = 0, tx = 0, ty = 0, start = performance.now();
  const steam = Array.from({length: 13}, (_, i) => ({ x: (i - 6) * 15, y: Math.random() * 72, s: .65 + Math.random() * .55, p: Math.random() * 7 }));
  const resize = () => { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; canvas.width = W*dpr; canvas.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  addEventListener('resize', resize); resize();
  addEventListener('pointermove', e => { mx = (e.clientX/W-.5); my = (e.clientY/H-.5); });
  const rng = (a,b) => a + Math.random()*(b-a);
  function ellipse(x,y,rx,ry,fill,shadow=0) { ctx.save(); if(shadow){ctx.shadowColor=fill;ctx.shadowBlur=shadow;} ctx.fillStyle=fill; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  function drawSteam(cx, cy, t) {
    ctx.save(); ctx.globalCompositeOperation='screen';
    steam.forEach((q,i) => { const age = reduce ? .45 : ((t*.00017*q.s + q.p/7)%1); const x=cx+q.x + Math.sin(t*.0011*q.s+q.p)*10*age + tx*.4; const y=cy-10-age*135; const a=Math.sin(age*Math.PI)*.13;
      ctx.strokeStyle=`rgba(255,239,208,${a})`; ctx.lineWidth=2.5+q.s*2; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x,y+24); ctx.bezierCurveTo(x-16,y+8,x+17,y-5,x,y-25); ctx.bezierCurveTo(x-12,y-39,x+10,y-54,x+3,y-75); ctx.stroke(); }); ctx.restore();
  }
  function draw(t) {
    const time = t-start; tx += (mx*22-tx)*.035; ty += (my*10-ty)*.035;
    const cx=W/2+tx, base=Math.min(W,H)*.43, cy=Math.min(H*.60, H-120)+ty, bw=Math.min(base, 350), bh=bw*.42;
    const bg=ctx.createRadialGradient(W*.49,H*.42,0,W*.49,H*.48,Math.max(W,H)*.72); bg.addColorStop(0,'#30251f');bg.addColorStop(.28,'#171319');bg.addColorStop(.72,'#0c0c12');bg.addColorStop(1,'#05060a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    // diffuse, low flame-like warmth behind the dish
    const glow=ctx.createRadialGradient(cx,cy-25,0,cx,cy-20,bw*1.35);glow.addColorStop(0,'rgba(236,117,42,.18)');glow.addColorStop(.45,'rgba(151,57,30,.06)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
    const floor=ctx.createLinearGradient(0,H*.72,0,H);floor.addColorStop(0,'rgba(8,8,11,0)');floor.addColorStop(1,'rgba(0,0,2,.75)');ctx.fillStyle=floor;ctx.fillRect(0,H*.65,W,H*.35);
    ellipse(cx+10,cy+bh*.46,bw*.9,bh*.29,'rgba(0,0,0,.66)',36);
    // bowl body
    const bowl=ctx.createLinearGradient(0,cy-bh*.15,0,cy+bh*1.1);bowl.addColorStop(0,'#d86c32');bowl.addColorStop(.32,'#a33e25');bowl.addColorStop(1,'#321319');ctx.fillStyle=bowl;ctx.beginPath();ctx.moveTo(cx-bw*.82,cy);ctx.quadraticCurveTo(cx-bw*.74,cy+bh*1.05,cx,cy+bh*1.18);ctx.quadraticCurveTo(cx+bw*.74,cy+bh*1.05,cx+bw*.82,cy);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,174,91,.24)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(cx,cy,bw*.84,bh*.47,0,0,Math.PI*2);ctx.stroke();
    // broth and rim
    ellipse(cx,cy,bw*.79,bh*.42,'#3a1715'); ellipse(cx,cy-2,bw*.71,bh*.34,'#a84b23'); ellipse(cx,cy-5,bw*.66,bh*.29,'#d7762e');
    const broth=ctx.createRadialGradient(cx-bw*.2,cy-bh*.18,0,cx,cy,bw*.7);broth.addColorStop(0,'rgba(255,190,79,.38)');broth.addColorStop(.5,'rgba(177,64,20,.16)');broth.addColorStop(1,'rgba(72,19,16,.45)');ctx.fillStyle=broth;ctx.beginPath();ctx.ellipse(cx,cy-5,bw*.64,bh*.27,0,0,Math.PI*2);ctx.fill();
    // noodles
    ctx.save();ctx.strokeStyle='#f4bd61';ctx.lineWidth=Math.max(4,bw*.018);ctx.lineCap='round'; for(let i=0;i<14;i++){let x=cx-bw*.5+i*bw*.075;ctx.beginPath();ctx.moveTo(x,cy-13+rng(-3,3));ctx.bezierCurveTo(x-14,cy-34,x+17,cy-35,x+3,cy-8);ctx.stroke();}ctx.restore();
    // toppings: bok choy, corn, tofu, scallion, nori
    ellipse(cx-bw*.34,cy-25,bw*.09,bh*.13,'#6c9b4d');ellipse(cx-bw*.27,cy-29,bw*.08,bh*.16,'#98bb64');
    for(let i=0;i<9;i++) ellipse(cx+bw*(.17+rng(-.28,.33)),cy+bh*rng(-.2,.15),bw*.025,bw*.025,'#ffd26a');
    ctx.save();ctx.translate(cx+bw*.28,cy-30);ctx.rotate(-.18);ctx.fillStyle='#f0c87c';ctx.shadowColor='rgba(255,193,88,.3)';ctx.shadowBlur=10;ctx.fillRect(-bw*.08,-bw*.07,bw*.16,bw*.14);ctx.restore();
    ctx.fillStyle='#203d38';ctx.beginPath();ctx.ellipse(cx+bw*.49,cy-13,bw*.08,bh*.19,-.3,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#b8d66d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx-bw*.45,cy-22);ctx.lineTo(cx-bw*.05,cy-48);ctx.moveTo(cx-bw*.39,cy-16);ctx.lineTo(cx+bw*.02,cy-42);ctx.stroke();
    drawSteam(cx,cy,time); requestAnimationFrame(draw);
  } requestAnimationFrame(draw);
})();
</script>
</body>
</html>
