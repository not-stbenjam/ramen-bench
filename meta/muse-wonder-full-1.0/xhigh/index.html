<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vegan Ramen</title>
<style>
  :root{
    --mx:0; --my:0;          /* pointer, -1 .. 1 */
    --lx:50%; --ly:38%;      /* warm light position */
    --warm:.75;              /* warmth intensity 0..1 */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    overflow:hidden;
    background:#0c0906;
    font-family:system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .scene{
    position:relative;
    width:100vw;height:100svh;min-height:100vh;
    display:grid;place-items:center;
    overflow:hidden;
    cursor:pointer;
    isolation:isolate;
    background:
      radial-gradient(120% 90% at 50% 30%, #2a1c10 0%, #171009 42%, #0c0906 72%),
      #0c0906;
    perspective:1100px;
  }
  /* faint table plane */
  .table{
    position:absolute;left:-10%;right:-10%;bottom:-4%;height:42%;z-index:0;
    background:
      radial-gradient(60% 100% at 50% 0%, rgba(255,166,66,.10), transparent 60%),
      linear-gradient(180deg, transparent 0%, #1b1108 34%, #120b05 100%);
    transform:rotateX(58deg);transform-origin:bottom;
  }
  .table::after{
    content:"";position:absolute;inset:0;opacity:.35;
    background:repeating-linear-gradient(90deg, transparent 0 118px, rgba(0,0,0,.35) 118px 120px);
  }
  /* ambient warm light that follows the pointer */
  .warmth{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(560px 420px at var(--lx) var(--ly),
      rgba(255,176,84,calc(.30 * var(--warm))) 0%,
      rgba(232,110,32,calc(.12 * var(--warm))) 42%,
      transparent 70%);
    mix-blend-mode:screen;
    animation:breathe 7s ease-in-out infinite alternate;
  }
  @keyframes breathe{from{opacity:.82}to{opacity:1}}
  .halo{
    position:absolute;z-index:1;pointer-events:none;
    width:min(86vmin,760px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle, rgba(255,158,64,.20) 0%, rgba(255,120,40,.07) 46%, transparent 68%);
    filter:blur(6px);
    transform:translate(calc(var(--mx) * -14px), calc(var(--my) * -10px - 6%));
    animation:breathe 6s ease-in-out infinite alternate-reverse;
  }
  .stage{
    position:relative;z-index:2;
    width:min(94vw, 880px);
    transform-style:preserve-3d;
    will-change:transform;
  }
  .stage svg{display:block;width:100%;height:auto;overflow:visible}
  #steamCanvas{
    position:absolute;inset:0;width:100%;height:100%;
    z-index:3;pointer-events:none;
  }
  .vignette{
    position:absolute;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(90% 80% at 50% 46%, transparent 52%, rgba(0,0,0,.62) 100%);
  }
  .grain{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.06;mix-blend-mode:overlay}
  .grain svg{width:100%;height:100%;display:block}

  /* ---- in-scene motion ---- */
  .lifted{transform-origin:478px 158px;animation:sway 4.6s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-1.15deg)}to{transform:rotate(1.25deg)}}
  .chopsticks{transform-origin:478px 158px;animation:sway 4.6s ease-in-out infinite alternate}
  .sheen{animation:sheen 5.5s ease-in-out infinite alternate}
  @keyframes sheen{from{opacity:.35;transform:translateX(-7px)}to{opacity:.65;transform:translateX(9px)}}
  .bubble{transform-box:fill-box;transform-origin:center;animation:bubble 3.4s ease-in-out infinite}
  .bubble.b2{animation-delay:1.1s;animation-duration:4.1s}
  .bubble.b3{animation-delay:2s;animation-duration:3s}
  .bubble.b4{animation-delay:.6s;animation-duration:4.6s}
  @keyframes bubble{0%,100%{transform:scale(.55);opacity:0}35%{opacity:.85}60%{transform:scale(1.15);opacity:.5}80%{transform:scale(1.3);opacity:0}}
  .oil{animation:oil 6s ease-in-out infinite alternate}
  @keyframes oil{from{transform:translate(0,0)}to{transform:translate(5px,-2px)}}
  .bob{animation:bob 5s ease-in-out infinite alternate}
  .bob2{animation:bob 6.2s ease-in-out infinite alternate-reverse}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
  .steam-path{animation:steamRise 5s ease-in-out infinite;opacity:0}
  .steam-path.s2{animation-delay:1.6s;animation-duration:6s}
  .steam-path.s3{animation-delay:3.1s;animation-duration:5.4s}
  @keyframes steamRise{
    0%{opacity:0;transform:translateY(14px) scaleY(.92)}
    30%{opacity:.55}
    70%{opacity:.32}
    100%{opacity:0;transform:translateY(-26px) scaleY(1.06)}
  }
  .ripple-ring{animation:ripple 1.15s ease-out forwards;transform-box:fill-box;transform-origin:center}
  @keyframes ripple{from{transform:scale(.25);opacity:.8}to{transform:scale(1.9);opacity:0}}

  @media (max-width:560px){
    .stage{width:118vw;max-width:none}
    .halo{width:110vmin}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
    .steam-path{opacity:.28}
    .scene{cursor:default}
  }
</style>
</head>
<body>
<main class="scene" id="scene" aria-label="A steaming bowl of vegan ramen in warm, dark light">
  <div class="table" aria-hidden="true"></div>
  <div class="halo" aria-hidden="true"></div>

        <!-- chili oil -->

        <!-- chili slices -->
        <g fill="none" stroke="#d92b1c" stroke-width="4"><circle cx="396" cy="292" r="7"/><circle cx="462" cy="326" r="6"/><circle cx="572" cy="330" r="6"/></g>

          <ellipse cx="590" cy="310" rx="4" ry="2" transform="rotate(40 590 310)"/><ellipse cx="340" cy="284" rx="4" ry="2" transform="rotate(12 340 284)"/>

</main>
<script>
(function(){
  "use strict";
  var scene = document.getElementById('scene');
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('steamCanvas');
  var sheenGroup = document.getElementById('sheenGroup');
  var rippleLayer = document.getElementById('rippleLayer');
  var steamGroup = document.getElementById('steamGroup');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  var ctx = canvas.getContext('2d');

  var W=0,H=0,DPR=1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = scene.clientWidth; H = scene.clientHeight;
    canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize(); window.addEventListener('resize', resize);

  /* pointer state: target vs smoothed */
  var tx=0, ty=0, mx=0, my=0, wind=0, lastPX=null, warmTarget=.75, warm=.75;
  var hasPointer=false;

  function onMove(e){
    var p = (e.touches && e.touches[0]) ? e.touches[0] : e;
    var r = scene.getBoundingClientRect();
    var px = p.clientX - r.left, py = p.clientY - r.top;
    tx = (px/r.width)*2-1; ty = (py/r.height)*2-1;
    tx = Math.max(-1,Math.min(1,tx)); ty = Math.max(-1,Math.min(1,ty));
    if(lastPX!==null){ wind += (px-lastPX)*0.012; wind = Math.max(-1.6,Math.min(1.6,wind)); }
    lastPX = px; hasPointer = true;
    /* warmth grows near the bowl (screen centre, slightly low) */
    var dx = px - r.width*0.5, dy = py - r.height*0.54;
    var dist = Math.sqrt(dx*dx+dy*dy) / (Math.min(r.width,r.height)*0.75);
    warmTarget = Math.max(.45, Math.min(1.15, 1.2 - dist*0.75));
    scene.style.setProperty('--lx', (px/r.width*100).toFixed(1)+'%');
    scene.style.setProperty('--ly', (py/r.height*100).toFixed(1)+'%');
  }
  function onLeave(){ tx=0; ty=0; lastPX=null; warmTarget=.75;
    scene.style.setProperty('--lx','50%'); scene.style.setProperty('--ly','38%'); }

  /* tap / click: broth ripple + steam puff */
  var puffs=[];
  function onTap(e){
    if(reduced.matches) return;
    if(rippleLayer){
      rippleLayer.innerHTML = '<ellipse cx="410" cy="302" rx="90" ry="24" fill="none" stroke="#ffe6b0" stroke-width="3" class="ripple-ring"/>';
      setTimeout(function(){ rippleLayer.innerHTML=''; },1250);
    }
    for(var i=0;i<10;i++) puffs.push(makeSteam(true));
  }

  if(!reduced.matches){
    scene.addEventListener('pointermove', onMove, {passive:true});
    scene.addEventListener('touchmove', onMove, {passive:true});
    scene.addEventListener('pointerleave', onLeave);
    scene.addEventListener('pointerdown', onTap);
  }

  /* ---- canvas particles: steam + warm dust ---- */
  function brothOrigin(){
    var r = stage.getBoundingClientRect(), sr = scene.getBoundingClientRect();
    return { x:(r.left-sr.left)+r.width*0.5, y:(r.top-sr.top)+r.height*0.47, w:r.width*0.44 };
  }
  function makeSteam(burst){
    var o = brothOrigin();
    return { kind:'steam', x:o.x+(Math.random()-.5)*o.w, y:o.y+(Math.random()-.5)*8,
      r: burst? 12+Math.random()*16 : 10+Math.random()*20,
      vx:(Math.random()-.5)*.18, vy:-(.45+Math.random()*.55)*(burst?1.5:1),
      life:0, max:260+Math.random()*220, seed:Math.random()*Math.PI*2 };
  }
  function makeDust(){
    return { kind:'dust', x:Math.random()*W, y:H*0.15+Math.random()*H*0.65,
      r:.8+Math.random()*1.7, vx:(Math.random()-.5)*.12, vy:-(.05+Math.random()*.14),
      life:0, max:500+Math.random()*500, seed:Math.random()*Math.PI*2 };
  }
  var particles=[];
  var i;
  for(i=0;i<26;i++){ var s=makeSteam(false); s.life=Math.random()*s.max; s.y-=Math.random()*160; particles.push(s); }
  for(i=0;i<22;i++){ var d=makeDust(); d.life=Math.random()*d.max; particles.push(d); }

  function drawStaticSteam(){
    ctx.clearRect(0,0,W,H);
    var o=brothOrigin();
    for(var k=0;k<7;k++){
      var x=o.x+(k-3)*o.w*0.13, y=o.y-46-k*16, rad=34+k*9;
      var g=ctx.createRadialGradient(x,y,0,x,y,rad);
      g.addColorStop(0,'rgba(255,250,240,0.13)'); g.addColorStop(1,'rgba(255,250,240,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill();
    }
  }

  var frame=0, running=true;
  document.addEventListener('visibilitychange', function(){ running=!document.hidden; if(running && !reduced.matches) requestAnimationFrame(loop); });

  function loop(){
    if(!running || reduced.matches) return;
    frame++;
    /* smooth pointer -> tilt, parallax, sheen, steam bend */
    mx += (tx-mx)*0.055; my += (ty-my)*0.055; wind *= 0.965;
    warm += (warmTarget-warm)*0.04;
    scene.style.setProperty('--mx', mx.toFixed(4));
    scene.style.setProperty('--my', my.toFixed(4));
    scene.style.setProperty('--warm', warm.toFixed(3));
    stage.style.transform = 'translate3d('+(mx*12).toFixed(2)+'px,'+(my*8).toFixed(2)+'px,0)'
      + ' rotateY('+(mx*4.2).toFixed(2)+'deg) rotateX('+(-my*3.2).toFixed(2)+'deg)';
    if(sheenGroup) sheenGroup.setAttribute('transform','translate('+(mx*46).toFixed(1)+','+(my*8).toFixed(1)+')');
    if(steamGroup) steamGroup.setAttribute('transform','translate('+((mx*10)+(wind*9)).toFixed(1)+',0) skewX('+((mx*3)+(wind*2.4)).toFixed(2)+')');

    ctx.clearRect(0,0,W,H);
    if(frame%7===0 && particles.length<110) particles.push(makeSteam(false));
    if(frame%47===0 && particles.length<110) particles.push(makeDust());
    if(puffs.length){ particles = particles.concat(puffs); puffs=[]; }

    for(var j=particles.length-1;j>=0;j--){
      var p=particles[j]; p.life++;
      if(p.life>=p.max){ particles.splice(j,1); continue; }
      var t=p.life/p.max;
      if(p.kind==='steam'){
        p.x += p.vx + Math.sin((p.life*0.018)+p.seed)*0.32 + wind*0.9 + mx*0.28;
        p.y += p.vy; p.r += 0.22;
        var a = Math.sin(t*Math.PI) * 0.16 * (0.75+warm*0.35);
        var g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
        g.addColorStop(0,'rgba(255,251,242,'+a.toFixed(3)+')');
        g.addColorStop(0.55,'rgba(255,244,226,'+(a*0.5).toFixed(3)+')');
        g.addColorStop(1,'rgba(255,244,226,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      } else {
        p.x += p.vx + Math.sin((p.life*0.01)+p.seed)*0.12 + mx*0.08; p.y += p.vy;
        var a2 = Math.sin(t*Math.PI) * (0.25+0.2*Math.sin(p.life*0.05+p.seed));
        ctx.fillStyle='rgba(255,190,110,'+Math.max(0,a2).toFixed(3)+')';
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      }
    }
    requestAnimationFrame(loop);
  }

  if(reduced.matches){ drawStaticSteam(); window.addEventListener('resize', drawStaticSteam); }
  else { requestAnimationFrame(loop); }

  if(reduced.addEventListener){
    reduced.addEventListener('change', function(){
      if(reduced.matches){ stage.style.transform=''; drawStaticSteam(); }
      else { running=true; requestAnimationFrame(loop); }
    });
  }
})();
</script>
</body>
</html>
