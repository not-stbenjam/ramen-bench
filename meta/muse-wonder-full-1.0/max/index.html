<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 50% 42%, #241610 0%, #140d08 46%, #0a0605 74%, #050303 100%);
    background-color: #070403;
  }
  .scene {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    width: 100dvw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    --px: 0;
    --py: 0;
    --warm: 0.35;
    --flicker: 1;
  }
  .glow {
    position: absolute;
    left: 50%;
    top: 52%;
    width: min(120vmin, 900px);
    height: min(120vmin, 900px);
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle,
      rgba(255, 176, 92, 0.34) 0%,
      rgba(255, 140, 58, 0.18) 34%,
      rgba(190, 84, 24, 0.07) 58%,
      rgba(0, 0, 0, 0) 72%);
    opacity: calc((0.55 + var(--warm) * 0.45) * var(--flicker));
    transform: translate(calc(-50% + var(--px) * 22px), calc(-50% + var(--py) * 14px)) scale(calc(1 + var(--warm) * 0.06));
    animation: breathe 7s ease-in-out infinite;
  }
  .pool {
    position: absolute;
    left: 50%;
    top: 68%;
    width: min(84vmin, 640px);
    height: min(22vmin, 170px);
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(ellipse, rgba(255, 150, 66, 0.20) 0%, rgba(255, 120, 40, 0.06) 55%, rgba(0,0,0,0) 72%);
    filter: blur(6px);
    opacity: calc((0.6 + var(--warm) * 0.4) * var(--flicker));
    transform: translate(calc(-50% + var(--px) * 10px), -50%);
  }
  .bowl-wrap {
    position: relative;
    width: min(96vw, 128vh, 980px);
    aspect-ratio: 4 / 3;
    flex: none;
  }
  .bowl-wrap svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  #steam {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(115% 100% at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.42) 82%, rgba(0,0,0,0.78) 100%);
  }
  #contents {
    transform: translate(calc(var(--px) * 3px), calc(var(--py) * 1.5px));
  }
  #sheen {
    transform: translate(calc(var(--px) * 10px), calc(var(--py) * 3px));
    animation: shimmer 5.5s ease-in-out infinite;
  }
  #lift {
    transform-box: view-box;
    transform-origin: 478px 232px;
    animation: sway 5.2s ease-in-out infinite;
  }
  #noodles { animation: noodle-drift 6s ease-in-out infinite; }
  .bob-a { animation: bob 4.6s ease-in-out infinite; }
  .bob-b { animation: bob 5.4s ease-in-out -1.4s infinite; }
  .bob-c { animation: bob 4.1s ease-in-out -2.2s infinite; }
  .oil { transform-box: fill-box; transform-origin: center; animation: oil-pulse 4.8s ease-in-out infinite; }
  .oil.d1 { animation-delay: -1.2s; }
  .oil.d2 { animation-delay: -2.6s; }
  .oil.d3 { animation-delay: -3.4s; }
  .ripple { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .ripple.go { animation: ripple 1.4s ease-out; }
  @keyframes breathe {
    0%, 100% { scale: 1; }
    50% { scale: 1.035; }
  }
  @keyframes shimmer {
    0%, 100% { opacity: 0.10; }
    50% { opacity: 0.20; }
  }
  @keyframes sway {
    0%, 100% { rotate: -0.9deg; }
    50% { rotate: 1.1deg; }
  }
  @keyframes noodle-drift {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-1.6px); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2.2px); }
  }
  @keyframes oil-pulse {
    0%, 100% { scale: 1; opacity: 0.85; }
    50% { scale: 1.18; opacity: 1; }
  }
  @keyframes ripple {
    0% { opacity: 0.55; scale: 0.35; }
    100% { opacity: 0; scale: 1.25; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    #contents, #sheen { transform: none; }
    .glow, .pool { transform: translate(-50%, -50%); }
    .pool { transform: translate(-50%, -50%); }
  }
</style>
</head>

<script>
(function () {
  var scene = document.getElementById('scene');
  var wrap = document.getElementById('bowlWrap');
  var svg = document.getElementById('ramen');
  var canvas = document.getElementById('steam');
  if (!scene || !wrap || !canvas) return;
  var ctx = null;
  try { ctx = canvas.getContext('2d'); } catch (e) { ctx = null; }
  var motionQuery = null;
  try { motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)'); } catch (e) { motionQuery = null; }
  function prefersReduced() { return !!(motionQuery && motionQuery.matches); }

  var dpr = 1, cw = 0, ch = 0, unit = 1;
  var bowl = { x: 0, y: 0, rx: 0, ry: 0, gripX: 0, gripY: 0 };
  function measure() {
    var rect = wrap.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width));
    var h = Math.max(1, Math.round(rect.height));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cw = w; ch = h;
    unit = Math.max(0.45, Math.min(1.3, w / 800));
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    if (ctx && ctx.setTransform) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bowl.x = (400 / 800) * w;
    bowl.y = (308 / 600) * h;
    bowl.rx = (238 / 800) * w;
    bowl.ry = (54 / 600) * h;
    bowl.gripX = (478 / 800) * w;
    bowl.gripY = (250 / 600) * h;
  }
  measure();

  var target = { x: 0, y: 0, warm: 0.35 };
  var current = { x: 0, y: 0, warm: 0.35 };
  var pointer = { x: -9999, y: -9999, lx: -9999, ly: -9999, vx: 0, inside: false };
  var burst = 0;

  function onPointer(clientX, clientY) {
    var srect = scene.getBoundingClientRect();
    var nx = ((clientX - srect.left) / Math.max(1, srect.width)) * 2 - 1;
    var ny = ((clientY - srect.top) / Math.max(1, srect.height)) * 2 - 1;
    target.x = Math.max(-1, Math.min(1, nx));
    target.y = Math.max(-1, Math.min(1, ny));
    var wrect = wrap.getBoundingClientRect();
    var px = clientX - wrect.left;
    var py = clientY - wrect.top;
    pointer.vx = pointer.lx < -9000 ? 0 : px - pointer.lx;
    pointer.lx = px; pointer.ly = py;
    pointer.x = px; pointer.y = py; pointer.inside = true;
    var dx = (px - bowl.x) / Math.max(1, bowl.rx);
    var dy = (py - bowl.y) / Math.max(1, bowl.rx * 0.8);
    var dist = Math.sqrt(dx * dx + dy * dy);
    target.warm = Math.max(0.18, Math.min(1, 1.15 - dist * 0.55));
  }
  function onLeave() {
    target.x = 0; target.y = 0; target.warm = 0.35;
    pointer.inside = false; pointer.x = -9999; pointer.y = -9999; pointer.vx = 0;
  }
  window.addEventListener('pointermove', function (e) { onPointer(e.clientX, e.clientY); }, { passive: true });
  window.addEventListener('pointerdown', function (e) {
    onPointer(e.clientX, e.clientY);
    if (prefersReduced()) return;
    burst = 1;
    stir();
  }, { passive: true });
  window.addEventListener('pointerleave', onLeave);
  document.addEventListener('mouseleave', onLeave);
  window.addEventListener('resize', function () { measure(); if (prefersReduced()) drawStatic(); });

  var ripples = [document.getElementById('ripple1'), document.getElementById('ripple2')];
  var rippleFlip = false;
  function stir() {
    rippleFlip = !rippleFlip;
    for (var i = 0; i < ripples.length; i++) {
      var el = ripples[i];
      if (!el || !el.classList) continue;
      el.classList.remove('go');
      if (el.getBoundingClientRect) void el.getBoundingClientRect().width;
      el.classList.add('go');
    }
    setTimeout(function () {
      for (var j = 0; j < ripples.length; j++) {
        if (ripples[j] && ripples[j].classList) ripples[j].classList.remove('go');
      }
    }, 1500);
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  var steam = [];
  var motes = [];
  function spawnSteam(boost) {
    var fromGrip = Math.random() < 0.22;
    var sx = fromGrip ? bowl.gripX + rand(-14, 14) : bowl.x + rand(-0.72, 0.72) * bowl.rx;
    var sy = fromGrip ? bowl.gripY + rand(-4, 10) : bowl.y + rand(-0.35, 0.35) * bowl.ry - 4;
    steam.push({
      x: sx, y: sy,
      vx: rand(-4, 4) * unit, vy: rand(-30, -18) * unit * (boost ? 1.25 : 1),
      life: 0, max: rand(3.2, 5.6),
      r: rand(9, 18) * unit, grow: rand(7, 13) * unit,
      phase: rand(0, Math.PI * 2), wob: rand(0.5, 1.1)
    });
  }
  function spawnMote(anywhere) {
    motes.push({
      x: bowl.x + rand(-1.4, 1.4) * bowl.rx,
      y: anywhere ? rand(0, ch) : bowl.y + rand(-1.2, 0.6) * bowl.rx,
      vx: rand(-3, 3), vy: rand(-5, -1),
      r: rand(0.7, 1.9), tw: rand(0, Math.PI * 2), ts: rand(0.4, 1.2)
    });
  }
  for (var s = 0; s < 34; s++) { spawnSteam(false); steam[s].life = rand(0, steam[s].max); steam[s].y -= rand(0, 130); }
  for (var m = 0; m < 22; m++) spawnMote(true);

  function drawStatic() {
    if (!ctx) return;
    ctx.clearRect(0, 0, cw, ch);
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    var wisps = [
      { x: bowl.x - bowl.rx * 0.30, y: bowl.y - bowl.rx * 0.42, r: bowl.rx * 0.20, a: 0.10 },
      { x: bowl.x, y: bowl.y - bowl.rx * 0.55, r: bowl.rx * 0.26, a: 0.12 },
      { x: bowl.x + bowl.rx * 0.30, y: bowl.y - bowl.rx * 0.40, r: bowl.rx * 0.18, a: 0.09 },
      { x: bowl.x - bowl.rx * 0.10, y: bowl.y - bowl.rx * 0.85, r: bowl.rx * 0.30, a: 0.07 },
      { x: bowl.x + bowl.rx * 0.14, y: bowl.y - bowl.rx * 0.95, r: bowl.rx * 0.34, a: 0.06 }
    ];
    for (var i = 0; i < wisps.length; i++) {
      var w = wisps[i];
      var g = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.r);
      g.addColorStop(0, 'rgba(255,244,226,' + w.a + ')');
      g.addColorStop(1, 'rgba(255,244,226,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    scene.style.setProperty('--px', '0');
    scene.style.setProperty('--py', '0');
    scene.style.setProperty('--warm', '0.35');
    scene.style.setProperty('--flicker', '1');
  }

  var rafId = 0, last = 0, spawnAcc = 0, flick = 1, running = false;
  function frame(now) {
    rafId = requestAnimationFrame(frame);
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (dt <= 0) dt = 0.016;
    current.x += (target.x - current.x) * (1 - Math.pow(0.0015, dt));
    current.y += (target.y - current.y) * (1 - Math.pow(0.0015, dt));
    current.warm += (target.warm - current.warm) * (1 - Math.pow(0.01, dt));
    burst = Math.max(0, burst - dt * 0.55);
    pointer.vx *= Math.pow(0.001, dt);
    var flickTarget = 0.97 + Math.random() * 0.05;
    flick += (flickTarget - flick) * Math.min(1, dt * 3);
    scene.style.setProperty('--px', current.x.toFixed(3));
    scene.style.setProperty('--py', current.y.toFixed(3));
    scene.style.setProperty('--warm', current.warm.toFixed(3));
    scene.style.setProperty('--flicker', flick.toFixed(3));
    if (!ctx) return;
    var wind = (current.x * 14 + Math.max(-26, Math.min(26, pointer.vx * 0.55))) * unit;
    var rate = 7 + current.warm * 9 + burst * 22;
    spawnAcc += rate * dt;
    while (spawnAcc >= 1 && steam.length < 90) { spawnAcc -= 1; spawnSteam(burst > 0.2); }
    if (spawnAcc > 3) spawnAcc = 3;
    ctx.clearRect(0, 0, cw, ch);
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (var i = steam.length - 1; i >= 0; i--) {
      var p = steam[i];
      p.life += dt;
      if (p.life >= p.max || p.y < -90) { steam.splice(i, 1); continue; }
      var t = p.life / p.max;
      p.phase += dt * p.wob * 2.1;
      p.vx += (Math.sin(p.phase) * 9 * unit + wind * (0.25 + t * 0.9)) * dt;
      p.vx *= Math.pow(0.35, dt);
      p.vy -= 3.2 * unit * dt;
      if (pointer.inside) {
        var pdx = p.x - pointer.x, pdy = p.y - pointer.y;
        var pd2 = pdx * pdx + pdy * pdy;
        var pr = 120 * Math.max(unit, 0.75);
        if (pd2 < pr * pr && pd2 > 0.01) {
          var pd = Math.sqrt(pd2);
          var push = (1 - pd / pr) * 90 * unit * dt;
          p.vx += (pdx / pd) * push + (-pdy / pd) * push * 0.45;
          p.vy += (pdy / pd) * push * 0.6;
        }
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      var rad = p.r + p.grow * p.life * 2.2;
      var fadeIn = Math.min(1, t / 0.16);
      var fadeOut = Math.min(1, (1 - t) / 0.42);
      var alpha = 0.16 * fadeIn * fadeOut * (0.75 + current.warm * 0.45 + burst * 0.35);
      var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
      g.addColorStop(0, 'rgba(255,246,232,' + alpha.toFixed(3) + ')');
      g.addColorStop(0.55, 'rgba(255,238,218,' + (alpha * 0.45).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,238,218,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI * 2); ctx.fill();
    }
    for (var k = 0; k < motes.length; k++) {
      var d = motes[k];
      d.tw += dt * d.ts * 2;
      d.x += (d.vx + wind * 0.06) * dt; d.y += d.vy * dt;
      if (d.y < -6 || d.x < -6 || d.x > cw + 6) { motes[k] = { x: bowl.x + rand(-1.4, 1.4) * bowl.rx, y: ch + 4, vx: rand(-3, 3), vy: rand(-5, -1), r: rand(0.7, 1.9), tw: rand(0, 6.28), ts: rand(0.4, 1.2) }; d = motes[k]; }
      var a = 0.10 + 0.10 * (0.5 + 0.5 * Math.sin(d.tw));
      ctx.fillStyle = 'rgba(255,206,150,' + (a * (0.6 + current.warm * 0.6)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  function startLoop() {
    if (running) return;
    running = true; last = 0;
    rafId = requestAnimationFrame(frame);
  }
  function stopLoop() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }
  function applyMotionMode() {
    if (prefersReduced()) { stopLoop(); drawStatic(); }
    else { startLoop(); }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopLoop();
    else applyMotionMode();
  });
  if (motionQuery && motionQuery.addEventListener) motionQuery.addEventListener('change', applyMotionMode);
  else if (motionQuery && motionQuery.addListener) motionQuery.addListener(applyMotionMode);
  applyMotionMode();
})();
</script>
</body>
</html>
