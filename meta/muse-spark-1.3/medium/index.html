<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vegan Ramen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #05070a;
  }
  body {
    display: grid;
    place-items: center;
    font-family: sans-serif;
  }
  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(120vmax 90vmax at 50% 118%, #1a0f06 0%, #0b0e13 42%, #05070a 72%),
      #05070a;
    perspective: 1100px;
  }
  /* ambient warm halo behind bowl */
  .halo {
    position: absolute;
    width: 92vmin;
    height: 92vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,150,60,.22) 0%, rgba(255,120,40,.10) 32%, rgba(255,110,40,.03) 55%, transparent 70%);
    filter: blur(6px);
    animation: haloBreathe 7s ease-in-out infinite;
    will-change: transform, opacity;
  }
  @keyframes haloBreathe {
    0%, 100% { opacity: .85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.045); }
  }
  /* cool rim light from above-left for depth */
  .coolwash {
    position: absolute;
    inset: 0;
    background: radial-gradient(70vmax 50vmax at 30% 8%, rgba(120,170,255,.07), transparent 60%);
    pointer-events: none;
  }
  .floor-glow {
    position: absolute;
    left: 50%;
    bottom: 8vh;
    width: 70vmin;
    height: 12vmin;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(255,140,50,.16), transparent 70%);
    filter: blur(12px);
    pointer-events: none;
  }
  .bowl-tilt {
    transform-style: preserve-3d;
    will-change: transform;
    display: grid;
    place-items: center;
    width: min(84vmin, 92vw);
  }
  .bowl-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,.65)) drop-shadow(0 6px 22px rgba(255,130,40,.10));
  }
  /* --- life: gentle bobbing --- */
  .bob-a { animation: bobA 5.2s ease-in-out infinite; }
  .bob-b { animation: bobA 6.3s ease-in-out -1.4s infinite; }
  .bob-c { animation: bobA 4.6s ease-in-out -.8s infinite; }
  .bob-d { animation: bobA 5.8s ease-in-out -2.6s infinite; }
  @keyframes bobA {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .broth-shine {
    animation: shineDrift 6s ease-in-out infinite;
  }
  @keyframes shineDrift {
    0%, 100% { opacity: .55; transform: translateX(0); }
    50% { opacity: .9; transform: translateX(10px); }
  }
  .bubble { animation: bubbleRise 4s ease-in infinite; transform-box: fill-box; transform-origin: center; }
  .bubble.b2 { animation-delay: -1.3s; animation-duration: 5.1s; }
  .bubble.b3 { animation-delay: -2.6s; animation-duration: 3.6s; }
  .bubble.b4 { animation-delay: -3.4s; animation-duration: 4.6s; }
  @keyframes bubbleRise {
    0% { opacity: 0; transform: translateY(6px) scale(.6); }
    25% { opacity: .8; }
    100% { opacity: 0; transform: translateY(-10px) scale(1.15); }
  }
  .oil-glint { animation: glintPulse 3.8s ease-in-out infinite; }
  .oil-glint.g2 { animation-delay: -1.9s; }
  @keyframes glintPulse {
    0%, 100% { opacity: .35; }
    50% { opacity: .95; }
  }
  /* steam canvas + vignette + grain */
  #steam {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 90% at 50% 46%, transparent 46%, rgba(0,0,0,.42) 76%, rgba(0,0,0,.82) 100%);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage" role="img" aria-label="A steaming bowl of vegan ramen glowing in the dark">
  <div class="halo" id="halo"></div>
  <div class="coolwash"></div>
  <div class="floor-glow"></div>

  <div class="bowl-tilt" id="tilt">
    <svg class="bowl-svg" viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <radialGradient id="brothGrad" cx="46%" cy="38%" r="75%">
          <stop offset="0%" stop-color="#f2b25c"/>
          <stop offset="28%" stop-color="#d98a32"/>
          <stop offset="62%" stop-color="#9c4d16"/>
          <stop offset="100%" stop-color="#5c2508"/>
        </radialGradient>
        <linearGradient id="bowlBody" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#0d1117"/>
          <stop offset="18%" stop-color="#232c38"/>
          <stop offset="42%" stop-color="#11161e"/>
          <stop offset="72%" stop-color="#1c1410"/>
          <stop offset="88%" stop-color="#4a2b14"/>
          <stop offset="100%" stop-color="#14100c"/>
        </linearGradient>
        <linearGradient id="bowlLower" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1a212c"/>
          <stop offset="30%" stop-color="#0d1117"/>
          <stop offset="100%" stop-color="#030405"/>
        </linearGradient>
        <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#5a6678" stop-opacity=".1"/>
          <stop offset="22%" stop-color="#cfd9e6" stop-opacity=".85"/>
          <stop offset="45%" stop-color="#ffffff" stop-opacity=".5"/>
          <stop offset="70%" stop-color="#ff9a4d" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#3a2a1c" stop-opacity=".2"/>
        </linearGradient>
        <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#b8e986"/>
          <stop offset="55%" stop-color="#4e9b4a"/>
          <stop offset="100%" stop-color="#23562b"/>
        </linearGradient>
        <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f4ffe8"/>
          <stop offset="100%" stop-color="#b9d9a4"/>
        </linearGradient>
        <linearGradient id="shroomGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a9764f"/>
          <stop offset="55%" stop-color="#6e4426"/>
          <stop offset="100%" stop-color="#3a2111"/>
        </linearGradient>
        <linearGradient id="noodleGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffe9b8"/>
          <stop offset="100%" stop-color="#d9a24e"/>
        </linearGradient>
        <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#000" stop-opacity=".75"/>
          <stop offset="60%" stop-color="#000" stop-opacity=".4"/>
          <stop offset="100%" stop-color="#000" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="brothClip">
          <ellipse cx="320" cy="238" rx="196" ry="74"/>
        </clipPath>
      </defs>

      <!-- ground shadow -->
      <ellipse cx="320" cy="452" rx="220" ry="42" fill="url(#shadowGrad)"/>

      <!-- bowl foot -->
      <ellipse cx="320" cy="438" rx="72" ry="16" fill="#05070a"/>
      <path d="M252 428 L256 448 Q320 464 384 448 L388 428 Z" fill="#0b0e13" stroke="#2a3442" stroke-width="1.5" opacity=".9"/>

      <!-- bowl body -->
      <path d="M118 244 C132 348 208 414 320 420 C432 414 508 348 522 244 L498 244 C488 330 410 392 320 396 C230 392 152 330 142 244 Z"
            fill="url(#bowlBody)" stroke="#05070a" stroke-width="2"/>
      <path d="M142 244 C152 330 230 392 320 396 C410 392 488 330 498 244 L482 244 C470 322 402 378 320 382 C238 378 170 322 158 244 Z"
            fill="url(#bowlLower)" opacity=".55"/>
      <!-- warm bounce light on bowl -->
      <path d="M452 280 C470 320 440 372 380 398 C430 384 480 330 466 276 Z" fill="#ff8a35" opacity=".18"/>
      <path d="M180 280 C162 318 188 368 244 394 C200 378 158 330 168 278 Z" fill="#8fb4ff" opacity=".10"/>

      <!-- rim -->
      <ellipse cx="320" cy="240" rx="208" ry="82" fill="#0a0d12" stroke="#05070a" stroke-width="2"/>
      <ellipse cx="320" cy="240" rx="208" ry="82" fill="none" stroke="url(#rimLight)" stroke-width="5" opacity=".9"/>
      <ellipse cx="320" cy="238" rx="196" ry="74" fill="url(#brothGrad)"/>

      <!-- contents clipped to broth -->
      <g clip-path="url(#brothClip)">
        <!-- chili-oil swirl -->
        <path d="M150 250 C220 218 360 214 470 246 C420 232 300 230 210 252 C300 244 400 248 462 264 C360 268 230 268 150 250 Z"
              fill="#b3270e" opacity=".5"/>
        <path d="M180 262 C260 244 380 244 452 260" stroke="#ff5a1f" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
        <!-- noodle mass base -->
        <ellipse cx="320" cy="246" rx="150" ry="52" fill="#e8b96a" opacity=".55"/>
        <!-- noodle strands -->
        <g fill="none" stroke="url(#noodleGrad)" stroke-linecap="round">
          <path d="M180 244 C220 228 260 258 300 242 C340 226 380 256 430 240 C450 234 466 240 476 246" stroke-width="9" opacity=".95"/>
          <path d="M172 256 C214 242 250 268 296 252 C344 236 386 266 436 250" stroke-width="8" opacity=".9"/>
          <path d="M200 268 C244 254 286 276 330 262 C376 248 410 270 446 258" stroke-width="8" opacity=".85"/>
          <path d="M230 232 C266 218 300 240 342 226 C384 212 420 236 452 228" stroke-width="7" opacity=".8"/>
          <path d="M196 238 C236 224 276 248 318 234" stroke-width="6" opacity=".9"/>
        </g>
        <g fill="none" stroke="#fff3d0" stroke-linecap="round" opacity=".5">
          <path d="M184 243 C220 229 258 256 298 241" stroke-width="2"/>
          <path d="M300 241 C340 227 378 254 428 239" stroke-width="2"/>
          <path d="M206 266 C250 253 292 273 336 260" stroke-width="2"/>
        </g>
        <!-- broth bubbles -->
        <g fill="#ffe6b0">
          <circle class="bubble" cx="250" cy="262" r="4"/>
          <circle class="bubble b2" cx="380" cy="266" r="5"/>
          <circle class="bubble b3" cx="330" cy="272" r="3.2"/>
          <circle class="bubble b4" cx="300" cy="258" r="2.6"/>
        </g>
        <!-- oil droplets -->
        <g>
          <ellipse cx="262" cy="230" rx="14" ry="5" fill="#ff7b1c" opacity=".7"/>
          <ellipse class="oil-glint" cx="258" cy="229" rx="5" ry="2" fill="#fff" opacity=".8"/>
          <ellipse cx="398" cy="244" rx="18" ry="6" fill="#ff7b1c" opacity=".6"/>
          <ellipse class="oil-glint g2" cx="394" cy="243" rx="6" ry="2.2" fill="#fff" opacity=".8"/>
          <ellipse cx="342" cy="222" rx="10" ry="4" fill="#ffc46b" opacity=".65"/>
        </g>
        <!-- drifting shine -->
        <ellipse class="broth-shine" id="brothShine" cx="252" cy="218" rx="86" ry="16" fill="#fff" opacity=".55"/>
      </g>

      <!-- bok choy (left) -->
      <g class="bob-a">
        <path d="M168 236 C150 200 156 168 186 152 C200 176 198 210 188 238 Z" fill="url(#leafGrad)" stroke="#1c3d22" stroke-width="1.5"/>
        <path d="M186 152 C178 180 178 208 188 238" stroke="#e8f7d0" stroke-width="2" opacity=".7" fill="none"/>
        <path d="M196 244 C184 214 188 184 210 168 C222 192 220 222 214 246 Z" fill="url(#stemGrad)" opacity=".95"/>
        <path d="M210 168 C214 150 228 138 244 136 C248 156 240 178 228 192 Z" fill="url(#leafGrad)" stroke="#1c3d22" stroke-width="1.2"/>
      </g>

      <!-- mushrooms (right-center) -->
      <g class="bob-b">
        <ellipse cx="420" cy="228" rx="46" ry="22" fill="url(#shroomGrad)" stroke="#2a1608" stroke-width="2"/>
        <ellipse cx="412" cy="222" rx="20" ry="8" fill="#d9a878" opacity=".55"/>
        <path d="M388 228 Q420 240 452 228" stroke="#f3d3a6" stroke-width="2" fill="none" opacity=".6"/>
        <ellipse cx="376" cy="250" rx="34" ry="16" fill="url(#shroomGrad)" stroke="#2a1608" stroke-width="1.6"/>
        <path d="M352 250 Q376 258 400 250" stroke="#f3d3a6" stroke-width="1.6" fill="none" opacity=".55"/>
      </g>

      <!-- corn cluster -->
      <g class="bob-c">
        <g fill="#ffd23f" stroke="#8a5a00" stroke-width="1">
          <circle cx="300" cy="196" r="10"/><circle cx="318" cy="192" r="10"/><circle cx="336" cy="196" r="10"/>
          <circle cx="309" cy="208" r="10"/><circle cx="327" cy="208" r="10"/><circle cx="318" cy="180" r="9"/>
        </g>
        <g fill="#fff3a6" opacity=".9">
          <circle cx="297" cy="193" r="2.4"/><circle cx="315" cy="189" r="2.4"/><circle cx="333" cy="193" r="2.4"/>
          <circle cx="306" cy="205" r="2.4"/><circle cx="324" cy="205" r="2.4"/>
        </g>
      </g>

      <!-- scallions -->
      <g class="bob-d" fill="none" stroke-linecap="round">
        <g stroke="#2f7a33" stroke-width="6"><ellipse cx="250" cy="272" rx="12" ry="7"/><ellipse cx="392" cy="272" rx="12" ry="7"/><ellipse cx="352" cy="284" rx="11" ry="6"/></g>
        <g stroke="#9be08a" stroke-width="2.6"><ellipse cx="250" cy="272" rx="12" ry="7"/><ellipse cx="392" cy="272" rx="12" ry="7"/><ellipse cx="352" cy="284" rx="11" ry="6"/></g>
        <g fill="#c6f5b5"><circle cx="250" cy="272" r="1.6"/><circle cx="392" cy="272" r="1.6"/></g>
      </g>

      <!-- nori sheet -->
      <g class="bob-b">
        <rect x="452" y="150" width="56" height="86" rx="6" transform="rotate(14 480 193)"
              fill="#0d1512" stroke="#22302a" stroke-width="2"/>
        <rect x="462" y="162" width="36" height="62" rx="3" transform="rotate(14 480 193)" fill="none" stroke="#2c3f36" stroke-width="1" opacity=".7"/>
      </g>

      <!-- sesame -->
      <g fill="#fff4d6" opacity=".9">
        <ellipse cx="282" cy="246" rx="3.4" ry="1.8" transform="rotate(-20 282 246)"/>
        <ellipse cx="362" cy="238" rx="3.4" ry="1.8" transform="rotate(18 362 238)"/>
        <ellipse cx="312" cy="256" rx="3" ry="1.6" transform="rotate(-8 312 256)"/>
        <ellipse cx="404" cy="256" rx="3" ry="1.6" transform="rotate(24 404 256)"/>
      </g>

      <!-- tofu cube -->
      <g class="bob-c">
        <rect x="224" y="196" width="44" height="30" rx="5" fill="#fdf6e8" stroke="#c9a86a" stroke-width="1.5"/>
        <rect x="224" y="196" width="44" height="10" rx="5" fill="#fff" opacity=".8"/>
      </g>

      <!-- front rim catchlight -->
      <path d="M170 268 C230 296 410 296 470 268" fill="none" stroke="#ffb066" stroke-width="3" opacity=".35" stroke-linecap="round"/>
    </svg>
  </div>

  <canvas id="steam"></canvas>
  <div class="vignette"></div>
</div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var tilt = document.getElementById('tilt');
  var halo = document.getElementById('halo');
  var shine = document.getElementById('brothShine');
  var canvas = document.getElementById('steam');
  var ctx = canvas.getContext('2d');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth; H = stage.clientHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildEmbers();
  }
  window.addEventListener('resize', resize);

  // pointer state (-1..1) + velocity for wind
  var px = 0, py = 0, tx = 0, ty = 0, pvx = 0, pvy = 0, lastX = 0, lastY = 0;
  var glowX = 0, glowY = 0;
  window.addEventListener('pointermove', function (e) {
    var nx = (e.clientX / window.innerWidth) * 2 - 1;
    var ny = (e.clientY / window.innerHeight) * 2 - 1;
    pvx = nx - lastX; pvy = ny - lastY;
    lastX = nx; lastY = ny;
    tx = nx; ty = ny;
  }, { passive: true });
  window.addEventListener('pointerleave', function () { tx = 0; ty = 0; });

  // steam wisps
  var wisps = [];
  function bowlAnchor() {
    var r = tilt.getBoundingClientRect();
    return { x: r.left + r.width * 0.5, y: r.top + r.height * 0.34, w: r.width };
  }
  function spawnWisp(seed) {
    var a = bowlAnchor();
    return {
      bx: a.x + (Math.random() - 0.5) * a.w * 0.42,
      y: seed ? a.y - Math.random() * H * 0.5 : a.y,
      r: 22 + Math.random() * 46,
      life: Math.random(),
      speed: 0.0009 + Math.random() * 0.0016,
      phase: Math.random() * Math.PI * 2,
      sway: 18 + Math.random() * 42,
      alpha: 0.05 + Math.random() * 0.10
    };
  }
  function buildWisps() {
    wisps = [];
    var n = reduced ? 10 : 34;
    for (var i = 0; i < n; i++) wisps.push(spawnWisp(true));
  }

  // ambient embers / dust
  var embers = [];
  function buildEmbers() {
    embers = [];
    var n = reduced ? 0 : Math.min(90, Math.floor(W * H / 18000));
    for (var i = 0; i < n; i++) {
      embers.push({
        x: Math.random() * W, y: Math.random() * H,
        r: 0.6 + Math.random() * 1.9,
        vy: 0.12 + Math.random() * 0.4,
        ph: Math.random() * Math.PI * 2,
        warm: Math.random() < 0.55
      });
    }
  }

  function drawSteam(t) {
    ctx.clearRect(0, 0, W, H);
    var a = bowlAnchor();

    // embers first (behind steam)
    ctx.save();
    for (var i = 0; i < embers.length; i++) {
      var m = embers[i];
      m.y -= m.vy;
      m.x += Math.sin(t * 0.0004 + m.ph) * 0.15 + pvx * 6;
      if (m.y < -8) { m.y = H + 8; m.x = Math.random() * W; }
      var tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.001 + m.ph));
      ctx.globalAlpha = 0.5 * tw;
      ctx.fillStyle = m.warm ? '#ffb066' : '#9fc0ff';
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // steam: soft additive puffs
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var j = 0; j < wisps.length; j++) {
      var s = wisps[j];
      s.life += s.speed * 16;
      if (s.life > 1) { wisps[j] = spawnWisp(false); continue; }
      var rise = s.life * H * 0.52;
      var y = a.y - rise;
      var x = s.bx + Math.sin(s.phase + t * 0.0009 + rise * 0.012) * (s.sway * (0.4 + s.life))
              + pvx * 260 * s.life + px * 40 * s.life;
      var fade = Math.sin(s.life * Math.PI); // inhale/exhale
      var rad = s.r * (0.7 + s.life * 1.5);
      var g = ctx.createRadialGradient(x, y, 0, x, y, rad);
      var al = (s.alpha * fade).toFixed(3);
      g.addColorStop(0, 'rgba(255,235,210,' + al + ')');
      g.addColorStop(0.55, 'rgba(255,220,190,' + (al * 0.5) + ')');
      g.addColorStop(1, 'rgba(255,220,190,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y, rad, rad * 1.35, 0.12 * Math.sin(s.phase + t * 0.0006), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // smooth parallax + warmth response
  function applyParallax() {
    px += (tx - px) * 0.055;
    py += (ty - py) * 0.055;
    pvx *= 0.92; pvy *= 0.92;
    glowX += (tx - glowX) * 0.04;
    glowY += (ty - glowY) * 0.04;
    var rY = px * 9, rX = -py * 7;
    tilt.style.transform = 'rotateX(' + rX.toFixed(2) + 'deg) rotateY(' + rY.toFixed(2) + 'deg) translate3d(' + (px * 14).toFixed(1) + 'px,' + (py * 10).toFixed(1) + 'px,0)';
    halo.style.transform = 'translate(' + (glowX * 46).toFixed(1) + 'px,' + (glowY * 30).toFixed(1) + 'px) scale(' + (1 + Math.abs(px) * 0.03) + ')';
    if (shine) shine.setAttribute('transform', 'translate(' + (px * 22).toFixed(1) + ' 0)');
  }

  resize();
  buildWisps();

  if (reduced) {
    // one calm static frame, no loop
    applyParallax();
    drawSteam(1200);
    return;
  }

  var start = performance.now();
  (function frame(now) {
    var t = now - start;
    applyParallax();
    drawSteam(t);
    requestAnimationFrame(frame);
  })(start);
})();
</script>
</body>
</html>
