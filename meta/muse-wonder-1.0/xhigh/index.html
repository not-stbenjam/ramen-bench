<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#070403}
  body{
    --mx:0; --my:0; --lx:50%; --ly:42%;
    font-family:system-ui,sans-serif;
  }
  .scene{
    position:fixed; inset:0; overflow:hidden; isolation:isolate;
    background:
      radial-gradient(ellipse 90% 62% at var(--lx) var(--ly), rgba(255,166,66,.17) 0%, rgba(196,98,32,.08) 32%, transparent 62%),
      radial-gradient(ellipse 120% 90% at 50% 108%, #1a0f08 0%, #0d0704 48%, #050302 100%);
  }
  /* warm ambient halo behind bowl */
  .halo{
    position:absolute; left:50%; top:52%; width:min(92vmin,760px); aspect-ratio:1;
    transform:translate(-50%,-54%);
    border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle, rgba(255,176,84,.20) 0%, rgba(232,116,42,.10) 34%, rgba(120,52,18,.04) 58%, transparent 70%);
    filter:blur(6px);
    animation:breathe 7s ease-in-out infinite;
  }
  .halo::after{
    content:""; position:absolute; inset:18%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,205,130,.14), transparent 65%);
    filter:blur(18px);
  }
  /* table surface */
  .table{
    position:absolute; left:50%; top:68%; width:130vmax; height:52%;
    transform:translateX(-50%);
    background:
      radial-gradient(ellipse 52% 68% at 50% 0%, rgba(112,62,28,.28), rgba(52,30,14,.16) 46%, transparent 72%),
      linear-gradient(180deg, rgba(38,22,11,.0), rgba(22,13,7,.55) 38%, #090503 100%);
    z-index:0; pointer-events:none;
  }
  .table::before{
    content:""; position:absolute; inset:0; opacity:.5;
    background:repeating-linear-gradient(92deg, transparent 0 118px, rgba(0,0,0,.14) 118px 119px, transparent 119px 260px);
    mask-image:linear-gradient(180deg, transparent, #000 30%, transparent 88%);
    -webkit-mask-image:linear-gradient(180deg, transparent, #000 30%, transparent 88%);
  }
  #fx{position:absolute; inset:0; width:100%; height:100%; z-index:3; pointer-events:none}
  .stage{
    position:absolute; left:50%; top:50%; z-index:2;
    width:min(96vw, 880px);
    transform:translate(calc(-50% + var(--mx)*10px), calc(-50% + var(--my)*7px));
    will-change:transform;
  }
  @media (max-aspect-ratio: 3/4){
    .stage{ width:112vw; top:52%; }
  }
  .stage svg{display:block; width:100%; height:auto; overflow:visible;
    filter:drop-shadow(0 28px 42px rgba(0,0,0,.62));
    animation:bob 6.5s ease-in-out infinite;
    transform-origin:50% 62%;
  }
  .vignette{
    position:absolute; inset:0; z-index:4; pointer-events:none;
    background:
      radial-gradient(ellipse 78% 68% at 50% 46%, transparent 52%, rgba(0,0,0,.42) 82%, rgba(0,0,0,.82) 100%),
      linear-gradient(180deg, rgba(0,0,0,.38), transparent 22%, transparent 78%, rgba(0,0,0,.5));
  }
  .warmth{
    position:absolute; inset:0; z-index:4; pointer-events:none; mix-blend-mode:screen; opacity:.55;
    background:radial-gradient(circle 340px at var(--lx) var(--ly), rgba(255,178,92,.14), transparent 70%);
    transition:opacity .6s;
  }
  /* SVG internal motion */
  .lift{ transform-origin:560px 168px; animation:sway 5.2s ease-in-out infinite; }
  .noodle-hang{ transform-origin:538px 210px; animation:dangle 4.6s ease-in-out infinite; }
  .ripple{ transform-origin:400px 342px; animation:ripple 4.8s ease-out infinite; }
  .ripple.r2{ animation-delay:1.6s } .ripple.r3{ animation-delay:3.1s }
  .shimmer{ animation:shimmer 3.8s ease-in-out infinite; }
  .oil{ animation:oil 3.4s ease-in-out infinite; }
  .oil.o2{ animation-delay:.7s } .oil.o3{ animation-delay:1.3s }
  .leaf-sway{ transform-origin:268px 316px; animation:leaf 6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-5px) rotate(.12deg)} }
  @keyframes breathe{ 0%,100%{opacity:.82; transform:translate(-50%,-54%) scale(1)} 50%{opacity:1; transform:translate(-50%,-54%) scale(1.045)} }
  @keyframes sway{ 0%,100%{transform:rotate(-.7deg)} 50%{transform:rotate(1.1deg)} }
  @keyframes dangle{ 0%,100%{transform:rotate(-1.6deg) translateY(0)} 50%{transform:rotate(2deg) translateY(2px)} }
  @keyframes ripple{ 0%{opacity:0; transform:scale(.72)} 28%{opacity:.5} 100%{opacity:0; transform:scale(1.06)} }
  @keyframes shimmer{ 0%,100%{opacity:.35} 50%{opacity:.85} }
  @keyframes oil{ 0%,100%{opacity:.55} 50%{opacity:1} }
  @keyframes leaf{ 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(1.4deg)} }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation:none !important; transition:none !important; }
    .stage svg{ animation:none !important; }
  }
</style>
</head>

<script>
(function(){
  var scene=document.getElementById('scene'), stage=document.getElementById('stage');
  var canvas=document.getElementById('fx'), ctx=canvas.getContext('2d');
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0,H=0,DPR=1, raf=0, t=0;
  var mx=0,my=0,tx=0,ty=0, smx=0,smy=0; // mouse + smoothed
  var steam=[], motes=[];

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize(); window.addEventListener('resize',resize,{passive:true});

  // bowl anchor in screen space (matches .stage centre)
  function bowlPos(){
    var s=Math.min(W*0.96,880); if(W/H<0.75) s=W*1.12;
    return { x:W/2, y:H*0.5 - s*0.02, surfY:H*0.5 - s*0.155, surfW:s*0.30 };
  }

  function makeSteam(seed){
    var b=bowlPos();
    return {
      x:b.x+(Math.random()-0.5)*b.surfW*1.15,
      y:b.surfY+Math.random()*10,
      r:10+Math.random()*22,
      vy:-(0.32+Math.random()*0.55),
      vx:(Math.random()-0.5)*0.18,
      life:0, max:260+Math.random()*220,
      ph:Math.random()*Math.PI*2,
      sw:0.4+Math.random()*0.9,
      a:0.05+Math.random()*0.10
    };
  }
  function makeMote(){
    return { x:Math.random()*W, y:H*0.25+Math.random()*H*0.65, r:0.6+Math.random()*1.7,
      vy:-(0.05+Math.random()*0.16), vx:(Math.random()-0.5)*0.08, ph:Math.random()*Math.PI*2, a:0.12+Math.random()*0.3 };
  }
  for(var i=0;i<34;i++){ var p=makeSteam(); p.life=Math.random()*p.max; p.y-=Math.random()*180; steam.push(p); }
  for(var j=0;j<42;j++) motes.push(makeMote());

  function drawSteamParticle(p){
    var k=p.life/p.max;
    var fade=Math.sin(Math.min(k,1)*Math.PI); // in-out
    var drift=Math.sin(t*0.012*p.sw+p.ph)*14*(0.4+k) + smx*46*k;
    var x=p.x+drift + p.vx*p.life;
    var y=p.y + p.vy*p.life - k*k*30;
    var r=p.r + k*54;
    var alpha=p.a*fade*(reduced?0.7:1);
    if(alpha<=0.002) return;
    var g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(255,246,230,'+alpha+')');
    g.addColorStop(0.45,'rgba(255,238,214,'+(alpha*0.55)+')');
    g.addColorStop(1,'rgba(255,238,214,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }

  function drawStatic(){
    ctx.clearRect(0,0,W,H);
    // faint static steam
    for(var i=0;i<steam.length;i++){
      var p=steam[i], b=bowlPos();
      var x=b.x+Math.sin(p.ph)*b.surfW*0.5, y=b.surfY-40-(i%7)*22, r=26+(i%5)*10;
      var g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba(255,244,226,0.07)'); g.addColorStop(1,'rgba(255,244,226,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    // warm motes frozen
    ctx.fillStyle='rgba(255,196,110,0.35)';
    for(var j=0;j<motes.length;j+=3){ ctx.beginPath(); ctx.arc(motes[j].x,motes[j].y,motes[j].r,0,Math.PI*2); ctx.fill(); }
  }

  function frame(){
    t++;
    // smooth mouse
    smx+=(tx-smx)*0.045; smy+=(ty-smy)*0.045;
    document.body.style.setProperty('--mx',smx.toFixed(3));
    document.body.style.setProperty('--my',smy.toFixed(3));
    document.body.style.setProperty('--lx',(50+smx*9)+'%');
    document.body.style.setProperty('--ly',(42+smy*6)+'%');

    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';

    // ambient warm glow pulse at broth
    var b=bowlPos();
    var pulse=0.75+Math.sin(t*0.018)*0.25;
    var glow=ctx.createRadialGradient(b.x,b.surfY+26,0,b.x,b.surfY+26,b.surfW*1.35);
    glow.addColorStop(0,'rgba(255,166,64,'+(0.10*pulse)+')');
    glow.addColorStop(0.55,'rgba(214,96,28,'+(0.05*pulse)+')');
    glow.addColorStop(1,'rgba(214,96,28,0)');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(b.x,b.surfY+26,b.surfW*1.35,0,Math.PI*2); ctx.fill();

    // dust motes
    for(var j=0;j<motes.length;j++){
      var m=motes[j];
      m.y+=m.vy; m.x+=m.vx+Math.sin(t*0.01+m.ph)*0.08 + smx*0.12;
      if(m.y<H*0.12||m.x<-10||m.x>W+10){ motes[j]=makeMote(); motes[j].y=H*0.85; continue; }
      var tw=0.55+Math.sin(t*0.03+m.ph)*0.45;
      ctx.fillStyle='rgba(255,198,112,'+(m.a*tw)+')';
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2); ctx.fill();
    }

    ctx.globalCompositeOperation='source-over';
    // steam (soft, layered)
    for(var i=0;i<steam.length;i++){
      var p=steam[i]; p.life++;
      p.x+=smx*0.22*(p.life/p.max);
      if(p.life>=p.max) steam[i]=makeSteam();
      else drawSteamParticle(p);
    }
    // second pass wispy cores
    ctx.globalCompositeOperation='lighter';
    for(var k=0;k<steam.length;k+=3){
      var q=steam[k], kk=q.life/q.max, fx=Math.sin(t*0.012*q.sw+q.ph)*10;
      var gx=q.x+fx+smx*30*kk, gy=q.y+q.vy*q.life-10, gr=6+kk*16;
      var gg=ctx.createRadialGradient(gx,gy,0,gx,gy,gr);
      gg.addColorStop(0,'rgba(255,250,238,'+(0.05*Math.sin(Math.min(kk,1)*Math.PI))+')');
      gg.addColorStop(1,'rgba(255,250,238,0)');
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(gx,gy,gr,0,Math.PI*2); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
    raf=requestAnimationFrame(frame);
  }

  function onMove(cx,cy){
    tx=(cx/W-0.5)*2; ty=(cy/H-0.5)*2;
    tx=Math.max(-1,Math.min(1,tx)); ty=Math.max(-1,Math.min(1,ty));
  }
  window.addEventListener('pointermove',function(e){ onMove(e.clientX,e.clientY); },{passive:true});
  window.addEventListener('touchmove',function(e){ if(e.touches[0]) onMove(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});

  var mq=window.matchMedia('(prefers-reduced-motion: reduce)');
  function applyMotion(){
    reduced=mq.matches;
    if(raf) cancelAnimationFrame(raf);
    if(reduced){ document.body.style.setProperty('--mx',0); document.body.style.setProperty('--my',0); drawStatic(); }
    else raf=requestAnimationFrame(frame);
  }
  if(mq.addEventListener) mq.addEventListener('change',applyMotion);
  applyMotion();
})();
</script>
</body>
</html>
