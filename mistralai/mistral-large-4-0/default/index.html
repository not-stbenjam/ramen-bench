<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Steaming Bowl</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0705;
  }

  /* ---------- Scene stage ---------- */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    /* warm hearth-like vignette */
    background:
      radial-gradient(120% 90% at 50% 108%, #3a1f10 0%, #241309 34%, #140b06 62%, #0a0705 100%);
  }

  /* soft warm light pool rising from the bowl */
  #glow {
    position: absolute;
    left: 50%;
    bottom: 4vh;
    width: min(90vmin, 720px);
    height: min(70vmin, 560px);
    transform: translateX(-50%);
    background: radial-gradient(50% 55% at 50% 62%, rgba(255,166,77,0.20) 0%, rgba(255,120,40,0.08) 45%, rgba(255,120,40,0) 72%);
    filter: blur(6px);
    pointer-events: none;
    animation: breathe 7s ease-in-out infinite;
  }

  /* ---------- Bowl composition ---------- */
  #bowl-wrap {
    position: relative;
    width: min(78vmin, 560px);
    margin-bottom: 6vh;
    transform-origin: 50% 100%;
    will-change: transform;
  }

  #bowl-svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  /* gentle idle bob of the whole bowl */
  #bowl-wrap .bob {
    animation: bob 6.5s ease-in-out infinite;
    transform-origin: 50% 100%;
  }

  /* ---------- Steam ---------- */
  .steam {
    fill: none;
    stroke-linecap: round;
    stroke: rgba(255, 235, 215, 0.0);
    filter: blur(2.5px);
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: steamRise 9s linear infinite;
    opacity: 0;
  }
  .steam.s1 { stroke-width: 9;  animation-duration: 8.5s; animation-delay: 0s;    stroke: rgba(255,238,220,0.34); }
  .steam.s2 { stroke-width: 6.5;animation-duration: 11s;  animation-delay: -3.2s; stroke: rgba(255,228,200,0.26); }
  .steam.s3 { stroke-width: 8;  animation-duration: 9.5s; animation-delay: -6.1s; stroke: rgba(255,240,224,0.30); }
  .steam.s4 { stroke-width: 5;  animation-duration: 12.5s;animation-delay: -1.7s; stroke: rgba(255,222,190,0.20); }
  .steam.s5 { stroke-width: 7;  animation-duration: 10s;  animation-delay: -8.4s; stroke: rgba(255,236,214,0.24); }

  /* ---------- Broth shimmer ---------- */
  #broth-shimmer {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: shimmer 5.5s ease-in-out infinite;
    mix-blend-mode: screen;
  }

  /* ---------- Toppings gentle sway ---------- */
  .sway-a { transform-box: fill-box; transform-origin: 50% 100%; animation: swayA 7s ease-in-out infinite; }
  .sway-b { transform-box: fill-box; transform-origin: 50% 100%; animation: swayB 8.5s ease-in-out infinite; }

  /* ---------- Chopsticks idle drift ---------- */
  #chopsticks { transform-box: fill-box; transform-origin: 80% 90%; animation: chopDrift 9s ease-in-out infinite; }

  /* ---------- Keyframes ---------- */
  @keyframes breathe {
    0%, 100% { opacity: 0.85; transform: translateX(-50%) scale(1); }
    50%      { opacity: 1;    transform: translateX(-50%) scale(1.06); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30%      { transform: translateY(-4px) rotate(-0.4deg); }
    65%      { transform: translateY(2px) rotate(0.35deg); }
  }
  @keyframes steamRise {
    0%   { transform: translateY(14px) scale(0.7) skewX(0deg);   opacity: 0; }
    12%  { opacity: 1; }
    35%  { transform: translateY(-30px) scale(0.95) skewX(9deg); }
    65%  { transform: translateY(-85px) scale(1.15) skewX(-11deg); opacity: 0.75; }
    100% { transform: translateY(-150px) scale(1.45) skewX(7deg); opacity: 0; }
  }
  @keyframes shimmer {
    0%, 100% { transform: translateX(-6%) scale(1);    opacity: 0.5; }
    50%      { transform: translateX(6%) scale(1.08);  opacity: 0.85; }
  }
  @keyframes swayA {
    0%, 100% { transform: rotate(-2.4deg) translateY(0); }
    50%      { transform: rotate(2.2deg) translateY(-2px); }
  }
  @keyframes swayB {
    0%, 100% { transform: rotate(2deg) translateY(0); }
    50%      { transform: rotate(-2.6deg) translateY(1.5px); }
  }
  @keyframes chopDrift {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    50%      { transform: rotate(-1.6deg) translateY(-3px); }
  }

  /* ---------- Mouse-reactive tilt (JS-driven, smooth) ---------- */
  #tilt {
    transform-style: preserve-3d;
    will-change: transform;
  }

  /* floating dust / ember motes */
  .mote {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,190,120,0.55) 0%, rgba(255,140,60,0.18) 55%, rgba(255,140,60,0) 75%);
    pointer-events: none;
    animation: moteFloat linear infinite;
  }
  @keyframes moteFloat {
    0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
    15%  { opacity: 0.9; }
    85%  { opacity: 0.5; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; }
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    #glow, #bowl-wrap .bob, .steam, #broth-shimmer, .sway-a, .sway-b, #chopsticks, .mote {
      animation: none !important;
    }
    .steam { opacity: 0.55; transform: translateY(-40px) scale(1.05); }
    .mote { display: none; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var tilt = document.getElementById("tilt");
  var glow = document.getElementById("glow");
  var motesLayer = document.getElementById("motes");
  var stage = document.getElementById("stage");

  /* ---------- Ember / dust motes ---------- */
  var MOTE_COUNT = 16;
  function spawnMotes() {
    if (reduceMotion) return;
    motesLayer.innerHTML = "";
    for (var i = 0; i < MOTE_COUNT; i++) {
      var m = document.createElement("div");
      m.className = "mote";
      var size = 3 + Math.random() * 7;
      m.style.width = size + "px";
      m.style.height = size + "px";
      m.style.left = (38 + Math.random() * 24) + "%";
      m.style.bottom = (8 + Math.random() * 30) + "%";
      m.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
      m.style.setProperty("--dy", -(80 + Math.random() * 220) + "px");
      m.style.animationDuration = (7 + Math.random() * 10) + "s";
      m.style.animationDelay = (-Math.random() * 15) + "s";
      motesLayer.appendChild(m);
    }
  }
  spawnMotes();

  /* ---------- Mouse-reactive parallax tilt ---------- */
  var targetRX = 0, targetRY = 0, targetGX = 0, targetGY = 0;
  var curRX = 0, curRY = 0, curGX = 0, curGY = 0;

  function onMove(e) {
    var nx = (e.clientX / window.innerWidth) * 2 - 1;   // -1 .. 1
    var ny = (e.clientY / window.innerHeight) * 2 - 1;
    targetRY = nx * 7;    // rotate around Y (left/right)
    targetRX = -ny * 5;   // rotate around X (up/down)
    targetGX = nx * 26;   // glow shifts with cursor
    targetGY = -ny * 16;
  }

  function onLeave() {
    targetRX = targetRY = targetGX = targetGY = 0;
  }

  if (!reduceMotion) {
    window.addEventListener("mousemove", onMove, { passive: true });
    window.addEventListener("mouseout", onLeave);
    // touch: gentle response to touch position too
    window.addEventListener("touchmove", function (e) {
      if (e.touches.length) onMove(e.touches[0]);
    }, { passive: true });
    window.addEventListener("touchend", onLeave);
  }

  function frame() {
    curRX += (targetRX - curRX) * 0.06;
    curRY += (targetRY - curRY) * 0.06;
    curGX += (targetGX - curGX) * 0.05;
    curGY += (targetGY - curGY) * 0.05;

    tilt.style.transform =
      "perspective(900px) rotateX(" + curRX.toFixed(3) + "deg) rotateY(" + curRY.toFixed(3) + "deg)";
    glow.style.marginLeft = curGX.toFixed(2) + "px";
    glow.style.marginBottom = curGY.toFixed(2) + "px";

    requestAnimationFrame(frame);
  }

  if (!reduceMotion) {
    requestAnimationFrame(frame);
  } else {
    // static, calm composition: show a gentle fixed steam posture via CSS override (handled in media query)
    tilt.style.transform = "none";
  }

  /* ---------- Subtle warmth pulse tied to pointer proximity ---------- */
  if (!reduceMotion) {
    window.addEventListener("mousemove", function (e) {
      var r = stage.getBoundingClientRect();
      var dx = e.clientX - (r.left + r.width / 2);
      var dy = e.clientY - (r.top + r.height * 0.72);
      var d = Math.sqrt(dx * dx + dy * dy);
      var prox = Math.max(0, 1 - d / (r.width * 0.55)); // 0..1 near bowl
      glow.style.opacity = (0.85 + prox * 0.15).toFixed(3);
    }, { passive: true });
  }
})();
</script>
</body>
</html>
