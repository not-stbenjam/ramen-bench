schema_version = "1.3"
artifacts = ["/app/index.html"]

[metadata]
category = "creative-coding"
tags = ["html", "visual", "vegan-ramen"]

[agent]
timeout_sec = 1800.0

[environment]
cpus = 2
memory_mb = 2048
storage_mb = 4096

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 4096
storage_mb = 4096

[verifier.env]
RAMEN_JUDGE_MODELS = "${RAMEN_JUDGE_MODELS:-openrouter/openai/gpt-6.1-sol,openrouter/anthropic/claude-sonnet-5.5,openrouter/z-ai/glm-5.3-flash}"
RAMEN_JUDGE_EFFORTS = '${RAMEN_JUDGE_EFFORTS:-}'
RAMEN_JUDGE_SAMPLES = "${RAMEN_JUDGE_SAMPLES:-3}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}"
