<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070504">
<title>Vegan Ramen</title>
<style>
  :root {
    --mx: 0;
    --my: 0;
    --heat: 0.18;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #070504;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background:
      radial-gradient(ellipse 72% 30% at 50% 100%, #1a100c 0%, transparent 58%),
      #070504;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    perspective: 1600px;
  }

  .ambient {
    position: fixed;
    inset: -15%;
    pointer-events: none;
    background:
      radial-gradient(ellipse 36% 30% at calc(50% + var(--mx) * 4%) calc(52% + var(--my) * 3%),
        rgba(255, 150, 60, calc(0.22 + var(--heat) * 0.36)) 0%,
        rgba(150, 48, 14, calc(0.08 + var(--heat) * 0.1)) 34%,
        transparent 66%),
      radial-gradient(ellipse 14% 11% at calc(38% + var(--mx) * -2%) calc(40% + var(--my) * -2%),
        rgba(255, 214, 170, 0.05), transparent 70%);
  }

  #mist, #grain {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #grain { opacity: 0.14; mix-blend-mode: overlay; }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 70% 62% at 50% 50%, transparent 42%, rgba(0, 0, 0, 0.64) 100%);
  }

  .bowl {
    position: relative;
    z-index: 1;
    width: min(96vw, calc(88vh * 1.6), 1080px);
    aspect-ratio: 800 / 500;
    transform:
      rotateX(calc(var(--my) * -4.5deg))
      rotateY(calc(var(--mx) * 6.5deg))
      translate3d(calc(var(--mx) * 14px), calc(var(--my) * 8px), 0);
  }

  @media (max-width: 720px) {
    .bowl { width: min(94vw, calc(74vh * 1.6)); }
  }

  svg { display: block; width: 100%; height: 100%; overflow: visible; }

  #steamFar { filter: blur(16px); opacity: calc(0.5 + var(--heat) * 0.35); }
  #steamNear { filter: blur(6px); opacity: calc(0.75 + var(--heat) * 0.25); }
  #bounce { opacity: calc(0.2 + var(--heat) * 0.5); }
  #brothSheen { opacity: calc(0.32 + var(--heat) * 0.5); }

  .wisp, .oil, .bub, #shimmer, .glint {
    transform-box: fill-box;
    transform-origin: center;
  }

  .wisp { opacity: 0.9; }
  .w1 { transform: translate3d(-6px, -10px, 0); }
  .w2 { transform: translate3d(10px, -36px, 0); }
  .w3 { transform: translate3d(0, -22px, 0); }
  .w4 { transform: translate3d(8px, -48px, 0); }
  .w5 { transform: translate3d(-12px, -28px, 0); }

  @media (prefers-reduced-motion: no-preference) {
    .wisp { animation: rise 10s ease-in-out infinite; }
    .w1 { animation-duration: 9s; }
    .w2 { animation-duration: 12s; animation-delay: -4.6s; }
    .w3 { animation-duration: 8.2s; animation-delay: -2s; }
    .w4 { animation-duration: 11.2s; animation-delay: -7.2s; }
    .w5 { animation-duration: 10s; animation-delay: -3.4s; }
    #shimmer { animation: shimmer 6.5s ease-in-out infinite; }
    .oil { animation: drift 9s ease-in-out infinite; }
    .o2 { animation-duration: 12s; animation-delay: -3s; }
    .o3 { animation-duration: 8s; animation-delay: -5s; }
    .bub { animation: pop 3.6s ease-in-out infinite; }
    .b2 { animation-delay: .7s; animation-duration: 4.1s; }
    .b3 { animation-delay: 1.4s; }
    .b4 { animation-delay: .3s; animation-duration: 3.1s; }
    .b5 { animation-delay: 1.9s; animation-duration: 4.4s; }
    .b6 { animation-delay: 1.1s; animation-duration: 3.3s; }
    .glint { stroke-dasharray: 7 64; animation: glint 8s linear infinite; }
    .g2 { animation-duration: 11s; animation-delay: -3s; }
    .g3 { animation-duration: 6.5s; animation-delay: -2s; }
  }

  @keyframes rise {
    0%   { transform: translate3d(0, 10px, 0) scale(0.94); opacity: 0; }
    20%  { opacity: 0.85; }
    100% { transform: translate3d(var(--drift, 14px), -140px, 0) scale(1.16); opacity: 0; }
  }
  @keyframes shimmer {
    0%, 100% { transform: translate(-18px, 0) scaleX(0.92); opacity: 0.3; }
    50%      { transform: translate(24px, -1px) scaleX(1.06); opacity: 0.75; }
  }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(6px, -1.5px); }
  }
  @keyframes pop {
    0%, 100% { transform: translateY(1px) scale(0.65); opacity: 0.15; }
    50%      { transform: translateY(-2px) scale(1); opacity: 0.8; }
  }
  @keyframes glint { to { stroke-dashoffset: -160; } }

  @media (prefers-reduced-motion: reduce) {
    .bowl { transform: none; }
    #mist { display: none; }
  }
</style>
</head>

        <g id="steamNear">
          <g class="wisp w1" style="--drift: -18px">
            <ellipse cx="346" cy="448" rx="14" ry="24" fill="#fff8f3" opacity="0.42"/>
            <ellipse cx="334" cy="382" rx="18" ry="28" fill="#fff" opacity="0.2"/>
            <ellipse cx="350" cy="318" rx="16" ry="24" fill="#fff" opacity="0.1"/>
          </g>
          <g class="wisp w3" style="--drift: 10px">
            <ellipse cx="390" cy="450" rx="12" ry="20" fill="#fff" opacity="0.38"/>
            <ellipse cx="402" cy="396" rx="14" ry="22" fill="#fff6ee" opacity="0.18"/>
          </g>
          <g class="wisp w5" style="--drift: 6px">
            <ellipse cx="452" cy="454" rx="12" ry="18" fill="#fff" opacity="0.32"/>
            <ellipse cx="464" cy="404" rx="14" ry="20" fill="#fff" opacity="0.14"/>
          </g>
        </g>
      </svg>
    </div>
  </main>
  <div class="vignette" aria-hidden="true"></div>
  <canvas id="grain" aria-hidden="true"></canvas>
  <script>
    (function () {
      var root = document.documentElement;
      var bowl = document.getElementById("bowl");
      var steamNear = document.getElementById("steamNear");
      var steamFar = document.getElementById("steamFar");
      var sheen = document.getElementById("brothSheen");
      var mist = document.getElementById("mist");
      var grain = document.getElementById("grain");
      var ctx = mist.getContext("2d", { alpha: true });
      var reduceQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
      var reduce = reduceQuery.matches;

      var mx = 0, my = 0, tx = 0, ty = 0, heat = 0.18;
      var px = 0, py = 0, hasPointer = false;
      var raf = 0, w = 0, h = 0, dpr = 1;
      var sprite = null, parts = [], ripples = [];
      var COUNT = 56;

      /* viewBox 0 330 800 500, broth ellipse at (400, 496) r 202 x 45 */
      var BROTH_Y = (496 - 330) / 500;
      var BROTH_RX = 202 / 800;
      var BROTH_RY = 45 / 500;

      function paintGrain() {
        var gw = 340, gh = 480;
        grain.width = gw;
        grain.height = gh;
        var g = grain.getContext("2d", { alpha: true });
        var img = g.createImageData(gw, gh);
        var data = img.data;
        for (var i = 0; i < data.length; i += 4) {
          var n = 214 + Math.random() * 41;
          data[i] = data[i + 1] = data[i + 2] = n;
          data[i + 3] = Math.random() * 30;
        }
        g.putImageData(img, 0, 0);
      }

      function makeSprite() {
        var c = document.createElement("canvas");
        c.width = c.height = 64;
        var g = c.getContext("2d");
        var rad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        rad.addColorStop(0, "rgba(255,248,240,0.95)");
        rad.addColorStop(0.4, "rgba(255,214,170,0.28)");
        rad.addColorStop(1, "rgba(255,214,170,0)");
        g.fillStyle = rad;
        g.beginPath();
        g.arc(32, 32, 32, 0, Math.PI * 2);
        g.fill();
        return c;
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        mist.width = Math.floor(w * dpr);
        mist.height = Math.floor(h * dpr);
      }

      function origin() {
        var r = bowl.getBoundingClientRect();
        return {
          x: r.left + r.width * 0.5,
          y: r.top + r.height * BROTH_Y,
          rx: r.width * BROTH_RX,
          ry: Math.max(r.height * BROTH_RY, 10)
        };
      }

      function prep(p, seeded) {
        var o = origin();
        var a = Math.random() * Math.PI * 2;
        var rad = Math.sqrt(Math.random());
        p.max = 160 + Math.random() * 180;
        p.x = o.x + Math.cos(a) * o.rx * rad * 0.8;
        p.y = o.y + Math.sin(a) * o.ry * rad - (seeded ? Math.random() * 110 : 0);
        p.s = 18 + Math.random() * 52;
        p.vy = -(0.18 + Math.random() * 0.55);
        p.vx = (Math.random() - 0.5) * 0.12;
        p.life = seeded ? Math.random() * p.max : 0;
        p.phase = Math.random() * Math.PI * 2;
        p.warm = Math.random();
      }

      function burst() {
        var o = origin();
        var n = 0;
        for (var i = 0; i < parts.length && n < 16; i++) {
          var p = parts[i];
          if (p.life < p.max * 0.4) continue;
          prep(p, false);
          p.x = o.x + (Math.random() - 0.5) * o.rx * 1.3;
          p.y = o.y;
          p.vy = -(0.75 + Math.random() * 0.9);
          p.s *= 1.2;
          n++;
        }
        ripples.push({ life: 0, max: 70 });
      }

      function frame(t) {
        var idleX = Math.sin(t * 0.00028) * 0.05;
        var idleY = Math.sin(t * 0.00022 + 1.1) * 0.035;
        tx += ((hasPointer ? mx : idleX) - tx) * 0.05;
        ty += ((hasPointer ? my : idleY) - ty) * 0.05;

        var o = origin();
        var prox = 0;
        if (hasPointer) {
          prox = Math.max(0, 1 - Math.hypot((px - o.x) / (o.rx * 2.2), (py - o.y) / (o.ry * 6)));
        }
        heat += ((Math.min(1, 0.16 + Math.sin(t * 0.0013) * 0.04 + prox * 0.85)) - heat) * 0.06;

        root.style.setProperty("--mx", tx.toFixed(4));
        root.style.setProperty("--my", ty.toFixed(4));
        root.style.setProperty("--heat", heat.toFixed(4));
        steamNear.setAttribute("transform", "translate(" + (tx * 22).toFixed(2) + " " + (ty * 8).toFixed(2) + ")");
        steamFar.setAttribute("transform", "translate(" + (tx * 34).toFixed(2) + " " + (ty * 10).toFixed(2) + ")");
        sheen.setAttribute("transform", "translate(" + (tx * 20).toFixed(2) + " " + (ty * 7).toFixed(2) + ")");

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        ctx.globalCompositeOperation = "lighter";
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          p.life += 1 + heat * 0.85;
          if (p.life > p.max) prep(p, false);
          var k = p.life / p.max;
          var fade = Math.sin(Math.min(1, k) * Math.PI);
          p.phase += 0.016;
          var wind = hasPointer ? (px - p.x) * 0.0005 : Math.sin(t * 0.0003) * 0.015;
          p.x += p.vx + Math.sin(p.phase) * 0.2 + wind;
          p.y += p.vy * (1 + heat * 0.4);
          ctx.globalAlpha = fade * (0.05 + p.warm * 0.035 + heat * 0.03);
          var size = p.s * (0.8 + k * 0.65);
          ctx.drawImage(sprite, p.x - size * 0.5, p.y - size * 0.5, size, size);
        }
        for (var r = ripples.length - 1; r >= 0; r--) {
          var rip = ripples[r];
          rip.life++;
          if (rip.life > rip.max) { ripples.splice(r, 1); continue; }
          var u = rip.life / rip.max;
          ctx.globalAlpha = (1 - u) * 0.4;
          ctx.strokeStyle = "rgba(255,220,180,0.95)";
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.ellipse(o.x, o.y, o.rx * (0.2 + u * 1.05), o.ry * (0.45 + u * 1.35), 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
        raf = requestAnimationFrame(frame);
      }

      function start() {
        resize();
        if (!sprite) sprite = makeSprite();
        parts = [];
        for (var i = 0; i < COUNT; i++) {
          var p = {};
          prep(p, true);
          parts.push(p);
        }
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(frame);
      }

      function stop() {
        cancelAnimationFrame(raf);
        raf = 0;
        tx = ty = mx = my = 0;
        heat = 0.18;
        hasPointer = false;
        root.style.setProperty("--mx", "0");
        root.style.setProperty("--my", "0");
        root.style.setProperty("--heat", "0.18");
        steamNear.removeAttribute("transform");
        steamFar.removeAttribute("transform");
        sheen.removeAttribute("transform");
        if (mist.width) {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
        }
      }

      window.addEventListener("pointermove", function (e) {
        if (reduce) return;
        px = e.clientX;
        py = e.clientY;
        hasPointer = true;
        mx = Math.max(-1, Math.min(1, (px / Math.max(window.innerWidth, 1)) * 2 - 1));
        my = Math.max(-1, Math.min(1, (py / Math.max(window.innerHeight, 1)) * 2 - 1));
      }, { passive: true });

      window.addEventListener("pointerdown", function (e) {
        if (reduce) return;
        px = e.clientX;
        py = e.clientY;
        var o = origin();
        var dx = (px - o.x) / (o.rx * 1.15);
        var dy = (py - o.y) / Math.max(o.ry * 2.4, 22);
        if (dx * dx + dy * dy < 1.25) burst();
      }, { passive: true });

      window.addEventListener("blur", function () { hasPointer = false; });
      window.addEventListener("resize", function () { if (!reduce) resize(); });
      document.addEventListener("visibilitychange", function () {
        if (reduce) return;
        if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
        else if (!raf) raf = requestAnimationFrame(frame);
      });
      if (reduceQuery.addEventListener) {
        reduceQuery.addEventListener("change", function (e) {
          reduce = e.matches;
          if (reduce) stop(); else start();
        });
      }

      paintGrain();
      if (!reduce) start();
    })();
  </script>
</body>
</html>
