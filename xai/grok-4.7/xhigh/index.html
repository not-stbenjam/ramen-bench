<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070504">
<title>Vegan Ramen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='9' r='5.2' fill='%23e7d3bc'/%3E%3Ccircle cx='8' cy='8.2' r='3.4' fill='%23c46a30'/%3E%3C/svg%3E">
<style>
  :root {
    --gx: 50%;
    --gy: 58%;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #070504;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(ellipse 90% 70% at 50% 100%, rgba(48, 22, 10, 0.55), transparent 46%),
      radial-gradient(ellipse 130% 90% at 50% 42%, #16100c 0%, #070504 70%);
  }

  #glow {
    position: fixed;
    inset: -8%;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 36% 30% at var(--gx) var(--gy), rgba(255, 148, 62, 0.22), rgba(255, 120, 40, 0.06) 42%, transparent 68%);
    animation: breathe 8s ease-in-out infinite;
  }

  .orb {
    position: fixed;
    z-index: 0;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(46px);
  }

  .orb-a {
    width: min(28vw, 240px);
    height: min(28vw, 240px);
    left: 8%;
    top: 14%;
    background: rgba(255, 132, 54, 0.14);
    animation: drift 16s ease-in-out infinite;
  }

  .orb-b {
    width: min(18vw, 160px);
    height: min(18vw, 160px);
    right: 12%;
    top: 22%;
    background: rgba(255, 206, 160, 0.08);
    animation: drift 19s ease-in-out infinite reverse;
  }

  #rig {
    position: relative;
    z-index: 1;
    width: min(960px, 92vw, 86vh);
    margin-inline: auto;
    perspective: 1400px;
    perspective-origin: 50% 42%;
  }

  #tilt {
    transform-style: preserve-3d;
    will-change: transform;
  }

  svg.scene {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  #steam {
    position: fixed;
    inset: 0;
    z-index: 2;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(ellipse 68% 62% at 50% 56%, transparent 42%, rgba(0, 0, 0, 0.38) 78%, rgba(0, 0, 0, 0.72) 100%);
  }

  .grain {
    position: fixed;
    inset: 0;
    z-index: 4;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0.16;
    mix-blend-mode: overlay;
  }

  #sheen {
    mix-blend-mode: screen;
  }

  #oil {
    transform-box: fill-box;
    transform-origin: center;
    animation: oilDrift 18s ease-in-out infinite;
  }

  .waft {
    animation: waft 9.5s ease-in-out infinite;
  }

  .w2 { animation-duration: 11s; animation-delay: -3.2s; }
  .w3 { animation-duration: 8.4s; animation-delay: -5.4s; }
  .w4 { animation-duration: 12s; animation-delay: -7s; }
  .w5 { animation-duration: 10s; animation-delay: -1.6s; }

  @keyframes breathe {
    0%, 100% { opacity: 0.72; }
    50% { opacity: 1; }
  }

  @keyframes drift {
    0%, 100% { transform: translate3d(0, 0, 0); }
    50% { transform: translate3d(14px, -18px, 0); }
  }

  @keyframes oilDrift {
    0%, 100% { transform: rotate(-5deg) translate(0, 0); }
    50% { transform: rotate(6deg) translate(4px, -2px); }
  }

  @keyframes waft {
    0%, 100% { transform: translate3d(0, 8px, 0); opacity: 0.55; }
    50% { transform: translate3d(7px, -28px, 0); opacity: 0.95; }
  }

  @media (max-width: 720px) {
    #rig { width: min(560px, 94vw, 84vh); }
    .orb-a { opacity: 0.7; }
  }

  @media (max-height: 520px) {
    #rig { width: min(680px, 88vw, 76vh); }
  }

  @media (prefers-reduced-motion: reduce) {
    #glow, .orb, #oil, .waft {
      animation: none !important;
    }
    #glow { opacity: 0.9; }
    .waft { opacity: 0.7; transform: none; }
    #oil { transform: none; }
  }
</style>
</head>

<script>
(() => {
  const reduceMQ = window.matchMedia("(prefers-reduced-motion: reduce)");
  const stage = document.getElementById("stage");
  const tilt = document.getElementById("tilt");
  const glow = document.getElementById("glow");
  const orbs = document.querySelector(".orb-a");
  const sheen = document.getElementById("sheen");
  const broth = document.getElementById("broth-disk");
  const bubbles = Array.from(document.querySelectorAll("#bubbles circle"));
  const canvas = document.getElementById("steam");
  const ctx = canvas.getContext("2d", { alpha: true });

  let reduce = reduceMQ.matches;
  let cssW = 1;
  let cssH = 1;
  let tx = 0;
  let ty = 0;
  let cx = 0;
  let cy = 0;
  let pointerX = window.innerWidth * 0.5;
  let pointerY = window.innerHeight * 0.42;
  let lastMove = -10000;
  let last = 0;
  let running = false;
  let sprite;

  const bubbleState = bubbles.map((el) => ({
    el,
    life: Math.random(),
    dur: 2.6 + Math.random() * 2.4,
    x: +el.getAttribute("cx"),
    y: +el.getAttribute("cy")
  }));

  const wisps = Array.from({ length: 46 }, () => makeWisp(true));
  const motes = Array.from({ length: 18 }, () => makeMote());

  function makeSprite() {
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const g = c.getContext("2d");
    const rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    rg.addColorStop(0, "rgba(255,250,244,0.95)");
    rg.addColorStop(0.28, "rgba(255,236,214,0.45)");
    rg.addColorStop(0.62, "rgba(255,226,196,0.12)");
    rg.addColorStop(1, "rgba(255,226,196,0)");
    g.fillStyle = rg;
    g.fillRect(0, 0, 128, 128);
    return c;
  }

  function brothPoint() {
    const rect = broth.getBoundingClientRect();
    const a = Math.random() * Math.PI * 2;
    const rad = Math.sqrt(Math.random()) * 0.78;
    return {
      x: rect.left + rect.width * (0.5 + Math.cos(a) * rad * 0.5),
      y: rect.top + rect.height * (0.5 + Math.sin(a) * rad * 0.5),
      rect
    };
  }

  function makeWisp(primed) {
    const origin = brothPoint();
    const w = {
      x0: origin.x,
      y0: origin.y,
      age: primed ? Math.random() : 0,
      max: 3.6 + Math.random() * 3.2,
      rise: 150 + Math.random() * 210,
      size0: 14 + Math.random() * 28,
      grow: 36 + Math.random() * 70,
      amp: 10 + Math.random() * 26,
      freq: 0.7 + Math.random() * 1.1,
      phase: Math.random() * Math.PI * 2,
      peak: 0.12 + Math.random() * 0.16,
      drift: (Math.random() - 0.5) * 16
    };
    if (!origin.rect.width) w.age = primed ? Math.random() * w.max : 0;
    return w;
  }

  function respawn(w) {
    const next = makeWisp(false);
    w.x0 = next.x0;
    w.y0 = next.y0;
    w.age = 0;
    w.max = next.max;
    w.rise = next.rise;
    w.size0 = next.size0;
    w.grow = next.grow;
    w.amp = next.amp;
    w.freq = next.freq;
    w.phase = next.phase;
    w.peak = next.peak;
    w.drift = next.drift;
  }

  function sampleWisp(w, time) {
    const u = Math.min(1, w.age / w.max);
    const fadeIn = Math.min(1, u / 0.14);
    const fadeOut = Math.pow(Math.max(0, 1 - u), 1.2);
    return {
      x: w.x0 + Math.sin(time * w.freq + w.phase) * w.amp * u + w.drift * u,
      y: w.y0 - w.rise * Math.pow(u, 0.85),
      size: w.size0 + w.grow * u,
      a: fadeIn * fadeOut * w.peak,
      rot: Math.sin(time * 0.6 + w.phase) * 0.4,
      sy: 1.35 + u * 1.15
    };
  }

  function makeMote() {
    return {
      x: Math.random(),
      y: Math.random(),
      r: 0.6 + Math.random() * 1.6,
      s: 0.015 + Math.random() * 0.03,
      p: Math.random() * Math.PI * 2,
      a: 0.15 + Math.random() * 0.45
    };
  }

  function placeBubble(b) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * 150;
    b.x = Math.cos(a) * r;
    b.y = Math.sin(a) * r * 0.92;
    b.life = 0;
    b.dur = 2.4 + Math.random() * 2.6;
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cssW = window.innerWidth;
    cssH = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(cssW * dpr));
    canvas.height = Math.max(1, Math.floor(cssH * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduce) drawFrame(performance.now(), 0, true);
  }

  function onPointer(e) {
    pointerX = e.clientX;
    pointerY = e.clientY;
    lastMove = performance.now();
    const nx = (e.clientX / cssW - 0.5) * 2;
    const ny = (e.clientY / cssH - 0.5) * 2;
    if (reduce) {
      applyPose(nx * 0.35, ny * 0.35, true);
      return;
    }
    tx = Math.max(-1, Math.min(1, nx));
    ty = Math.max(-1, Math.min(1, ny));
  }

  function applyPose(px, py, instant) {
    const heatX = 50 + px * 7;
    const heatY = 58 + py * 5;
    stage.style.setProperty("--gx", heatX.toFixed(2) + "%");
    stage.style.setProperty("--gy", heatY.toFixed(2) + "%");
    if (!reduce) {
      tilt.style.transform = "rotateX(" + (-py * 5.5).toFixed(2) + "deg) rotateY(" + (px * 7).toFixed(2) + "deg)";
      orbs.style.translate = (-px * 16).toFixed(1) + "px " + (-py * 10).toFixed(1) + "px";
    } else if (instant) {
      tilt.style.transform = "none";
    }
    const simmerX = reduce ? 0 : Math.sin(performance.now() / 1000 * 0.7) * 5;
    const simmerY = reduce ? 0 : Math.cos(performance.now() / 1000 * 0.53) * 4;
    sheen.setAttribute("transform", "translate(" + ((-px * 34) + simmerX).toFixed(1) + " " + ((-py * 26) + simmerY).toFixed(1) + ")");
    const bowl = tilt.getBoundingClientRect();
    const bcx = bowl.left + bowl.width * 0.5;
    const bcy = bowl.top + bowl.height * 0.48;
    const dist = Math.hypot(pointerX - bcx, pointerY - bcy);
    const warmth = Math.max(0, 1 - dist / (bowl.width * 0.9));
    if (reduce) glow.style.opacity = (0.85 + warmth * 0.15).toFixed(3);
    glow.style.filter = "saturate(" + (1 + warmth * 0.35).toFixed(3) + ")";
  }

  function drawFrame(now, dt, frozen) {
    ctx.clearRect(0, 0, cssW, cssH);
    ctx.globalCompositeOperation = "lighter";
    const time = now / 1000;
    for (const w of wisps) {
      if (!frozen) {
        w.age += dt;
        if (w.age >= w.max) respawn(w);
        const dx = w.x0 - pointerX;
        const dy = w.y0 - pointerY;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist < 240) {
          const push = (1 - dist / 240) * 90 * dt;
          w.x0 += (dx / dist) * push;
          w.y0 += (dy / dist) * push * 0.25;
        }
        w.x0 += cx * 14 * dt;
      }
      const s = sampleWisp(w, frozen ? w.phase : time);
      if (s.a < 0.008) continue;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.scale(1, s.sy);
      ctx.globalAlpha = s.a;
      ctx.drawImage(sprite, -s.size / 2, -s.size / 2, s.size, s.size);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    for (const m of motes) {
      if (!frozen) {
        m.y -= m.s * dt;
        m.x += Math.sin(time + m.p) * 0.012 * dt;
        if (m.y < -0.02) m.y = 1.02;
      }
      const tw = frozen ? 0.7 : 0.55 + Math.sin(time * 1.4 + m.p) * 0.45;
      ctx.globalAlpha = m.a * tw;
      ctx.fillStyle = "#ffd2a4";
      ctx.beginPath();
      ctx.arc(m.x * cssW, m.y * cssH, m.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function stepBubbles(dt, frozen) {
    for (const b of bubbleState) {
      if (!frozen) {
        b.life += dt / b.dur;
        if (b.life >= 1) placeBubble(b);
      }
      const u = frozen ? 0.45 : b.life;
      const flicker = Math.sin(u * Math.PI);
      b.el.setAttribute("cx", b.x.toFixed(1));
      b.el.setAttribute("cy", (b.y - u * 8).toFixed(1));
      b.el.setAttribute("r", (1.4 + u * 2.4).toFixed(2));
      b.el.setAttribute("opacity", (flicker * 0.55).toFixed(3));
    }
  }

  function frame(now) {
    if (!running) return;
    const dt = Math.min(0.034, last ? (now - last) / 1000 : 0.016);
    last = now;
    if (now - lastMove > 2200) {
      const t = now / 1000;
      tx = Math.sin(t * 0.27) * 0.24;
      ty = Math.cos(t * 0.21) * 0.16;
    }
    const k = 1 - Math.pow(0.0015, dt);
    cx += (tx - cx) * k;
    cy += (ty - cy) * k;
    applyPose(cx, cy, false);
    stepBubbles(dt, false);
    drawFrame(now, dt, false);
    requestAnimationFrame(frame);
  }

  function start() {
    sprite = makeSprite();
    resize();
    if (reduce) {
      applyPose(0, 0, true);
      stepBubbles(0, true);
      drawFrame(performance.now(), 0, true);
      return;
    }
    running = true;
    requestAnimationFrame(frame);
  }

  function setReduced(next) {
    reduce = next;
    if (reduce) {
      running = false;
      tilt.style.transform = "none";
      orbs.style.translate = "0px 0px";
      applyPose(0, 0, true);
      stepBubbles(0, true);
      drawFrame(performance.now(), 0, true);
      return;
    }
    if (!running) {
      running = true;
      last = 0;
      requestAnimationFrame(frame);
    }
  }

  window.addEventListener("pointermove", onPointer, { passive: true });
  window.addEventListener("pointerdown", onPointer, { passive: true });
  window.addEventListener("resize", resize);
  document.addEventListener("visibilitychange", () => {
    if (reduce) return;
    if (document.hidden) {
      running = false;
      return;
    }
    if (!running) {
      running = true;
      last = 0;
      requestAnimationFrame(frame);
    }
  });
  reduceMQ.addEventListener("change", () => setReduced(reduceMQ.matches));
  start();
})();
</script>
</body>
</html>
