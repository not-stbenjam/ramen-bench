<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramen</title>
<style>
  :root {
    --mx: 0.5;
    --my: 0.42;
    --tilt-x: 0deg;
    --tilt-y: 0deg;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #070605;
    overflow: hidden;
  }

  body {
    min-height: 100dvh;
    cursor: default;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background:
      radial-gradient(ellipse 55% 42% at calc(50% + (var(--mx) - 0.5) * 6%) calc(58% + (var(--my) - 0.5) * 4%),
        rgba(196, 98, 32, 0.22) 0%,
        rgba(90, 36, 12, 0.08) 42%,
        transparent 68%),
      radial-gradient(ellipse 120% 80% at 50% 115%, #1a0e09 0%, transparent 55%),
      radial-gradient(ellipse 80% 60% at 50% 30%, #16100d 0%, #070605 72%);
  }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 70% 65% at 50% 52%, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
    z-index: 4;
  }

  .grain {
    position: absolute;
    inset: -20%;
    pointer-events: none;
    opacity: 0.18;
    z-index: 5;
    mix-blend-mode: overlay;
  }

  .warmth {
    position: absolute;
    width: 42vmin;
    height: 42vmin;
    border-radius: 50%;
    pointer-events: none;
    z-index: 3;
    left: calc(var(--mx) * 100%);
    top: calc(var(--my) * 100%);
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 176, 84, 0.16) 0%, rgba(255, 120, 40, 0.05) 45%, transparent 70%);
    mix-blend-mode: screen;
    transition: left 0.45s ease-out, top 0.45s ease-out;
  }

  .bowl-wrap {
    position: absolute;
    left: 50%;
    top: 52%;
    width: min(92vw, 78vh, 820px);
    aspect-ratio: 6 / 7;
    transform:
      translate(-50%, -50%)
      perspective(1100px)
      rotateX(var(--tilt-x))
      rotateY(var(--tilt-y));
    transform-style: preserve-3d;
    z-index: 2;
    filter: drop-shadow(0 28px 40px rgba(0, 0, 0, 0.55));
  }

  svg.bowl {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  #steam {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6;
  }

  .sheen {
    transform-origin: 300px 418px;
    animation: sheen 9s ease-in-out infinite;
  }

  .oil {
    transform-origin: center;
    animation: oil 14s linear infinite;
  }

  .oil-b { animation-duration: 18s; animation-direction: reverse; }

  .noodle-group {
    transform-origin: 300px 430px;
    animation: noodles 11s ease-in-out infinite;
  }

  .bit {
    transform-box: fill-box;
    transform-origin: center;
    animation: bob 6.5s ease-in-out infinite;
  }

  .bit:nth-of-type(2) { animation-delay: -1.2s; animation-duration: 7.2s; }
  .bit:nth-of-type(3) { animation-delay: -2.4s; animation-duration: 5.8s; }
  .bit:nth-of-type(4) { animation-delay: -0.6s; animation-duration: 8s; }
  .bit:nth-of-type(5) { animation-delay: -3.1s; animation-duration: 6.2s; }
  .bit:nth-of-type(6) { animation-delay: -1.8s; animation-duration: 7.6s; }
  .bit:nth-of-type(7) { animation-delay: -4s; animation-duration: 5.4s; }
  .bit:nth-of-type(8) { animation-delay: -2.2s; animation-duration: 6.9s; }

  .glow-broth {
    animation: pulse 5.5s ease-in-out infinite;
  }

  @keyframes sheen {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(10px, -4px); }
  }

  @keyframes oil {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes noodles {
    0%, 100% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(0.6deg) scale(1.012); }
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2.2px); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.9; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sheen, .oil, .noodle-group, .bit, .glow-broth {
      animation: none !important;
    }
    .warmth {
      transition: none;
      left: 50%;
      top: 46%;
    }
    .bowl-wrap {
      transform: translate(-50%, -50%);
    }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <svg class="grain" aria-hidden="true">
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#grain)"/>
    </svg>
    <div class="warmth" aria-hidden="true"></div>
    <div class="bowl-wrap" id="bowl">
      <svg class="bowl" viewBox="0 0 600 700" role="img" aria-label="Steaming bowl of vegan ramen">
        <defs>
          <radialGradient id="tableGlow" cx="50%" cy="60%" r="50%">
            <stop offset="0%" stop-color="#3a2014" stop-opacity="0.9"/>
            <stop offset="70%" stop-color="#3a2014" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="bowlBody" cx="42%" cy="38%" r="68%">
            <stop offset="0%" stop-color="#4a3428"/>
            <stop offset="45%" stop-color="#2a1c16"/>
            <stop offset="100%" stop-color="#120c0a"/>
          </radialGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f0d7b0"/>
            <stop offset="35%" stop-color="#b88858"/>
            <stop offset="70%" stop-color="#6e4a30"/>
            <stop offset="100%" stop-color="#e7c79a"/>
          </linearGradient>
          <radialGradient id="broth" cx="48%" cy="42%" r="62%">
            <stop offset="0%" stop-color="#f0b15a"/>
            <stop offset="28%" stop-color="#d4782e"/>
            <stop offset="62%" stop-color="#9a4218"/>
            <stop offset="100%" stop-color="#5c2410"/>
          </radialGradient>
          <radialGradient id="brothDepth" cx="50%" cy="55%" r="55%">
            <stop offset="60%" stop-color="#3a1408" stop-opacity="0"/>
            <stop offset="100%" stop-color="#2a0c06" stop-opacity="0.72"/>
          </radialGradient>
          <linearGradient id="noodle" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f6e2b4"/>
            <stop offset="50%" stop-color="#e2c07a"/>
            <stop offset="100%" stop-color="#c4964e"/>
          </linearGradient>
          <radialGradient id="tofu" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#fff6e4"/>
            <stop offset="70%" stop-color="#f0d9b0"/>
            <stop offset="100%" stop-color="#c9a06a"/>
          </radialGradient>
          <linearGradient id="nori" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#24382e"/>
            <stop offset="100%" stop-color="#0e1a14"/>
          </linearGradient>
          <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="1.2"/>
          </filter>
          <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
          </filter>
          <clipPath id="brothClip">
            <ellipse cx="300" cy="418" rx="176" ry="102"/>
          </clipPath>
        </defs>

        <ellipse cx="300" cy="560" rx="210" ry="36" fill="url(#tableGlow)"/>
        <ellipse cx="300" cy="548" rx="168" ry="22" fill="#000" opacity="0.45"/>

        <!-- bowl exterior -->
        <path d="M112 430
                 C118 520 180 590 300 596
                 C420 590 482 520 488 430
                 C470 470 400 508 300 512
                 C200 508 130 470 112 430 Z"
              fill="url(#bowlBody)"/>
        <path d="M128 446
                 C150 520 210 568 300 572
                 C390 568 450 520 472 446
                 C450 490 385 522 300 526
                 C214 522 150 490 128 446 Z"
              fill="#1a100c" opacity="0.55"/>
        <!-- foot -->
        <ellipse cx="300" cy="574" rx="62" ry="12" fill="#1c120e"/>
        <ellipse cx="300" cy="570" rx="48" ry="8" fill="#3a281e"/>

        <!-- rim -->
        <ellipse cx="300" cy="418" rx="198" ry="118" fill="url(#rim)"/>
        <ellipse cx="300" cy="418" rx="184" ry="108" fill="#1a100c"/>

        <!-- broth -->
        <g clip-path="url(#brothClip)">
          <ellipse class="glow-broth" cx="300" cy="424" rx="176" ry="102" fill="url(#broth)"/>
          <ellipse cx="300" cy="430" rx="176" ry="102" fill="url(#brothDepth)"/>

          <g class="noodle-group" fill="none" stroke="url(#noodle)" stroke-linecap="round">
            <path d="M168 430 C200 390 250 470 300 420 C350 370 390 470 440 410" stroke-width="7" opacity="0.95"/>
            <path d="M160 450 C210 410 240 490 310 450 C370 410 410 480 450 440" stroke-width="6.5"/>
            <path d="M180 400 C220 450 270 370 330 410 C380 445 410 380 450 400" stroke-width="5.5" opacity="0.9"/>
            <path d="M190 470 C240 430 280 500 340 460 C390 430 420 490 455 455" stroke-width="6"/>
            <path d="M200 415 C240 385 270 445 320 400 C360 365 400 430 430 395" stroke-width="4.5" opacity="0.85"/>
            <path d="M175 440 C230 480 270 400 330 455 C380 495 420 420 448 450" stroke-width="5" opacity="0.8"/>
            <path d="M210 455 C250 420 290 470 330 430 C365 400 400 450 430 425" stroke-width="4" opacity="0.75"/>
          </g>

          <!-- chili oil ribbons -->
          <g class="oil" opacity="0.85">
            <ellipse cx="250" cy="400" rx="36" ry="14" fill="#c43218" opacity="0.55" transform="rotate(-20 250 400)"/>
            <ellipse cx="360" cy="450" rx="28" ry="10" fill="#e24a22" opacity="0.4" transform="rotate(18 360 450)"/>
          </g>
          <g class="oil oil-b" opacity="0.7">
            <ellipse cx="330" cy="390" rx="22" ry="8" fill="#ffb15a" opacity="0.35" transform="rotate(30 330 390)"/>
            <ellipse cx="220" cy="450" rx="18" ry="7" fill="#ffd08a" opacity="0.28"/>
          </g>

          <!-- sheen -->
          <ellipse class="sheen" id="sheen" cx="250" cy="392" rx="70" ry="28" fill="#fff4d8" opacity="0.13"/>

          <!-- nori -->
          <g class="bit">
            <path d="M392 360 C430 372 448 410 440 448 C420 430 400 400 392 360 Z" fill="url(#nori)"/>
            <path d="M404 378 C424 392 436 418 432 440" stroke="#3d5c4a" stroke-width="1" fill="none" opacity="0.6"/>
          </g>

          <!-- shiitake -->
          <g class="bit" filter="url(#shadow)">
            <ellipse cx="214" cy="400" rx="34" ry="22" fill="#4a2c18" transform="rotate(-18 214 400)"/>
            <ellipse cx="214" cy="398" rx="26" ry="15" fill="#6b4030" transform="rotate(-18 214 398)"/>
            <ellipse cx="206" cy="394" rx="8" ry="4" fill="#c4a07a" opacity="0.7" transform="rotate(-18 206 394)"/>
            <path d="M198 404 Q214 412 230 402" stroke="#2a160e" stroke-width="1.2" fill="none"/>
          </g>
          <g class="bit">
            <ellipse cx="248" cy="462" rx="26" ry="16" fill="#3e2414" transform="rotate(12 248 462)"/>
            <ellipse cx="248" cy="460" rx="18" ry="10" fill="#5c3824" transform="rotate(12 248 460)"/>
          </g>

          <!-- bok choy -->
          <g class="bit">
            <path d="M150 430 C158 400 176 392 186 408 C176 424 168 448 162 470 C150 458 146 444 150 430 Z" fill="#7fbf62"/>
            <path d="M168 418 C174 400 188 396 194 412 C184 424 176 446 170 462 C162 446 164 430 168 418 Z" fill="#dfe8c8"/>
            <path d="M176 412 C186 398 200 402 198 420 C190 432 182 450 176 460" fill="#4e9a48"/>
          </g>

          <!-- corn -->
          <g class="bit">
            <ellipse cx="360" cy="400" rx="5.2" ry="4.2" fill="#f6d15a"/>
            <ellipse cx="372" cy="406" rx="5" ry="4" fill="#e8b83a"/>
            <ellipse cx="352" cy="410" rx="4.6" ry="3.8" fill="#f8dc78"/>
            <ellipse cx="366" cy="416" rx="4.8" ry="3.8" fill="#f0c44a"/>
            <ellipse cx="378" cy="394" rx="4.2" ry="3.4" fill="#ffe08a"/>
            <ellipse cx="348" cy="398" rx="3.8" ry="3.2" fill="#e2b044"/>
          </g>

          <!-- tofu cubes -->
          <g class="bit" filter="url(#shadow)">
            <rect x="300" y="392" width="46" height="28" rx="4" fill="url(#tofu)" transform="rotate(-8 323 406)"/>
            <rect x="304" y="396" width="18" height="8" rx="2" fill="#fff" opacity="0.35" transform="rotate(-8 323 406)"/>
            <path d="M308 414 H338" stroke="#c9843a" stroke-width="1.4" opacity="0.7" transform="rotate(-8 323 406)"/>
          </g>
          <g class="bit">
            <rect x="268" y="430" width="34" height="22" rx="3" fill="#f3e2c4" transform="rotate(7 285 441)"/>
            <rect x="272" y="434" width="12" height="5" rx="1.5" fill="#fff" opacity="0.3" transform="rotate(7 285 441)"/>
          </g>

          <!-- scallions -->
          <g class="bit" stroke-linecap="round">
            <path d="M250 380 Q270 400 262 424" stroke="#3e9a4a" stroke-width="3.2" fill="none"/>
            <path d="M258 376 Q278 398 274 422" stroke="#8fd36a" stroke-width="2.4" fill="none"/>
            <path d="M268 384 Q286 402 280 426" stroke="#2f7a38" stroke-width="2.8" fill="none"/>
            <path d="M320 448 Q338 466 332 488" stroke="#4aaa52" stroke-width="3" fill="none"/>
            <path d="M330 444 Q348 464 346 486" stroke="#b6e08a" stroke-width="2.2" fill="none"/>
            <path d="M188 448 Q206 460 200 478" stroke="#57b25a" stroke-width="2.6" fill="none"/>
            <path d="M196 446 Q214 458 210 476" stroke="#d4f0a8" stroke-width="1.8" fill="none"/>
          </g>

          <!-- sesame -->
          <g fill="#f4e2c0">
            <ellipse cx="290" cy="390" rx="2.1" ry="1.3" transform="rotate(20 290 390)"/>
            <ellipse cx="304" cy="384" rx="2" ry="1.2" transform="rotate(-15 304 384)"/>
            <ellipse cx="410" cy="430" rx="1.8" ry="1.1" transform="rotate(40 410 430)"/>
            <ellipse cx="230" cy="440" rx="1.9" ry="1.2"/>
            <ellipse cx="340" cy="470" rx="1.7" ry="1.1" transform="rotate(-30 340 470)"/>
            <ellipse cx="180" cy="420" rx="1.6" ry="1" transform="rotate(10 180 420)"/>
            <ellipse cx="390" cy="460" rx="1.8" ry="1.1" transform="rotate(25 390 460)"/>
          </g>

          <!-- menma -->
          <g class="bit">
            <path d="M430 400 C446 408 450 428 438 444 C428 432 424 414 430 400 Z" fill="#f2e2a8"/>
            <path d="M436 408 C446 416 446 430 438 438" stroke="#e0c878" stroke-width="1" fill="none"/>
          </g>
        </g>

        <!-- inner rim shadow -->
        <ellipse cx="300" cy="418" rx="184" ry="108" fill="none" stroke="#000" stroke-width="10" opacity="0.28"/>
        <ellipse cx="300" cy="414" rx="190" ry="112" fill="none" stroke="#f3ddb8" stroke-width="3" opacity="0.55"/>
        <ellipse cx="300" cy="422" rx="196" ry="116" fill="none" stroke="#5a3a24" stroke-width="2" opacity="0.8"/>

        <!-- ceramic highlight -->
        <path d="M150 470 C160 510 200 548 250 562" fill="none" stroke="#d7b48a" stroke-width="3" opacity="0.28" stroke-linecap="round"/>
      </svg>
    </div>
    <canvas id="steam" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
  </main>
<script>
(function () {
  var stage = document.getElementById("stage");
  var bowl = document.getElementById("bowl");
  var canvas = document.getElementById("steam");
  var ctx = canvas.getContext("2d");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var mx = 0.5;
  var my = 0.42;
  var tx = 0.5;
  var ty = 0.42;
  var wind = 0;
  var particles = [];
  var running = true;
  var dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
  }

  function spawnZone() {
    var r = bowl.getBoundingClientRect();
    return {
      x: r.left + r.width * 0.5,
      y: r.top + r.height * 0.52,
      rx: r.width * 0.26,
      ry: r.height * 0.11
    };
  }

  function makeParticle(initial) {
    var z = spawnZone();
    var a = Math.random() * Math.PI * 2;
    var rad = Math.sqrt(Math.random());
    var life = 2.4 + Math.random() * 2.8;
    return {
      x: z.x + Math.cos(a) * z.rx * rad * 0.85,
      y: initial ? z.y - Math.random() * 180 : z.y + (Math.random() - 0.2) * z.ry,
      vx: (Math.random() - 0.5) * 8,
      vy: -18 - Math.random() * 28,
      r: 10 + Math.random() * 26,
      life: life,
      age: initial ? Math.random() * life : 0,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.8 + Math.random() * 1.4
    };
  }

  function seed() {
    particles = [];
    var n = Math.min(70, Math.max(28, Math.floor(window.innerWidth / 22)));
    for (var i = 0; i < n; i++) particles.push(makeParticle(true));
  }

  function drawStatic() {
    resize();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    var z = spawnZone();
    for (var i = 0; i < 8; i++) {
      var x = z.x + (i - 3.5) * z.rx * 0.22;
      var y = z.y - 40 - (i % 3) * 28;
      var g = ctx.createRadialGradient(x, y, 2, x, y - 20, 36);
      g.addColorStop(0, "rgba(255,244,230,0.16)");
      g.addColorStop(1, "rgba(255,244,230,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y - 16, 22, 48, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  var last = 0;
  function frame(now) {
    if (!running) return;
    if (reduce.matches) return;
    var dt = Math.min(0.033, (now - last) / 1000 || 0.016);
    last = now;

    tx += (mx - tx) * 0.06;
    ty += (my - ty) * 0.06;
    var tiltY = (tx - 0.5) * 7;
    var tiltX = (0.42 - ty) * 5;
    stage.style.setProperty("--mx", tx.toFixed(4));
    stage.style.setProperty("--my", ty.toFixed(4));
    stage.style.setProperty("--tilt-y", tiltY.toFixed(3) + "deg");
    stage.style.setProperty("--tilt-x", tiltX.toFixed(3) + "deg");

    var sheen = document.getElementById("sheen");
    if (sheen) {
      var sx = 230 + tx * 90;
      var sy = 378 + ty * 36;
      sheen.setAttribute("cx", sx.toFixed(1));
      sheen.setAttribute("cy", sy.toFixed(1));
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    ctx.globalCompositeOperation = "lighter";

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.age += dt;
      if (p.age >= p.life) {
        particles[i] = makeParticle(false);
        continue;
      }
      var k = p.age / p.life;
      p.wobble += p.wobbleSpeed * dt;
      p.x += (p.vx + Math.sin(p.wobble) * 14 + wind * 36) * dt;
      p.y += p.vy * dt;
      p.r += 8 * dt;
      var alpha = Math.sin(Math.min(1, k) * Math.PI) * 0.22;
      var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, "rgba(255,236,214," + alpha.toFixed(3) + ")");
      g.addColorStop(0.45, "rgba(220,200,180," + (alpha * 0.45).toFixed(3) + ")");
      g.addColorStop(1, "rgba(255,220,190,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = "source-over";
    wind *= 0.96;
    requestAnimationFrame(frame);
  }

  function pointer(e) {
    var x = e.clientX;
    var y = e.clientY;
    if (e.touches && e.touches[0]) {
      x = e.touches[0].clientX;
      y = e.touches[0].clientY;
    }
    var nx = x / window.innerWidth;
    var ny = y / window.innerHeight;
    wind += (nx - mx) * 1.4;
    wind = Math.max(-1.2, Math.min(1.2, wind));
    mx = nx;
    my = ny;
  }

  window.addEventListener("pointermove", pointer, { passive: true });
  window.addEventListener("resize", function () {
    resize();
    if (reduce.matches) drawStatic();
    else seed();
  });

  function applyMotion() {
    if (reduce.matches) {
      running = false;
      stage.style.setProperty("--mx", "0.5");
      stage.style.setProperty("--my", "0.42");
      stage.style.setProperty("--tilt-x", "0deg");
      stage.style.setProperty("--tilt-y", "0deg");
      drawStatic();
    } else {
      running = true;
      resize();
      seed();
      last = 0;
      requestAnimationFrame(frame);
    }
  }

  if (reduce.addEventListener) reduce.addEventListener("change", applyMotion);
  else if (reduce.addListener) reduce.addListener(applyMotion);

  applyMotion();
})();
</script>
</body>
</html>
