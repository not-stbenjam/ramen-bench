<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070504">
<title>Vegan ramen</title>
<style>
  :root {
    --void: #070504;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--void);
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    min-height: 100%;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse 46% 34% at 50% 60%, rgba(214, 112, 42, 0.2), transparent 66%),
      radial-gradient(ellipse 100% 78% at 50% 46%, #16110e 0%, #070504 68%);
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .glow {
    position: fixed;
    left: 50%;
    top: 56%;
    width: min(78vw, 880px);
    height: min(52vw, 560px);
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center,
      rgba(236, 150, 72, 0.28) 0%,
      rgba(170, 72, 28, 0.12) 36%,
      transparent 70%);
    filter: blur(10px);
    pointer-events: none;
    z-index: 0;
    animation: ember 7.5s ease-in-out infinite;
  }

  @keyframes ember {
    0%, 100% { opacity: 0.72; }
    40% { opacity: 1; }
    68% { opacity: 0.82; }
  }

  .stage {
    height: min(100vh, 980px, calc(100vw * 780 / 900));
    height: min(100dvh, 980px, calc(100vw * 780 / 900));
    aspect-ratio: 900 / 780;
    width: auto;
    max-width: 100vw;
    position: relative;
    z-index: 1;
    perspective: 1500px;
  }

  .tilt {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    will-change: transform;
  }

  svg.bowl {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  canvas.steam {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0;
  }

  html.live canvas.steam { opacity: 1; }

  .steam-static {
    animation: waft 8s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes waft {
    0%, 100% { transform: translate(0, 8px); }
    50% { transform: translate(10px, -16px); }
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    background: radial-gradient(ellipse at 50% 52%, transparent 36%, rgba(0, 0, 0, 0.58) 100%);
  }

  svg.grain {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
    opacity: 0.11;
    mix-blend-mode: overlay;
  }

  .oil {
    transform-box: view-box;
    transform-origin: 450px 505px;
    animation: convection 38s linear infinite;
  }

  @keyframes convection {
    to { transform: rotate(360deg); }
  }

  .bubble {
    transform-box: fill-box;
    transform-origin: center;
    animation: rise-bubble 4.2s ease-in infinite;
  }

  .bubble:nth-child(2) { animation-duration: 5.1s; animation-delay: -1.6s; }
  .bubble:nth-child(3) { animation-duration: 3.7s; animation-delay: -2.4s; }
  .bubble:nth-child(4) { animation-duration: 4.8s; animation-delay: -0.8s; }
  .bubble:nth-child(5) { animation-duration: 5.6s; animation-delay: -3.1s; }
  .bubble:nth-child(6) { animation-duration: 3.9s; animation-delay: -2s; }

  @keyframes rise-bubble {
    0% { transform: translateY(3px) scale(0.35); opacity: 0; }
    28% { opacity: 0.7; }
    100% { transform: translateY(-12px) scale(1.55); opacity: 0; }
  }

  .sheen {
    transform-box: fill-box;
    transform-origin: center;
    animation: sheen 6.5s ease-in-out infinite;
  }

  @keyframes sheen {
    0%, 100% { opacity: 0.28; transform: translate(0, 0); }
    50% { opacity: 0.5; transform: translate(10px, 4px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    .steam-static { opacity: 1 !important; }
    canvas.steam { display: none !important; }
  }
</style>
</head>

              <ellipse cx="24" cy="-6" rx="3.2" ry="2" fill="#ff5a32"/>
              <ellipse cx="8" cy="10" rx="2.6" ry="1.6" fill="#c42012"/>

            <g transform="translate(562 528) rotate(22)">

            <path d="M478,534 C508,552 536,544 562,566" fill="none" stroke="#e22e16" stroke-width="5" stroke-linecap="round" opacity="0.82"/>

          <ellipse id="spec" class="sheen" cx="392" cy="488" rx="70" ry="18" fill="url(#specGrad)"/>

        <g id="glints">
          <ellipse cx="450" cy="470" rx="228" ry="96" fill="none" stroke="url(#rimEdge)" stroke-width="7"/>

        <g class="steam-static" filter="url(#steamBlur)">
          <ellipse cx="448" cy="290" rx="55" ry="120" fill="rgba(255,248,242,0.2)"/>

          <ellipse cx="505" cy="240" rx="28" ry="86" fill="rgba(255,244,230,0.14)"/>
          <ellipse cx="462" cy="145" rx="20" ry="46" fill="rgba(255,250,246,0.13)"/>
          <path d="M425,430 C395,350 465,300 438,220 C418,160 455,115 442,62" fill="none" stroke="rgba(255,248,242,0.28)" stroke-width="34" stroke-linecap="round"/>
          <path d="M495,415 C530,330 455,270 500,185 C525,130 485,95 500,58" fill="none" stroke="rgba(255,242,228,0.18)" stroke-width="22" stroke-linecap="round"/>

  <div class="vignette" aria-hidden="true"></div>
  <svg class="grain" aria-hidden="true">
    <filter id="filmGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#filmGrain)"/>
  </svg>

  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      const tilt = document.getElementById("tilt");
      const glow = document.getElementById("glow");
      const spec = document.getElementById("spec");
      const glints = document.getElementById("glints");
      const noodles = document.getElementById("noodles");
      const onions = document.getElementById("onions");
      const canvas = document.getElementById("steam");
      const ctx = canvas.getContext("2d", { alpha: true });
      const motionMQ = window.matchMedia("(prefers-reduced-motion: reduce)");
      const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");
      let reduce = motionMQ.matches;

      function el(name, attrs) {
        const node = document.createElementNS(NS, name);
        for (const key in attrs) node.setAttribute(key, attrs[key]);
        return node;
      }

      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function buildNoodles() {
        const rand = mulberry32(0x51a7e);
        const cx = 450, cy = 505, rx = 178, ry = 48;
        const tones = ["#f4e0c4", "#e8c99a", "#f8ead4", "#efc278", "#ead3ae", "#f0d4a8", "#f7e7d2"];

        function inside(x, y, pad) {
          const nx = (x - cx) / (rx * pad);
          const ny = (y - cy) / (ry * pad);
          return nx * nx + ny * ny <= 1;
        }

        function paint(pts, sw, color, extra) {
          if (pts.length < 4) return;
          let d = "M " + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
          for (let i = 1; i < pts.length - 1; i++) {
            const mx = (pts[i][0] + pts[i + 1][0]) / 2;
            const my = (pts[i][1] + pts[i + 1][1]) / 2;
            d += " Q " + pts[i][0].toFixed(1) + " " + pts[i][1].toFixed(1) + " " + mx.toFixed(1) + " " + my.toFixed(1);
          }
          const attrs = {
            d: d,
            fill: "none",
            stroke: color,
            "stroke-width": sw.toFixed(2),
            "stroke-linecap": "round",
            "stroke-linejoin": "round"
          };
          if (extra) {
            for (const key in extra) attrs[key] = extra[key];
          }
          noodles.appendChild(el("path", attrs));
        }

        function commit(pts) {
          const kept = pts.filter(function (p) { return inside(p[0], p[1], 1.02); });
          if (kept.length < 4) return;
          const sw = 8.4 + rand() * 2.6;
          const tone = tones[(rand() * tones.length) | 0];
          paint(kept, sw, "#a87440", { opacity: "0.38", transform: "translate(1 1.8)" });
          paint(kept, sw, tone);
          paint(kept, Math.max(1.4, sw * 0.18), "rgba(255,244,224,0.38)", { transform: "translate(-1.1 -1.5)" });
        }

        const waves = 9;
        for (let i = 0; i < waves; i++) {
          const pts = [];
          const phase = rand() * Math.PI * 2;
          const amp = 2.4 + rand() * 3.2;
          const freq = 0.055 + rand() * 0.035;
          let y = cy - 40 + (i + 0.35) * (80 / waves) + (rand() - 0.5) * 4;
          const x0 = cx - rx + rand() * 36;
          const x1 = cx + rx - rand() * 28;
          for (let x = x0; x <= x1; x += 7.4) {
            const py = y + Math.sin(x * freq + phase) * amp + Math.sin(x * 0.018 + i) * 1.6;
            y += Math.sin(i + x * 0.01) * 0.18;
            pts.push([x, py]);
          }
          commit(pts);
        }

        for (let n = 0; n < 4; n++) {
          let x = cx + (rand() - 0.5) * rx * 0.9;
          let y = cy + (rand() - 0.5) * ry * 0.75;
          let ang = rand() * Math.PI * 2;
          const pts = [];
          const steps = 12 + ((rand() * 8) | 0);
          for (let i = 0; i < steps; i++) {
            if (!inside(x, y, 0.94)) ang = Math.atan2(cy - y, cx - x) + (rand() - 0.5) * 0.9;
            pts.push([x, y]);
            ang += (rand() - 0.5) * 1.15;
            const step = 11 + rand() * 9;
            x += Math.cos(ang) * step;
            y += Math.sin(ang) * step * 0.5;
          }
          commit(pts);
        }
      }

      function buildOnions() {
        const pieces = [
          [430, 524, -28, 1.02, 1],
          [462, 516, 14, 0.9, 0],
          [494, 528, -16, 1.0, 1],
          [520, 512, 30, 0.72, 0],
          [446, 546, 8, 0.84, 1],
          [478, 552, -36, 0.92, 0],
          [512, 548, 12, 0.66, 1],
          [408, 538, -14, 0.62, 0],
          [454, 568, 24, 0.56, 0],
          [498, 566, -10, 0.54, 1],
          [536, 536, 38, 0.48, 0],
          [422, 558, 16, 0.52, 0],
          [548, 552, -22, 0.44, 0],
          [470, 500, -6, 0.5, 1]
        ];
        for (let i = 0; i < pieces.length; i++) {
          const x = pieces[i][0], y = pieces[i][1], rot = pieces[i][2], s = pieces[i][3], cut = pieces[i][4];
          const g = el("g", { transform: "translate(" + x + " " + y + ") rotate(" + rot + ") scale(" + s + ")" });
          if (cut) {
            g.appendChild(el("ellipse", { cx: 0, cy: 0, rx: 13.5, ry: 4.8, fill: "#62c256", transform: "rotate(-34)" }));
            g.appendChild(el("ellipse", { cx: 0, cy: -0.7, rx: 13.2, ry: 2.35, fill: "#dff8bc", transform: "rotate(-34)" }));
            g.appendChild(el("ellipse", { cx: -2.2, cy: -1.3, rx: 3.6, ry: 0.9, fill: "#fff", opacity: "0.4", transform: "rotate(-34)" }));
          } else {
            g.appendChild(el("ellipse", { cx: 0, cy: 0, rx: 8.6, ry: 4.9, fill: "#3ea24c", stroke: "#2c7a38", "stroke-width": "0.6" }));
            g.appendChild(el("ellipse", { cx: 0, cy: 0, rx: 3.5, ry: 2.0, fill: "#e9fad4" }));
            g.appendChild(el("ellipse", { cx: -1.1, cy: -0.8, rx: 1.5, ry: 0.7, fill: "#fff", opacity: "0.45" }));
          }
          onions.appendChild(g);
        }
      }

      buildNoodles();
      buildOnions();

      const sprite = document.createElement("canvas");
      sprite.width = sprite.height = 128;
      const sctx = sprite.getContext("2d");
      const blob = sctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      blob.addColorStop(0, "rgba(255,246,236,0.7)");
      blob.addColorStop(0.38, "rgba(255,232,208,0.22)");
      blob.addColorStop(1, "rgba(255,232,208,0)");
      sctx.fillStyle = blob;
      sctx.beginPath();
      sctx.arc(64, 64, 64, 0, Math.PI * 2);
      sctx.fill();

      const SPAWN = { x: 450 / 900, y: (500 - 50) / 780, rx: 130 / 900, ry: 26 / 780 };
      const particles = [];

      function spawn(randomLife) {
        const a = Math.random() * Math.PI * 2;
        const rad = Math.sqrt(Math.random());
        const max = 240 + Math.random() * 170;
        const life = randomLife ? Math.random() * max : 0;
        const vy = -(0.00105 + Math.random() * 0.00085);
        const y0 = SPAWN.y + Math.sin(a) * SPAWN.ry * rad * 0.45;
        return {
          x: SPAWN.x + Math.cos(a) * SPAWN.rx * rad,
          y: Math.max(0.06, y0 + vy * life),
          vy: vy,
          r: 18 + Math.random() * 34,
          life: life,
          max: max,
          ph: Math.random() * Math.PI * 2,
          ps: 0.02 + Math.random() * 0.028,
          cloud: Math.random() > 0.35
        };
      }

      for (let i = 0; i < 34; i++) particles.push(spawn(true));

      let cssW = 0;
      let cssH = 0;
      let dpr = 1;

      function resize() {
        cssW = tilt.offsetWidth;
        cssH = tilt.offsetHeight;
        if (!cssW || !cssH) return;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(cssW * dpr));
        canvas.height = Math.max(1, Math.round(cssH * dpr));
      }

      let tx = 0, ty = 0, x = 0, y = 0, wind = 0;
      let running = false;

      function resetPose() {
        x = 0;
        y = 0;
        tx = 0;
        ty = 0;
        wind = 0;
        tilt.style.transform = "none";
        glow.style.transform = "translate(-50%, -50%)";
        if (spec) {
          spec.setAttribute("cx", "392");
          spec.setAttribute("cy", "488");
        }
        if (glints) glints.removeAttribute("transform");
      }

      function applyPreference() {
        reduce = motionMQ.matches;
        document.documentElement.classList.toggle("live", !reduce);
        if (reduce) {
          resetPose();
          running = false;
        } else {
          resize();
          start();
        }
      }

      function setTarget(clientX, clientY) {
        tx = Math.max(-1, Math.min(1, (clientX / window.innerWidth - 0.5) * 2));
        ty = Math.max(-1, Math.min(1, (clientY / window.innerHeight - 0.5) * 2));
      }

      function frame() {
        if (reduce) {
          running = false;
          return;
        }
        x += (tx - x) * 0.065;
        y += (ty - y) * 0.065;
        wind += (tx * 1.15 - wind) * 0.04;

        tilt.style.transform = "rotateX(" + (-y * 4.6).toFixed(3) + "deg) rotateY(" + (x * 6.2).toFixed(3) + "deg)";
        glow.style.transform = "translate(-50%, -50%) translate(" + (x * 32).toFixed(2) + "px, " + (y * 18).toFixed(2) + "px)";

        if (spec) {
          let sx = 392 + x * 80;
          let sy = 488 + y * 22;
          const nx = (sx - 450) / 150;
          const ny = (sy - 505) / 40;
          const dist = Math.hypot(nx, ny);
          if (dist > 1) {
            sx = 450 + (nx / dist) * 150;
            sy = 505 + (ny / dist) * 40;
          }
          spec.setAttribute("cx", sx.toFixed(1));
          spec.setAttribute("cy", sy.toFixed(1));
        }
        if (glints) {
          glints.setAttribute("transform", "translate(" + (x * 12).toFixed(1) + " " + (y * 7).toFixed(1) + ")");
        }

        if (cssW && cssH) {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, cssW, cssH);
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.life += 1;
            p.ph += p.ps;
            p.y += p.vy;
            p.x += Math.sin(p.ph) * 0.00042 + wind * 0.00062;
            if (p.life > p.max || p.y < 0.05 || p.x < -0.05 || p.x > 1.05) {
              particles[i] = spawn(false);
              continue;
            }
            const t = p.life / p.max;
            const bell = Math.sin(Math.PI * t);
            let mask = 1;
            if (p.y > 0.6) mask = Math.max(0, 1 - (p.y - 0.6) / 0.08);
            const alpha = bell * mask * (p.cloud ? 0.5 : 0.62);
            if (alpha < 0.01) continue;
            const grow = (p.cloud ? 0.7 : 0.45) + t * (p.cloud ? 1.7 : 1.15);
            const rad = p.r * grow * (cssW / 900);
            const px = p.x * cssW;
            const py = p.y * cssH;
            ctx.globalAlpha = alpha;
            ctx.drawImage(sprite, px - rad, py - rad, rad * 2, rad * 2);
          }
          ctx.globalAlpha = 1;
        }

        requestAnimationFrame(frame);
      }

      function start() {
        if (running || reduce) return;
        running = true;
        requestAnimationFrame(frame);
      }

      window.addEventListener("pointermove", function (e) {
        if (reduce) return;
        setTarget(e.clientX, e.clientY);
      }, { passive: true });

      function release() {
        if (!finePointer.matches) {
          tx = 0;
          ty = 0;
        }
      }
      window.addEventListener("pointerup", release);
      window.addEventListener("pointercancel", release);
      window.addEventListener("pointerleave", function () {
        tx = 0;
        ty = 0;
      });
      window.addEventListener("blur", function () {
        tx = 0;
        ty = 0;
      });

      motionMQ.addEventListener("change", applyPreference);
      window.addEventListener("resize", resize);
      if (window.ResizeObserver) new ResizeObserver(resize).observe(tilt);

      applyPreference();
    })();
  </script>
