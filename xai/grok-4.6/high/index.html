<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vegan Ramen</title>
  <style>
    :root {
      --lx: 50%;
      --ly: 48%;
      --heat: 1;
      --tilt-x: 6deg;
      --tilt-y: 0deg;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070504;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background:
        radial-gradient(ellipse 42% 28% at 50% 62%, rgba(190, 72, 22, calc(0.28 * var(--heat))), transparent 70%),
        radial-gradient(ellipse 22% 14% at 50% 58%, rgba(255, 170, 70, calc(0.18 * var(--heat))), transparent 60%),
        radial-gradient(ellipse 80% 50% at 50% 100%, #140a08, transparent 55%),
        #070504;
    }

    .scene {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      perspective: 1400px;
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        52vw 40vh at var(--lx) var(--ly),
        rgba(255, 150, 70, 0.08),
        transparent 58%
      );
      pointer-events: none;
      z-index: 2;
    }

    .hearth {
      position: absolute;
      width: min(78vmin, 760px);
      height: min(46vmin, 420px);
      left: 50%;
      top: 58%;
      transform: translate(-50%, -40%);
      background: radial-gradient(ellipse at center,
        rgba(255, 132, 42, calc(0.5 * var(--heat))) 0%,
        rgba(210, 70, 18, calc(0.22 * var(--heat))) 36%,
        transparent 70%);
      filter: blur(28px);
      animation: hearth 5.5s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    .stage {
      position: relative;
      width: min(92vmin, 980px);
      height: min(92vmin, 980px);
      transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transform-style: preserve-3d;
      will-change: transform;
      z-index: 1;
    }

    .stage svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    #oil {
      transform-origin: 500px 440px;
      animation: swirl 48s linear infinite;
    }

    #noodles {
      transform-origin: 490px 445px;
      animation: simmer 6.5s ease-in-out infinite;
    }

    #garnish-float {
      transform-origin: 500px 440px;
      animation: garnish 8s ease-in-out infinite;
    }

    #bubbles circle {
      animation: bubble 4.8s ease-in-out infinite;
    }
    #bubbles circle:nth-child(2) { animation-delay: -1.1s; animation-duration: 5.4s; }
    #bubbles circle:nth-child(3) { animation-delay: -2.4s; animation-duration: 4.2s; }
    #bubbles circle:nth-child(4) { animation-delay: -0.6s; animation-duration: 6s; }
    #bubbles circle:nth-child(5) { animation-delay: -3.3s; animation-duration: 5s; }
    #bubbles circle:nth-child(6) { animation-delay: -1.8s; animation-duration: 4.6s; }

    .static-steam { display: none; }

    .steam-live {
      pointer-events: none;
    }
    .steam-live path {
      fill: none;
      stroke: #f6ead8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }
    .steam-live .w1 { animation: steamRise 4.8s ease-in infinite; }
    .steam-live .w2 { animation: steamRise 5.6s ease-in infinite 0.7s; }
    .steam-live .w3 { animation: steamRise 5.1s ease-in infinite 1.4s; }
    .steam-live .w4 { animation: steamRise 6.2s ease-in infinite 0.3s; }
    .steam-live .w5 { animation: steamRise 4.4s ease-in infinite 2.1s; }
    .steam-live .w6 { animation: steamRise 5.8s ease-in infinite 1.8s; }
    .steam-live .w7 { animation: steamRise 6.6s ease-in infinite 2.6s; }
    .steam-live .w8 { animation: steamRise 5.2s ease-in infinite 3.2s; }

    @keyframes steamRise {
      0%   { transform: translate(0, 24px) scale(0.7, 0.45); opacity: 0; }
      12%  { opacity: 0.42; }
      55%  { opacity: 0.22; }
      100% { transform: translate(12px, -240px) scale(1.35, 1.9); opacity: 0; }
    }

    canvas#fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(ellipse 68% 62% at 50% 46%, transparent 38%, rgba(0, 0, 0, 0.55) 100%);
    }

    .grain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      opacity: 0.045;
      mix-blend-mode: overlay;
    }

    @keyframes hearth {
      0%, 100% { opacity: 0.82; transform: translate(-50%, -40%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -40%) scale(1.07); }
    }

    @keyframes swirl {
      to { transform: rotate(360deg); }
    }

    @keyframes simmer {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(0, 1.4px) scale(1.008, 1.012); }
    }

    @keyframes garnish {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(1.2px, -1px); }
    }

    @keyframes bubble {
      0%, 100% { opacity: 0.05; r: 2.2; }
      40% { opacity: 0.45; }
      70% { opacity: 0.15; r: 4.4; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hearth,
      #oil,
      #noodles,
      #garnish-float,
      #bubbles circle,
      .steam-live .w1,
      .steam-live .w2,
      .steam-live .w3,
      .steam-live .w4,
      .steam-live .w5,
      .steam-live .w6,
      .steam-live .w7,
      .steam-live .w8 {
        animation: none !important;
      }
      .steam-live { display: none; }
      .static-steam { display: block; }
      canvas#fx { display: none; }
    }
  </style>
</head>
<body>

  <canvas id="fx"></canvas>
  <div class="vignette"></div>
  <svg class="grain" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <filter id="pageGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <rect width="100%" height="100%" filter="url(#pageGrain)" />
  </svg>
  <script>
    (function () {
      const svgNS = "http://www.w3.org/2000/svg";
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
      let reduced = reduce.matches;
      reduce.addEventListener("change", () => {
        reduced = reduce.matches;
        if (!reduced) startLoop();
      });

      const root = document.documentElement;
      const stage = document.querySelector(".stage");
      const spec = document.getElementById("spec");
      const ceramicSpec = document.getElementById("ceramic-spec");
      const canvas = document.getElementById("fx");
      const ctx = canvas.getContext("2d");

      function mulberry32(a) {
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function catmull(pts) {
        if (pts.length < 2) return "";
        let d = "M " + pts[0][0] + " " + pts[0][1];
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[i - 1] || pts[i];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[i + 2] || p2;
          const c1x = p1[0] + (p2[0] - p0[0]) / 6;
          const c1y = p1[1] + (p2[1] - p0[1]) / 6;
          const c2x = p2[0] - (p3[0] - p1[0]) / 6;
          const c2y = p2[1] - (p3[1] - p1[1]) / 6;
          d += " C " + c1x + " " + c1y + " " + c2x + " " + c2y + " " + p2[0] + " " + p2[1];
        }
        return d;
      }

      function addPath(parent, d, attrs) {
        const p = document.createElementNS(svgNS, "path");
        p.setAttribute("d", d);
        for (const k in attrs) p.setAttribute(k, attrs[k]);
        parent.appendChild(p);
        return p;
      }

      function addEl(parent, name, attrs) {
        const el = document.createElementNS(svgNS, name);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        parent.appendChild(el);
        return el;
      }

      function inBroth(x, y, pad) {
        const rx = 322 - (pad || 0);
        const ry = 124 - (pad || 0);
        const dx = (x - 500) / rx;
        const dy = (y - 440) / ry;
        return dx * dx + dy * dy < 1;
      }

      /* ---- Noodles ---- */
      (function buildNoodles() {
        const g = document.getElementById("noodles");
        const rng = mulberry32(20260927);
        const cx = 488, cy = 444, rx = 200, ry = 82;
        const layers = [
          [10.5, "#6e4218", 0.95],
          [6.4, "#c48a38", 1],
          [2.6, "#f3d27a", 0.88]
        ];

        const strands = [];

        for (let n = 0; n < 28; n++) {
          const pts = [];
          let a = rng() * Math.PI * 2;
          let rad = 0.18 + rng() * 0.55;
          const len = 6 + Math.floor(rng() * 6);
          for (let i = 0; i < len; i++) {
            a += (rng() - 0.4) * 0.95;
            rad += (rng() - 0.5) * 0.2;
            rad = Math.max(0.1, Math.min(0.96, rad));
            pts.push([cx + Math.cos(a) * rx * rad, cy + Math.sin(a) * ry * rad]);
          }
          strands.push(catmull(pts));
        }

        const draped = [
          "M 360 430 C 400 458 445 418 490 446 C 535 474 580 428 640 452",
          "M 340 448 C 390 420 450 470 510 438 C 560 412 610 460 670 442",
          "M 380 410 C 430 438 480 400 530 428 C 570 448 610 418 650 430",
          "M 355 462 C 410 448 460 488 520 466 C 575 446 620 480 668 462",
          "M 400 400 C 440 428 500 392 548 422 C 590 446 630 410 675 424",
          "M 372 440 C 420 470 475 430 528 458 C 572 480 618 444 655 460",
          "M 410 470 C 455 448 500 492 555 470 C 600 452 638 478 690 458",
          "M 390 418 C 445 400 490 450 545 418 C 590 392 640 430 685 414"
        ];
        draped.forEach((d) => strands.push(d));

        strands.forEach((d, i) => {
          layers.forEach(([w, color, op], li) => {
            addPath(g, d, {
              fill: "none",
              stroke: color,
              "stroke-width": String(w * (i % 5 === 0 ? 1.12 : 1)),
              "stroke-linecap": "round",
              "stroke-linejoin": "round",
              opacity: String(op)
            });
          });
        });
      })();

      /* ---- Corn kernels ---- */
      (function buildCorn() {
        const g = document.getElementById("corn");
        const rng = mulberry32(77);
        const cells = [
          [536, 500], [548, 496], [560, 500], [572, 498],
          [542, 508], [554, 506], [566, 510], [578, 506],
          [530, 508], [548, 516], [560, 518], [572, 514],
          [538, 518], [584, 500], [526, 498]
        ];
        cells.forEach(([x, y]) => {
          const rx = 5.2 + rng() * 1.6;
          const ry = 4.2 + rng() * 1.2;
          const rot = (rng() - 0.5) * 50;
          addEl(g, "ellipse", {
            cx: x, cy: y, rx: rx, ry: ry,
            fill: "url(#cornG)",
            transform: "rotate(" + rot.toFixed(1) + " " + x + " " + y + ")"
          });
        });
      })();

      /* ---- Garnish: scallions, sesame, chili threads ---- */
      (function buildGarnish() {
        const g = document.getElementById("garnish-float");
        const rng = mulberry32(99);

        for (let i = 0; i < 28; i++) {
          let x, y, guard = 0;
          do {
            x = 500 + (rng() - 0.5) * 520;
            y = 440 + (rng() - 0.5) * 200;
            guard++;
          } while (!inBroth(x, y, 28) && guard < 40);

          const rx = 6 + rng() * 5;
          const ry = 3.2 + rng() * 2.4;
          const rot = rng() * 180;
          const isWhite = rng() > 0.62;
          if (isWhite) {
            addEl(g, "ellipse", {
              cx: x, cy: y, rx: rx * 0.7, ry: ry * 0.7,
              fill: "#f4f0e0",
              opacity: "0.92",
              transform: "rotate(" + rot.toFixed(1) + " " + x + " " + y + ")"
            });
            addEl(g, "ellipse", {
              cx: x, cy: y, rx: rx * 0.7, ry: ry * 0.7,
              fill: "none",
              stroke: "#7aaa4a",
              "stroke-width": "1.4",
              opacity: "0.85",
              transform: "rotate(" + rot.toFixed(1) + " " + x + " " + y + ")"
            });
          } else {
            addEl(g, "ellipse", {
              cx: x, cy: y, rx: rx, ry: ry,
              fill: "none",
              stroke: rng() > 0.5 ? "#6aaa3c" : "#4e8a2c",
              "stroke-width": String(1.6 + rng()),
              opacity: String(0.75 + rng() * 0.2),
              transform: "rotate(" + rot.toFixed(1) + " " + x + " " + y + ")"
            });
          }
        }

        for (let i = 0; i < 90; i++) {
          let x, y, guard = 0;
          do {
            x = 500 + (rng() - 0.5) * 560;
            y = 440 + (rng() - 0.5) * 220;
            guard++;
          } while (!inBroth(x, y, 18) && guard < 40);
          const white = rng() > 0.38;
          const rx = white ? 1.7 + rng() * 0.7 : 1.4 + rng() * 0.6;
          const ry = rx * (0.55 + rng() * 0.25);
          addEl(g, "ellipse", {
            cx: x.toFixed(1),
            cy: y.toFixed(1),
            rx: rx.toFixed(2),
            ry: ry.toFixed(2),
            fill: white ? "#f6f0de" : "#1a120c",
            opacity: white ? "0.9" : "0.8",
            transform: "rotate(" + (rng() * 180).toFixed(1) + " " + x + " " + y + ")"
          });
        }

        for (let i = 0; i < 14; i++) {
          let x, y, guard = 0;
          do {
            x = 500 + (rng() - 0.5) * 500;
            y = 440 + (rng() - 0.5) * 180;
            guard++;
          } while (!inBroth(x, y, 36) && guard < 40);
          const a = rng() * Math.PI * 2;
          const len = 6 + rng() * 10;
          addPath(g, "M " + x + " " + y + " l " + Math.cos(a) * len + " " + Math.sin(a) * len * 0.45, {
            fill: "none",
            stroke: rng() > 0.5 ? "#c42810" : "#8a1808",
            "stroke-width": String(0.9 + rng() * 0.7),
            "stroke-linecap": "round",
            opacity: "0.8"
          });
        }
      })();

      /* ---- Pointer / lighting ---- */
      let tx = 0.5, ty = 0.5, mx = 0.5, my = 0.5;
      let pmx = 0.5, pmy = 0.5;
      let windX = 0, windY = 0;
      let mousePx = window.innerWidth * 0.5;
      let mousePy = window.innerHeight * 0.48;

      function onMove(clientX, clientY) {
        tx = clientX / window.innerWidth;
        ty = clientY / window.innerHeight;
        mousePx = clientX;
        mousePy = clientY;
      }

      window.addEventListener("pointermove", (e) => onMove(e.clientX, e.clientY), { passive: true });
      window.addEventListener("touchmove", (e) => {
        const t = e.touches[0];
        if (t) onMove(t.clientX, t.clientY);
      }, { passive: true });

      /* ---- Steam particles ---- */
      const particles = [];
      const MAX = 200;

      function bowlOrigin() {
        const r = stage.getBoundingClientRect();
        return {
          x: r.left + r.width * 0.5,
          y: r.top + r.height * 0.44,
          rx: r.width * 0.28,
          ry: r.height * 0.1
        };
      }

      function spawn(kind) {
        const b = bowlOrigin();
        const t = Math.random() * Math.PI * 2;
        const rad = Math.sqrt(Math.random());
        const x = b.x + Math.cos(t) * b.rx * rad;
        const y = b.y + Math.sin(t) * b.ry * rad;
        if (kind === "dust") {
          return {
            kind: "dust",
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            vx: (Math.random() - 0.5) * 0.15,
            vy: -0.05 - Math.random() * 0.08,
            life: 0,
            max: 400 + Math.random() * 400,
            size: 0.6 + Math.random() * 1.4,
            heat: 0.15 + Math.random() * 0.2
          };
        }
        if (kind === "spark") {
          return {
            kind: "spark",
            x, y,
            vx: (Math.random() - 0.5) * 0.25,
            vy: -0.55 - Math.random() * 0.5,
            life: 0,
            max: 50 + Math.random() * 40,
            size: 1.2 + Math.random() * 2,
            heat: 0.8
          };
        }
        return {
          kind: "steam",
          x, y,
          vx: (Math.random() - 0.5) * 0.4,
          vy: -0.55 - Math.random() * 0.7,
          life: 0,
          max: 130 + Math.random() * 110,
          size: 18 + Math.random() * 26,
          heat: 0.32 + Math.random() * 0.28,
          wob: Math.random() * Math.PI * 2,
          wobS: 0.02 + Math.random() * 0.03
        };
      }

      for (let i = 0; i < 55; i++) {
        const p = spawn("steam");
        p.life = Math.random() * p.max * 0.85;
        p.x += p.vx * p.life * 1.2;
        p.y += p.vy * p.life * 1.2;
        p.wob += p.wobS * p.life;
        particles.push(p);
      }
      for (let i = 0; i < 16; i++) particles.push(spawn("dust"));
      for (let i = 0; i < 8; i++) {
        const p = spawn("spark");
        p.life = Math.random() * p.max * 0.6;
        p.y += p.vy * p.life;
        particles.push(p);
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener("resize", resize);
      resize();

      let running = false;
      let last = performance.now();
      let burstT = 0;

      function frame(now) {
        if (reduced) {
          running = false;
          return;
        }
        const dt = Math.min(32, now - last) / 16.67;
        last = now;

        mx += (tx - mx) * 0.08;
        my += (ty - my) * 0.08;
        windX += ((tx - pmx) * 18 - windX) * 0.12;
        windY += ((ty - pmy) * 18 - windY) * 0.12;
        pmx = tx;
        pmy = ty;

        const tiltY = (mx - 0.5) * 14;
        const tiltX = 6 + (0.5 - my) * 8;
        root.style.setProperty("--tilt-x", tiltX.toFixed(3) + "deg");
        root.style.setProperty("--tilt-y", tiltY.toFixed(3) + "deg");
        root.style.setProperty("--lx", (mx * 100).toFixed(2) + "%");
        root.style.setProperty("--ly", (my * 100).toFixed(2) + "%");

        const b = bowlOrigin();
        const dx = mousePx - b.x;
        const dy = mousePy - b.y;
        const near = Math.hypot(dx / (b.rx * 1.35), dy / (b.ry * 2.2));
        const heat = near < 1 ? 1.18 : 1;
        root.style.setProperty("--heat", heat.toFixed(3));

        spec.setAttribute("cx", (456 + (mx - 0.5) * 90).toFixed(1));
        spec.setAttribute("cy", (412 + (my - 0.5) * 36).toFixed(1));
        ceramicSpec.setAttribute("cx", (390 + (mx - 0.5) * 70).toFixed(1));
        ceramicSpec.setAttribute("cy", (330 + (my - 0.5) * 24).toFixed(1));

        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        ctx.globalCompositeOperation = "source-over";
        const pScale = Math.min(window.innerWidth, window.innerHeight) / 980;

        burstT += dt;
        if (burstT > 180) {
          burstT = 0;
          for (let i = 0; i < 10; i++) {
            if (particles.length < MAX) particles.push(spawn("steam"));
          }
        }

        if (Math.random() < 0.7 * dt && particles.length < MAX) particles.push(spawn("steam"));
        if (Math.random() < 0.12 * dt && particles.length < MAX) particles.push(spawn("spark"));
        if (Math.random() < 0.04 * dt && particles.length < MAX) particles.push(spawn("dust"));

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life += dt;

          const pdx = p.x - mousePx;
          const pdy = p.y - mousePy;
          const pd = Math.hypot(pdx, pdy) || 1;
          if (pd < 220 && p.kind !== "dust") {
            const f = (1 - pd / 220) * 0.45;
            p.vx += windX * f * 0.35;
            p.vy += windY * f * 0.35;
            p.vx += (pdx / pd) * f * 0.08;
          }

          if (p.kind === "steam") {
            p.wob += p.wobS * dt;
            p.vx += Math.sin(p.wob) * 0.04;
            p.vy -= 0.012 * dt;
            p.vx *= 0.99;
          }

          p.x += p.vx * dt * 1.4;
          p.y += p.vy * dt * 1.4;

          const tLife = p.life / p.max;
          if (tLife >= 1) {
            particles.splice(i, 1);
            continue;
          }

          const fade = tLife < 0.12 ? tLife / 0.12 : 1 - (tLife - 0.12) / 0.88;
          const alpha = fade * p.heat;

          if (p.kind === "steam") {
            const s = p.size * pScale * (0.75 + tLife * 1.35);
            const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, s);
            g.addColorStop(0, "rgba(255, 246, 236, " + (alpha * 0.2) + ")");
            g.addColorStop(0.35, "rgba(255, 228, 206, " + (alpha * 0.08) + ")");
            g.addColorStop(1, "rgba(255, 210, 180, 0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, s * 0.72, s, 0, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.kind === "spark") {
            ctx.fillStyle = "rgba(255, 196, 120, " + (alpha * 0.35) + ")";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * pScale * (1 - tLife * 0.5), 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = "rgba(255, 230, 200, " + (alpha * 0.22) + ")";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * pScale, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        requestAnimationFrame(frame);
      }

      function startLoop() {
        if (running || reduced) return;
        running = true;
        last = performance.now();
        requestAnimationFrame(frame);
      }

      if (!reduced) startLoop();
      else {
        root.style.setProperty("--tilt-x", "6deg");
        root.style.setProperty("--tilt-y", "0deg");
      }
    })();
  </script>
</body>
</html>
