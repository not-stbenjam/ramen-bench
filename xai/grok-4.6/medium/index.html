<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vegan Ramen</title>
  <style>
    :root {
      --mx: 0;
      --my: 0;
      --warm: 0.62;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060403;
    }

    body { cursor: none; touch-action: none; }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 48% 34% at calc(50% + var(--mx) * 5%) calc(40% + var(--my) * 4%),
          rgba(210, 110, 42, calc(0.28 * var(--warm))) 0%,
          transparent 58%),
        radial-gradient(ellipse 80% 52% at 50% 82%,
          rgba(36, 18, 10, 1) 0%,
          transparent 62%),
        radial-gradient(ellipse 110% 90% at 50% 100%,
          #110c09 0%,
          #060403 52%);
    }

    .table {
      position: absolute;
      inset: auto 0 0 0;
      height: 42%;
      background:
        radial-gradient(ellipse 62% 48% at 50% 0%,
          rgba(32, 18, 10, 0.95) 0%,
          rgba(8, 5, 4, 0) 72%);
      pointer-events: none;
      z-index: 0;
    }

    .glow {
      position: absolute;
      width: min(96vmin, 920px);
      height: min(96vmin, 920px);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -46%);
      background:
        radial-gradient(circle at 50% 58%,
          rgba(255, 158, 72, 0.22) 0%,
          rgba(180, 78, 24, 0.1) 26%,
          transparent 60%);
      filter: blur(10px);
      pointer-events: none;
      z-index: 0;
      animation: breathe 7.2s ease-in-out infinite;
    }

    .stage {
      position: relative;
      z-index: 2;
      width: min(108vmin, 980px);
      height: min(108vmin, 980px);
      transform-style: preserve-3d;
      transform:
        perspective(1500px)
        rotateX(calc(16deg + var(--my) * -6deg))
        rotateY(calc(var(--mx) * 8deg))
        translate3d(calc(var(--mx) * 14px), calc(var(--my) * 9px), 0);
      will-change: transform;
      transition: transform 0.2s ease-out;
    }

    .bowl {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      filter: drop-shadow(0 34px 28px rgba(0, 0, 0, 0.62));
    }

    canvas.fx, canvas.grain, .vignette, .cursor-light {
      pointer-events: none;
    }

    canvas.fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
    }

    canvas.grain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 7;
      opacity: 0.075;
      mix-blend-mode: overlay;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 6;
      background:
        radial-gradient(ellipse 70% 64% at 50% 46%, transparent 36%, rgba(0, 0, 0, 0.58) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.32) 0%, transparent 18%, transparent 72%, rgba(0, 0, 0, 0.55) 100%);
    }

    .cursor-light {
      position: absolute;
      width: 260px;
      height: 260px;
      margin: -130px 0 0 -130px;
      border-radius: 50%;
      z-index: 5;
      background: radial-gradient(circle,
        rgba(255, 204, 130, 0.16) 0%,
        rgba(232, 140, 62, 0.05) 40%,
        transparent 70%);
      mix-blend-mode: screen;
      transform: translate(-9999px, -9999px);
      will-change: transform, opacity;
    }

    .oil { animation: sheen 5.4s ease-in-out infinite; }
    .broth-shimmer { animation: shimmer 6.4s ease-in-out infinite; }
    .steam-wisp { animation: rise 4.6s ease-in infinite; transform-origin: center bottom; }
    .steam-wisp.d2 { animation-duration: 5.5s; animation-delay: -1.3s; }
    .steam-wisp.d3 { animation-duration: 6.2s; animation-delay: -2.6s; }
    .steam-wisp.d4 { animation-duration: 5s; animation-delay: -0.8s; }
    .steam-wisp.d5 { animation-duration: 6.8s; animation-delay: -3.4s; }
    .bubble { animation: bubble 3.7s ease-in infinite; }
    .bubble.b2 { animation-duration: 4.5s; animation-delay: -1.1s; }
    .bubble.b3 { animation-duration: 5.1s; animation-delay: -2.3s; }
    .bubble.b4 { animation-duration: 3.3s; animation-delay: -0.5s; }
    .bubble.b5 { animation-duration: 4.2s; animation-delay: -3s; }
    .bubble.b6 { animation-duration: 4.8s; animation-delay: -1.8s; }
    .idle-bob { animation: bob 8.5s ease-in-out infinite; }
    .chili-thread { animation: drift 8.5s ease-in-out infinite; transform-origin: 400px 380px; }

    @keyframes breathe {
      0%, 100% { opacity: 0.78; transform: translate(-50%, -46%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -46%) scale(1.07); }
    }
    @keyframes sheen {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.95; }
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.28; }
      50% { opacity: 0.62; }
    }
    @keyframes rise {
      0% { opacity: 0; transform: translateY(10px) scale(0.84); }
      16% { opacity: 0.62; }
      68% { opacity: 0.2; }
      100% { opacity: 0; transform: translateY(-92px) scale(1.4); }
    }
    @keyframes bubble {
      0% { opacity: 0; transform: translateY(0) scale(0.55); }
      18% { opacity: 0.75; }
      78% { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-18px) scale(1.2); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes drift {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(9deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow, .oil, .broth-shimmer, .steam-wisp, .bubble, .idle-bob, .chili-thread {
        animation: none !important;
      }
      .stage {
        transition: none !important;
        transform: perspective(1500px) rotateX(16deg);
      }
      .steam-wisp { opacity: 0.32; transform: none; }
      .oil { opacity: 0.74; }
      .broth-shimmer { opacity: 0.48; }
    }
  </style>
</head>

    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <div class="cursor-light" id="cursorLight" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <canvas class="grain" id="grain" aria-hidden="true"></canvas>
  </div>

  <script>
    (function () {
      const root = document.documentElement;
      const stage = document.getElementById("stage");
      const specular = document.getElementById("specular");
      const cursorLight = document.getElementById("cursorLight");
      const fx = document.getElementById("fx");
      const grain = document.getElementById("grain");
      const fxCtx = fx.getContext("2d", { alpha: true });
      const grainCtx = grain.getContext("2d");

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let motionOff = reduceMotion.matches;
      reduceMotion.addEventListener("change", function (e) {
        motionOff = e.matches;
        if (motionOff) {
          target.x = 0;
          target.y = 0;
          steam.length = 0;
          motes.length = 0;
        }
      });

      const target = { x: 0, y: 0 };
      const current = { x: 0, y: 0 };
      let pointerInside = false;
      let width = 1;
      let height = 1;
      let dpr = 1;
      let idle = 0;

      const steam = [];
      const motes = [];
      const MAX_STEAM = 80;
      const MAX_MOTES = 48;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        [fx, grain].forEach(function (c) {
          c.width = Math.floor(width * dpr);
          c.height = Math.floor(height * dpr);
        });
        paintGrain();
        seedSteam();
      }

      function paintGrain() {
        const w = grain.width;
        const h = grain.height;
        const img = grainCtx.createImageData(w, h);
        const data = img.data;
        for (let i = 0; i < data.length; i += 4) {
          const n = (Math.random() * 255) | 0;
          data[i] = data[i + 1] = data[i + 2] = n;
          data[i + 3] = 255;
        }
        grainCtx.putImageData(img, 0, 0);
      }

      function bowlOrigin() {
        const r = stage.getBoundingClientRect();
        return {
          x: r.left + r.width * 0.5,
          y: r.top + r.height * 0.545,
          w: r.width,
          h: r.height
        };
      }

      function makeSteam(lifeStart) {
        const b = bowlOrigin();
        const spread = b.w * 0.2;
        return {
          x: b.x + (Math.random() - 0.5) * spread * 2,
          y: b.y - b.h * 0.03 + (Math.random() - 0.5) * b.h * 0.05,
          vx: (Math.random() - 0.5) * 0.28,
          vy: -0.5 - Math.random() * 0.75,
          life: lifeStart || 0,
          max: 100 + Math.random() * 90,
          size: 20 + Math.random() * 40,
          wobble: Math.random() * Math.PI * 2
        };
      }

      function seedSteam() {
        steam.length = 0;
        motes.length = 0;
        if (motionOff) return;
        for (let i = 0; i < 28; i++) steam.push(makeSteam(Math.random() * 80));
        for (let i = 0; i < 18; i++) {
          motes.push({
            x: Math.random() * width,
            y: height * (0.22 + Math.random() * 0.5),
            vx: (Math.random() - 0.5) * 0.12,
            vy: -0.08 - Math.random() * 0.12,
            life: Math.random() * 120,
            max: 200 + Math.random() * 200,
            size: 0.6 + Math.random() * 1.5,
            a: 0.09 + Math.random() * 0.16
          });
        }
      }

      function spawnSteam() {
        if (motionOff) return;
        const p = makeSteam(0);
        p.vx += current.x * 0.6;
        steam.push(p);
        if (steam.length > MAX_STEAM) steam.splice(0, steam.length - MAX_STEAM);
      }

      function spawnMote() {
        if (motionOff) return;
        motes.push({
          x: width * (0.25 + Math.random() * 0.5),
          y: height * (0.3 + Math.random() * 0.4),
          vx: (Math.random() - 0.5) * 0.12,
          vy: -0.08 - Math.random() * 0.12,
          life: 0,
          max: 200 + Math.random() * 200,
          size: 0.6 + Math.random() * 1.4,
          a: 0.08 + Math.random() * 0.18
        });
        if (motes.length > MAX_MOTES) motes.splice(0, motes.length - MAX_MOTES);
      }

      function applyPose() {
        root.style.setProperty("--mx", current.x.toFixed(4));
        root.style.setProperty("--my", current.y.toFixed(4));
        const warmth = 0.52 + Math.abs(current.x) * 0.14 + (pointerInside ? 0.14 : 0);
        root.style.setProperty("--warm", warmth.toFixed(3));
        specular.setAttribute("cx", (356 + current.x * 76).toFixed(1));
        specular.setAttribute("cy", (376 + current.y * 24).toFixed(1));
      }

      function onPointer(e) {
        target.x = (e.clientX / width - 0.5) * 2;
        target.y = (e.clientY / height - 0.5) * 2;
        pointerInside = true;
        idle = 0;
        cursorLight.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px)";
        cursorLight.style.opacity = motionOff ? "0.3" : "1";
      }

      function onLeave() {
        pointerInside = false;
        target.x = 0;
        target.y = 0;
        cursorLight.style.opacity = "0";
      }

      window.addEventListener("pointermove", onPointer, { passive: true });
      window.addEventListener("pointerdown", onPointer, { passive: true });
      window.addEventListener("pointerleave", onLeave);
      window.addEventListener("blur", onLeave);
      window.addEventListener("resize", resize);

      let last = performance.now();
      let acc = 0;

      function frame(now) {
        const dt = Math.min(32, now - last);
        last = now;
        acc += dt;
        idle += dt;

        if (!motionOff) {
          if (!pointerInside && idle > 1400) {
            const t = now * 0.00035;
            target.x = Math.sin(t) * 0.22;
            target.y = Math.cos(t * 0.8) * 0.12;
          }
          current.x += (target.x - current.x) * 0.085;
          current.y += (target.y - current.y) * 0.085;
        } else {
          current.x += (0 - current.x) * 0.15;
          current.y += (0 - current.y) * 0.15;
        }
        applyPose();

        fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        fxCtx.clearRect(0, 0, width, height);

        if (!motionOff) {
          if (acc > 38) {
            spawnSteam();
            if (Math.random() < 0.55) spawnSteam();
            if (Math.random() < 0.32) spawnMote();
            acc = 0;
          }

          for (let i = steam.length - 1; i >= 0; i--) {
            const p = steam[i];
            p.life += 1;
            p.wobble += 0.032;
            p.x += p.vx + Math.sin(p.wobble) * 0.38 + current.x * 0.14;
            p.y += p.vy;
            p.vy *= 0.996;
            p.size *= 1.0065;
            const t = p.life / p.max;
            if (t >= 1) {
              steam.splice(i, 1);
              continue;
            }
            const fade = t < 0.12 ? t / 0.12 : 1 - (t - 0.12) / 0.88;
            const alpha = fade * 0.2;
            const g = fxCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
            g.addColorStop(0, "rgba(255,246,232," + (alpha * 1.45) + ")");
            g.addColorStop(0.42, "rgba(236,214,188," + (alpha * 0.75) + ")");
            g.addColorStop(1, "rgba(200,170,140,0)");
            fxCtx.fillStyle = g;
            fxCtx.beginPath();
            fxCtx.ellipse(p.x, p.y, p.size * 0.6, p.size, 0, 0, Math.PI * 2);
            fxCtx.fill();
          }

          for (let i = motes.length - 1; i >= 0; i--) {
            const m = motes[i];
            m.life += 1;
            m.x += m.vx + current.x * 0.05;
            m.y += m.vy;
            const t = m.life / m.max;
            if (t >= 1) {
              motes.splice(i, 1);
              continue;
            }
            const fade = t < 0.15 ? t / 0.15 : 1 - (t - 0.15) / 0.85;
            fxCtx.fillStyle = "rgba(255,214,154," + (m.a * fade) + ")";
            fxCtx.beginPath();
            fxCtx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
            fxCtx.fill();
          }
        } else {
          const b = bowlOrigin();
          for (let i = 0; i < 6; i++) {
            const x = b.x + (i - 2.5) * b.w * 0.045;
            const y = b.y - b.h * 0.18 - i * 5;
            const g = fxCtx.createRadialGradient(x, y, 0, x, y, 52);
            g.addColorStop(0, "rgba(255,244,230,0.12)");
            g.addColorStop(1, "rgba(200,170,140,0)");
            fxCtx.fillStyle = g;
            fxCtx.beginPath();
            fxCtx.ellipse(x, y, 24, 42, 0, 0, Math.PI * 2);
            fxCtx.fill();
          }
        }

        requestAnimationFrame(frame);
      }

      resize();
      applyPose();
      cursorLight.style.opacity = "0";
      requestAnimationFrame(frame);
    })();
  </script>
