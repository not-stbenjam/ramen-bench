<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vegan Ramen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07060a;
      cursor: none;
    }

    body {
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      touch-action: none;
    }

    .scene {
      position: relative;
      width: min(100vw, 100vh);
      height: min(100vw, 100vh);
      max-width: 920px;
      max-height: 920px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    /* Ambient room glow — warm and living */
    .ambience {
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(ellipse 55% 45% at 50% 62%,
          rgba(255, 140, 60, 0.22) 0%,
          rgba(180, 60, 20, 0.10) 35%,
          transparent 70%),
        radial-gradient(ellipse 80% 70% at 50% 100%,
          rgba(40, 18, 8, 0.9) 0%,
          transparent 55%),
        radial-gradient(circle at var(--mx, 50%) var(--my, 40%),
          rgba(255, 170, 90, 0.12) 0%,
          transparent 42%);
      pointer-events: none;
      z-index: 0;
      transition: background 0.15s ease-out;
      animation: ambiencePulse 7s ease-in-out infinite;
    }

    @keyframes ambiencePulse {
      0%, 100% { opacity: 0.85; filter: brightness(1); }
      50% { opacity: 1; filter: brightness(1.08); }
    }

    /* Soft vignette */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 70% at 50% 48%,
        transparent 40%,
        rgba(0, 0, 0, 0.55) 100%);
      pointer-events: none;
      z-index: 4;
    }

    .bowl-wrap {
      position: relative;
      width: 72%;
      max-width: 560px;
      aspect-ratio: 1;
      z-index: 2;
      transform:
        translate3d(calc(var(--px, 0) * 1px), calc(var(--py, 0) * 1px), 0)
        rotateX(calc(var(--rx, 0) * 1deg))
        rotateY(calc(var(--ry, 0) * 1deg));
      transform-style: preserve-3d;
      transition: transform 0.12s ease-out;
      animation: bowlBreathe 5.5s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes bowlBreathe {
      0%, 100% { transform:
        translate3d(calc(var(--px, 0) * 1px), calc(var(--py, 0) * 1px), 0)
        rotateX(calc(var(--rx, 0) * 1deg))
        rotateY(calc(var(--ry, 0) * 1deg))
        scale(1); }
      50% { transform:
        translate3d(calc(var(--px, 0) * 1px), calc(var(--py, 0) * 1px - 3px), 0)
        rotateX(calc(var(--rx, 0) * 1deg))
        rotateY(calc(var(--ry, 0) * 1deg))
        scale(1.012); }
    }

    .bowl-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 28px 40px rgba(0, 0, 0, 0.55))
              drop-shadow(0 8px 16px rgba(180, 70, 20, 0.25));
    }

    /* Steam layer */
    .steam {
      position: absolute;
      left: 18%;
      right: 18%;
      top: 8%;
      height: 42%;
      pointer-events: none;
      z-index: 3;
      overflow: visible;
    }

    .steam-plume {
      position: absolute;
      bottom: 0;
      width: 28%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 100%,
        rgba(255, 245, 230, 0.45) 0%,
        rgba(255, 230, 200, 0.18) 35%,
        transparent 70%);
      filter: blur(10px);
      opacity: 0;
      transform-origin: 50% 100%;
      animation: steamRise var(--dur, 4.2s) ease-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .steam-plume:nth-child(1) { left: 8%;  --dur: 4.6s; --delay: 0s;    width: 32%; }
    .steam-plume:nth-child(2) { left: 36%; --dur: 3.9s; --delay: 1.1s;  width: 26%; }
    .steam-plume:nth-child(3) { left: 58%; --dur: 5.1s; --delay: 0.5s;  width: 30%; }
    .steam-plume:nth-child(4) { left: 22%; --dur: 4.3s; --delay: 2.2s;  width: 22%; }
    .steam-plume:nth-child(5) { left: 48%; --dur: 4.8s; --delay: 1.7s;  width: 24%; }

    @keyframes steamRise {
      0% {
        opacity: 0;
        transform: translateY(8%) scaleX(0.7) scaleY(0.4);
      }
      12% { opacity: 0.7; }
      45% {
        opacity: 0.55;
        transform: translateY(-35%) scaleX(1.05) scaleY(1.1) translateX(var(--sway, 4px));
      }
      100% {
        opacity: 0;
        transform: translateY(-95%) scaleX(1.35) scaleY(1.5) translateX(calc(var(--sway, 4px) * -1.2));
      }
    }

    /* Broth shimmer overlay on SVG via CSS filter pulse */
    .broth-shimmer {
      animation: shimmer 3.8s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.9; }
    }

    /* Chopstick glint */
    .chopstick-glint {
      animation: glint 6s ease-in-out infinite;
    }

    @keyframes glint {
      0%, 70%, 100% { opacity: 0.15; }
      78% { opacity: 0.55; }
      85% { opacity: 0.2; }
    }

    /* Custom warm cursor orb */
    .cursor {
      position: fixed;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(255, 200, 120, 0.85) 0%,
        rgba(255, 140, 60, 0.35) 45%,
        transparent 70%);
      box-shadow: 0 0 24px 8px rgba(255, 150, 70, 0.25);
      pointer-events: none;
      z-index: 10;
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .cursor.visible { opacity: 1; }

    /* Heat haze near bowl */
    .haze {
      position: absolute;
      left: 20%;
      right: 20%;
      top: 28%;
      height: 35%;
      background: radial-gradient(ellipse at 50% 80%,
        rgba(255, 180, 100, 0.08) 0%,
        transparent 70%);
      filter: blur(16px);
      pointer-events: none;
      z-index: 1;
      animation: hazeDrift 8s ease-in-out infinite;
    }

    @keyframes hazeDrift {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(-6%) scale(1.08); opacity: 1; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .ambience,
      .bowl-wrap,
      .steam-plume,
      .broth-shimmer,
      .chopstick-glint,
      .haze {
        animation: none !important;
      }

      .steam-plume {
        opacity: 0.25;
        transform: translateY(-40%) scale(1.1);
      }

      .bowl-wrap {
        transition: none;
      }

      .ambience {
        transition: none;
        opacity: 0.9;
      }
    }

    /* Fine-tune on very small screens */
    @media (max-width: 420px) {
      .bowl-wrap { width: 86%; }
      .steam { top: 6%; height: 38%; }
    }
  </style>
</head>
<body>
  <div class="scene" id="scene" aria-hidden="true">
    <div class="ambience" id="ambience"></div>
    <div class="haze"></div>

    <div class="bowl-wrap" id="bowl">
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Steaming bowl of vegan ramen">
        <defs>
          <!-- Bowl ceramic -->
          <linearGradient id="bowlOuter" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2a1810"/>
            <stop offset="35%" stop-color="#1a0e0a"/>
            <stop offset="70%" stop-color="#120a08"/>
            <stop offset="100%" stop-color="#0c0705"/>
          </linearGradient>
          <linearGradient id="bowlRim" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#5c3a28"/>
            <stop offset="40%" stop-color="#3d2418"/>
            <stop offset="100%" stop-color="#1e100c"/>
          </linearGradient>
          <linearGradient id="bowlInner" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1f120e"/>
            <stop offset="100%" stop-color="#0a0604"/>
          </linearGradient>

          <!-- Rich tonkotsu-style vegan broth -->
          <radialGradient id="broth" cx="48%" cy="42%" r="55%">
            <stop offset="0%" stop-color="#e8a854"/>
            <stop offset="35%" stop-color="#c47830"/>
            <stop offset="70%" stop-color="#8f4a18"/>
            <stop offset="100%" stop-color="#5c2e0e"/>
          </radialGradient>
          <radialGradient id="brothHighlight" cx="40%" cy="35%" r="40%">
            <stop offset="0%" stop-color="#ffd890" stop-opacity="0.55"/>
            <stop offset="60%" stop-color="#e8a050" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#c07030" stop-opacity="0"/>
          </radialGradient>

          <!-- Chili oil swirl -->
          <radialGradient id="chiliOil" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff6b2c" stop-opacity="0.7"/>
            <stop offset="50%" stop-color="#c43010" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#8a2008" stop-opacity="0"/>
          </radialGradient>

          <!-- Soft shadow under bowl -->
          <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#000" stop-opacity="0.55"/>
            <stop offset="70%" stop-color="#000" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#000" stop-opacity="0"/>
          </radialGradient>

          <!-- Nori -->
          <linearGradient id="noriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1a2e1a"/>
            <stop offset="50%" stop-color="#0d1a0e"/>
            <stop offset="100%" stop-color="#152218"/>
          </linearGradient>

          <!-- Tofu -->
          <linearGradient id="tofuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f5f0e4"/>
            <stop offset="100%" stop-color="#d4c8a8"/>
          </linearGradient>

          <!-- Corn -->
          <radialGradient id="cornGrad" cx="40%" cy="35%" r="60%">
            <stop offset="0%" stop-color="#ffe566"/>
            <stop offset="100%" stop-color="#e8a820"/>
          </radialGradient>

          <!-- Shiitake -->
          <radialGradient id="mushroomCap" cx="45%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#8b5a3c"/>
            <stop offset="100%" stop-color="#4a2a18"/>
          </radialGradient>

          <!-- Soft clip for broth surface -->
          <clipPath id="brothClip">
            <ellipse cx="200" cy="195" rx="118" ry="52"/>
          </clipPath>

          <!-- Subtle noise-like pattern via filter for broth depth -->
          <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="b"/>
            <feMerge>
              <feMergeNode in="b"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Floor shadow -->
        <ellipse cx="200" cy="340" rx="130" ry="22" fill="url(#floorShadow)"/>

        <!-- Bowl body -->
        <path d="M70 185
                 C70 185, 75 310, 200 318
                 C325 310, 330 185, 330 185
                 Z"
              fill="url(#bowlOuter)"/>

        <!-- Bowl inner wall hint -->
        <ellipse cx="200" cy="185" rx="130" ry="58" fill="url(#bowlInner)"/>

        <!-- Rim -->
        <ellipse cx="200" cy="185" rx="130" ry="58" fill="none"
                 stroke="url(#bowlRim)" stroke-width="14"/>
        <ellipse cx="200" cy="182" rx="122" ry="52" fill="none"
                 stroke="#6b4530" stroke-width="2" opacity="0.45"/>

        <!-- Broth surface -->
        <ellipse cx="200" cy="195" rx="118" ry="52" fill="url(#broth)"/>
        <ellipse class="broth-shimmer" cx="200" cy="195" rx="118" ry="52"
                 fill="url(#brothHighlight)"/>

        <!-- Chili oil droplets -->
        <g clip-path="url(#brothClip)" opacity="0.85">
          <ellipse cx="155" cy="200" rx="22" ry="10" fill="url(#chiliOil)" transform="rotate(-15 155 200)"/>
          <ellipse cx="250" cy="210" rx="18" ry="8" fill="url(#chiliOil)" transform="rotate(20 250 210)"/>
          <ellipse cx="200" cy="185" rx="14" ry="6" fill="url(#chiliOil)"/>
          <ellipse cx="175" cy="220" rx="10" ry="5" fill="url(#chiliOil)" transform="rotate(-8 175 220)"/>
        </g>

        <!-- Noodles (wavy strands) -->
        <g clip-path="url(#brothClip)" fill="none" stroke-linecap="round" opacity="0.9">
          <path d="M110 195 Q140 175 170 200 T230 190 T290 205"
                stroke="#d4a574" stroke-width="3.2"/>
          <path d="M115 210 Q150 185 185 215 T255 200 T295 218"
                stroke="#c99560" stroke-width="2.8"/>
          <path d="M120 180 Q155 205 190 175 T260 195 T300 180"
                stroke="#e0b888" stroke-width="2.6"/>
          <path d="M105 205 Q145 220 180 195 T250 215 T285 198"
                stroke="#b8864e" stroke-width="3"/>
          <path d="M130 220 Q165 195 200 225 T270 210"
                stroke="#d4a574" stroke-width="2.4"/>
          <path d="M140 188 Q175 210 210 185 T280 200"
                stroke="#c99560" stroke-width="2.2"/>
          <path d="M125 198 Q160 170 195 205 T265 188"
                stroke="#e8c090" stroke-width="2"/>
        </g>

        <!-- Toppings cluster -->

        <!-- Nori sheet (left) -->
        <g transform="translate(105, 155) rotate(-12)">
          <rect x="0" y="0" width="38" height="55" rx="2" fill="url(#noriGrad)"/>
          <rect x="4" y="6" width="30" height="3" rx="1" fill="#2a4a2c" opacity="0.5"/>
          <rect x="4" y="16" width="30" height="3" rx="1" fill="#2a4a2c" opacity="0.5"/>
          <rect x="4" y="26" width="30" height="3" rx="1" fill="#2a4a2c" opacity="0.5"/>
          <rect x="4" y="36" width="30" height="3" rx="1" fill="#2a4a2c" opacity="0.5"/>
          <rect x="0" y="0" width="38" height="8" fill="#243828" opacity="0.35"/>
        </g>

        <!-- Marinated tofu cubes -->
        <g transform="translate(155, 168)">
          <rect x="0" y="8" width="26" height="22" rx="2" fill="url(#tofuGrad)"
                transform="rotate(-8 13 19)"/>
          <rect x="18" y="0" width="24" height="20" rx="2" fill="#ebe4d4"
                transform="rotate(12 30 10)"/>
          <!-- Seared edges -->
          <rect x="0" y="8" width="26" height="5" rx="1" fill="#c4a060" opacity="0.5"
                transform="rotate(-8 13 19)"/>
          <rect x="18" y="0" width="24" height="4" rx="1" fill="#b89050" opacity="0.45"
                transform="rotate(12 30 10)"/>
        </g>

        <!-- Shiitake mushrooms -->
        <g transform="translate(230, 160)">
          <ellipse cx="18" cy="22" rx="20" ry="10" fill="url(#mushroomCap)"/>
          <ellipse cx="18" cy="20" rx="14" ry="6" fill="#6b4228" opacity="0.4"/>
          <ellipse cx="14" cy="18" rx="3" ry="2" fill="#3a2010" opacity="0.5"/>
          <ellipse cx="22" cy="19" rx="2.5" ry="1.8" fill="#3a2010" opacity="0.45"/>
          <!-- Second mushroom -->
          <ellipse cx="42" cy="28" rx="15" ry="8" fill="#5c3820"/>
          <ellipse cx="42" cy="26" rx="10" ry="5" fill="#4a2a14" opacity="0.4"/>
        </g>

        <!-- Corn kernels cluster -->
        <g transform="translate(205, 195)">
          <circle cx="0" cy="0" r="5.5" fill="url(#cornGrad)"/>
          <circle cx="10" cy="-3" r="5" fill="#f0d040"/>
          <circle cx="5" cy="8" r="5.2" fill="#e8b828"/>
          <circle cx="16" cy="6" r="4.8" fill="url(#cornGrad)"/>
          <circle cx="-6" cy="7" r="4.5" fill="#f5d850"/>
          <circle cx="20" cy="-2" r="4.2" fill="#e0a820"/>
        </g>

        <!-- Soft-boiled style (aquafaba) egg half — vegan -->
        <g transform="translate(255, 185)">
          <ellipse cx="0" cy="8" rx="22" ry="18" fill="#f2e8d0" transform="rotate(25)"/>
          <ellipse cx="-2" cy="8" rx="14" ry="12" fill="#f5c84a" transform="rotate(25)"/>
          <ellipse cx="-4" cy="6" rx="6" ry="5" fill="#ffe070" transform="rotate(25)" opacity="0.7"/>
        </g>

        <!-- Green onion / scallion ribbons -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M145 205 Q160 195 175 208" stroke="#5a9a40" stroke-width="3.5"/>
          <path d="M155 215 Q170 205 185 218" stroke="#6aad4e" stroke-width="2.8"/>
          <path d="M165 198 Q180 210 195 200" stroke="#4a8835" stroke-width="3"/>
          <path d="M210 220 Q225 208 240 222" stroke="#5a9a40" stroke-width="3.2"/>
          <path d="M220 210 Q235 220 250 208" stroke="#6aad4e" stroke-width="2.5"/>
          <path d="M130 215 Q140 225 155 218" stroke="#7abc58" stroke-width="2.2"/>
          <!-- Thin rings -->
          <ellipse cx="190" cy="212" rx="7" ry="3.5" stroke="#68a848" stroke-width="2" fill="none" transform="rotate(-20 190 212)"/>
          <ellipse cx="225" cy="205" rx="6" ry="3" stroke="#5a9a40" stroke-width="1.8" fill="none" transform="rotate(15 225 205)"/>
        </g>

        <!-- Sesame seeds -->
        <g fill="#f5e8c8" opacity="0.85">
          <ellipse cx="160" cy="200" rx="2.2" ry="1.2" transform="rotate(30 160 200)"/>
          <ellipse cx="185" cy="190" rx="2" ry="1.1" transform="rotate(-20 185 190)"/>
          <ellipse cx="215" cy="215" rx="2.1" ry="1.15" transform="rotate(45 215 215)"/>
          <ellipse cx="240" cy="198" rx="1.9" ry="1" transform="rotate(-10 240 198)"/>
          <ellipse cx="175" cy="220" rx="2" ry="1.1" transform="rotate(60 175 220)"/>
          <ellipse cx="200" cy="205" rx="1.8" ry="1" transform="rotate(15 200 205)"/>
          <ellipse cx="145" cy="210" rx="2" ry="1.05" transform="rotate(-40 145 210)"/>
        </g>

        <!-- Chopsticks resting on rim -->
        <g class="chopstick-glint">
          <line x1="280" y1="120" x2="355" y2="250"
                stroke="#3d2818" stroke-width="5.5" stroke-linecap="round"/>
          <line x1="280" y1="120" x2="355" y2="250"
                stroke="#8b6540" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
          <line x1="292" y1="115" x2="368" y2="245"
                stroke="#2a1a10" stroke-width="5.5" stroke-linecap="round"/>
          <line x1="292" y1="115" x2="368" y2="245"
                stroke="#7a5535" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
        </g>

        <!-- Rim specular highlight -->
        <ellipse cx="200" cy="160" rx="90" ry="12" fill="none"
                 stroke="#c4a080" stroke-width="1.5" opacity="0.25"/>
      </svg>
    </div>

    <div class="steam" id="steam">
      <div class="steam-plume" style="--sway: 6px"></div>
      <div class="steam-plume" style="--sway: -5px"></div>
      <div class="steam-plume" style="--sway: 8px"></div>
      <div class="steam-plume" style="--sway: -4px"></div>
      <div class="steam-plume" style="--sway: 5px"></div>
    </div>

    <div class="vignette"></div>
  </div>

  <div class="cursor" id="cursor"></div>

  <script>
    (function () {
      const scene = document.getElementById('scene');
      const bowl = document.getElementById('bowl');
      const ambience = document.getElementById('ambience');
      const cursor = document.getElementById('cursor');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let targetX = 0, targetY = 0;
      let curX = 0, curY = 0;
      let mx = 50, my = 40;
      let tmx = 50, tmy = 40;
      let cursorX = window.innerWidth / 2;
      let cursorY = window.innerHeight / 2;
      let tCursorX = cursorX;
      let tCursorY = cursorY;
      let hasPointer = false;
      let raf = 0;

      function onPointerMove(e) {
        const x = e.clientX ?? (e.touches && e.touches[0].clientX);
        const y = e.clientY ?? (e.touches && e.touches[0].clientY);
        if (x == null || y == null) return;

        hasPointer = true;
        cursor.classList.add('visible');
        tCursorX = x;
        tCursorY = y;

        const rect = scene.getBoundingClientRect();
        const nx = (x - rect.left) / rect.width - 0.5;
        const ny = (y - rect.top) / rect.height - 0.5;

        // Parallax / tilt targets
        targetX = nx * (reduceMotion ? 4 : 14);
        targetY = ny * (reduceMotion ? 3 : 10);
        tmx = ((x - rect.left) / rect.width) * 100;
        tmy = ((y - rect.top) / rect.height) * 100;
      }

      function onPointerLeave() {
        targetX = 0;
        targetY = 0;
        tmx = 50;
        tmy = 40;
        hasPointer = false;
        cursor.classList.remove('visible');
      }

      function tick() {
        // Smooth follow
        curX += (targetX - curX) * 0.08;
        curY += (targetY - curY) * 0.08;
        mx += (tmx - mx) * 0.06;
        my += (tmy - my) * 0.06;
        cursorX += (tCursorX - cursorX) * 0.22;
        cursorY += (tCursorY - cursorY) * 0.22;

        const rx = reduceMotion ? curY * 0.15 : curY * 0.45;
        const ry = reduceMotion ? -curX * 0.2 : -curX * 0.55;

        bowl.style.setProperty('--px', curX.toFixed(2));
        bowl.style.setProperty('--py', curY.toFixed(2));
        bowl.style.setProperty('--rx', rx.toFixed(2));
        bowl.style.setProperty('--ry', ry.toFixed(2));

        ambience.style.setProperty('--mx', mx.toFixed(1) + '%');
        ambience.style.setProperty('--my', my.toFixed(1) + '%');

        if (hasPointer) {
          cursor.style.transform = 'translate(' + cursorX.toFixed(1) + 'px,' + cursorY.toFixed(1) + 'px)';
        }

        raf = requestAnimationFrame(tick);
      }

      window.addEventListener('pointermove', onPointerMove, { passive: true });
      window.addEventListener('pointerleave', onPointerLeave);
      window.addEventListener('blur', onPointerLeave);
      document.body.addEventListener('mouseleave', onPointerLeave);

      // Touch: brief follow then settle
      window.addEventListener('touchstart', onPointerMove, { passive: true });
      window.addEventListener('touchmove', onPointerMove, { passive: true });
      window.addEventListener('touchend', function () {
        setTimeout(onPointerLeave, 400);
      });

      raf = requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
