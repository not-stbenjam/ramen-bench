<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060a">
<title>Vegan Ramen</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05060a; }
  body {
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function () {
'use strict';

/* ============================================================
   1. math + noise
   ============================================================ */

var TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }

function rngFrom(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var PERM = new Uint8Array(512);
(function () {
  var r = rngFrom(20260904);
  var p = new Uint8Array(256), i, j, t;
  for (i = 0; i < 256; i++) p[i] = i;
  for (i = 255; i > 0; i--) { j = (r() * (i + 1)) | 0; t = p[i]; p[i] = p[j]; p[j] = t; }
  for (i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();

var GX = [1, -1, 1, -1, 1, -1, 0, 0];
var GY = [1, 1, -1, -1, 0, 0, 1, -1];
function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }

/* gradient noise, roughly [-1, 1] */
function noise2(x, y) {
  var xi = Math.floor(x), yi = Math.floor(y);
  var X = xi & 255, Y = yi & 255;
  var xf = x - xi, yf = y - yi;
  var u = fade(xf), v = fade(yf);
  var A = PERM[X] + Y, B = PERM[X + 1] + Y;
  var g00 = PERM[A] & 7, g01 = PERM[A + 1] & 7, g10 = PERM[B] & 7, g11 = PERM[B + 1] & 7;
  var n00 = GX[g00] * xf + GY[g00] * yf;
  var n10 = GX[g10] * (xf - 1) + GY[g10] * yf;
  var n01 = GX[g01] * xf + GY[g01] * (yf - 1);
  var n11 = GX[g11] * (xf - 1) + GY[g11] * (yf - 1);
  return lerp(lerp(n00, n10, u), lerp(n01, n11, u), v);
}

function fbm(x, y, oct) {
  var v = 0, a = 0.5, f = 1;
  for (var i = 0; i < oct; i++) { v += a * noise2(x * f, y * f); f *= 2.03; a *= 0.5; }
  return v;
}

/* curl of a scalar noise potential -> divergence-free flow, what smoke wants */
function potential(x, y, t) {
  return noise2(x, y + t) + noise2(x * 2.17 + 19.3, y * 2.17 - t * 1.55 + 7.1) * 0.45;
}
var CURL = { x: 0, y: 0 };
function curl(x, y, t, out) {
  var e = 0.09, ie = 1 / (2 * e);
  out.x = (potential(x, y + e, t) - potential(x, y - e, t)) * ie;
  out.y = -(potential(x + e, y, t) - potential(x - e, y, t)) * ie;
}

/* ============================================================
   2. canvas + scene state
   ============================================================ */

var cv = document.getElementById('scene');
var ctx = cv.getContext('2d', { alpha: false });

var S = {
  w: 0, h: 0, dpr: 1,
  cx: 0, cy: 0, R: 300,
  bg: null
};

var G = null;              /* geometry */
var BB = null;             /* bowl bounding box */
var LA = null, LB = null;  /* baked layers: A = vessel + broth, B = food + rim */
var pBody = null, pRim = null, pWall = null, pRimClip = null, pBrothClip = null;

var T = 0;                 /* scene clock, seconds */
var reduced = false;
var rafId = 0;
var lastTs = 0;
var noriBox = null;
var frameAvg = 16.7, frameCount = 0, downgraded = false;

/* the pointer is a soft, laggy thing; it also drifts on its own when nobody is there */
var ptr = {
  x: 0, y: 0, tx: 0, ty: 0,
  vx: 0, vy: 0,
  lastMove: -1e9,
  everMoved: false
};

/* composition constants, in units of the broth radius (top-down disc space) */
var FLAT = 0.42;                                    /* rim ellipse ry / rx */
var MOUND = { u: -0.14, v: 0.18, r: 0.44, h: 0.30 };  /* the noodle pile */

/* ============================================================
   3. geometry
   ============================================================ */

/* map a top-down point on the broth disc to screen space */
function P(g, u, v) {
  return { x: g.bx + u * g.brothR, y: g.by + v * g.brothR * g.s };
}

/* how high the food sits above the broth at (u,v), in broth-radius units */
function surfaceHeight(u, v) {
  var dx = (u - MOUND.u) / MOUND.r, dy = (v - MOUND.v) / MOUND.r;
  var d2 = dx * dx + dy * dy;
  if (d2 >= 1) return 0;
  return MOUND.h * Math.sqrt(1 - d2) * 0.92;
}

function buildGeom() {
  var R = S.R, s = FLAT;
  var g = {
    R: R, s: s,
    cx: S.cx, cy: S.cy,
    Ro: R * 1.062,
    rimRy: R * s,
    outRy: R * 1.062 * s,
    brothR: R * 0.920,
    brothRy: R * 0.920 * s,
    brothDrop: R * 0.125,
    depth: R * 0.84,
    footR: R * 0.36
  };
  g.footRy = g.footR * s * 0.92;
  g.bx = g.cx;
  g.by = g.cy + g.brothDrop;
  return g;
}

/* outer profile half-width at t (0 = rim, 1 = foot) */
function halfWidth(g, t) {
  return g.footR + (g.Ro - g.footR) * (1 - Math.pow(clamp(t, 0, 1), 1.55));
}

function buildPaths(g) {
  var p = new Path2D();
  p.moveTo(g.cx + g.Ro, g.cy);
  p.ellipse(g.cx, g.cy, g.Ro, g.outRy, 0, 0, Math.PI, false);
  p.bezierCurveTo(
    g.cx - g.Ro * 0.985, g.cy + g.depth * 0.30,
    g.cx - g.R * 0.700, g.cy + g.depth * 0.82,
    g.cx - g.footR, g.cy + g.depth);
  p.ellipse(g.cx, g.cy + g.depth, g.footR, g.footRy, 0, Math.PI, 0, true);
  p.bezierCurveTo(
    g.cx + g.R * 0.700, g.cy + g.depth * 0.82,
    g.cx + g.Ro * 0.985, g.cy + g.depth * 0.30,
    g.cx + g.Ro, g.cy);
  p.closePath();
  pBody = p;

  var r = new Path2D();
  r.ellipse(g.cx, g.cy, g.Ro, g.outRy, 0, 0, TAU);
  r.moveTo(g.cx + g.R, g.cy);
  r.ellipse(g.cx, g.cy, g.R, g.rimRy, 0, 0, TAU);
  pRim = r;

  var w = new Path2D();
  w.ellipse(g.cx, g.cy, g.R, g.rimRy, 0, 0, TAU);
  w.moveTo(g.bx + g.brothR, g.by);
  w.ellipse(g.bx, g.by, g.brothR, g.brothRy, 0, 0, TAU);
  pWall = w;

  var rc = new Path2D();
  rc.ellipse(g.cx, g.cy, g.R, g.rimRy, 0, 0, TAU);
  pRimClip = rc;

  var bc = new Path2D();
  bc.ellipse(g.bx, g.by, g.brothR, g.brothRy, 0, 0, TAU);
  pBrothClip = bc;
}

function bowlBounds(g) {
  var pad = g.R * 0.12;
  var top = g.cy - g.outRy - g.R * 0.34;
  var contact = g.cy + g.depth + g.footRy;
  return {
    x: g.cx - g.Ro - pad,
    y: top,
    w: (g.Ro + pad) * 2,
    h: (contact + g.R * 0.46) - top,
    contact: contact
  };
}

function makeLayer(bb, dpr) {
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(bb.w * dpr));
  c.height = Math.max(1, Math.ceil(bb.h * dpr));
  var x = c.getContext('2d');
  x.setTransform(dpr, 0, 0, dpr, -bb.x * dpr, -bb.y * dpr);
  return { cv: c, ctx: x, w: c.width / dpr, h: c.height / dpr };
}

/* ============================================================
   4. the vessel  (baked into layer A)
   ============================================================ */

function paintExterior(x, g, bb) {
  x.save();
  x.clip(pBody);

  var lg = x.createLinearGradient(0, g.cy - g.outRy * 0.2, 0, g.cy + g.depth + g.footRy);
  lg.addColorStop(0.00, '#5b4a33');
  lg.addColorStop(0.15, '#362e28');
  lg.addColorStop(0.36, '#23222c');
  lg.addColorStop(0.60, '#181823');
  lg.addColorStop(0.84, '#10101a');
  lg.addColorStop(1.00, '#090910');
  x.fillStyle = lg;
  x.fillRect(bb.x, bb.y, bb.w, bb.h);

  /* cylindrical falloff: the silhouette edges roll away from the light */
  var hg = x.createLinearGradient(g.cx - g.Ro, 0, g.cx + g.Ro, 0);
  hg.addColorStop(0.00, 'rgba(0,0,0,0.52)');
  hg.addColorStop(0.19, 'rgba(0,0,0,0.14)');
  hg.addColorStop(0.42, 'rgba(255,236,208,0.045)');
  hg.addColorStop(0.72, 'rgba(0,0,0,0.08)');
  hg.addColorStop(1.00, 'rgba(0,0,0,0.36)');
  x.fillStyle = hg;
  x.fillRect(bb.x, bb.y, bb.w, bb.h);

  /* throwing lines from the wheel */
  x.lineWidth = Math.max(0.6, g.R * 0.0045);
  for (var k = 1; k <= 9; k++) {
    var t = k / 10;
    var rx = halfWidth(g, t);
    var y = g.cy + g.depth * t;
    var a = 0.020 * (1 - t * 0.5);
    x.beginPath();
    x.ellipse(g.cx, y, rx * 0.995, rx * g.s * 0.9, 0, 0.12, Math.PI - 0.12);
    x.strokeStyle = 'rgba(255,222,186,' + a.toFixed(3) + ')';
    x.stroke();
    x.beginPath();
    x.ellipse(g.cx, y + g.R * 0.012, rx * 0.995, rx * g.s * 0.9, 0, 0.14, Math.PI - 0.14);
    x.strokeStyle = 'rgba(0,0,0,0.13)';
    x.stroke();
  }

  /* glaze sheen: a soft broad reflection low on the left flank */
  x.globalCompositeOperation = 'lighter';
  var sx = g.cx - g.R * 0.46, sy = g.cy + g.depth * 0.44;
  var sg = x.createRadialGradient(sx, sy, 0, sx, sy, g.R * 0.62);
  sg.addColorStop(0.00, 'rgba(150,176,216,0.13)');
  sg.addColorStop(0.45, 'rgba(120,146,188,0.045)');
  sg.addColorStop(1.00, 'rgba(90,110,150,0)');
  x.fillStyle = sg;
  x.fillRect(bb.x, bb.y, bb.w, bb.h);

  /* warm spill from the mouth pooling on the upper flank */
  var wg = x.createRadialGradient(g.cx, g.cy, g.R * 0.10, g.cx, g.cy, g.R * 1.15);
  wg.addColorStop(0.00, 'rgba(224,136,56,0.22)');
  wg.addColorStop(0.40, 'rgba(196,110,44,0.08)');
  wg.addColorStop(1.00, 'rgba(160,80,30,0)');
  x.fillStyle = wg;
  x.fillRect(bb.x, bb.y, bb.w, bb.h);

  /* warm bounce off the table onto the foot */
  var fy = g.cy + g.depth;
  var fgd = x.createRadialGradient(g.cx, fy, 0, g.cx, fy, g.R * 0.95);
  fgd.addColorStop(0.00, 'rgba(200,104,38,0.15)');
  fgd.addColorStop(0.50, 'rgba(170,84,30,0.05)');
  fgd.addColorStop(1.00, 'rgba(150,70,26,0)');
  x.fillStyle = fgd;
  x.fillRect(bb.x, bb.y, bb.w, bb.h);
  x.globalCompositeOperation = 'source-over';

  x.restore();

  /* rim lights hug the silhouette: cool from behind-left, warm from the right */
  x.save();
  x.lineJoin = 'round';
  var wide = x.createLinearGradient(g.cx - g.Ro, 0, g.cx + g.Ro, 0);
  wide.addColorStop(0.00, 'rgba(128,164,222,0.46)');
  wide.addColorStop(0.18, 'rgba(104,134,186,0.07)');
  wide.addColorStop(0.58, 'rgba(0,0,0,0)');
  wide.addColorStop(0.82, 'rgba(232,146,66,0.10)');
  wide.addColorStop(1.00, 'rgba(255,172,90,0.46)');
  x.lineWidth = Math.max(3, g.R * 0.055);
  x.strokeStyle = wide;
  x.globalCompositeOperation = 'lighter';
  x.stroke(pBody);

  var tight = x.createLinearGradient(g.cx - g.Ro, 0, g.cx + g.Ro, 0);
  tight.addColorStop(0.00, 'rgba(178,206,250,0.62)');
  tight.addColorStop(0.10, 'rgba(140,172,226,0.14)');
  tight.addColorStop(0.52, 'rgba(0,0,0,0)');
  tight.addColorStop(0.85, 'rgba(242,158,76,0.20)');
  tight.addColorStop(1.00, 'rgba(255,196,122,0.86)');
  x.lineWidth = Math.max(1.4, g.R * 0.014);
  x.strokeStyle = tight;
  x.stroke(pBody);
  x.globalCompositeOperation = 'source-over';
  x.restore();
}

function paintInnerWall(x, g, bb) {
  x.save();
  x.clip(pRimClip);

  var y0 = g.cy - g.rimRy;
  var y1 = g.by - g.brothRy;
  var lg = x.createLinearGradient(0, y0, 0, y1);
  lg.addColorStop(0.00, '#2c1c10');
  lg.addColorStop(0.30, '#150c06');
  lg.addColorStop(0.68, '#2e1608');
  lg.addColorStop(1.00, '#7d4315');
  x.fillStyle = lg;
  x.fill(pWall, 'evenodd');

  /* the broth is the light source, so the wall glows where it meets the liquid */
  x.globalCompositeOperation = 'lighter';
  x.save();
  x.clip(pWall, 'evenodd');
  x.translate(g.bx, g.by);
  x.scale(1, g.s);
  var bg = x.createRadialGradient(0, 0, g.brothR * 0.55, 0, 0, g.brothR * 1.55);
  bg.addColorStop(0.00, 'rgba(255,150,60,0)');
  bg.addColorStop(0.60, 'rgba(236,132,48,0.20)');
  bg.addColorStop(1.00, 'rgba(160,70,20,0)');
  x.fillStyle = bg;
  x.beginPath();
  x.arc(0, 0, g.brothR * 1.6, 0, TAU);
  x.fill();
  x.restore();
  x.globalCompositeOperation = 'source-over';

  /* faint vertical throwing texture inside the wall */
  x.save();
  x.clip(pWall, 'evenodd');
  x.lineWidth = Math.max(0.5, g.R * 0.004);
  for (var i = 0; i < 46; i++) {
    var a = (i / 46) * Math.PI + Math.PI;
    var xx = g.cx + Math.cos(a) * g.R;
    var yt = g.cy + Math.sin(a) * g.rimRy;
    var yb = g.by + Math.sin(a) * g.brothRy;
    x.beginPath();
    x.moveTo(xx, yt);
    x.lineTo(g.bx + Math.cos(a) * g.brothR, yb);
    x.strokeStyle = (i % 2) ? 'rgba(255,196,132,0.045)' : 'rgba(0,0,0,0.10)';
    x.stroke();
  }
  x.restore();

  x.restore();
}

function paintBrothBase(x, g) {
  x.save();
  x.translate(g.bx, g.by);
  x.scale(1, g.s);

  var rg = x.createRadialGradient(0, -g.brothR * 0.16, g.brothR * 0.03, 0, 0, g.brothR * 1.06);
  rg.addColorStop(0.00, '#ffd08a');
  rg.addColorStop(0.11, '#f0a94e');
  rg.addColorStop(0.30, '#c4732a');
  rg.addColorStop(0.55, '#944d17');
  rg.addColorStop(0.80, '#63300c');
  rg.addColorStop(1.00, '#3a1a05');
  x.fillStyle = rg;
  x.beginPath();
  x.arc(0, 0, g.brothR, 0, TAU);
  x.fill();

  /* depth blotches so the liquid reads as opaque, not as flat paint */
  var rng = rngFrom(9911);
  x.save();
  x.beginPath();
  x.arc(0, 0, g.brothR, 0, TAU);
  x.clip();
  for (var i = 0; i < 16; i++) {
    var a = rng() * TAU, d = Math.sqrt(rng()) * g.brothR * 0.95;
    var bx = Math.cos(a) * d, by = Math.sin(a) * d;
    var br = g.brothR * (0.14 + rng() * 0.30);
    var warm = rng() < 0.5;
    var bg2 = x.createRadialGradient(bx, by, 0, bx, by, br);
    bg2.addColorStop(0, warm ? 'rgba(255,178,88,0.11)' : 'rgba(40,16,4,0.20)');
    bg2.addColorStop(1, warm ? 'rgba(255,178,88,0)' : 'rgba(40,16,4,0)');
    x.fillStyle = bg2;
    x.beginPath();
    x.arc(bx, by, br, 0, TAU);
    x.fill();
  }
  x.restore();

  /* meniscus: the liquid climbs the wall and darkens right at the edge */
  var mg = x.createRadialGradient(0, 0, g.brothR * 0.80, 0, 0, g.brothR);
  mg.addColorStop(0.00, 'rgba(20,7,0,0)');
  mg.addColorStop(0.74, 'rgba(24,9,0,0.18)');
  mg.addColorStop(1.00, 'rgba(16,6,0,0.58)');
  x.fillStyle = mg;
  x.beginPath();
  x.arc(0, 0, g.brothR, 0, TAU);
  x.fill();

  x.globalCompositeOperation = 'lighter';
  x.lineWidth = g.brothR * 0.012;
  x.beginPath();
  x.arc(0, 0, g.brothR * 0.985, Math.PI * 0.08, Math.PI * 0.92);
  x.strokeStyle = 'rgba(255,190,110,0.22)';
  x.stroke();
  x.globalCompositeOperation = 'source-over';

  x.restore();
}

function paintRim(x, g) {
  /* the lip. bright where it faces the far light, dark and occluding at the near edge */
  var lg = x.createLinearGradient(0, g.cy - g.outRy, 0, g.cy + g.outRy);
  lg.addColorStop(0.00, '#6a5745');
  lg.addColorStop(0.22, '#372c24');
  lg.addColorStop(0.48, '#181315');
  lg.addColorStop(0.74, '#0e0b0f');
  lg.addColorStop(1.00, '#1a1310');
  x.fillStyle = lg;
  x.fill(pRim, 'evenodd');

  x.save();
  x.clip(pRim, 'evenodd');
  x.globalCompositeOperation = 'lighter';

  /* the far lip catches the most light */
  var back = x.createRadialGradient(g.cx, g.cy - g.outRy, 0, g.cx, g.cy - g.outRy, g.Ro * 1.5);
  back.addColorStop(0.00, 'rgba(255,226,190,0.30)');
  back.addColorStop(0.34, 'rgba(220,190,164,0.14)');
  back.addColorStop(1.00, 'rgba(180,150,130,0)');
  x.fillStyle = back;
  x.fillRect(g.cx - g.Ro - 2, g.cy - g.outRy - 2, g.Ro * 2 + 4, g.outRy * 2 + 4);

  var hg = x.createLinearGradient(g.cx - g.Ro, 0, g.cx + g.Ro, 0);
  hg.addColorStop(0.00, 'rgba(146,180,238,0.36)');
  hg.addColorStop(0.30, 'rgba(120,140,190,0.04)');
  hg.addColorStop(0.66, 'rgba(255,186,116,0.06)');
  hg.addColorStop(1.00, 'rgba(255,178,100,0.40)');
  x.fillStyle = hg;
  x.fillRect(g.cx - g.Ro - 2, g.cy - g.outRy - 2, g.Ro * 2 + 4, g.outRy * 2 + 4);
  x.globalCompositeOperation = 'source-over';

  /* the near lip is turned away from everything */
  var front = x.createLinearGradient(0, g.cy, 0, g.cy + g.outRy);
  front.addColorStop(0, 'rgba(0,0,0,0)');
  front.addColorStop(1, 'rgba(0,0,0,0.62)');
  x.fillStyle = front;
  x.fillRect(g.cx - g.Ro - 2, g.cy - 2, g.Ro * 2 + 4, g.outRy + 4);
  x.restore();

  x.lineWidth = Math.max(0.9, g.R * 0.006);

  /* outer edge: lit behind, a whisper of table bounce in front */
  x.beginPath();
  x.ellipse(g.cx, g.cy, g.Ro, g.outRy, 0, Math.PI, TAU);
  x.strokeStyle = 'rgba(255,222,182,0.34)';
  x.stroke();
  x.beginPath();
  x.ellipse(g.cx, g.cy, g.Ro, g.outRy, 0, 0, Math.PI);
  x.strokeStyle = 'rgba(255,166,94,0.12)';
  x.stroke();

  /* inner edge: the far side glows from the broth, the near side cuts a hard shadow */
  x.lineWidth = Math.max(1.0, g.R * 0.007);
  x.beginPath();
  x.ellipse(g.cx, g.cy, g.R, g.rimRy, 0, Math.PI, TAU);
  x.strokeStyle = 'rgba(255,198,138,0.42)';
  x.stroke();
  x.beginPath();
  x.ellipse(g.cx, g.cy, g.R, g.rimRy, 0, 0, Math.PI);
  x.strokeStyle = 'rgba(0,0,0,0.55)';
  x.stroke();
}

/* ============================================================
   5. the food  (baked into layer B)
   ============================================================ */

function contactShadow(x, g, u, v, rw, strength) {
  var b = P(g, u, v);
  var r = rw * g.brothR;
  x.save();
  x.translate(b.x, b.y);
  x.scale(1, g.s * 0.85);
  var sg = x.createRadialGradient(0, 0, 0, 0, 0, r);
  sg.addColorStop(0.00, 'rgba(22,8,0,' + strength + ')');
  sg.addColorStop(0.55, 'rgba(22,8,0,' + (strength * 0.45).toFixed(3) + ')');
  sg.addColorStop(1.00, 'rgba(22,8,0,0)');
  x.fillStyle = sg;
  x.beginPath();
  x.arc(0, 0, r, 0, TAU);
  x.fill();
  x.restore();
}

/* --- nori: a lacquered black sheet leaning on the far wall --- */
function drawNori(x, g, u, v, w, hh, lean) {
  var b = P(g, u, v);
  var W = w * g.brothR, H = hh * g.brothR;
  var lx = b.x - W / 2, rx = b.x + W / 2;
  var tlx = lx + lean * W, tly = b.y - H;
  var trx = rx + lean * W * 0.80, trY = b.y - H * 0.92;

  contactShadow(x, g, u, v + 0.02, w * 0.62, 0.55);

  var p = new Path2D();
  p.moveTo(lx, b.y);
  p.bezierCurveTo(lx - W * 0.07, b.y - H * 0.44, tlx - W * 0.05, tly + H * 0.30, tlx, tly);
  p.bezierCurveTo(tlx + W * 0.32, tly - H * 0.09, trx - W * 0.36, trY + H * 0.12, trx, trY);
  p.bezierCurveTo(trx + W * 0.06, trY + H * 0.36, rx + W * 0.06, b.y - H * 0.42, rx, b.y);
  p.closePath();

  var lg = x.createLinearGradient(0, tly, 0, b.y);
  lg.addColorStop(0.00, '#12181a');
  lg.addColorStop(0.26, '#080c0d');
  lg.addColorStop(0.68, '#0a0f0e');
  lg.addColorStop(1.00, '#1c1409');
  x.fillStyle = lg;
  x.fill(p);

  x.save();
  x.clip(p);
  x.globalCompositeOperation = 'lighter';

  /* satin sheen band across the sheet */
  var sg = x.createLinearGradient(lx, tly, rx, b.y);
  sg.addColorStop(0.00, 'rgba(80,104,116,0)');
  sg.addColorStop(0.32, 'rgba(84,108,120,0.05)');
  sg.addColorStop(0.47, 'rgba(126,152,164,0.11)');
  sg.addColorStop(0.60, 'rgba(84,108,120,0.04)');
  sg.addColorStop(1.00, 'rgba(60,80,92,0)');
  x.fillStyle = sg;
  x.fillRect(lx - W, tly - H, W * 3, H * 3);

  /* broth light bouncing onto the bottom of the sheet */
  var bg = x.createLinearGradient(0, b.y - H * 0.42, 0, b.y);
  bg.addColorStop(0, 'rgba(255,150,60,0)');
  bg.addColorStop(1, 'rgba(255,140,54,0.52)');
  x.fillStyle = bg;
  x.fillRect(lx - W, b.y - H * 0.5, W * 3, H * 0.6);
  x.globalCompositeOperation = 'source-over';

  /* pressed grain */
  x.lineWidth = Math.max(0.5, g.R * 0.0035);
  for (var i = 1; i < 13; i++) {
    var yy = b.y - (H * i / 13);
    x.beginPath();
    x.moveTo(lx + lean * W * (i / 13) - W * 0.04, yy + Math.sin(i * 1.7) * H * 0.012);
    x.lineTo(rx + lean * W * 0.8 * (i / 13) + W * 0.04, yy + Math.sin(i * 2.3 + 1) * H * 0.012);
    x.strokeStyle = (i % 3 === 0) ? 'rgba(150,170,180,0.030)' : 'rgba(0,0,0,0.20)';
    x.stroke();
  }
  x.restore();

  /* crisp lit top edge */
  x.lineWidth = Math.max(0.9, g.R * 0.006);
  x.beginPath();
  x.moveTo(tlx, tly);
  x.bezierCurveTo(tlx + W * 0.32, tly - H * 0.09, trx - W * 0.36, trY + H * 0.12, trx, trY);
  x.strokeStyle = 'rgba(158,178,188,0.26)';
  x.stroke();

  noriBox = { x0: Math.min(lx, tlx) - W * 0.08, x1: Math.max(rx, trx) + W * 0.08, y0: tly - H * 0.1, y1: b.y };
}

/* --- shiitake: domed cap with the traditional scored cross --- */
function drawShiitake(x, g, u, v, rad, rot) {
  var b = P(g, u, v);
  var rr = rad * g.brothR;
  var ry = rr * 0.58;
  var lift = rr * 0.30;
  var cxx = b.x, cyy = b.y - lift;

  contactShadow(x, g, u, v + rad * 0.16, rad * 1.5, 0.62);

  var p = new Path2D();
  p.ellipse(cxx, cyy, rr, ry, 0, 0, Math.PI, false);
  p.ellipse(cxx, cyy, rr, ry * 1.22, 0, Math.PI, TAU, false);
  p.closePath();

  var cg = x.createRadialGradient(cxx - rr * 0.34, cyy - ry * 0.95, rr * 0.05, cxx, cyy, rr * 1.35);
  cg.addColorStop(0.00, '#7a4b26');
  cg.addColorStop(0.26, '#4f2d15');
  cg.addColorStop(0.58, '#301809');
  cg.addColorStop(1.00, '#150902');
  x.fillStyle = cg;
  x.fill(p);

  x.save();
  x.clip(p);

  /* scored cross, cut through to the pale flesh */
  x.save();
  x.translate(cxx, cyy - ry * 0.34);
  x.rotate(rot);
  x.lineCap = 'round';
  /* six shallow cuts radiating from the crown, the way they are scored by hand */
  for (var ci = 0; ci < 6; ci++) {
    var ca = (ci / 6) * TAU + 0.22;
    var i0 = rr * 0.16, i1 = rr * 0.62;
    x.lineWidth = rr * 0.075;
    x.strokeStyle = 'rgba(196,166,124,0.34)';
    x.beginPath();
    x.moveTo(Math.cos(ca) * i0, Math.sin(ca) * i0 * 0.55);
    x.quadraticCurveTo(
      Math.cos(ca + 0.16) * (i0 + i1) * 0.5, Math.sin(ca + 0.16) * (i0 + i1) * 0.5 * 0.55,
      Math.cos(ca) * i1, Math.sin(ca) * i1 * 0.55);
    x.stroke();
    x.lineWidth = rr * 0.035;
    x.strokeStyle = 'rgba(26,12,4,0.42)';
    x.beginPath();
    x.moveTo(Math.cos(ca) * i0, Math.sin(ca) * i0 * 0.55 + rr * 0.035);
    x.quadraticCurveTo(
      Math.cos(ca + 0.16) * (i0 + i1) * 0.5, Math.sin(ca + 0.16) * (i0 + i1) * 0.5 * 0.55 + rr * 0.035,
      Math.cos(ca) * i1, Math.sin(ca) * i1 * 0.55 + rr * 0.035);
    x.stroke();
  }
  x.restore();

  x.globalCompositeOperation = 'lighter';
  var sg = x.createRadialGradient(cxx - rr * 0.30, cyy - ry * 1.05, 0, cxx - rr * 0.30, cyy - ry * 1.05, rr * 0.95);
  sg.addColorStop(0.00, 'rgba(255,208,150,0.20)');
  sg.addColorStop(1.00, 'rgba(255,190,120,0)');
  x.fillStyle = sg;
  x.fillRect(cxx - rr * 1.2, cyy - ry * 2.2, rr * 2.4, ry * 4);

  /* warm bounce off the broth onto the cap underside */
  var ug = x.createLinearGradient(0, cyy, 0, cyy + ry);
  ug.addColorStop(0, 'rgba(255,130,40,0)');
  ug.addColorStop(1, 'rgba(255,132,42,0.36)');
  x.fillStyle = ug;
  x.fillRect(cxx - rr * 1.2, cyy, rr * 2.4, ry * 1.3);
  x.globalCompositeOperation = 'source-over';
  x.restore();

  x.lineWidth = Math.max(0.8, rr * 0.045);
  x.beginPath();
  x.ellipse(cxx, cyy, rr, ry * 1.22, 0, Math.PI * 1.12, TAU - 0.2);
  x.strokeStyle = 'rgba(255,190,126,0.30)';
  x.stroke();
}

/* --- menma: bamboo shoots, leaning in a small bundle --- */
function drawMenma(x, g, u, v, len, tilt, wdt) {
  var b = P(g, u, v);
  var L = len * g.brothR, W = wdt * g.brothR;
  var tipx = b.x + Math.sin(tilt) * L, tipy = b.y - Math.cos(tilt) * L;

  contactShadow(x, g, u, v + 0.02, wdt * 2.2, 0.45);

  var dx = tipx - b.x, dy = tipy - b.y;
  var l = Math.hypot(dx, dy) || 1;
  var px = -dy / l, py = dx / l;
  var p = new Path2D();
  p.moveTo(b.x + px * W, b.y + py * W);
  p.quadraticCurveTo(b.x + dx * 0.5 + px * W * 1.15, b.y + dy * 0.5 + py * W * 1.15, tipx + px * W * 0.58, tipy + py * W * 0.58);
  p.lineTo(tipx - px * W * 0.58, tipy - py * W * 0.58);
  p.quadraticCurveTo(b.x + dx * 0.5 - px * W * 0.85, b.y + dy * 0.5 - py * W * 0.85, b.x - px * W, b.y - py * W);
  p.closePath();

  var lg = x.createLinearGradient(b.x - px * W, b.y, b.x + px * W, b.y);
  lg.addColorStop(0.00, '#4d3315');
  lg.addColorStop(0.32, '#9a733a');
  lg.addColorStop(0.56, '#bb9152');
  lg.addColorStop(1.00, '#5f4520');
  x.fillStyle = lg;
  x.fill(p);

  x.save();
  x.clip(p);
  x.lineWidth = Math.max(0.6, W * 0.16);
  for (var i = -1; i <= 1; i++) {
    x.beginPath();
    x.moveTo(b.x + px * W * i * 0.5, b.y + py * W * i * 0.5);
    x.lineTo(tipx + px * W * i * 0.3, tipy + py * W * i * 0.3);
    x.strokeStyle = 'rgba(80,52,20,0.34)';
    x.stroke();
  }
  x.globalCompositeOperation = 'lighter';
  var bg = x.createLinearGradient(0, b.y - L * 0.4, 0, b.y);
  bg.addColorStop(0, 'rgba(255,140,50,0)');
  bg.addColorStop(1, 'rgba(255,140,50,0.32)');
  x.fillStyle = bg;
  x.fillRect(b.x - L, b.y - L * 0.5, L * 2, L * 0.6);
  x.globalCompositeOperation = 'source-over';
  x.restore();

  x.lineWidth = Math.max(0.7, W * 0.22);
  x.beginPath();
  x.moveTo(tipx + px * W * 0.58, tipy + py * W * 0.58);
  x.lineTo(tipx - px * W * 0.58, tipy - py * W * 0.58);
  x.strokeStyle = 'rgba(226,192,140,0.34)';
  x.stroke();
}

/* --- tofu: a seared cube, built face by face --- */
function drawTofu(x, g, u, v, size, rot) {
  var b = P(g, u, v);
  var sz = size * g.brothR;
  var hgt = sz * 0.80;
  var i, j;

  contactShadow(x, g, u, v + size * 0.20, size * 1.5, 0.60);

  var base = [];
  for (i = 0; i < 4; i++) {
    var a = rot + i * TAU / 4 + Math.PI / 4;
    base.push({ x: b.x + Math.cos(a) * sz * 0.707, y: b.y + Math.sin(a) * sz * 0.707 * g.s });
  }
  var top = base.map(function (q) { return { x: q.x, y: q.y - hgt }; });

  var edges = [];
  for (i = 0; i < 4; i++) {
    j = (i + 1) % 4;
    edges.push({ i: i, j: j, mid: (base[i].y + base[j].y) / 2, mx: (base[i].x + base[j].x) / 2 });
  }
  edges.sort(function (p, q) { return p.mid - q.mid; });

  for (i = 0; i < 4; i++) {
    var e = edges[i];
    var na = Math.atan2(e.mid - b.y, e.mx - b.x);
    var lit = clamp(0.30 + 0.70 * Math.max(0, Math.cos(na - Math.PI * 0.40)), 0, 1);
    var fg = x.createLinearGradient(0, base[e.i].y - hgt, 0, base[e.i].y);
    fg.addColorStop(0.00, shade(214, 194, 152, lit * 0.92));
    fg.addColorStop(0.55, shade(178, 154, 112, lit * 0.80));
    fg.addColorStop(1.00, shade(150, 106, 54, lit * 0.86));
    x.fillStyle = fg;
    x.beginPath();
    x.moveTo(top[e.i].x, top[e.i].y);
    x.lineTo(top[e.j].x, top[e.j].y);
    x.lineTo(base[e.j].x, base[e.j].y);
    x.lineTo(base[e.i].x, base[e.i].y);
    x.closePath();
    x.fill();
    x.lineWidth = Math.max(0.8, sz * 0.045);
    x.strokeStyle = 'rgba(178,116,48,' + (0.30 * lit).toFixed(3) + ')';
    x.stroke();
  }

  x.beginPath();
  x.moveTo(top[0].x, top[0].y);
  for (i = 1; i < 4; i++) x.lineTo(top[i].x, top[i].y);
  x.closePath();
  var tg = x.createLinearGradient(b.x - sz * 0.7, b.y - hgt - sz * 0.4, b.x + sz * 0.7, b.y - hgt + sz * 0.4);
  tg.addColorStop(0.00, '#f2e6c8');
  tg.addColorStop(0.48, '#dfcda4');
  tg.addColorStop(1.00, '#b99f70');
  x.fillStyle = tg;
  x.fill();
  x.lineWidth = Math.max(0.9, sz * 0.05);
  x.strokeStyle = 'rgba(196,132,54,0.50)';
  x.stroke();

  /* a few charred flecks on the seared top */
  var rng = rngFrom(Math.round(u * 1000 + v * 733 + 17));
  for (i = 0; i < 7; i++) {
    var fa = rng() * TAU, fd = Math.sqrt(rng()) * sz * 0.44;
    x.beginPath();
    x.ellipse(b.x + Math.cos(fa) * fd, b.y - hgt + Math.sin(fa) * fd * g.s, sz * 0.05, sz * 0.03, fa, 0, TAU);
    x.fillStyle = 'rgba(140,84,30,' + (0.20 + rng() * 0.30).toFixed(2) + ')';
    x.fill();
  }
}

function shade(r, gg, bl, k) {
  return 'rgb(' + Math.round(r * k) + ',' + Math.round(gg * k) + ',' + Math.round(bl * k) + ')';
}

/* --- sweetcorn --- */
function drawKernel(x, g, u, v, sz, rot) {
  var b = P(g, u, v);
  var rw = sz * g.brothR, rh = rw * 0.86;
  var cyy = b.y - rh * 0.46;

  x.save();
  x.beginPath();
  x.ellipse(b.x, b.y + rh * 0.10, rw * 1.15, rw * 0.42, 0, 0, TAU);
  x.fillStyle = 'rgba(30,12,2,0.48)';
  x.fill();
  x.restore();

  x.beginPath();
  x.ellipse(b.x, cyy, rw, rh * 0.66, rot * 0.2, 0, TAU);
  var kg = x.createLinearGradient(b.x, cyy - rh * 0.7, b.x, cyy + rh * 0.7);
  kg.addColorStop(0.00, '#ffe9a2');
  kg.addColorStop(0.36, '#f6bd44');
  kg.addColorStop(0.78, '#c9801d');
  kg.addColorStop(1.00, '#8d5411');
  x.fillStyle = kg;
  x.fill();

  x.save();
  x.globalCompositeOperation = 'lighter';
  x.beginPath();
  x.ellipse(b.x - rw * 0.20, cyy - rh * 0.24, rw * 0.36, rh * 0.19, -0.42, 0, TAU);
  x.fillStyle = 'rgba(255,248,220,0.52)';
  x.fill();
  x.restore();
}

function drawCorn(x, g, u, v, n, spread, seed) {
  var rng = rngFrom(seed);
  var items = [], i;
  for (i = 0; i < n; i++) {
    var a = rng() * TAU, r = Math.sqrt(rng()) * spread;
    items.push({ u: u + Math.cos(a) * r, v: v + Math.sin(a) * r * 0.9, s: 0.030 + rng() * 0.014, rot: rng() * TAU });
  }
  items.sort(function (p, q) { return p.v - q.v; });
  for (i = 0; i < items.length; i++) drawKernel(x, g, items[i].u, items[i].v, items[i].s, items[i].rot);
}

/* --- bok choy: pale stems under a ruffled blade --- */
function leafPath(bx, by, tipx, tipy, width, ruffle, phase) {
  var p = new Path2D();
  var dx = tipx - bx, dy = tipy - by;
  var L = Math.hypot(dx, dy) || 1;
  var ux = dx / L, uy = dy / L;
  var px = -uy, py = ux;
  var N = 40, i, t, w;
  p.moveTo(bx, by);
  for (i = 1; i <= N; i++) {
    t = i / N;
    w = width * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.72)), 0.85) * (1 + ruffle * Math.sin(t * 11 + phase));
    p.lineTo(bx + ux * L * t + px * w, by + uy * L * t + py * w);
  }
  for (i = N; i >= 0; i--) {
    t = i / N;
    w = width * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.72)), 0.85) * (1 + ruffle * Math.sin(t * 9.5 - phase));
    p.lineTo(bx + ux * L * t - px * w, by + uy * L * t - py * w);
  }
  p.closePath();
  return p;
}

function drawBokChoy(x, g, u, v, sz, lean, seed) {
  var b = P(g, u, v);
  var H = sz * g.brothR;
  var rng = rngFrom(seed);
  var i;

  contactShadow(x, g, u, v + 0.02, sz * 0.9, 0.55);

  /* stems */
  for (i = 0; i < 4; i++) {
    var off = (i - 1.5) * H * 0.11;
    var tx = b.x + off * 1.3 + lean * H * 0.42;
    var ty = b.y - H * (0.40 + rng() * 0.14);
    var wdt = H * 0.075;
    var p = new Path2D();
    p.moveTo(b.x + off - wdt, b.y);
    p.quadraticCurveTo(b.x + off - wdt * 1.1, b.y - H * 0.24, tx - wdt * 0.42, ty);
    p.lineTo(tx + wdt * 0.42, ty);
    p.quadraticCurveTo(b.x + off + wdt * 1.1, b.y - H * 0.24, b.x + off + wdt, b.y);
    p.closePath();
    var sg = x.createLinearGradient(b.x + off - wdt, 0, b.x + off + wdt, 0);
    sg.addColorStop(0.00, '#5e7043');
    sg.addColorStop(0.40, '#cfdcae');
    sg.addColorStop(0.70, '#a1b57e');
    sg.addColorStop(1.00, '#4c5b36');
    x.fillStyle = sg;
    x.fill(p);
  }

  /* blade */
  var bx0 = b.x + lean * H * 0.30, by0 = b.y - H * 0.30;
  var tipx = b.x + lean * H * 1.05, tipy = b.y - H * 1.02;
  var lp = leafPath(bx0, by0, tipx, tipy, H * 0.34, 0.14, rng() * TAU);
  var lg = x.createLinearGradient(bx0, by0, tipx, tipy);
  lg.addColorStop(0.00, '#3c5a24');
  lg.addColorStop(0.34, '#24431d');
  lg.addColorStop(0.72, '#173219');
  lg.addColorStop(1.00, '#0e2313');
  x.fillStyle = lg;
  x.fill(lp);

  x.save();
  x.clip(lp);
  x.globalCompositeOperation = 'lighter';
  var hg = x.createLinearGradient(bx0 - H * 0.3, by0, tipx + H * 0.3, tipy);
  hg.addColorStop(0.00, 'rgba(255,140,52,0.20)');
  hg.addColorStop(0.36, 'rgba(140,186,84,0.05)');
  hg.addColorStop(1.00, 'rgba(110,170,100,0.02)');
  x.fillStyle = hg;
  x.fillRect(b.x - H * 2, b.y - H * 2, H * 4, H * 4);
  x.globalCompositeOperation = 'source-over';
  x.lineWidth = Math.max(0.6, H * 0.012);
  x.strokeStyle = 'rgba(190,222,150,0.30)';
  x.beginPath();
  x.moveTo(bx0, by0);
  x.lineTo(tipx, tipy);
  x.stroke();
  for (i = 1; i <= 4; i++) {
    var t = i / 5;
    var vx = lerp(bx0, tipx, t), vy = lerp(by0, tipy, t);
    x.beginPath();
    x.moveTo(vx, vy);
    x.lineTo(vx - H * 0.20, vy - H * 0.06);
    x.moveTo(vx, vy);
    x.lineTo(vx + H * 0.20, vy - H * 0.06);
    x.strokeStyle = 'rgba(180,214,140,0.16)';
    x.stroke();
  }
  x.restore();
}

/* --- the noodles --- */
function buildNoodles(seed) {
  var rng = rngFrom(seed);
  var strands = [];
  var N = 34, i, k;
  for (i = 0; i < N; i++) {
    var layer = Math.pow(rng(), 0.70);
    var th = rng() * TAU;
    var d = (rng() * 2 - 1) * MOUND.r * 0.94;
    var half = Math.sqrt(Math.max(0.015, MOUND.r * MOUND.r - d * d)) * (0.82 + rng() * 0.46);
    var amp = MOUND.r * (0.085 + rng() * 0.095);
    var freq = (2.4 + rng() * 3.0) / MOUND.r;
    var ph = rng() * TAU;
    var ct = Math.cos(th), st = Math.sin(th);
    var pts = [];
    var STEPS = 26;
    for (k = 0; k <= STEPS; k++) {
      var t = (k / STEPS * 2 - 1) * half;
      var taper = 0.35 + 0.65 * Math.sin(Math.PI * (k / STEPS));
      var w = Math.sin(t * freq + ph) * amp * taper;
      var uu = MOUND.u + ct * t - st * (d + w);
      var vv = MOUND.v + st * t + ct * (d + w);
      var dome = surfaceHeight(uu, vv) / MOUND.h;
      var hgt = MOUND.h * dome * (0.26 + 0.76 * layer);
      hgt += Math.sin(t * freq * 1.7 + ph * 1.3) * MOUND.h * 0.032 * layer;
      pts.push({ u: uu, v: vv, h: Math.max(0, hgt) });
    }
    var mv = 0, mh = 0;
    for (k = 0; k < pts.length; k++) { mv += pts[k].v; mh += pts[k].h; }
    mv /= pts.length; mh /= pts.length;
    strands.push({ pts: pts, layer: layer, order: mv * 0.5 + (mh / MOUND.h) * 0.8, wk: 0.86 + rng() * 0.30 });
  }

  /* a couple of strands spilling off the front of the pile */
  for (i = 0; i < 4; i++) {
    var a0 = Math.PI * (0.20 + rng() * 0.60);
    var pts2 = [];
    var S2 = 20;
    for (k = 0; k <= S2; k++) {
      var tt = k / S2;
      var rr = MOUND.r * (0.20 + tt * 1.02);
      var ang = a0 + tt * (rng() > 0.5 ? 0.7 : -0.7);
      var uu2 = MOUND.u + Math.cos(ang) * rr + Math.sin(tt * 9 + i) * MOUND.r * 0.07;
      var vv2 = MOUND.v + Math.sin(ang) * rr * 0.9;
      var hh2 = MOUND.h * (0.85 * Math.pow(1 - tt, 1.7));
      pts2.push({ u: uu2, v: vv2, h: hh2 });
    }
    strands.push({ pts: pts2, layer: 1, order: 1.9 + i * 0.01, wk: 0.82 });
  }

  strands.sort(function (p, q) { return p.order - q.order; });
  return strands;
}

function strandPath(g, pts) {
  var p = new Path2D(), i;
  var sp = [];
  for (i = 0; i < pts.length; i++) {
    sp.push({
      x: g.bx + pts[i].u * g.brothR,
      y: g.by + pts[i].v * g.brothR * g.s - pts[i].h * g.brothR
    });
  }
  p.moveTo(sp[0].x, sp[0].y);
  for (i = 1; i < sp.length - 1; i++) {
    p.quadraticCurveTo(sp[i].x, sp[i].y, (sp[i].x + sp[i + 1].x) / 2, (sp[i].y + sp[i + 1].y) / 2);
  }
  p.lineTo(sp[sp.length - 1].x, sp[sp.length - 1].y);
  return p;
}

function drawNoodles(x, g, strands) {
  var topY = g.by + (MOUND.v - MOUND.r) * g.brothR * g.s - MOUND.h * g.brothR;
  var botY = g.by + (MOUND.v + MOUND.r * 1.4) * g.brothR * g.s;
  var w0 = g.brothR * 0.029;

  /* the pile darkens the broth it sits in */
  contactShadow(x, g, MOUND.u, MOUND.v + 0.04, MOUND.r * 1.35, 0.62);

  var body = x.createLinearGradient(0, topY, 0, botY);
  body.addColorStop(0.00, '#f8e2ad');
  body.addColorStop(0.26, '#e4c176');
  body.addColorStop(0.56, '#bd8f47');
  body.addColorStop(0.82, '#8a6228');
  body.addColorStop(1.00, '#4e3313');

  x.lineCap = 'round';
  x.lineJoin = 'round';

  for (var i = 0; i < strands.length; i++) {
    var s = strands[i];
    var path = strandPath(g, s.pts);
    var w = w0 * s.wk;

    x.save();
    x.translate(0, w * 0.42);
    x.lineWidth = w * 1.18;
    x.strokeStyle = 'rgba(24,9,1,0.55)';
    x.stroke(path);
    x.restore();

    x.lineWidth = w;
    x.strokeStyle = body;
    x.stroke(path);

    x.save();
    x.translate(-w * 0.10, -w * 0.26);
    x.lineWidth = w * 0.34;
    x.strokeStyle = 'rgba(255,238,198,' + (0.20 + 0.26 * s.layer).toFixed(3) + ')';
    x.stroke(path);
    x.restore();

    x.save();
    x.translate(-w * 0.16, -w * 0.32);
    x.lineWidth = w * 0.13;
    x.strokeStyle = 'rgba(255,252,238,' + (0.14 + 0.26 * s.layer).toFixed(3) + ')';
    x.stroke(path);
    x.restore();
  }
}

/* --- garnish --- */
function drawScallion(x, cx0, cy0, r, squash, pale, alpha) {
  var g1 = pale ? ['#f0f6dc', '#c3d2a2', '#8fa374'] : ['#a9de78', '#6fae46', '#3d6f2e'];
  var lg = x.createLinearGradient(cx0, cy0 - r, cx0, cy0 + r);
  lg.addColorStop(0.00, g1[0]);
  lg.addColorStop(0.45, g1[1]);
  lg.addColorStop(1.00, g1[2]);
  x.globalAlpha = alpha;
  x.beginPath();
  x.ellipse(cx0, cy0, r, r * squash, 0, 0, TAU);
  x.fillStyle = lg;
  x.fill();
  x.beginPath();
  x.ellipse(cx0, cy0 - r * squash * 0.08, r * 0.44, r * squash * 0.44, 0, 0, TAU);
  x.fillStyle = 'rgba(26,42,18,0.82)';
  x.fill();
  x.lineWidth = Math.max(0.4, r * 0.16);
  x.beginPath();
  x.ellipse(cx0, cy0, r * 0.86, r * squash * 0.86, 0, Math.PI * 1.08, TAU - 0.18);
  x.strokeStyle = 'rgba(226,255,196,0.42)';
  x.stroke();
  x.globalAlpha = 1;
}

function drawSesame(x, cx0, cy0, r, squash, black, alpha) {
  x.globalAlpha = alpha;
  x.beginPath();
  x.ellipse(cx0, cy0, r, r * squash * 0.78, 0.4, 0, TAU);
  x.fillStyle = black ? '#2b2721' : '#efe0b8';
  x.fill();
  if (!black) {
    x.beginPath();
    x.ellipse(cx0 - r * 0.22, cy0 - r * squash * 0.22, r * 0.36, r * squash * 0.26, 0.4, 0, TAU);
    x.fillStyle = 'rgba(255,252,236,0.75)';
    x.fill();
  }
  x.globalAlpha = 1;
}

function drawChiliPatch(x, g, u, v, rad, seed) {
  var rng = rngFrom(seed);
  x.save();
  x.translate(g.bx, g.by);
  x.scale(1, g.s);
  var R2 = rad * g.brothR;
  var p = new Path2D();
  var N = 30, i;
  for (i = 0; i <= N; i++) {
    var a = (i / N) * TAU;
    var rr = R2 * (0.72 + 0.30 * Math.sin(a * 3 + seed) + 0.16 * Math.sin(a * 5.5 - seed * 0.7));
    var px = u * g.brothR + Math.cos(a) * rr;
    var py = v * g.brothR + Math.sin(a) * rr;
    if (i === 0) p.moveTo(px, py); else p.lineTo(px, py);
  }
  p.closePath();

  var cg = x.createRadialGradient(u * g.brothR, v * g.brothR, 0, u * g.brothR, v * g.brothR, R2 * 1.1);
  cg.addColorStop(0.00, 'rgba(238,92,28,0.72)');
  cg.addColorStop(0.48, 'rgba(206,62,16,0.50)');
  cg.addColorStop(1.00, 'rgba(150,36,8,0.10)');
  x.fillStyle = cg;
  x.fill(p);

  x.save();
  x.clip(p);
  for (i = 0; i < 26; i++) {
    var fa = rng() * TAU, fd = Math.sqrt(rng()) * R2;
    x.beginPath();
    x.ellipse(u * g.brothR + Math.cos(fa) * fd, v * g.brothR + Math.sin(fa) * fd,
      R2 * (0.04 + rng() * 0.05), R2 * (0.02 + rng() * 0.03), fa, 0, TAU);
    x.fillStyle = 'rgba(126,22,6,' + (0.4 + rng() * 0.5).toFixed(2) + ')';
    x.fill();
  }
  x.globalCompositeOperation = 'lighter';
  var sg = x.createRadialGradient(u * g.brothR - R2 * 0.3, v * g.brothR - R2 * 0.3, 0,
    u * g.brothR - R2 * 0.3, v * g.brothR - R2 * 0.3, R2 * 0.8);
  sg.addColorStop(0, 'rgba(255,170,90,0.34)');
  sg.addColorStop(1, 'rgba(255,120,40,0)');
  x.fillStyle = sg;
  x.fill(p);
  x.restore();
  x.restore();
}

/* ============================================================
   6. layer assembly
   ============================================================ */

var noodleStrands = null;

function paintFood(x, g) {
  drawChiliPatch(x, g, -0.36, 0.66, 0.15, 3.1);
  drawChiliPatch(x, g, -0.56, -0.10, 0.10, 7.7);
  drawChiliPatch(x, g, 0.44, 0.66, 0.11, 5.3);

  /* solid items, painted back to front */
  var items = [
    { v: -0.58, fn: function () { drawMenma(x, g, -0.06, -0.58, 0.20, -0.66, 0.058); } },
    { v: -0.55, fn: function () { drawMenma(x, g, 0.02, -0.55, 0.23, -0.40, 0.062); } },
    { v: -0.52, fn: function () { drawMenma(x, g, 0.11, -0.52, 0.18, -0.10, 0.054); } },
    { v: -0.46, fn: function () { drawShiitake(x, g, 0.36, -0.44, 0.170, -0.35); } },
    { v: -0.36, fn: function () { drawNori(x, g, -0.46, -0.36, 0.38, 0.46, -0.13); } },
    { v: -0.18, fn: function () { drawShiitake(x, g, 0.58, -0.18, 0.195, 0.42); } },
    { v: 0.06, fn: function () { drawBokChoy(x, g, -0.64, 0.06, 0.42, -0.36, 51); } },
    { v: 0.18, fn: function () { drawNoodles(x, g, noodleStrands); } },
    { v: 0.32, fn: function () { drawCorn(x, g, 0.56, 0.32, 12, 0.16, 88); } },
    { v: 0.46, fn: function () { drawTofu(x, g, 0.31, 0.46, 0.185, 0.34); } },
    { v: 0.64, fn: function () { drawTofu(x, g, 0.02, 0.64, 0.165, -0.24); } }
  ];
  items.sort(function (a, b) { return a.v - b.v; });
  for (var i = 0; i < items.length; i++) items[i].fn();

  /* garnish scattered over the food itself */
  var rng = rngFrom(2024);
  var pts = [], i2;
  for (i2 = 0; i2 < 30; i2++) {
    var a = rng() * TAU, d = Math.sqrt(rng());
    var u = MOUND.u + Math.cos(a) * d * MOUND.r * 1.15;
    var v = MOUND.v + Math.sin(a) * d * MOUND.r * 1.15;
    var h = surfaceHeight(u, v);
    pts.push({ u: u, v: v, h: h, r: rng(), pale: rng() < 0.24, sz: 0.020 + rng() * 0.014 });
  }
  pts.sort(function (p, q) { return (p.v + p.h) - (q.v + q.h); });
  for (i2 = 0; i2 < pts.length; i2++) {
    var q2 = pts[i2];
    var sx = g.bx + q2.u * g.brothR;
    var sy = g.by + q2.v * g.brothR * g.s - q2.h * g.brothR * 0.98;
    if (q2.r < 0.62) {
      drawScallion(x, sx, sy, q2.sz * g.brothR, 0.62, q2.pale, 1);
    } else {
      drawSesame(x, sx, sy, q2.sz * g.brothR * 0.42, 0.8, q2.r > 0.9, 0.95);
    }
  }
}

function buildLayers() {
  var g = G, bb = BB, dpr = S.dpr;
  LA = makeLayer(bb, dpr);
  LB = makeLayer(bb, dpr);

  paintExterior(LA.ctx, g, bb);
  paintInnerWall(LA.ctx, g, bb);
  LA.ctx.save();
  LA.ctx.clip(pRimClip);
  paintBrothBase(LA.ctx, g);
  LA.ctx.restore();

  LB.ctx.save();
  LB.ctx.clip(pRimClip);
  paintFood(LB.ctx, g);
  LB.ctx.restore();
  paintRim(LB.ctx, g);

  buildReflection(bb, dpr, g);
}

/* a wet lacquer table: bake a soft mirrored ghost into the bottom of layer A.
   the flip is composed in its own buffer so it can never eat the bowl above it. */
function buildReflection(bb, dpr, g) {
  var W = LA.cv.width, H = LA.cv.height;
  var contactPx = Math.round((bb.contact - bb.y) * dpr);
  if (contactPx >= H - 2) return;

  var tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = H;
  var t = tmp.getContext('2d');
  t.drawImage(LA.cv, 0, 0);
  t.drawImage(LB.cv, 0, 0);

  var ref = document.createElement('canvas');
  ref.width = W; ref.height = H;
  var r = ref.getContext('2d');

  r.save();
  r.beginPath();
  r.rect(0, contactPx, W, H - contactPx);
  r.clip();
  r.globalAlpha = 0.17;
  try { r.filter = 'blur(' + Math.max(1, g.R * 0.018 * dpr).toFixed(1) + 'px)'; } catch (e) { /* older engines */ }
  r.translate(0, contactPx * 2);
  r.scale(1, -1);
  r.drawImage(tmp, 0, 0);
  r.restore();

  r.globalCompositeOperation = 'destination-out';
  var fg = r.createLinearGradient(0, contactPx, 0, H);
  fg.addColorStop(0.00, 'rgba(0,0,0,0.10)');
  fg.addColorStop(0.30, 'rgba(0,0,0,0.66)');
  fg.addColorStop(1.00, 'rgba(0,0,0,1)');
  r.fillStyle = fg;
  r.fillRect(0, contactPx, W, H - contactPx);
  r.globalCompositeOperation = 'source-over';

  var a = LA.ctx;
  a.save();
  a.setTransform(1, 0, 0, 1, 0, 0);
  a.drawImage(ref, 0, 0);
  a.restore();
}

/* ============================================================
   7. living things
   ============================================================ */

var steam = { list: [], sprites: [], cv: null, ctx: null, ss: 0.5, target: 0 };
var oil = [], flotsam = [], ripples = [], shimmer = [], dust = [];
var grainTile = null, grainPat = null;

function makeSteamSprite(size, seed) {
  var c = document.createElement('canvas');
  c.width = c.height = size;
  var x = c.getContext('2d');
  var id = x.createImageData(size, size);
  var d = id.data;
  var h = size / 2;
  for (var j = 0; j < size; j++) {
    for (var i = 0; i < size; i++) {
      var dx = (i - h) / h, dy = (j - h) / h;
      var r = Math.sqrt(dx * dx + dy * dy);
      var a = Math.max(0, 1 - r);
      a = a * a * (3 - 2 * a);
      a = Math.pow(a, 1.55);
      var n = fbm(i * 0.052 + seed * 13.7, j * 0.052 + seed * 5.1, 3);
      a *= clamp(0.55 + n * 1.15, 0, 1.4);
      var k = (j * size + i) * 4;
      d[k] = 255; d[k + 1] = 255; d[k + 2] = 255;
      d[k + 3] = clamp(a, 0, 1) * 255;
    }
  }
  x.putImageData(id, 0, 0);
  return c;
}

function makeGrain(size) {
  var c = document.createElement('canvas');
  c.width = c.height = size;
  var x = c.getContext('2d');
  var id = x.createImageData(size, size);
  var d = id.data;
  var rng = rngFrom(4242);
  for (var i = 0; i < d.length; i += 4) {
    var v = 128 + (rng() - 0.5) * 96;
    d[i] = d[i + 1] = d[i + 2] = v;
    d[i + 3] = 255;
  }
  x.putImageData(id, 0, 0);
  return c;
}

function respawnSteam(p, aged) {
  var g = G;
  var a = Math.random() * TAU;
  var rr = Math.sqrt(Math.random());
  var u = Math.cos(a) * rr * 0.84;
  var v = Math.sin(a) * rr * 0.84;
  var hh = surfaceHeight(u, v);
  p.x = g.bx + u * g.brothR;
  p.y = g.by + v * g.brothR * g.s - hh * g.brothR - g.R * 0.02;
  p.vx = (Math.random() - 0.5) * g.R * 0.06;
  p.vy = -g.R * (0.13 + Math.random() * 0.10);
  p.maxLife = 3.6 + Math.random() * 3.8;
  p.life = aged ? Math.random() * p.maxLife : 0;
  p.r0 = g.R * (0.050 + Math.random() * 0.080);
  p.grow = 2.1 + Math.random() * 2.5;
  p.alpha = 0.125 + Math.random() * 0.145;
  p.rot = Math.random() * TAU;
  p.spin = (Math.random() - 0.5) * 0.6;
  p.seed = Math.random() * 1000;
  p.spr = (Math.random() * steam.sprites.length) | 0;
  if (Math.random() < 0.15) {           /* a few slow, fat volumes for body */
    p.r0 *= 2.4; p.alpha *= 0.45; p.vy *= 0.70; p.maxLife *= 1.3; p.grow *= 0.8;
  }
  return p;
}

function initParticles() {
  var g = G, i;

  if (!steam.sprites.length) {
    for (i = 0; i < 3; i++) steam.sprites.push(makeSteamSprite(128, i + 1));
  }
  if (!grainTile) { grainTile = makeGrain(180); grainPat = ctx.createPattern(grainTile, 'repeat'); }

  var area = S.w * S.h;
  steam.target = Math.round(clamp(185 * Math.sqrt(area / (1280 * 720)), 110, 300));
  if (downgraded) steam.target = Math.round(steam.target * 0.62);

  steam.list.length = 0;
  for (i = 0; i < steam.target; i++) steam.list.push(respawnSteam({}, true));

  var sc = document.createElement('canvas');
  var k = S.dpr * steam.ss;
  sc.width = Math.max(1, Math.ceil(S.w * k));
  sc.height = Math.max(1, Math.ceil(S.h * k));
  steam.cv = sc;
  steam.ctx = sc.getContext('2d');
  steam.k = k;

  var rng = rngFrom(777);
  oil.length = 0;
  for (i = 0; i < 54; i++) {
    var a = rng() * TAU, d = Math.sqrt(rng()) * 0.93;
    oil.push({
      u: Math.cos(a) * d, v: Math.sin(a) * d,
      r: 0.012 + Math.pow(rng(), 2.1) * 0.055,
      ph: rng() * TAU,
      chili: rng() < 0.22,
      sp: 0.5 + rng()
    });
  }

  flotsam.length = 0;
  for (i = 0; i < 30; i++) {
    var a2 = rng() * TAU, d2 = Math.sqrt(rng()) * 0.90;
    flotsam.push({
      u: Math.cos(a2) * d2, v: Math.sin(a2) * d2,
      sz: 0.017 + rng() * 0.013,
      kind: rng(),
      pale: rng() < 0.26,
      spin: (rng() - 0.5) * 0.4,
      rot: rng() * TAU
    });
  }

  shimmer.length = 0;
  for (i = 0; i < 7; i++) {
    shimmer.push({ u: (rng() * 2 - 1) * 0.6, v: (rng() * 2 - 1) * 0.6, r: 0.24 + rng() * 0.34, ph: rng() * TAU });
  }

  ripples.length = 0;

  dust.length = 0;
  var dn = Math.round(clamp(44 * Math.sqrt(area / (1280 * 720)), 24, 70));
  for (i = 0; i < dn; i++) {
    dust.push({
      x: rng() * S.w, y: rng() * S.h,
      r: 0.5 + rng() * 1.9,
      a: 0.10 + rng() * 0.42,
      sp: 6 + rng() * 20,
      ph: rng() * TAU,
      dep: rng(),
      front: rng() < 0.45
    });
  }
}

function addRipple(u, v, str) {
  if (ripples.length > 22) ripples.shift();
  ripples.push({ u: u, v: v, t: 0, life: 1.7 + Math.random() * 0.9, str: str });
}

/* ============================================================
   8. simulation
   ============================================================ */

function updateSteam(dt) {
  var g = G;
  var ns = 2.6 / g.R;
  var Rm = g.R * 0.66, Rm2 = Rm * Rm;
  var pvx = clamp(ptr.vx, -4000, 4000), pvy = clamp(ptr.vy, -4000, 4000);
  var drag = Math.exp(-1.05 * dt);

  for (var i = 0; i < steam.list.length; i++) {
    var p = steam.list[i];
    p.life += dt;
    if (p.life > p.maxLife || p.y < -g.R * 0.6) { respawnSteam(p, false); continue; }
    var t01 = p.life / p.maxLife;

    curl(p.x * ns, p.y * ns, T * 0.30, CURL);
    var turb = g.R * (0.30 + 1.05 * t01);
    p.vx += CURL.x * turb * dt;
    p.vy += CURL.y * turb * 0.62 * dt;

    /* buoyancy, fading as the plume cools */
    p.vy -= g.R * 0.34 * (1 - t01 * 0.72) * dt;
    p.vx += Math.sin(T * 0.23 + p.seed * 0.017) * g.R * 0.05 * dt;

    var dx = p.x - ptr.x, dy = p.y - ptr.y;
    var d2 = dx * dx + dy * dy;
    if (d2 < Rm2) {
      var d = Math.sqrt(d2) + 1e-3;
      var f = 1 - d / Rm;
      f = f * f;
      p.vx += (dx / d) * f * g.R * 2.2 * dt;
      p.vy += (dy / d) * f * g.R * 2.2 * dt;
      p.vx += pvx * f * 2.6 * dt;
      p.vy += pvy * f * 2.6 * dt;
    }

    p.vx *= drag;
    p.vy *= drag;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.spin * dt;
  }
}

function renderSteam() {
  var g = G;
  var sc = steam.ctx, scv = steam.cv;
  sc.setTransform(1, 0, 0, 1, 0, 0);
  sc.clearRect(0, 0, scv.width, scv.height);
  sc.setTransform(steam.k, 0, 0, steam.k, 0, 0);
  sc.globalCompositeOperation = 'lighter';

  for (var i = 0; i < steam.list.length; i++) {
    var p = steam.list[i];
    var t01 = p.life / p.maxLife;
    var a = p.alpha * smooth(0.02, 0.34, t01) * (1 - smooth(0.52, 1, t01));
    if (a <= 0.0025) continue;
    var r = p.r0 * (1 + p.grow * t01);
    if (p.y + r < 0 || p.x + r < 0 || p.x - r > S.w) continue;

    var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    var st = 1 + clamp(sp / (g.R * 0.60), 0, 1) * 0.9;
    sc.save();
    sc.translate(p.x, p.y);
    sc.rotate(Math.atan2(p.vy, p.vx) + p.rot * 0.06);
    sc.scale(st, 1 / Math.sqrt(st));
    sc.globalAlpha = a;
    sc.drawImage(steam.sprites[p.spr], -r, -r, r * 2, r * 2);
    sc.restore();
  }

  /* tint the accumulated density by height: amber at the bowl, cool as it dissipates */
  sc.setTransform(1, 0, 0, 1, 0, 0);
  sc.globalAlpha = 1;
  sc.globalCompositeOperation = 'source-in';
  var mouth = (g.cy - g.rimRy) * steam.k;
  var tg = sc.createLinearGradient(0, 0, 0, Math.max(mouth + 1, scv.height * 0.2));
  tg.addColorStop(0.00, 'rgba(126,148,186,0)');
  tg.addColorStop(0.14, 'rgba(150,170,204,0.50)');
  tg.addColorStop(0.42, 'rgba(204,204,206,0.92)');
  tg.addColorStop(0.70, 'rgba(248,220,188,1)');
  tg.addColorStop(1.00, 'rgba(255,186,110,0.86)');
  sc.fillStyle = tg;
  sc.fillRect(0, 0, scv.width, scv.height);
  sc.globalCompositeOperation = 'source-over';
}

function updateSurface(dt) {
  var i, o, a, d;
  for (i = 0; i < oil.length; i++) {
    o = oil[i];
    curl(o.u * 2.4 + 11, o.v * 2.4, T * 0.11, CURL);
    o.u += (CURL.x * 0.020 - o.v * 0.030) * o.sp * dt;
    o.v += (CURL.y * 0.020 + o.u * 0.030) * o.sp * dt;
    d = Math.sqrt(o.u * o.u + o.v * o.v);
    if (d > 0.93) { a = Math.random() * TAU; d = Math.sqrt(Math.random()) * 0.5; o.u = Math.cos(a) * d; o.v = Math.sin(a) * d; }
  }
  for (i = 0; i < flotsam.length; i++) {
    o = flotsam[i];
    curl(o.u * 2.1 - 5, o.v * 2.1 + 3, T * 0.09, CURL);
    o.u += (CURL.x * 0.016 - o.v * 0.026) * dt;
    o.v += (CURL.y * 0.016 + o.u * 0.026) * dt;
    o.rot += o.spin * dt;
    d = Math.sqrt(o.u * o.u + o.v * o.v);
    if (d > 0.90) { a = Math.random() * TAU; d = Math.sqrt(Math.random()) * 0.55; o.u = Math.cos(a) * d; o.v = Math.sin(a) * d; }
  }
  for (i = 0; i < shimmer.length; i++) {
    o = shimmer[i];
    curl(o.u * 1.5 + 21, o.v * 1.5, T * 0.07, CURL);
    o.u = clamp(o.u + CURL.x * 0.05 * dt, -0.8, 0.8);
    o.v = clamp(o.v + CURL.y * 0.05 * dt, -0.8, 0.8);
  }
  for (i = ripples.length - 1; i >= 0; i--) {
    ripples[i].t += dt;
    if (ripples[i].t > ripples[i].life) ripples.splice(i, 1);
  }
}

function updateDust(dt) {
  for (var i = 0; i < dust.length; i++) {
    var m = dust[i];
    m.y -= m.sp * dt;
    m.x += Math.sin(T * 0.4 + m.ph) * 5 * dt;
    m.ph += dt * 0.6;
    if (m.y < -8) { m.y = S.h + 8; m.x = Math.random() * S.w; }
  }
}

/* ============================================================
   9. frame
   ============================================================ */

function buildBackground() {
  var g = G, w = S.w, h = S.h;
  var far = Math.max(w, h);
  var b = {};

  b.base = ctx.createLinearGradient(0, 0, 0, h);
  b.base.addColorStop(0.00, '#04050a');
  b.base.addColorStop(0.42, '#07070d');
  b.base.addColorStop(0.72, '#0a0810');
  b.base.addColorStop(1.00, '#050509');

  b.warm = ctx.createRadialGradient(g.cx, g.cy - g.R * 0.18, g.R * 0.05, g.cx, g.cy - g.R * 0.18, far * 0.86);
  b.warm.addColorStop(0.00, 'rgba(214,116,44,0.30)');
  b.warm.addColorStop(0.16, 'rgba(178,88,32,0.16)');
  b.warm.addColorStop(0.42, 'rgba(126,56,20,0.06)');
  b.warm.addColorStop(1.00, 'rgba(90,36,12,0)');

  b.cool = ctx.createRadialGradient(w * 0.14, -h * 0.12, 0, w * 0.14, -h * 0.12, far * 0.85);
  b.cool.addColorStop(0.00, 'rgba(58,86,140,0.16)');
  b.cool.addColorStop(0.50, 'rgba(40,60,104,0.05)');
  b.cool.addColorStop(1.00, 'rgba(30,44,80,0)');

  b.vig = ctx.createRadialGradient(g.cx, g.cy - g.R * 0.05, g.R * 0.55, g.cx, g.cy, far * 0.80);
  b.vig.addColorStop(0.00, 'rgba(0,0,0,0)');
  b.vig.addColorStop(0.42, 'rgba(0,0,0,0.30)');
  b.vig.addColorStop(0.76, 'rgba(0,0,0,0.70)');
  b.vig.addColorStop(1.00, 'rgba(0,0,0,0.93)');

  S.bg = b;
}

function drawBackground(px, py) {
  var g = G, w = S.w, h = S.h;
  ctx.fillStyle = S.bg.base;
  ctx.fillRect(0, 0, w, h);

  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = S.bg.cool;
  ctx.fillRect(0, 0, w, h);

  var breathe = reduced ? 1 : (0.88 + 0.12 * Math.sin(T * 0.5) + 0.05 * Math.sin(T * 1.31));
  ctx.save();
  ctx.translate(-px * 2.2, -py * 2.2);
  ctx.globalAlpha = breathe;
  ctx.fillStyle = S.bg.warm;
  ctx.fillRect(-w, -h, w * 3, h * 3);
  ctx.globalAlpha = 1;
  ctx.restore();

  /* pool of light on the table */
  var py2 = g.cy + g.depth * 0.98;
  ctx.save();
  ctx.translate(g.cx + px * 0.4, py2 + py * 0.4);
  ctx.scale(1, 0.20);
  var pg = ctx.createRadialGradient(0, 0, 0, 0, 0, g.R * 2.5);
  pg.addColorStop(0.00, 'rgba(180,92,34,0.26)');
  pg.addColorStop(0.40, 'rgba(150,70,26,0.10)');
  pg.addColorStop(1.00, 'rgba(120,50,18,0)');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.arc(0, 0, g.R * 2.5, 0, TAU);
  ctx.fill();
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';

  /* contact shadow */
  ctx.save();
  ctx.translate(g.cx + px, g.cy + g.depth + g.footRy * 0.55 + py);
  ctx.scale(1, 0.24);
  var cg = ctx.createRadialGradient(0, 0, 0, 0, 0, g.R * 1.45);
  cg.addColorStop(0.00, 'rgba(0,0,0,0.92)');
  cg.addColorStop(0.34, 'rgba(0,0,0,0.60)');
  cg.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(0, 0, g.R * 1.45, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawDust(front, px, py) {
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < dust.length; i++) {
    var m = dust[i];
    if (m.front !== front) continue;
    var tw = 0.55 + 0.45 * Math.sin(T * 1.4 + m.ph * 3);
    var a = m.a * tw * (front ? 1 : 0.6);
    var x = m.x + px * (front ? 3.2 : 1.1) * m.dep;
    var y = m.y + py * (front ? 2.4 : 0.8) * m.dep;
    var r = m.r * (front ? 1.25 : 0.9);
    var gr = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
    gr.addColorStop(0, 'rgba(255,206,150,' + a.toFixed(3) + ')');
    gr.addColorStop(0.4, 'rgba(255,180,110,' + (a * 0.30).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(255,160,90,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(x, y, r * 4, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawSurface() {
  var g = G, i;
  ctx.save();
  ctx.clip(pRimClip);
  ctx.save();
  ctx.clip(pBrothClip);

  /* drifting light on the liquid */
  ctx.save();
  ctx.translate(g.bx, g.by);
  ctx.scale(1, g.s);
  ctx.globalCompositeOperation = 'lighter';
  for (i = 0; i < shimmer.length; i++) {
    var sh = shimmer[i];
    var r = sh.r * g.brothR * (0.86 + 0.14 * Math.sin(T * 0.6 + sh.ph));
    var sx = sh.u * g.brothR, sy = sh.v * g.brothR;
    var sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
    var ai = 0.075 * (0.6 + 0.4 * Math.sin(T * 0.42 + sh.ph * 2));
    sg.addColorStop(0.00, 'rgba(255,196,116,' + ai.toFixed(3) + ')');
    sg.addColorStop(0.55, 'rgba(255,160,80,' + (ai * 0.35).toFixed(3) + ')');
    sg.addColorStop(1.00, 'rgba(255,140,60,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, TAU);
    ctx.fill();
  }

  /* ripples */
  for (i = 0; i < ripples.length; i++) {
    var rp = ripples[i];
    var t = rp.t / rp.life;
    var rr = g.brothR * (0.03 + t * 0.62);
    var al = rp.str * (1 - t) * (1 - t) * 0.55;
    ctx.lineWidth = g.brothR * 0.016 * (1 - t * 0.6);
    ctx.strokeStyle = 'rgba(255,206,150,' + al.toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(rp.u * g.brothR, rp.v * g.brothR, rr, 0, TAU);
    ctx.stroke();
    ctx.lineWidth = g.brothR * 0.008 * (1 - t * 0.6);
    ctx.strokeStyle = 'rgba(255,236,200,' + (al * 0.7).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(rp.u * g.brothR, rp.v * g.brothR, rr * 0.80, 0, TAU);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  /* oil lenses floating on top */
  for (i = 0; i < oil.length; i++) {
    var o = oil[i];
    var ox = g.bx + o.u * g.brothR;
    var oy = g.by + o.v * g.brothR * g.s;
    var orr = o.r * g.brothR * (1 + 0.05 * Math.sin(T * 1.1 + o.ph));
    var ory = orr * g.s * 1.05;
    ctx.beginPath();
    ctx.ellipse(ox, oy, orr, ory, 0, 0, TAU);
    var og = ctx.createRadialGradient(ox, oy - ory * 0.2, 0, ox, oy, orr);
    if (o.chili) {
      og.addColorStop(0.00, 'rgba(255,132,50,0.44)');
      og.addColorStop(0.62, 'rgba(224,78,22,0.34)');
      og.addColorStop(1.00, 'rgba(190,52,12,0.18)');
    } else {
      og.addColorStop(0.00, 'rgba(255,206,130,0.34)');
      og.addColorStop(0.62, 'rgba(240,160,66,0.24)');
      og.addColorStop(1.00, 'rgba(210,120,40,0.12)');
    }
    ctx.fillStyle = og;
    ctx.fill();

    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.ellipse(ox - orr * 0.26, oy - ory * 0.34, orr * 0.30, ory * 0.34, 0, 0, TAU);
    ctx.fillStyle = 'rgba(255,240,204,0.30)';
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    /* the far edge of the lens catches a thin dark meniscus */
    ctx.lineWidth = Math.max(0.4, orr * 0.07);
    ctx.strokeStyle = 'rgba(60,22,4,0.24)';
    ctx.beginPath();
    ctx.ellipse(ox, oy + ory * 0.10, orr * 0.94, ory * 0.94, 0, 0.15, Math.PI - 0.15);
    ctx.stroke();
  }

  ctx.restore();
  ctx.restore();
}

function drawFlotsam() {
  var g = G;
  ctx.save();
  ctx.clip(pRimClip);
  ctx.clip(pBrothClip);
  for (var i = 0; i < flotsam.length; i++) {
    var f = flotsam[i];
    var fx = g.bx + f.u * g.brothR;
    var fy = g.by + f.v * g.brothR * g.s;
    /* anything behind the nori sheet is hidden by it */
    if (noriBox && f.v < -0.30 && fx > noriBox.x0 && fx < noriBox.x1 && fy > noriBox.y0 && fy < noriBox.y1) continue;
    var bob = Math.sin(T * 1.5 + f.rot * 3) * g.brothR * 0.004;
    if (f.kind < 0.60) {
      drawScallion(ctx, fx, fy + bob, f.sz * g.brothR, 0.60, f.pale, 0.96);
    } else if (f.kind < 0.86) {
      drawSesame(ctx, fx, fy + bob, f.sz * g.brothR * 0.40, 0.8, f.kind > 0.83, 0.9);
    } else {
      ctx.save();
      ctx.translate(fx, fy + bob);
      ctx.rotate(f.rot);
      ctx.scale(1, g.s);
      ctx.beginPath();
      ctx.ellipse(0, 0, f.sz * g.brothR * 1.5, f.sz * g.brothR * 0.42, 0, 0, TAU);
      ctx.fillStyle = 'rgba(112,168,74,0.85)';
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawBowlSpecular() {
  var g = G;
  var ax = clamp((ptr.x - g.cx) / g.R, -1.6, 1.6);
  var hx = g.cx + ax * g.R * 0.66;
  var hy = g.cy + g.depth * 0.34 - clamp((ptr.y - g.cy) / g.R, -1.5, 1.5) * g.R * 0.07;
  var rr = g.R * 0.62;
  ctx.save();
  ctx.clip(pBody);
  ctx.globalCompositeOperation = 'lighter';
  var sg = ctx.createRadialGradient(hx, hy, 0, hx, hy, rr);
  sg.addColorStop(0.00, 'rgba(255,214,168,0.14)');
  sg.addColorStop(0.42, 'rgba(255,186,124,0.045)');
  sg.addColorStop(1.00, 'rgba(255,170,110,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(hx - rr, hy - rr, rr * 2, rr * 2);
  ctx.restore();
}

function drawMouthBloom() {
  var g = G;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(g.cx, g.cy);
  ctx.scale(1, 0.62);
  var pulse = reduced ? 1 : (0.85 + 0.15 * Math.sin(T * 0.72 + 0.6));
  var bg = ctx.createRadialGradient(0, 0, g.R * 0.42, 0, 0, g.R * 1.75);
  bg.addColorStop(0.00, 'rgba(255,150,58,' + (0.14 * pulse).toFixed(3) + ')');
  bg.addColorStop(0.34, 'rgba(240,116,36,' + (0.07 * pulse).toFixed(3) + ')');
  bg.addColorStop(1.00, 'rgba(200,80,24,0)');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(0, 0, g.R * 1.75, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawPointerGlow() {
  var g = G;
  var sp = Math.min(1, Math.sqrt(ptr.vx * ptr.vx + ptr.vy * ptr.vy) / (g.R * 3));
  var inten = 0.040 + 0.045 * sp;
  var rr = g.R * 0.90;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  var gr = ctx.createRadialGradient(ptr.x, ptr.y, 0, ptr.x, ptr.y, rr);
  gr.addColorStop(0.00, 'rgba(255,198,132,' + inten.toFixed(3) + ')');
  gr.addColorStop(0.40, 'rgba(255,162,90,' + (inten * 0.32).toFixed(3) + ')');
  gr.addColorStop(1.00, 'rgba(255,140,70,0)');
  ctx.fillStyle = gr;
  ctx.fillRect(ptr.x - rr, ptr.y - rr, rr * 2, rr * 2);
  ctx.restore();
}

function drawGrain() {
  if (!grainPat) return;
  var ox = reduced ? 0 : ((Math.random() * 180) | 0);
  var oy = reduced ? 0 : ((Math.random() * 180) | 0);
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.42;
  ctx.translate(-ox, -oy);
  ctx.fillStyle = grainPat;
  ctx.fillRect(0, 0, S.w + 200, S.h + 200);
  ctx.restore();
}

function drawScene() {
  var g = G;
  var px = reduced ? 0 : clamp((ptr.x - S.cx) * 0.014, -g.R * 0.05, g.R * 0.05);
  var py = reduced ? 0 : clamp((ptr.y - S.cy) * 0.010, -g.R * 0.035, g.R * 0.035);

  ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  drawBackground(px, py);
  drawDust(false, px, py);

  ctx.save();
  ctx.translate(px, py);
  ctx.drawImage(LA.cv, BB.x, BB.y, LA.w, LA.h);
  drawSurface();
  ctx.drawImage(LB.cv, BB.x, BB.y, LB.w, LB.h);
  drawFlotsam();
  drawBowlSpecular();
  drawMouthBloom();
  ctx.restore();

  renderSteam();
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.drawImage(steam.cv, 0, 0, S.w, S.h);
  ctx.restore();

  drawPointerGlow();
  drawDust(true, px, py);

  ctx.fillStyle = S.bg.vig;
  ctx.fillRect(0, 0, S.w, S.h);
  drawGrain();
}

/* ============================================================
   10. pointer, loop, lifecycle
   ============================================================ */

var rippleClock = 0;

function idleTarget(t) {
  var a = t * 0.16;
  return {
    x: S.cx + Math.cos(a) * S.w * 0.20 + Math.cos(a * 2.31 + 1.1) * S.w * 0.055,
    y: S.cy - S.R * 0.58 + Math.sin(a * 0.83) * S.h * 0.12 + Math.sin(a * 1.91) * S.h * 0.035
  };
}

function updatePointer(dt) {
  var now = T;
  var idle = (now - ptr.lastMove) > 2.4 || !ptr.everMoved;
  if (idle) {
    var it = idleTarget(now);
    var k = ptr.everMoved ? 0.45 : 1;
    ptr.tx = lerp(ptr.tx, it.x, clamp(k * dt * 1.4, 0, 1));
    ptr.ty = lerp(ptr.ty, it.y, clamp(k * dt * 1.4, 0, 1));
  }
  var ox = ptr.x, oy = ptr.y;
  var f = clamp(dt * 7.5, 0, 1);
  ptr.x = lerp(ptr.x, ptr.tx, f);
  ptr.y = lerp(ptr.y, ptr.ty, f);
  if (dt > 0) {
    ptr.vx = lerp(ptr.vx, (ptr.x - ox) / dt, 0.35);
    ptr.vy = lerp(ptr.vy, (ptr.y - oy) / dt, 0.35);
  }
}

function maybeRipple(dt) {
  var g = G;
  rippleClock -= dt;
  if (rippleClock <= 0) {
    rippleClock = 1.1 + Math.random() * 1.6;
    var a = Math.random() * TAU, d = Math.sqrt(Math.random()) * 0.72;
    addRipple(Math.cos(a) * d, Math.sin(a) * d, 0.42 + Math.random() * 0.3);
  }
  /* the cursor sweeping over the liquid nudges it */
  var u = (ptr.x - g.bx) / g.brothR;
  var v = (ptr.y - g.by) / (g.brothR * g.s);
  var sp = Math.sqrt(ptr.vx * ptr.vx + ptr.vy * ptr.vy);
  if (u * u + v * v < 0.82 && sp > g.R * 0.5 && Math.random() < dt * 7) {
    addRipple(u, v, clamp(sp / (g.R * 3), 0.25, 1));
  }
}

function step(dt) {
  T += dt;
  updatePointer(dt);
  maybeRipple(dt);
  updateSteam(dt);
  updateSurface(dt);
  updateDust(dt);
}

function frame(ts) {
  rafId = requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  var raw = ts - lastTs;
  lastTs = ts;
  var dt = clamp(raw / 1000, 0, 1 / 20);

  frameAvg = frameAvg * 0.94 + raw * 0.06;
  frameCount++;
  if (!downgraded && frameCount > 150 && frameAvg > 33) {
    downgraded = true;
    steam.ss = 0.34;
    initParticles();
  }

  step(dt);
  drawScene();
}

function start() {
  if (rafId || reduced) return;
  lastTs = 0;
  rafId = requestAnimationFrame(frame);
}

function stop() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
}

/* reduced motion: nothing animates on its own. the pointer still shifts the
   light softly, which is a direct response rather than autonomous movement. */
var staticPending = false;
function requestStatic() {
  if (!reduced || staticPending) return;
  staticPending = true;
  requestAnimationFrame(function () {
    staticPending = false;
    updatePointer(1);
    drawScene();
  });
}

function rebuild() {
  var el = cv;
  var w = Math.max(1, el.clientWidth || window.innerWidth || 1);
  var h = Math.max(1, el.clientHeight || window.innerHeight || 1);
  var dpr = clamp(window.devicePixelRatio || 1, 1, 2);

  S.w = w; S.h = h; S.dpr = dpr;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  S.R = Math.min(w * 0.455, h * 0.395, 560);
  S.cx = w * 0.5;
  S.cy = h * 0.585;

  G = buildGeom();
  BB = bowlBounds(G);
  buildPaths(G);
  buildBackground();
  if (!noodleStrands) noodleStrands = buildNoodles(3131);
  buildLayers();
  initParticles();

  ptr.tx = clamp(ptr.tx || S.cx, 0, w);
  ptr.ty = clamp(ptr.ty || S.cy - S.R * 0.5, 0, h);
  if (!ptr.everMoved) {
    var it = idleTarget(T);
    ptr.x = ptr.tx = it.x;
    ptr.y = ptr.ty = it.y;
  }

  /* let the plume establish itself before the first frame is seen */
  var warm = reduced ? 220 : 150;
  for (var i = 0; i < warm; i++) step(1 / 40);
}

var resizeTimer = 0;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    var el = cv;
    var w = el.clientWidth, h = el.clientHeight;
    if (w === S.w && h === S.h && clamp(window.devicePixelRatio || 1, 1, 2) === S.dpr) return;
    rebuild();
    if (reduced) requestStatic();
  }, 140);
}

function onPointer(e) {
  ptr.tx = e.clientX;
  ptr.ty = e.clientY;
  ptr.lastMove = T;
  ptr.everMoved = true;
  if (reduced) requestStatic();
}

function onDown(e) {
  onPointer(e);
  if (reduced) return;
  var g = G;
  var u = (e.clientX - g.bx) / g.brothR;
  var v = (e.clientY - g.by) / (g.brothR * g.s);
  if (u * u + v * v < 1.05) addRipple(clamp(u, -0.8, 0.8), clamp(v, -0.8, 0.8), 1);
  /* a puff of heat where you touched */
  for (var i = 0; i < steam.list.length; i++) {
    var p = steam.list[i];
    var dx = p.x - e.clientX, dy = p.y - e.clientY;
    var d = Math.sqrt(dx * dx + dy * dy) + 1e-3;
    if (d < g.R * 0.8) {
      var f = 1 - d / (g.R * 0.8);
      p.vx += (dx / d) * f * f * g.R * 1.6;
      p.vy += (dy / d) * f * f * g.R * 1.6 - g.R * 0.2 * f;
    }
  }
}

function applyMotionPref(mq) {
  reduced = !!mq.matches;
  if (reduced) {
    stop();
    rebuild();
    drawScene();
  } else {
    lastTs = 0;
    start();
  }
}

/* ---- boot ---- */
var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false, addEventListener: null };
reduced = !!mq.matches;

rebuild();
drawScene();

window.addEventListener('resize', onResize, { passive: true });
window.addEventListener('orientationchange', onResize, { passive: true });
if (window.ResizeObserver) { new ResizeObserver(onResize).observe(cv); }

window.addEventListener('pointermove', onPointer, { passive: true });
window.addEventListener('pointerdown', onDown, { passive: true });
window.addEventListener('pointerup', function () { ptr.lastMove = T; }, { passive: true });
window.addEventListener('pointercancel', function () { ptr.lastMove = T - 10; }, { passive: true });
window.addEventListener('blur', function () { ptr.lastMove = T - 10; });

document.addEventListener('visibilitychange', function () {
  if (document.hidden) stop();
  else { lastTs = 0; start(); }
});

if (mq.addEventListener) mq.addEventListener('change', applyMotionPref);
else if (mq.addListener) mq.addListener(applyMotionPref);

if (!reduced) start();

})();
</script>
</body>
</html>
