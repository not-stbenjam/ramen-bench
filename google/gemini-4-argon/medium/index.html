<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vegan Miso Ramen</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070504;
      user-select: none;
      -webkit-user-select: none;
      cursor: crosshair;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at calc(50% + var(--mx, 0) * 60px) calc(45% + var(--my, 0) * 60px),
          rgba(235, 110, 30, 0.16) 0%,
          rgba(140, 48, 12, 0.08) 38%,
          rgba(15, 10, 8, 0.94) 72%,
          #060403 100%);
      overflow: hidden;
    }

    /* Subtle dark timber counter surface perspective */
    .table-grain {
      position: absolute;
      inset: -10%;
      pointer-events: none;
      opacity: 0.35;
      background:
        repeating-linear-gradient(
          8deg,
          transparent 0px,
          transparent 14px,
          rgba(255, 195, 130, 0.014) 15px,
          rgba(0, 0, 0, 0.18) 29px
        ),
        radial-gradient(ellipse 95% 65% at 50% 60%, rgba(72, 34, 14, 0.38), transparent 75%);
      transform: translate3d(calc(var(--mx, 0) * -12px), calc(var(--my, 0) * -12px), 0);
      transition: transform 0.08s linear;
    }

    .scene-container {
      position: relative;
      width: min(94vw, 94vh * 1.15);
      aspect-ratio: 1000 / 880;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: perspective(1200px)
        rotateX(calc(var(--my, 0) * -5.5deg))
        rotateY(calc(var(--mx, 0) * 5.5deg));
    }

    svg#ramen-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
      filter: drop-shadow(0 36px 58px rgba(0, 0, 0, 0.92));
    }

    canvas#fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Subtle organic animations */
    @keyframes brothBreath {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.006, 1.009) rotate(0.25deg); }
    }

    @keyframes floatSlow {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      33% { transform: translate(2.2px, -2.5px) rotate(0.7deg); }
      66% { transform: translate(-1.8px, 1.8px) rotate(-0.5deg); }
    }

    @keyframes floatMedium {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(-2.6px, -3.2px) rotate(-1.1deg); }
    }

    @keyframes oilPulse {
      0%, 100% { opacity: 0.86; transform: scale(1); }
      50% { opacity: 0.98; transform: scale(1.045); }
    }

    @keyframes noriSway {
      0%, 100% { transform: rotate(0deg) skewX(0deg); }
      50% { transform: rotate(-1.1deg) skewX(0.6deg); }
    }

    @keyframes noodleLift {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6.5px) rotate(-0.6deg); }
    }

    .anim-broth {
      transform-origin: 500px 490px;
      animation: brothBreath 7s ease-in-out infinite;
    }

    .anim-float-1 {
      transform-origin: 360px 480px;
      animation: floatSlow 8.5s ease-in-out infinite;
    }

    .anim-float-2 {
      transform-origin: 615px 465px;
      animation: floatMedium 6.8s ease-in-out infinite;
    }

    .anim-float-3 {
      transform-origin: 485px 575px;
      animation: floatSlow 7.4s ease-in-out infinite reverse;
    }

    .anim-oil {
      transform-origin: 500px 495px;
      animation: oilPulse 5.2s ease-in-out infinite;
    }

    .anim-nori {
      transform-origin: 340px 390px;
      animation: noriSway 6.4s ease-in-out infinite;
    }

    .anim-chopsticks {
      transform-origin: 680px 260px;
      animation: noodleLift 5.6s ease-in-out infinite;
    }

    /* Ambient vignette & warm photographic grade */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background:
        radial-gradient(circle at 50% 48%,
          transparent 46%,
          rgba(8, 5, 3, 0.48) 76%,
          rgba(3, 2, 1, 0.92) 100%);
    }

    @media (prefers-reduced-motion: reduce) {
      .table-grain,
      .scene-container,
      .anim-broth,
      .anim-float-1,
      .anim-float-2,
      .anim-float-3,
      .anim-oil,
      .anim-nori,
      .anim-chopsticks {
        animation: none !important;
        transition: none !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="viewport" id="viewport" aria-label="A steaming ceramic bowl of rich vegan miso ramen">
    <div class="table-grain"></div>

    <div class="scene-container" id="scene">
      <svg id="ramen-svg" viewBox="0 0 1000 880" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Soft shadows & glows -->
          <filter id="blur-xl" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="38" />
          </filter>
          <filter id="blur-md" x="-25%" y="-25%" width="150%" height="150%">
            <feGaussianBlur stdDeviation="11" />
          </filter>
          <filter id="blur-sm" x="-15%" y="-15%" width="130%" height="130%">
            <feGaussianBlur stdDeviation="3.5" />
          </filter>
          <filter id="blur-xs" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur stdDeviation="1.4" />
          </filter>

          <!--Topping drop shadow into broth -->
          <filter id="topping-shadow" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#260801" flood-opacity="0.72" />
          </filter>

          <filter id="rim-shadow" x="-15%" y="-15%" width="130%" height="135%">
            <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#050201" flood-opacity="0.85" />
          </filter>

          <!-- Organic broth turbulence filter -->
          <filter id="broth-sheen" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.018 0.026" numOctaves="3" seed="14" result="noise" />
            <feColorMatrix type="matrix" values="
              1 0 0 0 0.85
              0 0.5 0 0 0.32
              0 0 0.1 0 0.04
              0 0 0 0.16 0" in="noise" result="warmNoise" />
            <feComposite in="SourceGraphic" in2="warmNoise" operator="atop" />
          </filter>

          <!-- Ceramic glaze texture -->
          <radialGradient id="table-glow" cx="50%" cy="50%" r="55%">
            <stop offset="0%" stop-color="#ff771c" stop-opacity="0.28" />
            <stop offset="48%" stop-color="#9e3208" stop-opacity="0.11" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0" />
          </radialGradient>

          <radialGradient id="coaster-wood" cx="46%" cy="42%" r="58%">
            <stop offset="0%" stop-color="#3a2214" />
            <stop offset="55%" stop-color="#22130b" />
            <stop offset="90%" stop-color="#140b06" />
            <stop offset="100%" stop-color="#0b0603" />
          </radialGradient>

          <!-- Outer ceramic bowl body (Kuro-Raku hand-thrown black stoneware) -->
          <linearGradient id="bowl-outer" x1="18%" y1="15%" x2="84%" y2="92%">
            <stop offset="0%" stop-color="#38302c" />
            <stop offset="22%" stop-color="#231d1a" />
            <stop offset="58%" stop-color="#14100e" />
            <stop offset="86%" stop-color="#0b0908" />
            <stop offset="100%" stop-color="#1b1411" />
          </linearGradient>

          <radialGradient id="bowl- outer-highlight" cx="30%" cy="32%" r="55%">
            <stop offset="0%" stop-color="#6e5a4f" stop-opacity="0.42" />
            <stop offset="35%" stop-color="#3c2f28" stop-opacity="0.16" />
            <stop offset="100%" stop-color="#120e0c" stop-opacity="0" />
          </radialGradient>

          <!-- Warm gold/crimson inner ceramic wall -->
          <linearGradient id="bowl-inner-wall" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#7c2814" />
            <stop offset="28%" stop-color="#58190b" />
            <stop offset="68%" stop-color="#330d05" />
            <stop offset="100%" stop-color="#1c0602" />
          </linearGradient>

          <!-- Rim gold-bronze kintsugi / tenmoku lip -->
          <linearGradient id="bowl-lip" x1="0%" y1="20%" x2="100%" y2="80%">
            <stop offset="0%" stop-color="#856242" />
            <stop offset="22%" stop-color="#c99c67" />
            <stop offset="48%" stop-color="#6b4c32" />
            <stop offset="76%" stop-color="#b88852" />
            <stop offset="100%" stop-color="#593e28" />
          </linearGradient>

          <!-- Rich Creamy Vegan Tantan/Miso Broth -->
          <radialGradient id="broth-base" cx="48%" cy="46%" r="54%" fx="44%" fy="42%">
            <stop offset="0%" stop-color="#ee7b24" />
            <stop offset="32%" stop-color="#d85c17" />
            <stop offset="64%" stop-color="#a8370b" />
            <stop offset="86%" stop-color="#6e1d05" />
            <stop offset="100%" stop-color="#3e0d02" />
          </radialGradient>

          <!-- Creamy tahini / oat-milk swirl in the miso broth -->
          <radialGradient id="broth-cream" cx="45%" cy="50%" r="48%">
            <stop offset="0%" stop-color="#ffbe6b" stop-opacity="0.55" />
            <stop offset="45%" stop-color="#ea842c" stop-opacity="0.28" />
            <stop offset="100%" stop-color="#b33b0c" stop-opacity="0" />
          </radialGradient>

          <!-- Rayu (Chili Oil) Pools -->
          <radialGradient id="chili-oil" cx="38%" cy="38%" r="60%">
            <stop offset="0%" stop-color="#ff3b08" stop-opacity="0.9" />
            <stop offset="45%" stop-color="#c91400" stop-opacity="0.85" />
            <stop offset="82%" stop-color="#7c0700" stop-opacity="0.72" />
            <stop offset="100%" stop-color="#4a0300" stop-opacity="0" />
          </radialGradient>

          <!-- Noodle Gradients -->
          <linearGradient id="noodle-lit" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffdf85" />
            <stop offset="45%" stop-color="#f3ba4a" />
            <stop offset="85%" stop-color="#cf8622" />
            <stop offset="100%" stop-color="#9e550d" />
          </linearGradient>

          <linearGradient id="noodle-mid" x1="10%" y1="0%" x2="90%" y2="100%">
            <stop offset="0%" stop-color="#f5c35b" />
            <stop offset="50%" stop-color="#d89228" />
            <stop offset="100%" stop-color="#8c440a" />
          </linearGradient>

          <linearGradient id="noodle-deep" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c9781d" />
            <stop offset="60%" stop-color="#96490b" />
            <stop offset="100%" stop-color="#5c2304" />
          </linearGradient>

          <!-- Nori Seaweed Gradient -->
          <linearGradient id="nori-grad" x1="15%" y1="5%" x2="85%" y2="95%">
            <stop offset="0%" stop-color="#1d2b1f" />
            <stop offset="40%" stop-color="#111a13" />
            <stop offset="80%" stop-color="#090f0a" />
            <stop offset="100%" stop-color="#050806" />
          </linearGradient>

          <!-- Crispy Pan-Seared Tofu Gradients -->
          <linearGradient id="tofu-top" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff0cc" />
            <stop offset="55%" stop-color="#f2cf8d" />
            <stop offset="100%" stop-color="#d69e49" />
          </linearGradient>

          <linearGradient id="tofu-side" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#d99b43" />
            <stop offset="60%" stop-color="#a8641c" />
            <stop offset="100%" stop-color="#6e3608" />
          </linearGradient>

          <radialGradient id="tofu-sear" cx="50%" cy="50%" r="55%">
            <stop offset="0%" stop-color="#873808" stop-opacity="0.88" />
            <stop offset="55%" stop-color="#b85d19" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#e5aa57" stop-opacity="0" />
          </radialGradient>

          <!-- King Oyster Mushroom Scallop -->
          <radialGradient id="mushroom-cap" cx="42%" cy="40%" r="58%">
            <stop offset="0%" stop-color="#f7DFB9" />
            <stop offset="52%" stop-color="#d8ab73" />
            <stop offset="85%" stop-color="#9e632c" />
            <stop offset="100%" stop-color="#69360e" />
          </radialGradient>

          <!-- Shiitake Cap -->
          <radialGradient id="shiitake-cap" cx="38%" cy="35%" r="62%">
            <stop offset="0%" stop-color="#6e3b1e" />
            <stop offset="45%" stop-color="#3d1d0c" />
            <stop offset="85%" stop-color="#210d04" />
            <stop offset="100%" stop-color="#120602" />
          </radialGradient>

          <!-- Baby Bok Choy -->
          <linearGradient id="bokchoy-leaf" x1="0%" y1="0%" x2="90%" y2="100%">
            <stop offset="0%" stop-color="#4e9e32" />
            <stop offset="45%" stop-color="#286e1b" />
            <stop offset="85%" stop-color="#13420d" />
            <stop offset="100%" stop-color="#0a2906" />
          </linearGradient>

          <linearGradient id="bokchoy-stem" x1="10%" y1="10%" x2="90%" y2="90%">
            <stop offset="0%" stop-color="#f2fae9" />
            <stop offset="45%" stop-color="#cde8b5" />
            <stop offset="85%" stop-color="#8bc26b" />
            <stop offset="100%" stop-color="#538c3c" />
          </linearGradient>

          <!-- Sweet Corn Kernel -->
          <radialGradient id="corn-grad" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#fff799" />
            <stop offset="45%" stop-color="#ffd13b" />
            <stop offset="85%" stop-color="#e09212" />
            <stop offset="100%" stop-color="#9c5405" />
          </radialGradient>

          <!-- Menma (Fermented Bamboo Shoots) -->
          <linearGradient id="menma-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e3b168" />
            <stop offset="50%" stop-color="#b87932" />
            <stop offset="85%" stop-color="#824914" />
            <stop offset="100%" stop-color="#542906" />
          </linearGradient>

          <!-- Wooden Chopsticks -->
          <linearGradient id="chopstick-wood" x1="0%" y1="0%" x2="100%" y2="15%">
            <stop offset="0%" stop-color="#6e351c" />
            <stop offset="30%" stop-color="#471e0d" />
            <stop offset="70%" stop-color="#290f05" />
            <stop offset="100%" stop-color="#170702" />
          </linearGradient>

          <!-- Dynamic mouse-reactive specular highlight -->
          <radialGradient id="interactive-specular" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff6e0" stop-opacity="0.34" />
            <stop offset="35%" stop-color="#ffae52" stop-opacity="0.14" />
            <stop offset="100%" stop-color="#ff6a00" stop-opacity="0" />
          </radialGradient>

          <!-- Clip path for broth interior -->
          <clipPath id="broth-clip">
            <ellipse cx="500" cy="482" rx="334" ry="222" />
          </clipPath>

          <!-- Reusable Sesame Seed & Scallion Ring -->
          <g id="sesame-white">
            <ellipse cx="0" cy="0" rx="4.2" ry="2.3" fill="#fff5dc" stroke="#d4b279" stroke-width="0.6" />
            <ellipse cx="-1" cy="-0.5" rx="1.8" ry="0.7" fill="#ffffff" opacity="0.8" />
          </g>
          <g id="sesame-black">
            <ellipse cx="0" cy="0" rx="4.2" ry="2.3" fill="#1d1916" stroke="#080605" stroke-width="0.5" />
            <ellipse cx="-1" cy="-0.6" rx="1.6" ry="0.6" fill="#574d46" opacity="0.7" />
          </g>
          <g id="scallion-ring">
            <ellipse cx="0" cy="0" rx="13" ry="9.5" fill="#2b7a1f" stroke="#17470f" stroke-width="1.2" />
            <ellipse cx="0.5" cy="0.3" rx="9.2" ry="6.5" fill="#6ec44e" />
            <ellipse cx="0.8" cy="0.5" rx="5.5" ry="3.8" fill="#2e5918" opacity="0.85" />
            <path d="M -8 -4 A 10 7 0 0 1 6 -5" fill="none" stroke="#b6f296" stroke-width="1.3" stroke-linecap="round" opacity="0.75" />
          </g>
          <g id="corn-kernel">
            <path d="M -7 -5 C -8 -10, 8 -10, 7 -5 C 9 3, 6 9, 0 9 C -6 9, -9 3, -7 -5 Z" fill="url(#corn-grad)" />
            <ellipse cx="-2.2" cy="-3.5" rx="2.6" ry="1.8" fill="#ffffff" opacity="0.65" transform="rotate(-18 -2.2 -3.5)" />
          </g>
        </defs>

        <!-- ==================== 1. AMBIENT TABLE SHADOW & COASTER ==================== -->
        <g id="layer-table">
          <!-- Warm bounce light on the table -->
          <ellipse cx="500" cy="585" rx="440" ry="260" fill="url(#table-glow)" />

          <!-- Deep ambient occlusion shadow under coaster and bowl -->
          <ellipse cx="500" cy="645" rx="355" ry="185" fill="#020100" opacity="0.95" filter="url(#blur-xl)" />
          <ellipse cx="500" cy="635" rx="290" ry="145" fill="#000000" opacity="0.9" filter="url(#blur-md)" />

          <!-- Hand-carved charred cedar coaster (Yakisugi) -->
          <ellipse cx="500" cy="628" rx="285" ry="138" fill="#0d0704" />
          <ellipse cx="500" cy="618" rx="282" ry="134" fill="url(#coaster-wood)" stroke="#472a18" stroke-width="2" />
          <ellipse cx="500" cy="614" rx="258" ry="118" fill="none" stroke="#120904" stroke-width="3" opacity="0.8" />
          <ellipse cx="500" cy="616" rx="256" ry="116" fill="none" stroke="#59351f" stroke-width="1" stroke-dasharray="18 9 6 12" opacity="0.45" />

          <!-- Scattered sesame seeds & chili flakes on the dark table/coaster -->
          <use href="#sesame-white" transform="translate(248, 650) rotate(28) scale(1.1)" opacity="0.75" />
          <use href="#sesame-white" transform="translate(265, 668) rotate(-14) scale(0.95)" opacity="0.65" />
          <use href="#sesame-black" transform="translate(256, 659) rotate(65)" opacity="0.8" />
          <use href="#sesame-white" transform="translate(738, 635) rotate(-42)" opacity="0.7" />
          <use href="#sesame-black" transform="translate(752, 648) rotate(19) scale(1.1)" opacity="0.7" />
          <circle cx="722" cy="656" r="2.2" fill="#9e1b06" opacity="0.6" />
        </g>

        <!-- ==================== 2. CERAMIC BOWL EXTERIOR & FOOT ==================== -->
        <g id="layer-bowl-base">
          <!-- Ceramic foot ring (Kodai) -->
          <path d="M 332 652 C 332 726, 668 726, 668 652 L 652 605 L 348 605 Z" fill="#140f0d" />
          <path d="M 334 656 C 334 720, 666 720, 666 656" fill="none" stroke="#5e4332" stroke-width="4.5" opacity="0.55" />
          <path d="M 332 648 C 332 714, 668 714, 668 648" fill="none" stroke="#080605" stroke-width="6" />

          <!-- Main stoneware bowl belly -->
          <path d="M 134 468
                   C 136 638, 286 710, 500 710
                   C 714 710, 864 638, 866 468
                   Z"
                fill="url(#bowl-outer)"
                filter="url(#rim-shadow)" />

          <!-- Specular sheen on hand-thrown ceramic ribs -->
          <path d="M 134 468
                   C 136 638, 286 710, 500 710
                   C 714 710, 864 638, 866 468
                   Z"
                fill="url(#bowl- outer-highlight)" />

          <!-- Subtle horizontal potter's wheel throwing ridges -->
          <path d="M 164 538 C 255 642, 745 642, 836 538" fill="none" stroke="#54453d" stroke-width="1.6" stroke-dasharray="90 18 45 25" opacity="0.32" />
          <path d="M 195 578 C 290 668, 710 668, 805 578" fill="none" stroke="#080605" stroke-width="3.2" opacity="0.55" />
          <path d="M 225 606 C 320 684, 680 684, 775 606" fill="none" stroke="#634f44" stroke-width="1.3" stroke-dasharray="60 30 110 20" opacity="0.28" />
          <path d="M 275 644 C 375 702, 625 702, 725 644" fill="none" stroke="#7d5d46" stroke-width="1.2" opacity="0.24" />

          <!-- Hand-painted copper/gold brushwork accent on front-left of bowl -->
          <path d="M 205 535 Q 275 585 375 598 Q 300 608 218 562 Z" fill="#8c5830" opacity="0.22" filter="url(#blur-xs)" />
          <path d="M 235 568 Q 315 612 415 618" fill="none" stroke="#b87b48" stroke-width="2.5" stroke-linecap="round" opacity="0.25" />

          <!-- Bowl upper opening & inner ceramic wall -->
          <ellipse cx="500" cy="466" rx="366" ry="246" fill="#17110e" stroke="url(#bowl-lip)" stroke-width="7.5" />
          <ellipse cx="500" cy="469" rx="354" ry="236" fill="url(#bowl-inner-wall)" />

          <!-- Inner ceramic glaze rim highlight & wave pattern -->
          <ellipse cx="500" cy="468" rx="355" ry="237" fill="none" stroke="#2b0c04" stroke-width="4" />
          <path d="M 155 432 A 354 236 0 0 1 845 432" fill="none" stroke="#b54824" stroke-width="2.2" stroke-dasharray="12 8" opacity="0.38" />
          <path d="M 148 452 A 364 244 0 0 1 852 452" fill="none" stroke="#ffdfb8" stroke-width="1.8" opacity="0.32" />
          <path d="M 168 518 A 364 244 0 0 0 832 518" fill="none" stroke="#ffd8a8" stroke-width="2.4" opacity="0.45" />
        </g>

        <!-- ==================== 3. NORI SHEETS (TUCKED AT BACK-LEFT RIM) ==================== -->
        <g id="layer-nori" class="anim-nori" filter="url(#topping-shadow)">
          <!-- Back Nori Sheet -->
          <g transform="translate(275, 290) rotate(-26)">
            <rect x="-58" y="-105" width="124" height="175" rx="6" fill="url(#nori-grad)" stroke="#2c3d2e" stroke-width="1.2" />
            <!-- Cross-hatched pressed seaweed texture -->
            <line x1="-54" y1="-80" x2="62" y2="-80" stroke="#283b2b" stroke-width="0.9" opacity="0.55" />
            <line x1="-54" y1="-50" x2="62" y2="-50" stroke="#283b2b" stroke-width="0.9" opacity="0.55" />
            <line x1="-54" y1="-20" x2="62" y2="-20" stroke="#283b2b" stroke-width="0.9" opacity="0.55" />
            <line x1="-54" y1="10" x2="62" y2="10" stroke="#283b2b" stroke-width="0.9" opacity="0.55" />
            <line x1="-25" y1="-102" x2="-25" y2="65" stroke="#080d09" stroke-width="1.1" opacity="0.6" />

        <!-- ==================== 9. SCALLIONS, SESAME & CHILI THREADS (ITO-TOGARASHI) ==================== -->
        <g id="layer-fine-garnish" class="anim-float-2">
          <!-- Freshly sliced green scallion rings -->
          <use href="#scallion-ring" transform="translate(458, 488) rotate(-14)" />
          <use href="#scallion-ring" transform="translate(482, 476) rotate(22) scale(1.1)" />
          <use href="#scallion-ring" transform="translate(508, 492) rotate(-8) scale(0.92)" />
          <use href="#scallion-ring" transform="translate(472, 506) rotate(35) scale(0.95)" />
          <use href="#scallion-ring" transform="translate(526, 474) rotate(-28) scale(0.85)" />
          <use href="#scallion-ring" transform="translate(438, 504) rotate(15) scale(0.8)" />
          <use href="#scallion-ring" transform="translate(556, 522) rotate(42) scale(0.9)" />
          <use href="#scallion-ring" transform="translate(388, 472) rotate(-18) scale(0.88)" />
          <use href="#scallion-ring" transform="translate(592, 456) rotate(12) scale(0.78)" />

          <!-- Ito-Togarashi (Fine crimson chili threads crowned in the center) -->
          <g fill="none" stroke="#d91e05" stroke-width="1.8" stroke-linecap="round" opacity="0.92">
            <path d="M 455 485 C 468 462, 502 458, 518 482 C 532 502, 495 518, 478 498" />
            <path d="M 468 496 C 452 475, 482 448, 508 468 C 528 484, 512 512, 488 504" />
            <path d="M 448 474 C 475 455, 515 472, 528 495" />
            <path d="M 476 462 C 495 445, 525 465, 505 492" stroke="#ff4d1a" stroke-width="1.4" />
            <path d="M 462 488 C 485 472, 512 488, 492 510" stroke="#ff4d1a" stroke-width="1.4" />
          </g>

          <!-- Toasted White & Black Sesame Seeds scattered across the bowl -->
          <use href="#sesame-white" transform="translate(425, 468) rotate(15)" />
          <use href="#sesame-black" transform="translate(442, 455) rotate(-32)" />
          <use href="#sesame-white" transform="translate(538, 498) rotate(48)" />
          <use href="#sesame-white" transform="translate(562, 482) rotate(-12)" />
          <use href="#sesame-black" transform="translate(548, 465) rotate(28)" />
          <use href="#sesame-white" transform="translate(465, 532) rotate(-45)" />
          <use href="#sesame-black" transform="translate(488, 542) rotate(18)" />
          <use href="#sesame-white" transform="translate(412, 528) rotate(62)" />
          <use href="#sesame-white" transform="translate(352, 525) rotate(-22)" />
          <use href="#sesame-black" transform="translate(375, 542) rotate(35)" />
          <use href="#sesame-white" transform="translate(625, 478) rotate(-18)" />
          <use href="#sesame-black" transform="translate(642, 495) rotate(52)" />
          <use href="#sesame-white" transform="translate(582, 545) rotate(14)" />
          <use href="#sesame-white" transform="translate(495, 422) rotate(-38)" />
          <use href="#sesame-black" transform="translate(515, 435) rotate(24)" />
          <use href="#sesame-white" transform="translate(415, 398) rotate(42)" />
          <use href="#sesame-white" transform="translate(585, 398) rotate(-28)" />
        </g>

        <!-- ==================== 10. INTERACTIVE SPECULAR SHEEN & FRONT BOWL LIP ==================== -->
        <!-- Dynamic light reflection on the broth that follows the user's cursor -->
        <ellipse id="broth-specular" cx="500" cy="475" rx="220" ry="135" fill="url(#interactive-specular)" style="mix-blend-mode: screen; pointer-events: none;" />

        <!-- Front Bowl Rim Overlap (ensures depth and encloses the front edge of the broth) -->
        <path d="M 134 468
                 A 366 246 0 0 0 866 468
                 A 354 238 0 0 1 146 468 Z"
              fill="url(#bowl-lip)" opacity="0.88" />
        <path d="M 185 562 A 366 246 0 0 0 815 562"
              fill="none" stroke="#ffdfb8" stroke-width="2.2" stroke-linecap="round" opacity="0.45" />
      </svg>

      <!-- Volumetric Steam, Rising Broth Bubbles & Floating Warm Embers Canvas -->
      <canvas id="fx-canvas"></canvas>
    </div>

    <div class="vignette"></div>
  </main>

  <script>
    (() => {
      const viewport = document.getElementById('viewport');
      const canvas = document.getElementById('fx-canvas');
      const ctx = canvas.getContext('2d');
      const brothSpecular = document.getElementById('broth-specular');
      const chopstickLayer = document.getElementById('layer-chopsticks-noodles');

      const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      let prefersReducedMotion = reducedMotionQuery.matches;

      // Normalized cursor coordinates (-1 to 1) & SVG space cursor (0 to 1000, 0 to 880)
      const pointer = {
        targetX: 0,
        targetY: 0,
        x: 0,
        y: 0,
        svgX: 500,
        svgY: 440,
        vx: 0,
        vy: 0,
        active: false,
        pulse: 0
      };

      let width = 1000;
      let height = 880;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        width = rect.width || 1000;
        height = rect.height || 880;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener('resize', resizeCanvas, { passive: true });
      resizeCanvas();

      // Track pointer for parallax, specular reflection, and steam eddy interaction
      function handlePointerMove(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const nx = ((clientX - window.innerWidth / 2) / (window.innerWidth / 2));
        const ny = ((clientY - window.innerHeight / 2) / (window.innerHeight / 2));
        pointer.targetX = Math.max(-1, Math.min(1, nx));
        pointer.targetY = Math.max(-1, Math.min(1, ny));

        const newSvgX = ((clientX - rect.left) / rect.width) * 1000;
        const newSvgY = ((clientY - rect.top) / rect.height) * 880;
        pointer.vx = Math.max(-45, Math.min(45, newSvgX - pointer.svgX));
        pointer.vy = Math.max(-45, Math.min(45, newSvgY - pointer.svgY));
        pointer.svgX = newSvgX;
        pointer.svgY = newSvgY;
        pointer.active = true;
      }

      window.addEventListener('pointermove', (e) => {
        handlePointerMove(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener('pointerdown', (e) => {
        handlePointerMove(e.clientX, e.clientY);
        pointer.pulse = 1.0;
        if (!prefersReducedMotion) {
          spawnRipple(pointer.svgX, pointer.svgY);
        }
      }, { passive: true });

      window.addEventListener('pointerleave', () => {
        pointer.targetX = 0;
        pointer.targetY = 0;
        pointer.active = false;
      }, { passive: true });

      // ---------------- VOLUMETRIC STEAM PLUMES & PARTICLES ----------------
      // All coordinates are defined in virtual 1000x880 space and scaled to canvas dimensions
      const steamPuffs = [];
      const steamRibbons = [];
      const brothRipples = [];
      const aromaMotes = [];

      const PUFF_COUNT = 58;
      const RIBBON_COUNT = 9;
      const MOTE_COUNT = 28;

      function createSteamPuff(randomY = false) {
        // Spawn across the warm broth & lifted noodles
        const fromNoodles = Math.random() < 0.32;
        const baseX = fromNoodles
          ? 460 + (Math.random() - 0.5) * 95
          : 500 + (Math.random() - 0.5) * 460;
        const baseY = fromNoodles
          ? 275 + Math.random() * 140
          : 465 + (Math.random() - 0.5) * 210;

        const maxLife = 240 + Math.random() * 180;
        return {
          x: baseX,
          y: randomY ? baseY - Math.random() * 340 : baseY,
          originX: baseX,
          vx: (Math.random() - 0.5) * 0.35,
          vy: -(0.55 + Math.random() * 0.75),
          radius: 34 + Math.random() * 42,
          growth: 0.24 + Math.random() * 0.22,
          life: randomY ? Math.random() * maxLife : 0,
          maxLife,
          phase: Math.random() * Math.PI * 2,
          freq: 0.012 + Math.random() * 0.014,
          alpha: 0.045 + Math.random() * 0.055,
          warmth: Math.random()
        };
      }

      function createSteamRibbon(index) {
        const spread = (index / (RIBBON_COUNT - 1) - 0.5) * 420;
        return {
          baseX: 495 + spread + (Math.random() - 0.5) * 35,
          baseY: 485 - Math.abs(spread) * 0.18 + (Math.random() - 0.5) * 40,
          height: 310 + Math.random() * 120,
          phase: Math.random() * Math.PI * 2,
          speed: 0.014 + Math.random() * 0.009,
          amp: 18 + Math.random() * 20,
          width: 28 + Math.random() * 26,
          offsetX: 0,
          offsetVx: 0
        };
      }

      function createAromaMote(randomY = false) {
        return {
          x: 240 + Math.random() * 520,
          y: randomY ? 120 + Math.random() * 480 : 480 + (Math.random() - 0.5) * 160,
          vx: (Math.random() - 0.5) * 0.3,
          vy: -(0.35 + Math.random() * 0.55),
          size: 1.2 + Math.random() * 2.2,
          alpha: 0.2 + Math.random() * 0.45,
          phase: Math.random() * Math.PI * 2
        };
      }

      function spawnRipple(svgX, svgY) {
        // Keep ripples inside the broth ellipse roughly
        const dx = (svgX - 500) / 310;
        const dy = (svgY - 485) / 200;
        if (dx * dx + dy * dy <= 1.05) {
          brothRipples.push({
            x: svgX,
            y: svgY,
            rx: 6,
            ry: 3.8,
            alpha: 0.55
          });
        } else {
          brothRipples.push({
            x: 500 + (Math.random() - 0.5) * 260,
            y: 485 + (Math.random() - 0.5) * 140,
            rx: 5,
            ry: 3.2,
            alpha: 0.45
          });
        }
      }

      for (let i = 0; i < PUFF_COUNT; i++) {
        steamPuffs.push(createSteamPuff(true));
      }
      for (let i = 0; i < RIBBON_COUNT; i++) {
        steamRibbons.push(createSteamRibbon(i));
      }
      for (let i = 0; i < MOTE_COUNT; i++) {
        aromaMotes.push(createAromaMote(true));
      }

      function renderStaticSteam() {
        ctx.clearRect(0, 0, width, height);
        const sx = width / 1000;
        const sy = height / 880;
        ctx.save();
        ctx.scale(sx, sy);

        // Gentle static atmospheric wisps when prefers-reduced-motion is active
        const staticPositions = [
          { x: 380, y: 340, r: 95, a: 0.06 },
          { x: 485, y: 260, r: 115, a: 0.075 },
          { x: 585, y: 320, r: 90, a: 0.055 },
          { x: 450, y: 165, r: 130, a: 0.045 },
          { x: 540, y: 190, r: 110, a: 0.05 }
        ];
        for (const p of staticPositions) {
          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
          grad.addColorStop(0, `rgba(255, 238, 218, ${p.a})`);
          grad.addColorStop(0.5, `rgba(245, 205, 175, ${p.a * 0.45})`);
          grad.addColorStop(1, 'rgba(255, 220, 190, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      let time = 0;

      function animate() {
        if (prefersReducedMotion) {
          renderStaticSteam();
          return;
        }

        time += 1;

        // Smoothly interpolate pointer for parallax and lighting
        pointer.x += (pointer.targetX - pointer.x) * 0.065;
        pointer.y += (pointer.targetY - pointer.y) * 0.065;
        pointer.vx *= 0.88;
        pointer.vy *= 0.88;
        pointer.pulse *= 0.94;

        viewport.style.setProperty('--mx', pointer.x.toFixed(4));
        viewport.style.setProperty('--my', pointer.y.toFixed(4));

        // Shift interactive specular reflection on the broth
        if (brothSpecular) {
          const specX = 500 + pointer.x * 115;
          const specY = 475 + pointer.y * 68;
          brothSpecular.setAttribute('cx', specX.toFixed(1));
          brothSpecular.setAttribute('cy', specY.toFixed(1));
        }

        // Subtle interactive response on the lifted chopsticks
        if (chopstickLayer) {
          const liftOffset = pointer.y * -8 - pointer.pulse * 10;
          const tiltOffset = pointer.x * 1.4;
          chopstickLayer.style.transform = `translate(${(pointer.x * 5).toFixed(2)}px, ${liftOffset.toFixed(2)}px) rotate(${tiltOffset.toFixed(2)}deg)`;
        }

        // Occasional natural simmering broth micro-ripples
        if (Math.random() < 0.045 && brothRipples.length < 6) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * 0.78;
          spawnRipple(500 + Math.cos(angle) * 290 * dist, 485 + Math.sin(angle) * 180 * dist);
        }

        ctx.clearRect(0, 0, width, height);
        const sx = width / 1000;
        const sy = height / 880;

        ctx.save();
        ctx.scale(sx, sy);

        // 1. Draw delicate broth surface ripples
        for (let i = brothRipples.length - 1; i >= 0; i--) {
          const r = brothRipples[i];
          r.rx += 0.65;
          r.ry += 0.4;
          r.alpha *= 0.965;

          ctx.strokeStyle = `rgba(255, 222, 168, ${r.alpha})`;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.ellipse(r.x, r.y, r.rx, r.ry, 0, 0, Math.PI * 2);
          ctx.stroke();

          if (r.alpha < 0.015) {
            brothRipples.splice(i, 1);
          }
        }

        // 2. Draw silky curling steam ribbons
        ctx.globalCompositeOperation = 'screen';
        for (let i = 0; i < steamRibbons.length; i++) {
          const rib = steamRibbons[i];
          rib.phase += rib.speed;

          // React to cursor proximity
          const distToMouse = Math.hypot(pointer.svgX - (rib.baseX + rib.offsetX), pointer.svgY - (rib.baseY - rib.height * 0.45));
          if (pointer.active && distToMouse < 190) {
            const push = (1 - distToMouse / 190);
            rib.offsetVx += (pointer.vx * 0.14 + (rib.baseX - pointer.svgX) * 0.012) * push;
          }
          rib.offsetVx += -rib.offsetX * 0.025;
          rib.offsetVx *= 0.9;
          rib.offsetX += rib.offsetVx;

          const topX = rib.baseX + rib.offsetX * 1.4 + Math.sin(rib.phase) * rib.amp * 1.3 + pointer.x * 28;
          const topY = rib.baseY - rib.height;
          const cp1X = rib.baseX + Math.sin(rib.phase * 1.2 + 1) * rib.amp + rib.offsetX * 0.5;
          const cp1Y = rib.baseY - rib.height * 0.35;
          const cp2X = rib.baseX - Math.cos(rib.phase * 0.9) * rib.amp * 1.15 + rib.offsetX;
          const cp2Y = rib.baseY - rib.height * 0.7;

          const grad = ctx.createLinearGradient(rib.baseX, rib.baseY, topX, topY);
          grad.addColorStop(0, 'rgba(255, 225, 195, 0)');
          grad.addColorStop(0.22, 'rgba(255, 232, 208, 0.055)');
          grad.addColorStop(0.6, 'rgba(255, 240, 225, 0.045)');
          grad.addColorStop(1, 'rgba(255, 245, 235, 0)');

          ctx.strokeStyle = grad;
          ctx.lineWidth = rib.width;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(rib.baseX, rib.baseY);
          ctx.bezierCurveTo(cp1X, cp1Y, cp2X, cp2Y, topX, topY);
          ctx.stroke();
        }

        // 3. Draw volumetric soft steam puffs
        for (let i = 0; i < steamPuffs.length; i++) {
          const p = steamPuffs[i];
          p.life += 1;
          if (p.life >= p.maxLife) {
            steamPuffs[i] = createSteamPuff(false);
            continue;
          }

          const progress = p.life / p.maxLife;
          const wave = Math.sin(p.life * p.freq + p.phase) * 0.55;

          // Cursor wind & swirl deflection
          if (pointer.active) {
            const dx = p.x - pointer.svgX;
            const dy = p.y - pointer.svgY;
            const dist = Math.hypot(dx, dy);
            if (dist < 175 && dist > 1) {
              const force = (1 - dist / 175);
              p.vx += (pointer.vx * 0.045 + (dx / dist) * 0.38) * force;
              p.vy += (pointer.vy * 0.03 + (dy / dist) * 0.22) * force;
            }
          }

          p.vx *= 0.96;
          p.x += p.vx + wave + pointer.x * 0.22;
          p.y += p.vy - pointer.pulse * 0.4;
          p.radius += p.growth;

          // Smooth fade-in and fade-out envelope
          const env = progress < 0.22
            ? progress / 0.22
            : Math.pow(1 - (progress - 0.22) / 0.78, 1.45);
          const alpha = p.alpha * env;

          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
          if (p.warmth > 0.45) {
            grad.addColorStop(0, `rgba(255, 236, 214, ${alpha})`);
            grad.addColorStop(0.48, `rgba(242, 198, 165, ${alpha * 0.5})`);
            grad.addColorStop(1, 'rgba(235, 175, 140, 0)');
          } else {
            grad.addColorStop(0, `rgba(255, 246, 238, ${alpha})`);
            grad.addColorStop(0.5, `rgba(238, 224, 212, ${alpha * 0.48})`);
            grad.addColorStop(1, 'rgba(220, 208, 200, 0)');
          }

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        // 4. Draw tiny glowing warmth motes (floating spice/steam droplets catching backlight)
        for (let i = 0; i < aromaMotes.length; i++) {
          const m = aromaMotes[i];
          m.phase += 0.03;
          m.x += m.vx + Math.sin(m.phase) * 0.35 + pointer.x * 0.3;
          m.y += m.vy;

          if (pointer.active) {
            const dx = m.x - pointer.svgX;
            const dy = m.y - pointer.svgY;
            const dist = Math.hypot(dx, dy);
            if (dist < 130 && dist > 1) {
              m.x += (dx / dist) * 1.5;
              m.y += (dy / dist) * 1.5;
            }
          }

          if (m.y < 60) {
            aromaMotes[i] = createAromaMote(false);
            continue;
          }

          const heightFade = Math.max(0, Math.min(1, (m.y - 60) / 180)) * Math.max(0, Math.min(1, (560 - m.y) / 140));
          const flicker = 0.65 + 0.35 * Math.sin(m.phase * 2.2);
          const a = m.alpha * heightFade * flicker;

          ctx.fillStyle = `rgba(255, 205, 140, ${a})`;
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
        requestAnimationFrame(animate);
      }

      reducedMotionQuery.addEventListener('change', (e) => {
        prefersReducedMotion = e.matches;
        if (prefersReducedMotion) {
          renderStaticSteam();
        } else {
          requestAnimationFrame(animate);
        }
      });

      if (prefersReducedMotion) {
        renderStaticSteam();
      } else {
        requestAnimationFrame(animate);
      }
    })();
  </script>
